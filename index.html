<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>생활원예 기출문제은행</title>
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --text:#1b2420; --muted:#616e68; --line:#e0e7e2;
  --accent:#2f7d5d; --accent-2:#24634a; --accent-weak:#e4f1ea;
  --right:#1e8a5c; --right-bg:#e7f7ef; --right-line:#8fd6b3;
  --wrong:#c0392b; --wrong-bg:#fdecea; --wrong-line:#f0a9a2;
  --shadow:0 1px 2px rgba(16,32,24,.05), 0 8px 24px rgba(16,32,24,.06);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0f1310; --card:#181d19; --text:#e8ede9; --muted:#9aa79f; --line:#28322b;
  --accent:#6bcf9c; --accent-2:#8ee0b6; --accent-weak:#1b2a22;
  --right:#6fdcae; --right-bg:#16342a; --right-line:#2e6b53;
  --wrong:#ff9a8f; --wrong-bg:#3a1e1b; --wrong-line:#7a3a33;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
body{
  font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-0.01em;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px;}
button{font-family:inherit; font-size:inherit; color:inherit; touch-action:manipulation;}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-0.02em;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.tiny{font-size:12px;}

/* top bar */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .inner{display:flex; align-items:center; gap:10px; height:56px;}
.iconbtn{
  border:1px solid var(--line); background:var(--card); border-radius:12px;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; flex:0 0 auto;
}
.iconbtn:active{transform:scale(.96);}
.title{font-size:17px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.progress{height:4px; background:var(--line);}
.progress > i{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width .25s ease;}
.metrics{display:flex; gap:12px; font-size:12.5px; color:var(--muted); padding:6px 0 8px;}
.metrics b{color:var(--text); font-weight:700;}

/* home */
.hero{padding:22px 0 10px;}
.hero h1{font-size:26px; line-height:1.3;}
.hero p{margin:8px 0 0; color:var(--muted); font-size:14px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin:14px 0;
}
.card h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.seg.three{grid-template-columns:1fr 1fr 1fr;}
.seg button{
  border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:12px 8px;
  cursor:pointer; font-weight:600; font-size:14px; line-height:1.35;
}
.seg button small{display:block; font-weight:500; color:var(--muted); font-size:11.5px; margin-top:2px;}
.seg button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-weak); color:var(--accent-2);}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--accent);}
select{
  width:100%; padding:13px 12px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card); color:var(--text); font-size:15px; font-family:inherit; appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) calc(50% + 1px), calc(100% - 14px) calc(50% + 1px);
  background-size:6px 6px, 6px 6px; background-repeat:no-repeat;
}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0;}
.row + .row{border-top:1px solid var(--line);}
.switch{position:relative; width:46px; height:28px; flex:0 0 auto;}
.switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
.switch span{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.2s;}
.switch span::after{content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + span{background:var(--accent);}
.switch input:checked + span::after{transform:translateX(18px);}
.cta{
  display:block; width:100%; margin-top:6px; padding:16px; border-radius:14px; border:0;
  background:var(--accent); color:#fff; font-size:17px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 18px rgba(47,125,93,.28);
}
[data-theme="dark"] .cta{color:#08120d;}
.cta:active{transform:translateY(1px);}
.ghost{
  width:100%; padding:14px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); font-weight:600; cursor:pointer;
}
.ghost:active{background:var(--accent-weak);}
.quicklinks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.quicklinks button{
  border:1px solid var(--line); background:var(--card); border-radius:14px; padding:14px 10px;
  font-weight:600; font-size:14px; cursor:pointer; text-align:left; box-shadow:var(--shadow);
}
.quicklinks b{display:block; font-size:18px; margin-top:2px; color:var(--accent);}

/* quiz */
.qmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.badge{
  font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px;
  background:var(--accent-weak); color:var(--accent-2);
}
[data-theme="dark"] .badge{color:var(--accent);}
.badge.gray{background:var(--line); color:var(--muted);}
.star{margin-left:auto; border:0; background:transparent; font-size:22px; line-height:1; cursor:pointer; padding:6px; color:var(--muted);}
.star[aria-pressed="true"]{color:#f0b429;}
.stem{font-size:18px; font-weight:600; line-height:1.5; margin:2px 0 16px; word-break:keep-all;}
.opts{display:flex; flex-direction:column; gap:9px;}
.opt{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:14px 14px; border-radius:13px; border:1.5px solid var(--line);
  background:var(--card); cursor:pointer; font-size:15.5px; line-height:1.45;
  transition:border-color .12s, background .12s; word-break:keep-all;
}
.opt .num{
  flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--muted);
  margin-top:1px;
}
.opt .txt{flex:1;}
.opt[data-picked="1"]{border-color:var(--accent); background:var(--accent-weak);}
.opt[data-picked="1"] .num{border-color:var(--accent); color:var(--accent-2);}
.opt.right{border-color:var(--right-line); background:var(--right-bg);}
.opt.right .num{border-color:var(--right); background:var(--right); color:#fff;}
.opt.wrong{border-color:var(--wrong-line); background:var(--wrong-bg);}
.opt.wrong .num{border-color:var(--wrong); background:var(--wrong); color:#fff;}
.opt[disabled]{cursor:default;}
.opt .mark{margin-left:auto; font-weight:700; font-size:13px; color:var(--muted);}
.feedback{
  margin-top:14px; padding:14px; border-radius:13px; border:1px solid var(--line);
  background:var(--card); font-size:14.5px; line-height:1.6; word-break:keep-all;
}
.feedback.ok{border-color:var(--right-line); background:var(--right-bg);}
.feedback.no{border-color:var(--wrong-line); background:var(--wrong-bg);}
.feedback .head{font-weight:800; margin-bottom:6px;}
.feedback .ans{margin-bottom:6px;}
.navbar{
  display:flex; gap:10px; margin-top:18px;
}
.navbar button{flex:1; padding:15px; border-radius:14px; font-weight:700; font-size:16px; cursor:pointer; border:1.5px solid var(--line); background:var(--card);}
.navbar .primary{background:var(--accent); border-color:var(--accent); color:#fff;}
[data-theme="dark"] .navbar .primary{color:#08120d;}
.navbar button[disabled]{opacity:.4; cursor:default;}
.hint{margin-top:14px; font-size:12px; color:var(--muted); text-align:center;}

/* result */
.score{display:flex; align-items:center; gap:18px;}
.ring{
  --p:0; width:96px; height:96px; border-radius:50%; flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);
  display:flex; align-items:center; justify-content:center;
}
.ring > div{
  width:76px; height:76px; border-radius:50%; background:var(--card);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;
}
.score .num{font-size:22px; font-weight:800;}
.wronglist{margin-top:8px;}
.wrongitem{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--card);
  border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer; font-size:14.5px; line-height:1.5;
}
.wrongitem .row-top{display:flex; gap:8px; align-items:center; margin-bottom:4px;}
.wrongitem .meta{font-size:11.5px; color:var(--muted);}
.wrongitem .mine{color:var(--wrong); font-size:13px;}
.wrongitem .corr{color:var(--right); font-size:13px;}
.empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:14px;}

/* detail */
.detail .stem{margin-top:4px;}
.answerbox{margin-top:14px; padding:14px; border-radius:13px; background:var(--accent-weak); border:1px solid var(--line); font-size:14.5px; line-height:1.6; word-break:keep-all;}
.footer{margin:28px 0 6px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7;}
a.link{color:var(--accent-2); text-decoration:none; border-bottom:1px solid currentColor;}
@media (min-width:560px){
  .stem{font-size:19px;}
  .opt{font-size:16px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = [{"id":"2019-2-기말-36","set":"2019-2-기말","year":2019,"kind":"기말","no":36,"stem":"생산원예와 비교하여 생활원예의 특징을 바르게 설명한 것은?","opts":["고용노동이 필요하다","대상작물 범위가 넓고 다양하다","고소득을 추구한다","다수확을 목적으로 한다"],"ans":[2],"multi":false,"dup":false,"expl":"생산원예는 소수의 작물을 대규모·고소득·다수확으로 다루지만, 생활원예는 대상 작물의 범위가 넓고 다양하며 생활 속에서 즐기는 것이 특징이다."},{"id":"2019-2-기말-37","set":"2019-2-기말","year":2019,"kind":"기말","no":37,"stem":"다음 중 헤르만헤세가 정원을 가꾸고 토마토를 기르면서 얻었던 효과로 볼 수 없는 것은?","opts":["신체적 건강 증진","청정한 식품 생산","경제적 소득 증대","자연을 배우고 이해"],"ans":[3],"multi":false,"dup":false,"expl":"헤르만 헤세가 정원과 토마토를 기르며 얻은 것은 신체적 건강, 청정한 식품, 자연에 대한 이해였고 경제적 소득 증대와는 거리가 멀다."},{"id":"2019-2-기말-38","set":"2019-2-기말","year":2019,"kind":"기말","no":38,"stem":"원예활동 중 포푸리를 바르게 설명한 것은?","opts":["접시에 담은 작은 정원","식물과 소동물을 소재로 이용","말림꽃을 눌러 소재로 이용","향기로운 꽃잎을 투명한 병에 넣어 감상"],"ans":[4],"multi":false,"dup":true,"expl":"포푸리는 향기로운 꽃잎이나 허브를 말려 향과 색을 함께 감상하는 것. ①은 디시가든, ②는 비바리움, ③은 누름꽃(프레스드플라워)이다."},{"id":"2019-2-기말-39","set":"2019-2-기말","year":2019,"kind":"기말","no":39,"stem":"색양배추의 학명 Brassica oleracea L. var. acephala DC. 에서 acephala는 무엇을 나타내는가?","opts":["변종명","속명","종소명","과명"],"ans":[1],"multi":false,"dup":false,"expl":"학명에서 var. 뒤에 붙는 acephala는 변종명(변종 소명)이다. 앞의 Brassica는 속명, oleracea는 종소명이다."},{"id":"2019-2-기말-40","set":"2019-2-기말","year":2019,"kind":"기말","no":40,"stem":"다음 중 종자번식을 하며 은화식물로 분류되는 식물문은?","opts":["선태식물문","양치식물문","나자식물문","피자식물문"],"ans":[3],"multi":false,"dup":false,"expl":"나자식물문은 종자로 번식하지만 꽃이 불완전하여 은화식물로 분류된다. 선태·양치식물은 포자로 번식한다."},{"id":"2019-2-기말-41","set":"2019-2-기말","year":2019,"kind":"기말","no":41,"stem":"식물 뿌리에 대한 설명으로 옳은 것은?","opts":["쌍자엽식물 뿌리는 다수의 수염뿌리를 형성한다","뿌리의 신장대에서 양수분이 가장 활발히 흡수된다","뿌리의 유관속은 중심에 위치해 있다","초본식물 뿌리는 유관속형성층이 있어 부피생장을 지속적으로 한다"],"ans":[3],"multi":false,"dup":false,"expl":"뿌리의 유관속(물관·체관)은 중심주에 모여 있다. 쌍자엽식물 뿌리는 직근, 수분 흡수는 뿌리털(성숙대)에서 가장 활발하다."},{"id":"2019-2-기말-42","set":"2019-2-기말","year":2019,"kind":"기말","no":42,"stem":"뿌리의 내부 구조에서 표피세포군과 내피세포군 사이에 위치하는 세포군은?","opts":["물관","피층","체관","내초"],"ans":[2],"multi":false,"dup":false,"expl":"뿌리 단면은 표피 - 피층 - 내피 - 중심주 순이며, 표피와 내피 사이의 넓은 세포군이 피층이다."},{"id":"2019-2-기말-43","set":"2019-2-기말","year":2019,"kind":"기말","no":43,"stem":"다음 중 식물의 분열조직 중 줄기나 뿌리의 길이생장에 역할을 하는 것은?","opts":["유합조직","형성층","조직간","생장점"],"ans":[4],"multi":false,"dup":false,"expl":"생장점(정단분열조직)은 줄기·뿌리의 길이생장을, 형성층(측생분열조직)은 부피생장을 담당한다."},{"id":"2019-2-기말-44","set":"2019-2-기말","year":2019,"kind":"기말","no":44,"stem":"다음 잎에서 기공의 분포가 가장 많은 조직은?","opts":["엽육조직","유관속초유조직","상면표피조직","하면표피조직"],"ans":[4],"multi":false,"dup":false,"expl":"기공은 잎의 뒷면(하면) 표피조직에 가장 많이 분포하여 증산과 기체교환을 담당한다."},{"id":"2019-2-기말-45","set":"2019-2-기말","year":2019,"kind":"기말","no":45,"stem":"다음 해바라기 줄기의 외부 형태와 내부 구조에 대해 설명한 것 중 바르지 않은 것은?","opts":["줄기의 마디마다 잎이 달려 있다","잎 겨드랑이에서 가지가 발생한다","유관속조직이 줄기 중심에 배열되어 있다","줄기 끝 생장점이 꽃으로 발달한다"],"ans":[3],"multi":false,"dup":false,"expl":"해바라기처럼 쌍자엽식물의 줄기는 유관속이 중심에 모여 있지 않고 고리(환상) 모양으로 배열된다."},{"id":"2019-2-기말-46","set":"2019-2-기말","year":2019,"kind":"기말","no":46,"stem":"다음 꽃의 기본구조에서 암술을 구성하는 요소가 아닌 것은?","opts":["암술머리","암술대","씨방","화밀"],"ans":[4],"multi":false,"dup":false,"expl":"암술은 암술머리·암술대·씨방으로 구성된다. 화밀은 꽃의 밀선에서 분비되는 꿀로 암술 구성 요소가 아니다."},{"id":"2019-2-기말-47","set":"2019-2-기말","year":2019,"kind":"기말","no":47,"stem":"꽃의 구조에서 수정 후 종피로 발달되는 것은?","opts":["밑씨(배주)의 표피","씨방","꽃받침","암술대"],"ans":[1],"multi":false,"dup":false,"expl":"수정 후 밑씨(배주)의 표피는 종피로, 씨방벽은 과피로 발달한다."},{"id":"2019-2-기말-48","set":"2019-2-기말","year":2019,"kind":"기말","no":48,"stem":"씨방이 비대 발육하지 못하고 씨방벽에 그대로 종피에 말라붙어 있거나 종피를 감싸고 있는 수과(여윈과실) 종자가 아닌 것은?","opts":["토마토 종자","딸기 종자","상추 종자","벼 종자"],"ans":[1],"multi":false,"dup":true,"expl":"토마토는 다육질의 진과이다. 딸기·상추·벼의 종자는 씨방벽이 말라붙은 수과(여윈과실) 종자이다."},{"id":"2019-2-기말-49","set":"2019-2-기말","year":2019,"kind":"기말","no":49,"stem":"딸기 과실에 대해 바르게 설명한 것은?","opts":["씨방을 감싸고 있던 화통이 비대한 위과이다","과실표면에 수과가 박혀 있다","씨방이 열매가 된 진과이다","과피가 과실의 중앙에 있다"],"ans":[2],"multi":false,"dup":true,"expl":"딸기는 화탁이 비대해진 위과(허위과)로, 과실 표면에 수과(씨)가 점점이 박혀 있다."},{"id":"2019-2-기말-50","set":"2019-2-기말","year":2019,"kind":"기말","no":50,"stem":"다음 중 잔디 종류의 식별을 위한 주요 부위가 아닌 것은?","opts":["입혀","잎귀","종자","꽃"],"ans":[4],"multi":false,"dup":false,"expl":"잔디 식별은 잎혀·잎귀·잎깃·종자 등의 형태로 하며, 꽃은 주요 식별 부위로 쓰지 않는다."},{"id":"2019-2-기말-51","set":"2019-2-기말","year":2019,"kind":"기말","no":51,"stem":"다음 잔디 중 한지형이며 골프경기 등을 목적으로 집약적으로 관리할 때 높은 질감을 갖는 것은?","opts":["버팔로그래스","페스큐","켄터키 블루그래스","벤트그래스"],"ans":[4],"multi":false,"dup":false,"expl":"벤트그래스는 한지형 중에서도 5mm 이하로 낮게 깎아 균일하고 질감이 좋아 골프 그린 조성에 쓰인다."},{"id":"2019-2-기말-52","set":"2019-2-기말","year":2019,"kind":"기말","no":52,"stem":"잔디식재에서 종자파종의 장점은?","opts":["조성에 드는 비용이 비싸다","대단위 면적 피복이 가능하다","단기간에 잔디조성이 가능하다","잔디 깎기를 하지 않아도 된다"],"ans":[2],"multi":false,"dup":true,"expl":"종자파종은 비용이 적게 들고 대단위 면적을 한 번에 피복할 수 있다는 것이 장점이다."},{"id":"2019-2-기말-53","set":"2019-2-기말","year":2019,"kind":"기말","no":53,"stem":"난류의 특성을 바르게 설명한 것은?","opts":["쌍자엽식물이다","종류가 단순하다","주로 자가수정한다","미숙 배를 가지고 있다"],"ans":[4],"multi":false,"dup":true,"expl":"난과식물은 씨방 안에 미숙한 배가 있고 종자에 지질을 저장한다. 단자엽식물이며 주로 타가수정한다."},{"id":"2019-2-기말-54","set":"2019-2-기말","year":2019,"kind":"기말","no":54,"stem":"서양란에 대한 설명으로 옳은 것은?","opts":["분포범위가 좁다","대부분 산악지대가 원산지다","종류가 많지 않다","종류로는 덴드로비움이 있다"],"ans":[4],"multi":false,"dup":true,"expl":"교재상 서양란에는 덴드로비움·카틀레야·팔레놉시스 등이 포함된다."},{"id":"2019-2-기말-55","set":"2019-2-기말","year":2019,"kind":"기말","no":55,"stem":"다음 중 난의 영양번식 중 포기나누기를 이용한 번식법에 해당하는 것은?","opts":["분주법","위구경번식법","삽목번식법","조직배양"],"ans":[1],"multi":false,"dup":true,"expl":"포기나누기(포기 나눔)를 이용한 영양번식법이 분주법이다."},{"id":"2019-2-기말-56","set":"2019-2-기말","year":2019,"kind":"기말","no":56,"stem":"다음 중 영년생 허브는?","opts":["바실","캐모마일","딜","오레가노"],"ans":[4],"multi":false,"dup":false,"expl":"오레가노는 영년생(다년생) 허브이다. 바실·캐모마일·딜은 일년생 허브로 분류된다."},{"id":"2019-2-기말-57","set":"2019-2-기말","year":2019,"kind":"기말","no":57,"stem":"허브의 삽목 시에 많이 사용하는 발근제는?","opts":["지베렐린","루톤","사이토키닌","오옥신"],"ans":[2],"multi":false,"dup":false,"expl":"허브 삽목에는 발근촉진제인 루톤(인돌부티르산)을 많이 사용한다."},{"id":"2019-2-기말-58","set":"2019-2-기말","year":2019,"kind":"기말","no":58,"stem":"토마토 요리에 가장 어울리는 허브는?","opts":["고수","바실","월계수","배초향"],"ans":[2],"multi":false,"dup":false,"expl":"토마토 요리에는 바실(바질)이 가장 잘 어울리는 허브로 알려져 있다."},{"id":"2019-2-기말-59","set":"2019-2-기말","year":2019,"kind":"기말","no":59,"stem":"절화의 수명을 연장시키기 위한 방법으로 적절한 것은?","opts":["줄기를 재절단한다","냉수에 줄기를 깊이 담가둔다","절화가 배달되면 포장을 뜯지 않는다","저장고 습도는 40% 이하로 관리한다"],"ans":[1],"multi":false,"dup":false,"expl":"절화는 물에 담그기 전에 줄기 끝을 비스듬히 다시 잘라 막힌 도관을 열어 주어야 물올림이 좋아진다."},{"id":"2019-2-기말-60","set":"2019-2-기말","year":2019,"kind":"기말","no":60,"stem":"다음 순수 수경재배의 종류 중 뿌리가 잘 내리지 않는 식물의 번식과 고구마, 감자 및 약용식물 등의 재배에 가장 많이 이용되는 방식은?","opts":["담액수경","박막수경","분무경","저면관수"],"ans":[3],"multi":false,"dup":false,"expl":"분무경은 뿌리를 공중에 두고 양액을 안개처럼 분무해 산소 공급이 좋아 발근이 어려운 식물의 번식과 고구마·감자·약용작물 재배에 이용된다."},{"id":"2019-2-기말-61","set":"2019-2-기말","year":2019,"kind":"기말","no":61,"stem":"다음 중 간이수경재배 장치의 주요 구성이 아닌 것은?","opts":["재배조","양액탱크","펌프","필터 시스템"],"ans":[4],"multi":false,"dup":true,"expl":"간이수경재배 장치는 재배조·양액탱크·펌프 등으로 구성되며 필터 시스템은 주요 구성 요소가 아니다."},{"id":"2019-2-기말-62","set":"2019-2-기말","year":2019,"kind":"기말","no":62,"stem":"다음 중 양액의 총염류 농도를 알 수 있는 전기전도도를 나타내는 단위는?","opts":["mg/L","dS/m","kPa","bar"],"ans":[2],"multi":false,"dup":true,"expl":"전기전도도(EC)는 양액의 총염류 농도를 나타내며 단위는 dS/m(＝mS/cm)이다."},{"id":"2019-2-기말-63","set":"2019-2-기말","year":2019,"kind":"기말","no":63,"stem":"다음 중 수경재배에서 양분흡수가 최대로 이루어지는 pH 범위는?","opts":["pH 7.0∼8.0","pH 5.5∼6.5","pH 8.5∼9.5","pH 4.5∼5.0"],"ans":[2],"multi":false,"dup":false,"expl":"양분 흡수가 최대로 이루어지는 양액의 pH는 5.5∼6.5의 약산성 범위이다."},{"id":"2019-2-기말-64","set":"2019-2-기말","year":2019,"kind":"기말","no":64,"stem":"다음 중 베란다 햇빛 양이 부족할 때 재배하기 가장 적합한 채소는?","opts":["토마토","청경채","적근대","생강"],"ans":[4],"multi":false,"dup":false,"expl":"생강은 대표적인 음지성 채소로, 햇빛이 부족한 베란다에서도 재배하기에 적합하다."},{"id":"2019-2-기말-65","set":"2019-2-기말","year":2019,"kind":"기말","no":65,"stem":"다음 중 도시 건축물의 벽면녹화의 주요 효과가 아닌 것은?","opts":["미적 경관 향상으로 구조물 경관 개선","산성비와 자외선 차단으로 구조물 내구성 향상","빗물 저장으로 자원 순환형 생태계 형성","조류들 서식지 제공으로 생태계 보호"],"ans":[3],"multi":false,"dup":false,"expl":"벽면녹화는 경관 개선, 건물 보호(산성비·자외선 차단), 조류 서식처 제공 등의 효과가 있다. 빗물 저장은 옥상녹화·빗물이용의 효과이다."},{"id":"2019-2-기말-66","set":"2019-2-기말","year":2019,"kind":"기말","no":66,"stem":"텃밭에서 재배할 채소 종류를 선택할 때 고려해야 할 사항이 아닌 것은?","opts":["햇빛이 드는 시간","관수의 가능성","수익성 증대","텃밭의 규모"],"ans":[3],"multi":false,"dup":false,"expl":"텃밭 채소 선택에서는 햇빛·관수 가능성·텃밭 규모를 고려하며, 수익성 증대는 고려 대상이 아니다."},{"id":"2019-2-기말-67","set":"2019-2-기말","year":2019,"kind":"기말","no":67,"stem":"다음 중 겨울채소로 분류되는 가정채소는?","opts":["감자","마늘","갓","멜론"],"ans":[2],"multi":false,"dup":true,"expl":"마늘은 월동하여 가꾸는 겨울채소로 분류된다. 감자·멜론은 여름, 갓은 가을채소이다."},{"id":"2019-2-기말-68","set":"2019-2-기말","year":2019,"kind":"기말","no":68,"stem":"채소재배에서 열근, 열과 현상의 공통적 원인으로 가장 적합한 것은?","opts":["잦은 농약사용","고온","붕소부족","토양수분 급변"],"ans":[4],"multi":false,"dup":false,"expl":"열근과 열과는 모두 토양 수분의 급격한 변화(급건·급습)가 공통 원인이다."},{"id":"2019-2-기말-69","set":"2019-2-기말","year":2019,"kind":"기말","no":69,"stem":"도심 텃밭을 조성할 때 고려해야 할 사항으로 옳지 않은 것은?","opts":["오염되지 않은 농업용수 사용","물 빠짐이 좋고 비옥한 토양","도로변 옆에 붙어있어 접근성이 용이","물주기가 용이한 시설을 갖추는 것"],"ans":[3],"multi":false,"dup":false,"expl":"도로변에 붙은 텃밭은 배기가스·분진 오염 우려가 있어 도심 텃밭 입지로 바람직하지 않다."},{"id":"2019-2-기말-70","set":"2019-2-기말","year":2019,"kind":"기말","no":70,"stem":"다음 중 블루베리가 휴면 중일 때 하는 전정으로 적기에 해당하는 시기는?","opts":["2월","5월","9월","11월"],"ans":[1],"multi":false,"dup":false,"expl":"블루베리 휴면기 전정(겨울전정)은 2월경에 하고, 수확 직후인 7월경에는 여름전정을 한다."},{"id":"2019-2-출석-1","set":"2019-2-출석","year":2019,"kind":"출석대체","no":1,"stem":"다음 중 생활원예가 필요한 이유가 아닌 것은?","opts":["산업화로 인한 환경파괴","도시화로 인한 정서불안","정보화로 인한 인간의 기계화","가계의 경제적 소득증대"],"ans":[4],"multi":false,"dup":true,"expl":"생활원예가 필요한 이유는 환경파괴·정서불안·인간의 기계화에 대한 대응이며, 가계 소득증대는 그 이유가 아니다."},{"id":"2019-2-출석-2","set":"2019-2-출석","year":2019,"kind":"출석대체","no":2,"stem":"목본식물에서 뿌리가 비대 되는 데 역할을 하는 분열조직은?","opts":["유관속형성층","중심주","표피","피층"],"ans":[1],"multi":false,"dup":false,"expl":"목본식물에서 뿌리의 부피생장(비대)을 담당하는 분열조직은 유관속형성층이다."},{"id":"2019-2-출석-3","set":"2019-2-출석","year":2019,"kind":"출석대체","no":3,"stem":"다음 중 꽃에서 수술의 구성요소가 아 석-12","set":"2019-2-출석","year":2019,"kind":"출석대체","no":12,"stem":"다음 중 생태순화형의 일종인 수경재배 방식은?","opts":["아쿠아포닉스","자루재배","암면배지재배","입상암면배지재배"],"ans":[1],"multi":false,"dup":false,"expl":"생태순화형 수경재배의 대표적인 방식은 아쿠아포닉스이다."},{"id":"2019-2-출석-13","set":"2019-2-출석","year":2019,"kind":"출석대체","no":13,"stem":"다음 중 수확까지 소요일수가 가장 긴 채소는?","opts":["20일 무","오이","가지","아스파라거스"],"ans":[4],"multi":false,"dup":true,"expl":"수확까지 소요일수가 가장 긴 채소는 아스파라거스이다."},{"id":"2019-2-출석-14","set":"2019-2-출석","year":2019,"kind":"출석대체","no":14,"stem":"다음 중 월동하여 재배하는 겨울채소는 어느 것인가?","opts":["고추","수박","양파","쑥갓"],"ans":[3],"multi":false,"dup":false,"expl":"월동하여 재배하는 겨울채소는 양파이다."},{"id":"2019-2-출석-15","set":"2019-2-출석","year":2019,"kind":"출석대체","no":15,"stem":"다음 중 블루베리 뿌리에 대한 설명으로 옳지 않은 것은?","opts":["심토(깊이 50cm 이상)까지 깊게 분포한다","뿌리 생장에 적합한 온도는 7∼20℃이다","뿌리 신장이 가장 활발한 시기는 6월 초순이다","뿌리는 근모가 없기 때문에 양수분 흡수력이 약하다"],"ans":[1],"multi":false,"dup":false,"expl":"블루베리 뿌리는 천근성으로 얕게 분포하므로 '심토 50cm 이상 깊게 분포한다'는 설명이 옳지 않다."},{"id":"2018-2-기말-36","set":"2018-2-기말","year":2018,"kind":"기말","no":36,"stem":"다음 중 생활원예의 효과로 볼 수 없는 것은?","opts":["정원에서 토마토를 묶어 주면서 자연과 인생을 공부하는 것","주말농장에서 기르고 수확한 신선한 토마토를 먹는 것","선비들이 눈 내린 겨울날 가헌에 모여 분매(盆梅)를 감상한 것","과수재배에서 전정기술을 익혀 사과 생산량을 극대화하는 것"],"ans":[4],"multi":false,"dup":false,"expl":"생활원예의 효과는 정서 안정·신선한 식품 생산·자연과 인생 공부 등이지, 과수 전정으로 생산량을 극대화하는 상업적 소득 추구가 아니다."},{"id":"2018-2-기말-37","set":"2018-2-기말","year":2018,"kind":"기말","no":37,"stem":"다음 생활원예 활동 중 투명한 용기 안에 흙을 채우고 적절한 식물을 배치하여 꾸미는 정원을 의미하는 것은?","opts":["테라리움","디쉬가든","분경","비바리움"],"ans":[1],"multi":false,"dup":false,"expl":"투명한 용기 안에 흙을 채우고 식물을 배치해 꾸미는 정원이 테라리움이다. ②는 디시가든, ③은 분경, ④는 비바리움이다."},{"id":"2018-2-기말-38","set":"2018-2-기말","year":2018,"kind":"기말","no":38,"stem":"원예활동 중 포푸리를 바르게 설명한 것은?","opts":["말림꽃을 화훼장식에 소재로 사용한 것","향기롭고 색깔이 고운 꽃잎이나 허브를 말려 감상하는 것","누름꽃을 화훼장식에 소재로 사용한 것","접시위에 자연의 풍경을 연출한 것"],"ans":[2],"multi":false,"dup":true,"expl":"포푸리는 향기롭고 색깔이 고운 꽃잎이나 허브를 말려 향과 색을 감상하는 것이다."},{"id":"2018-2-기말-39","set":"2018-2-기말","year":2018,"kind":"기말","no":39,"stem":"다음 중 포자로 번식하는 하등식물로 엽록체가 발달하여 독립 영양생활을 하는 식물문은?","opts":["선태식물문","양치식물문","나자식물문","피자식물문"],"ans":[1],"multi":false,"dup":false,"expl":"선태식물문은 포자로 번식하는 하등식물이지만 엽록체가 있어 독립영양을 한다. 양치식물은 관다발이 발달한 하등식물이다."},{"id":"2018-2-기말-40","set":"2018-2-기말","year":2018,"kind":"기말","no":40,"stem":"다음 중 완전한 꽃의 구성요소를 가지고 있어서 현화식물로 분류되고 중복수정 후 자방은 과실로 발달하는 식물문은?","opts":["선태식물문","양치식물문","나자식물문","피자식물문"],"ans":[4],"multi":false,"dup":false,"expl":"완전한 꽃을 갖고 중복수정 후 자방이 과실로 발달하는 식물문은 피자식물문(현화식물)이다."},{"id":"2018-2-기말-41","set":"2018-2-기말","year":2018,"kind":"기말","no":41,"stem":"다음 학명을 이루고 있는 이름에서 종을 지칭하는 이름은?","opts":["속명","종소명","아종명","변종명"],"ans":[2],"multi":false,"dup":false,"expl":"학명의 두 번째 단어인 종소명이 종을 지칭한다. 첫 단어는 속명이다."},{"id":"2018-2-기말-42","set":"2018-2-기말","year":2018,"kind":"기말","no":42,"stem":"방울다다기양배추의 학명 Brassica oleracea var. gemmifera에서 gemmifera는 무엇을 나타내는가?","opts":["과명","속명","변종명","명명자"],"ans":[3],"multi":false,"dup":false,"expl":"var. 뒤에 오는 gemmifera는 변종명이다."},{"id":"2018-2-기말-43","set":"2018-2-기말","year":2018,"kind":"기말","no":43,"stem":"일년초화류 중 춘파일년초의 특징으로 가장 적합한 것은?","opts":["아한대 원산","저온에서 생육 양호","장일성 식물","여름에서 가을에 걸쳐 개화"],"ans":[4],"multi":false,"dup":false,"expl":"춘파일년초는 봄에 파종해 여름∼가을에 걸쳐 개화한다. 추파일년초는 가을에 파종해 이듬해 봄에 개화하는 장일식물이다."},{"id":"2018-2-기말-44","set":"2018-2-기말","year":2018,"kind":"기말","no":44,"stem":"다음 중 줄기의 마디사이와 잎의 엽초와 엽신의 기부에 분포하는 분열조직은?","opts":["정단분열조직","개재분열조직","측재분열조직","유합조직"],"ans":[2],"multi":false,"dup":false,"expl":"마디사이와 잎의 엽초·엽신 기부에 남아 있는 분열조직은 개재분열조직이다."},{"id":"2018-2-기말-45","set":"2018-2-기말","year":2018,"kind":"기말","no":45,"stem":"다음 잎 내부구조에서 기공이 분포되어 있는 조직은?","opts":["표피조직","책상조직","유관속초세포","해면조직"],"ans":[1],"multi":false,"dup":false,"expl":"기공은 잎의 표피조직에 분포한다. 책상조직·해면조직은 엽육조직이다."},{"id":"2018-2-기말-46","set":"2018-2-기말","year":2018,"kind":"기말","no":46,"stem":"다음 뿌리에서 양분과 수분 흡수가 가장 활발한 조직은?","opts":["생장점","신장대","뿌리골무","뿌리털"],"ans":[4],"multi":false,"dup":false,"expl":"양분과 수분 흡수는 표피세포가 뿌리털로 변형된 뿌리털(성숙대)에서 가장 활발하다."},{"id":"2018-2-기말-47","set":"2018-2-기말","year":2018,"kind":"기말","no":47,"stem":"다음 중 쌍자엽식물 광합성의 90%가 이루어지는 곳은?","opts":["큐티클","책상엽육조직","유관속조직","표피조직"],"ans":[2],"multi":false,"dup":false,"expl":"쌍자엽식물 잎에서 광합성의 90%는 책상엽육조직에서 이루어진다."},{"id":"2018-2-기말-48","set":"2018-2-기말","year":2018,"kind":"기말","no":48,"stem":"암술을 구성하는 기본 단위는 심피이다. 다음 중 심피를 구성하는 조직이 아닌 것은?","opts":["꽃실","암술머리","씨방","암술대"],"ans":[1],"multi":false,"dup":false,"expl":"심피는 암술머리·암술대·씨방으로 구성된다. 꽃실은 수술의 구성 요소이다."},{"id":"2018-2-기말-49","set":"2018-2-기말","year":2018,"kind":"기말","no":49,"stem":"다음 종자에 대한 설명으로 바르지 않은 것은?","opts":["씨방 안에 있는 밑씨는 수정 후에 종자로 발달한다","밑씨의 표피는 과피로 발달한다","배유는 영양분 저장조직이다","씨방벽이 종피에 말라붙은 종자를 여윈과실이라 한다"],"ans":[2],"multi":false,"dup":false,"expl":"밑씨의 표피는 종피로 발달하며, 과피는 씨방벽이 발달한 것이다."},{"id":"2018-2-기말-50","set":"2018-2-기말","year":2018,"kind":"기말","no":50,"stem":"잔디 종류의 식별을 위한 방법으로 바르지 않은 것은?","opts":["잎혀의 막과 털로 식별한다","잎귀의 길이로 식별한다","줄기 길이로 식별한다","잎깃이 연결되거나 양분된 것으로 식별한다"],"ans":[3],"multi":false,"dup":false,"expl":"잔디 식별에는 잎혀·잎귀·잎깃의 형태를 이용하지 줄기 길이로 식별하지는 않는다."},{"id":"2018-2-기말-51","set":"2018-2-기말","year":2018,"kind":"기말","no":51,"stem":"다음 중 난지형 잔디류에 해당하는 것은?","opts":["한국잔디류","켄터키 블루그래스","벤트그래스류","페스큐류"],"ans":[1],"multi":false,"dup":false,"expl":"난지형 잔디에는 한국잔디류(들잔디)·버뮤다그래스 등이 있고, 켄터키 블루그래스·벤트그래스·페스큐는 한지형이다."},{"id":"2018-2-기말-52","set":"2018-2-기말","year":2018,"kind":"기말","no":52,"stem":"다음 잔디 중 잎 끝은 보트형으로 둥글게 홈져 있으며 잎의 중앙 엽맥의 양쪽에 연한 선이 있는 것은?","opts":["켄터키 블루그래스","페스큐류","한국잔디류","벤트그래스류"],"ans":[1],"multi":false,"dup":false,"expl":"잎 끝이 보트 모양으로 둥글고 엽맥 양쪽에 연한 선이 있는 것은 켄터키 블루그래스이다."},{"id":"2018-2-기말-53","set":"2018-2-기말","year":2018,"kind":"기말","no":53,"stem":"난 재배환경으로 바르게 설명한 것은?","opts":["광도가 4000lux 이하 조건에서 잘 자란다","동양란은 겨울에는 5℃이상, 여름엔 30℃이하에서 재배한다","공중습도는 40% 정도로 유지시킨다","토양공극 사이에 공기보다 물이 많은 조건에서 재배한다"],"ans":[2],"multi":false,"dup":true,"expl":"동양란은 겨울 5℃ 이상, 여름 30℃ 이하에서 재배한다. 난은 40%보다 높은 60∼70% 습도가 필요하고 통기성이 중요하다."},{"id":"2018-2-기말-54","set":"2018-2-기말","year":2018,"kind":"기말","no":54,"stem":"난의 영양번식 방법 중 2~3개의 촉(shoot)을 하나의 단위로 나누어 화분에 심는 것은?","opts":["삽목번식법","생장점배양","분주법","화경배양"],"ans":[3],"multi":false,"dup":false,"expl":"2∼3개의 촉을 한 단위로 나누어 화분에 심는 영양번식법은 분주법이다."},{"id":"2018-2-기말-55","set":"2018-2-기말","year":2018,"kind":"기말","no":55,"stem":"다음 허브 식물들 중 사람의 신경을 안정시키는 효능이 있는 것으로 알려진 허브식물은?","opts":["카라웨이","고수","쿠민","캐모마일"],"ans":[4],"multi":false,"dup":false,"expl":"캐모마일은 신경을 안정시키는 효능이 있는 허브로 알려져 있다."},{"id":"2018-2-기말-56","set":"2018-2-기말","year":2018,"kind":"기말","no":56,"stem":"다음 허브 식물들 중 월동가능 온도가 가장 높은 것은?","opts":["알로에","민들레","인삼","레몬밤"],"ans":[1],"multi":false,"dup":false,"expl":"알로에는 열대·아열대성이라 월동 가능 온도가 가장 높다. 인삼·민들레·레몬밤은 내한성이 강하다."},{"id":"2018-2-기말-57","set":"2018-2-기말","year":2018,"kind":"기말","no":57,"stem":"다음 중 허브식물 영양번식에 대한 설명으로 바르지 않은 것은?","opts":["허브의 영양번식은 삽목, 휘묻이, 포기나누기법이 있다","삽수 끝을 발근제인 루톤을 묻혀서 심으면 발근이 잘된다","삽목 후 수일간 햇볕이 잘 드는 곳에 건조한 조건으로 놔둔다","포기나누기는 박하, 레몬밤, 차이브 같은 영년생 초본 식물을 삽으로 캐서 분리하여 심는 방법이다"],"ans":[3],"multi":false,"dup":false,"expl":"삽목 후에는 직사광선을 피하고 습도를 높게 유지해야 한다. 햇볕이 잘 드는 건조한 곳에 두는 것은 잘못이다."},{"id":"2018-2-기말-58","set":"2018-2-기말","year":2018,"kind":"기말","no":58,"stem":"다음 꽃꽂이에 이용되는 식물소재 중 절화 거베라, 국화 등은 어느 형태에 속하는가?","opts":["라인플라워","매스플라워","필러플라워","폼플라워"],"ans":[2],"multi":false,"dup":false,"expl":"거베라·국화처럼 꽃 한 송이가 덩어리를 이루어 공간을 채우는 소재는 매스플라워이다."},{"id":"2018-2-기말-59","set":"2018-2-기말","year":2018,"kind":"기말","no":59,"stem":"다음 절화의 수명을 연장시키기 위한 관리방법과 그 이유를 설명한 것 중 바람직한 것은?","opts":["줄기 재절단은 막힌 도관을 뚫어주기 위함이다","절화보존용액을 사용하여 증산이 활발하게 되도록 한다","줄기에 있는 모든 잎을 따주어 에틸렌 발생을 최소화한다","세균이나 미생물 번식억제를 위하여 저장고 습도는 50% 미만으로 유지한다"],"ans":[1],"multi":false,"dup":false,"expl":"줄기 재절단은 막힌 도관을 뚫어 물올림을 좋게 하기 위해서이다. 저장습도는 오히려 높게(90% 이상) 유지한다."},{"id":"2018-2-기말-60","set":"2018-2-기말","year":2018,"kind":"기말","no":60,"stem":"다음 간이 수경재배 종류 중 순수수경 방식에서 베드 내 뿌리의 윗부분이 공기 중에 노출되고 밑부분은 흐르는 양액에 접촉되며 베드 내 양액이 잘 순환될 수 있도록 1/60～1/80의 경사도를 유지하는 방식은?","opts":["박막수경","담액수경","분무경","분무수경"],"ans":[1],"multi":false,"dup":false,"expl":"베드에 경사(1/60∼1/80)를 두고 양액을 얇게 흘려 뿌리 일부는 공기 중에 노출되게 하는 방식은 박막수경(NFT)이다."},{"id":"2018-2-기말-61","set":"2018-2-기말","year":2018,"kind":"기말","no":61,"stem":"최근 씨감자 생산을 위한 수경재배 방식으로 가장 많이 이용하는 방식은?","opts":["담액수경","박막수경","저면관수","분무경"],"ans":[4],"multi":false,"dup":false,"expl":"씨감자 생산에는 분무경이 가장 많이 이용된다."},{"id":"2018-2-기말-62","set":"2018-2-기말","year":2018,"kind":"기말","no":62,"stem":"다음 중 가정에서 수경재배방식과 함께 사용할 수 있는 경제적인 광원은?","opts":["수은등","LED등","백열등","고압나트륨등"],"ans":[2],"multi":false,"dup":true,"expl":"가정용 수경재배에는 전력 소모가 적고 수명이 긴 LED등이 경제적이다."},{"id":"2018-2-기말-63","set":"2018-2-기말","year":2018,"kind":"기말","no":63,"stem":"다음 양액관리에 대해 설명한 것 중 바르지 않은 것은?","opts":["양액의 pH가 7.0 이상이 되면 Fe, B, Mn이 결핍된다","전기전도도(EC) 증가는 양액의 총염류농도 증가를 뜻한다","저온성 식물의 경우 양액온도는 8～12℃로 유지한다","여름철 양액온도가 높아질수록 포화용존산소량은 부족해진다"],"ans":[3],"multi":false,"dup":false,"expl":"저온성 식물의 양액온도는 15∼20℃ 정도로 유지한다. 8∼12℃는 너무 낮다."},{"id":"2018-2-기말-64","set":"2018-2-기말","year":2018,"kind":"기말","no":64,"stem":"다음 중 스쿨팜의 효과에 대한 설명으로 바르지 않은 것은?","opts":["자연을 사랑하는 마음을 갖게 한다","농업, 식품, 영양에 대한 지식과 경험을 쌓을 수 있게 한다","동료학생 및 선생님과의 협력의 기회를 제공한다","식물재배와 관련된 이론을 집중적으로 교육받는다"],"ans":[4],"multi":false,"dup":false,"expl":"스쿨팜은 자연 사랑, 농업·식품·영양 지식, 협력 기회를 주는 체험 활동이지 이론을 집중 교육하는 곳이 아니다."},{"id":"2018-2-기말-65","set":"2018-2-기말","year":2018,"kind":"기말","no":65,"stem":"다음 해외 국가들의 공동체 정원활동의 주요 목적으로 바르지 않은 것은?","opts":["공동체 의식 키우기","자연․환경보호 활동","아이들 야외학습장소","지역구 행정비용 마련"],"ans":[4],"multi":false,"dup":false,"expl":"공동체 정원의 목적은 공동체 의식·환경보호·아이들 야외학습 등이며, 행정비용 마련과는 무관하다."},{"id":"2018-2-기말-66","set":"2018-2-기말","year":2018,"kind":"기말","no":66,"stem":"다음 중 국가별 공동체 정원의 프로그램이나 단체 연결이 바른 것은?","opts":["미국 - P-패치","영국 - 클라인가르텐","독일 - 캐피털 그로스","일본 - 얼로트먼트"],"ans":[1],"multi":false,"dup":false,"expl":"미국의 공동체 정원 프로그램은 P-패치이다. 클라인가르텐은 독일, 얼로트먼트는 영국이다."},{"id":"2018-2-기말-67","set":"2018-2-기말","year":2018,"kind":"기말","no":67,"stem":"실내정원의 기능 중 환경적 기능을 바르게 설명한 것은?","opts":["대체로 잎이 작고 두꺼운 식물이 음이온을 많이 발생시킨다","목본식물에서 발생되는 피톤치드는 쾌적감과 항균효과를 준다","선인장류는 밤에 이산화탄소를 대기에 방출한다","식물의 증산작용은 실내 습도를 높여 쾌적함을 떨어뜨린다"],"ans":[2],"multi":false,"dup":false,"expl":"목본식물이 발생시키는 피톤치드는 쾌적감과 항균 효과를 준다. 식물의 증산은 실내 습도를 높여 쾌적성을 높인다."},{"id":"2018-2-기말-68","set":"2018-2-기말","year":2018,"kind":"기말","no":68,"stem":"다음 가정 채소 중 파종 후 수확까지 소요기간이 가장 긴 것은?","opts":["시금치","오이","감자","마늘"],"ans":[4],"multi":false,"dup":false,"expl":"파종 후 수확까지 기간은 마늘(약 8∼9개월)이 가장 길다."},{"id":"2018-2-기말-69","set":"2018-2-기말","year":2018,"kind":"기말","no":69,"stem":"다음 중 가정에서 씨앗을 받아 이듬해 종자로 활용할 수 있는 고정종자인 채소는?","opts":["고추","수박","상추","호박"],"ans":[3],"multi":false,"dup":false,"expl":"상추는 고정종이라 씨앗을 받아 이듬해에도 활용할 수 있다. 고추·수박·호박은 F1 종자이다."},{"id":"2018-2-기말-70","set":"2018-2-기말","year":2018,"kind":"기말","no":70,"stem":"다음 블루베리 재배에서 전정에 대한 설명으로 바르지 않은 것은?","opts":["가지치는 방법에 따라 자름전정과 솎음전정으로 나뉜다","주로 2월경에 하는 것이 겨울전정이다","수확이 끝난 7월경에 하는 것이 여름전정이다","겨울전정은 솎아주는 정도로 해주는 것이다"],"ans":[4],"multi":false,"dup":false,"expl":"겨울전정은 솎아주는 정도가 아니라 굵은 가지를 솎고 길게 뻗은 가지를 잘라 주는 전정이다."},{"id":"2018-2-출석-31","set":"2018-2-출석","year":2018,"kind":"출석대체","no":31,"stem":"다음 중 생활원예가 필요한 사회적 배경이 아닌 것은?","opts":["도시개발을 위한 자연․환경파괴","경쟁사회에서 생겨나는 정서불안","정보화 발달로 인한 기계화","귀농․귀촌 인구증가"],"ans":[4],"multi":false,"dup":true,"expl":"생활원예가 필요한 사회적 배경은 산업화·도시화·정보화 등이며, 귀농·귀촌 인구 증가는 그 배경이 아니다."},{"id":"2018-2-출석-32","set":"2018-2-출석","year":2018,"kind":"출석대체","no":32,"stem":"다음 중 줄기 유관속의 배열이 환상으로 되어 있는 식물은?","opts":["단자엽 초본식물","쌍자엽 초본식물","선태식물","양치식물"],"ans":[2],"multi":false,"dup":false,"expl":"줄기의 유관속이 환상(고리 모양)으로 배열된 것은 쌍자엽 초본식물이다. 단자엽은 산재되어 있다."},{"id":"2018-2-출석-33","set":"2018-2-출석","year":2018,"kind":"출석대체","no":33,"stem":"식물의 잎 내부 구조에서 광합성을 하는 조직은?","opts":["표피조직","유관속조직","엽육조직","유관속초조직"],"ans":[3],"multi":false,"dup":false,"expl":"광합성을 하는 조직은 엽육조직이다."},{"id":"2018-2-출석-34","set":"2018-2-출석","year":2018,"kind":"출석대체","no":34,"stem":"다음 중 꽃에서 암술의 구성요소가 아닌 것은?","opts":["자방","꽃실","암술대","암술머리"],"ans":[2],"multi":false,"dup":true,"expl":"암술은 암술머리·암술대·씨방으로 구성되며 꽃실은 수술의 요소이다."},{"id":"2018-2-출석-35","set":"2018-2-출석","year":2018,"kind":"출석대체","no":35,"stem":"다음 중 뿌리구조에서 중 var mem = {};
function load(k, dflt){
  try{ var raw = localStorage.getItem(k); if(raw===null) return dflt; var v = JSON.parse(raw); return v===null?dflt:v; }
  catch(e){ return (mem[k]===undefined? dflt : mem[k]); }
}
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function shuffled(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- 선지 순서 섞기 ---------- */
var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
function identityPerm(n){ var a = []; for(var i=0;i<n;i++) a.push(i); return a; }
function makePerm(n){ return state.optShuffle ? shuffled(identityPerm(n)) : identityPerm(n); }
/* 해설 속 ①~④ 표기를 섞인 순서에 맞게 다시 매핑 (숫자 읽는 소리에 맞춰 조사도 정리) */
function remapExpl(expl, perm){
  if(!expl) return '';
  var toDisp = {};
  for(var i=0;i<perm.length;i++){ toDisp[perm[i]+1] = i+1; }
  var out = expl.replace(/[①②③④⑤]/g, function(ch){
    var n = CIRC.indexOf(ch)+1;
    return toDisp[n] ? CIRC[toDisp[n]-1] : ch;
  });
  var WITH = {은:1, 이:1, 을:1, 과:1};      // 받침 있는 소리(일·삼)
  var WITHOUT = {는:1, 가:1, 를:1, 와:1};   // 받침 없는 소리(이·사·오)
  var toWith = {는:'은', 가:'이', 를:'을', 와:'과'};
  var toWithout = {은:'는', 이:'가', 을:'를', 과:'와'};
  return out.replace(/([①②③④⑤])(은|는|이|가|을|를|과|와)/g, function(m, num, josa){
    var noBatchim = (num === '②' || num === '④' || num === '⑤');
    if(noBatchim && WITH[josa]) return num + toWithout[josa];   // 은→는, 이→가 ...
    if(!noBatchim && WITHOUT[josa]) return num + toWith[josa];  // 는→은, 가→이 ...
    return m;
  });
}
/* perm: 화면 순서 -> 원본 인덱스(0부터). 없으면 원본 순서 그대로 */
function viewOf(q, perm){
  if(!perm || perm.length !== q.opts.length) perm = identityPerm(q.opts.length);
  var toDisp = {};
  perm.forEach(function(o, i){ toDisp[o+1] = i+1; });
  return {
    opts: perm.map(function(o){ return q.opts[o]; }),
    ans: q.ans.map(function(n){ return toDisp[n] || n; }).sort(function(a,b){ return a-b; }),
    perm: perm,
    expl: remapExpl(q.expl, perm)
  };
}

function bookCount(){ return Object.keys(bookmarks).length; }
function normStem(s){ return s.replace(/[^가-힣A-Za-z0-9]/g,'').slice(0,40); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function nowText(){
  var d = new Date();
  var mm = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'.'+mm+'.'+dd+' '+(('0'+d.getHours()).slice(-2))+':'+(('0'+d.getMinutes()).slice(-2));
}

function applyTheme(){
  var t = state.theme;
  if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='dark' ? '#0f1310' : '#2f7d5d');
}

/* ---------- pool ---------- */
function scopeList(scope){
  if(scope === 'all') return DATA.slice();
  if(scope === '기말') return DATA.filter(function(q){ return q.kind==='기말'; });
  if(scope === '출석') return DATA.filter(function(q){ return q.kind==='출석대체'; });
  if(scope === 'wrong') return Object.keys(wrongNote).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope === 'book') return Object.keys(bookmarks).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope.indexOf('set:')===0) return DATA.filter(function(q){ return q.set === scope.slice(4); });
  return DATA.slice();
}
function buildPool(){
  var list = scopeList(state.scope);
  if(state.dedupe){
    var seen = {};
    list = list.filter(function(q){ var k = normStem(q.stem); if(seen[k]) return false; seen[k] = 1; return true; });
  }
  if(state.shuffle) list = shuffled(list);
  if(state.limit && list.length > state.limit) list = list.slice(0, state.limit);
  return list.map(function(q){ return q.id; });
}

function startQuiz(pool, label){
  var maps = {};
  pool.forEach(function(id){ var q = BY_ID[id]; if(q) maps[id] = makePerm(q.opts.length); });
  quiz = {
    pool: pool, i: 0, picks: {}, revealed: {}, finished: false, maps: maps,
    mode: state.mode, startAt: Date.now(),
    label: label || (state.scope==='all' ? '전체 문제은행' : (state.scope==='기말'?'기말고사만':(state.scope==='출석'?'출석대체만':(state.scope==='wrong'?'오답노트':(state.scope==='book'?'북마크':setLabel(state.scope.slice(4)))))))
  };
  renderQuiz();
}

/* pick은 화면에 보인 번호(1~4)이므로 섞인 순서로 정답을 판정한다 */
function isRight(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  return v.ans.indexOf(pick) >= 0;
}

function recordAnswer(q, pick){
  var ok = isRight(q, pick);
  if(!ok){
    var rec = wrongNote[q.id] || {n:0};
    rec.n = (rec.n||0) + 1; rec.t = Date.now();
    wrongNote[q.id] = rec;
  } else if(state.removeOnCorrect && wrongNote[q.id]){
    delete wrongNote[q.id];
  }
  save(LS_KEYS.wrong, wrongNote);
  return ok;
}

  var done = Object.keys(quiz.picks).length;
  var revealed = quiz.mode === 'instant' && quiz.revealed[q.id];
  var pick = quiz.picks[q.id];
  var v = viewOf(q, quiz.maps ? quiz.maps[q.id] : null);
  var correctSoFar = 0;
  quiz.pool.forEach(function(id){ if(quiz.picks[id] && isRight(BY_ID[id], quiz.picks[id])) correctSoFar++; });
  var answeredSoFar = done;

  '<div class="topbar">' +
    '<div class="wrap"><div class="inner">' +
      '<button class="iconbtn" id="btn-quit" aria-label="그만두기">✕</button>' +

      '<span><b>' + (quiz.i+1) + '</b> / ' + total + '</span>' +
      '<span>정답률 <b>' + (answeredSoFar ? pct(correctSoFar, answeredSoFar) + '%' : '–') + '</b></span>' +
      '<span>오답노트 <b>' + wrongCount() + '</b></span>' +
    '</div></div>' +
    '<div class="progress"><i style="width:' + ((quiz.i)/total*100) + '%"></i></div>' +
  '</div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta">' +
        '<span class="badge">' + esc(setLabel(q.set)) + '</span>' +
        '<span class="badge gray">' + q.no + '번</span>' +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') +
        '<button class="star" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
      '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts" id="opts">' +
        v.opts.map(function(txt, idx){
          var n = idx+1;
          var cls = 'opt';
          if(revealed){
            if(v.ans.indexOf(n) >= 0) cls += ' right';
            else if(pick === n) cls += ' wrong';
          } else if(pick === n){
            cls += ' picked';
          }
          return '<button class="' + cls + '" data-pick="' + n + '"' + ' data-picked="' + (pick===n?1:0) + '"' + (revealed ? ' disabled' : '') + '>' +
            '<span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
            (revealed && v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') +
          '</button>';
        }).join('') +
      '</div>' +
      (revealed ? feedbackHtml(q, pick) : '') +
    '</div>' +
    '<div class="navbar">' +
      '<button id="btn-prev"' + (quiz.i===0?' disabled':'') + '>이전</button>' +
      (quiz.i === total-1
        ? '<button class="primary" id="btn-next">' + (quiz.mode==='instant' ? '결과 보기' : '채점하기') + '</button>'

    '</div>' +
    '<div class="hint">' + (quiz.mode==='instant' ? '선지를 고르면 바로 채점됩니다.' : '답을 골라 두고 마지막에 한 번에 채점합니다.') + '</div>' +

  };
  document.getElementById('btn-theme2').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme');
    state.theme = cur === 'dark' ? 'light' : 'dark';
    save(LS_KEYS.theme, state.theme); applyTheme(); renderQuiz();
  };
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderQuiz();
  };
  var optsBox = document.getElementById('opts');
  optsBox.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){
      var n = parseInt(b.getAttribute('data-pick'), 10);
      if(quiz.mode === 'instant' && quiz.revealed[q.id]) return;
      quiz.picks[q.id] = n;
      if(quiz.mode === 'instant'){
        quiz.revealed[q.id] = true;
        recordAnswer(q, n);
      }
      renderQuiz();
    };
  });
  document.getElementById('btn-prev').onclick = function(){ if(quiz.i>0){ quiz.i--; renderQuiz(); } };
  document.getElementById('btn-next').onclick = function(){
    if(quiz.mode === 'instant' && !quiz.revealed[q.id]){
      alert('선지를 먼저 고르세요.'); return;
    }
    if(quiz.i === quiz.pool.length-1){ finishQuiz(); return; }
    quiz.i++;
    renderQuiz();
  };
  window.scrollTo(0,0);
}

function feedbackHtml(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  var ok = v.ans.indexOf(pick) >= 0;
  var ansText = v.ans.map(function(n){ return n + ') ' + v.opts[n-1]; }).join(' / ');
  return '<div class="feedback ' + (ok?'ok':'no') + '">' +
    '<div class="head">' + (ok ? '정답입니다' : '오답입니다') + (q.multi ? ' · 복수정답 문항(전항 정답 처리)' : '') + '</div>' +
    '<div class="ans"><b>정답</b> ' + esc(ansText) + '</div>' +
    (q.expl ? '<div>' + esc(v.expl) + '</div>' : '') +
  '</div>';
}

function finishQuiz(){
  var total = quiz.pool.length;
  var picks = quiz.picks;
  var correct = 0, unanswered = 0, wrongIds = [];
  quiz.pool.forEach(function(id){
    var p = picks[id];
    if(!p){ unanswered++; wrongIds.push(id); return; }
    if(isRight(BY_ID[id], p)) correct++;
    else { wrongIds.push(id); }
  });
  if(quiz.mode === 'exam'){
    quiz.pool.forEach(function(id){ var p = picks[id]; if(p) recordAnswer(BY_ID[id], p); });
  }
  var spent = Math.max(1, Math.round((Date.now()-quiz.startAt)/1000));
  hist.unshift({label: quiz.label, when: nowText(), correct: correct, total: total, mode: quiz.mode, sec: spent});
  hist = hist.slice(0,20);
  save(LS_KEYS.stats, hist);
  quiz.finished = true;
  quiz.result = {correct: correct, total: total, unanswered: unanswered, wrongIds: wrongIds, spent: spent};
  renderResult();
}

  var items = ids.map(function(id){ return BY_ID[id]; }).filter(Boolean);
  items.sort(function(a,b){ return a.set < b.set ? 1 : (a.set > b.set ? -1 : a.no-b.no); });
  var title = kind === 'wrong' ? '오답노트' : '북마크';

  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">' + title + ' <span class="muted small">' + items.length + '</span></div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    (items.length ? '<div class="card"><div class="wronglist">' + items.map(function(q){
      var rec = wrongNote[q.id];
      return '<button class="wrongitem" data-detail="' + q.id + '">' +
        '<div class="row-top"><span class="badge">' + esc(setLabel(q.set)) + '</span><span class="meta">' + q.no + '번</span>' +
        (kind==='wrong' && rec && rec.n ? '<span class="meta">· ' + rec.n + '회 틀림</span>' : '') + '</div>' +
        '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
        '<div class="corr">정답: ' + q.ans.map(function(n){ return esc(q.opts[n-1]); }).join(' / ') + '</div>' +
      '</button>';
    }).join('') + '</div></div>'
      : '<div class="card"><div class="empty">' + (kind==='wrong' ? '오답이 없습니다.<br>문제를 풀면 틀린 문제가 여기에 쌓입니다.' : '북마크한 문제가 없습니다.<br>문제 화면의 ☆를 눌러 저장하세요.') + '</div></div>') +
    (items.length ? '<div class="navbar"><button class="primary" id="btn-solve">' + (kind==='wrong'?'오답 전체 다시 풀기':'북마크 전체 풀기') + '</button></div>' : '') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ renderDetail(b.getAttribute('data-detail'), function(){ renderList(kind); }); };
  });
  var solve = document.getElementById('btn-solve');
  if(solve) solve.onclick = function(){ startQuiz(items.map(function(q){ return q.id; }), title + ' 풀기'); };
  window.scrollTo(0,0);
}

function renderDetail(id, back, perm){
  var q = BY_ID[id];
  if(!q) { renderHome(); return; }
  var v = viewOf(q, perm || null);
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-back" aria-label="뒤로">←</button>' +
    '<div class="title">문제 보기</div>' +
    '<button class="iconbtn" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta"><span class="badge">' + esc(setLabel(q.set)) + '</span><span class="badge gray">' + q.no + '번</span>' +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') + '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts">' + v.opts.map(function(txt, idx){
        var n = idx+1, cls = 'opt' + (v.ans.indexOf(n) >= 0 ? ' right' : '');
        return '<div class="' + cls + '"><span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
          (v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') + '</div>';
      }).join('') + '</div>' +
      (q.expl ? '<div class="answerbox"><b>해설</b><br>' + esc(v.expl) + '</div>' : '') +
    '</div>' +
    '<div class="navbar"><button class="ghost" id="btn-back2">목 록</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-back').onclick = back;
  document.getElementById('btn-back2').onclick = back;
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderDetail(id, back, perm);
  };
  window.scrollTo(0,0);
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if(!quiz || quiz.finished) return;
  var q = BY_ID[quiz.pool[quiz.i]];
  if(!q) return;
  if(e.key >= '1' && e.key <= '4'){
    var n = parseInt(e.key,10);
    if(!(quiz.mode==='instant' && quiz.revealed[q.id])){
      quiz.picks[q.id] = n;
      if(quiz.mode==='instant'){ quiz.revealed[q.id] = true; recordAnswer(q, n); }
      renderQuiz();
    }
  } else if(e.key === 'ArrowRight' || e.key === 'Enter'){
    var b = document.getElementById('btn-next'); if(b) b.click();
  } else if(e.key === 'ArrowLeft'){
    var p = document.getElementById('btn-prev'); if(p && !p.disabled) p.click();
  }
});

applyTheme();
renderHome();
</script>
</body>
</html>
