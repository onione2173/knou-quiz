의 종류를 고려해 정한다."},{"id":"L11-15","set":"강의록","year":null,"kind":"강의록","no":215,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"가정에서 구근식물로 수경재배하기에 알맞은 식물로 옳게 묶인 것은?","opts":["토마토, 오이, 가지, 호박","상추, 쑥갓, 미나리, 치커리","히아신스, 수선화, 크로커스, 튤립","딸기, 수박, 참외, 멜론"],"ans":[3],"multi":false,"dup":false,"expl":"구근식물 수경재배에는 히아신스·수선화·크로커스·튤립·아이리스와 양파·마늘·쪽파 등이 이용된다."},{"id":"L11-16","set":"강의록","year":null,"kind":"강의록","no":216,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"분화식물의 심지재배에 이용하는 식물로 옳게 묶인 것은?","opts":["칼랑코에, 아프리칸바이올렛, 안스리움, 스파티필름","토마토, 오이, 딸기, 고추","히아신스, 튤립, 수선화, 크로커스","상추, 청경채, 쑥갓, 치커리"],"ans":[1],"multi":false,"dup":false,"expl":"분화식물 심지재배에는 다년생 숙근초(칼랑코에·아프리칸바이올렛·국화), 구근류(시클라멘·수선화·구근베고니아), 관엽식물(안스리움·스파티필름·포인세티아) 등이 이용된다."},{"id":"L11-17","set":"강의록","year":null,"kind":"강의록","no":217,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"과채류 수경재배에서 토마토에 알맞은 양액 농도(EC)로 옳은 것은?","opts":["3.5~4.5dS/m","0.5~0.8dS/m","2.0~3.0dS/m","1.0~1.5dS/m"],"ans":[3],"multi":false,"dup":false,"expl":"토마토 수경재배는 EC 2.0~3.0dS/m, 딸기는 EC 1.0~1.5dS/m가 알맞다."},{"id":"L11-18","set":"강의록","year":null,"kind":"강의록","no":218,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"허브 수경재배에 대한 설명으로 옳은 것은?","opts":["허브는 과채류와 같이 EC 3.0dS/m 이상에서 기른다","허브는 음지성 식물로 생육 적온이 25~30℃이다","허브는 호광성 식물로 생육 적온이 15~20℃이다","허브는 양액을 공급하지 않아도 된다"],"ans":[3],"multi":false,"dup":false,"expl":"허브는 호광성 식물로 생육 적온이 15~20℃이고, 허브용 배양액을 주 2~3회 급액하며 EC는 1.2~1.8dS/m로 관리한다."},{"id":"L11-19","set":"강의록","year":null,"kind":"강의록","no":219,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"Microgreen(어린 채소)에 대한 설명으로 옳은 것은?","opts":["과채류의 열매만 수확하는 재배법이다","어린 채소를 뜻하며 수경재배로 생산해 샐러드 등으로 이용하고 사업화도 이루어지고 있다","다 자란 잎채소를 건조해 가루로 만든 것이다","구근을 물에 담가 꽃을 피우는 방식이다"],"ans":[2],"multi":false,"dup":false,"expl":"Microgreen은 어린 채소를 뜻하며 인천국제성모병원 마리스텔라, 서울시립대 등에서 재배되고 샐러드용으로 사업화되고 있다. 멀티그린·겨자채·케일·루꼴라 등이 재배된다."},{"id":"L11-20","set":"강의록","year":null,"kind":"강의록","no":220,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"자루재배(bag culture)에 대한 설명으로 옳은 것은?","opts":["플라스틱 비닐 튜브에 각종 배지를 채워 작물을 재배한다","PVC 파이프를 수직으로 세워 재배한다","화분에 상토를 넣어 재배한다","스티로폼 베드에 양액을 담아 재배한다"],"ans":[1],"multi":false,"dup":false,"expl":"자루재배는 플라스틱 비닐 튜브에 각종 배지를 채워 재배하는 방식이고, 베드재배는 플라스틱·스티로폼 베드를, 용기재배는 플라스틱 포트를 이용한다."},{"id":"L12-1","set":"강의록","year":null,"kind":"강의록","no":221,"lec":12,"lecName":"도시원예","src":"L","stem":"로빈슨(1987)이 정의한 도시원예의 핵심으로 옳은 것은?","opts":["원예식물의 생산보다 이용과 관련되며, 도시인의 스트레스를 줄이고 생활환경을 향상시키기 위해 식물의 기능을 연구·발전·교육하는 것","도시 근교에서 원예작물을 대규모로 생산해 소득을 높이는 것","도시 공원에 조경수를 식재하고 관리하는 것","실내에서 인공광으로 식물공장을 운영하는 것"],"ans":[1],"multi":false,"dup":false,"expl":"도시원예는 생산보다 이용에 초점을 두고, 도시인의 스트레스 경감과 생활환경 향상을 위해 식물의 기능을 연구·발전·교육하는 소비자 중심의 원예이다."},{"id":"L12-2","set":"강의록","year":null,"kind":"강의록","no":222,"lec":12,"lecName":"도시원예","src":"L","stem":"「도시농업의 육성 및 지원에 관한 법률」(도시농업법)이 시행된 때는?","opts":["2011년 5월 1일","2014년 11월 19일","2017년 3월 21일","2024년 1월 1일"],"ans":[2],"multi":false,"dup":false,"expl":"도시농업법은 2014년 11월 19일 시행되었고, 2017년 3월 21일 개정으로 수목·화초 재배와 곤충 사육까지 도시농업의 범위가 넓어졌다."},{"id":"L12-3","set":"강의록","year":null,"kind":"강의록","no":223,"lec":12,"lecName":"도시원예","src":"L","stem":"옥상녹화에서 저관리형의 특징으로 옳은 것은?","opts":["토심이 20cm 이하이고 건조에 강한 지피식물(세덤류) 위주로 식재한다","토심이 20cm 이상이며 교목을 포함한 다층구조로 조성한다","관수·시비·전정 등 정기적인 관리가 반드시 필요하다","경량형이 없고 중량형으로만 시공한다"],"ans":[1],"multi":false,"dup":false,"expl":"저관리형은 토심 20cm 이하에 건조에 강한 지피식물 위주로 식재한다. 관리형은 토심 20cm 이상에 지피식물·관목·교목을 다층으로 조성해 정기 관리가 필요하다."},{"id":"L12-4","set":"강의록","year":null,"kind":"강의록","no":224,"lec":12,"lecName":"도시원예","src":"L","stem":"미국 시애틀의 P-패치 공동체텃밭에서 경작자에게 부과하는 의무로 옳은 것은?","opts":["연간 사용료를 내고 1인당 연 8시간의 자원봉사를 한다","사용료 없이 1인당 연 100시간의 자원봉사를 한다","5년마다 경작 자격을 새로 시험으로 받는다","경작한 작물의 절반을 시에 납부한다"],"ans":[1],"multi":false,"dup":false,"expl":"시애틀 P-패치(85개 텃밭, 2,750구획, 경작자 6,300명)는 연간 사용료와 1인당 연 8시간의 자원봉사를 의무화하고 있다."},{"id":"L12-5","set":"강의록","year":null,"kind":"강의록","no":225,"lec":12,"lecName":"도시원예","src":"L","stem":"실내정원에서 증산작용이 활발해 음이온을 많이 발생시키는 식물로 옳은 것은?","opts":["팔손이나무, 스파티필름, 심비디움","선인장, 다육식물","아레카야자, 드라세나","관음죽, 테이블야자"],"ans":[1],"multi":false,"dup":false,"expl":"음이온을 다량 발생시키는 식물은 증산작용이 활발한 팔손이나무·스파티필름·심비디움·광나무이다. 음이온은 오염물질 제거와 신진대사 촉진에 도움을 준다."},{"id":"L12-6","set":"강의록","year":null,"kind":"강의록","no":226,"lec":12,"lecName":"도시원예","src":"L","stem":"밤에 이산화탄소를 흡수하는 식물로 침실에 두면 좋은 것을 묶은 것은?","opts":["호접란, 선인장, 다육식물","아레카야자, 인도고무나무","스킨답서스, 산호수","관음죽, 테이블야자"],"ans":[1],"multi":false,"dup":false,"expl":"침실에는 밤에 이산화탄소를 흡수하는 호접란·선인장·다육식물을 두는 것이 좋다. 아레카야자는 거실, 스킨답서스는 주방, 관음죽은 화장실에 알맞다."},{"id":"L12-7","set":"강의록","year":null,"kind":"강의록","no":227,"lec":12,"lecName":"도시원예","src":"L","stem":"2017년 3월 개정된 도시농업법에서 도시농업의 범위에 새로 포함된 행위는?","opts":["임업용 묘목 생산","축산물 가공","어류의 양식","곤충의 사육(양봉 포함)"],"ans":[4],"multi":false,"dup":false,"expl":"2017년 3월 21일 개정된 도시농업법은 도시농업을 농작물 경작·재배, 수목·화초 재배, 곤충 사육(양봉 포함)의 행위로 규정했다."},{"id":"L12-8","set":"강의록","year":null,"kind":"강의록","no":228,"lec":12,"lecName":"도시원예","src":"L","stem":"2024년 유형별 도시농업 현황에서 참여자 수가 가장 많은 유형은?","opts":["학교교육형","농장·공원형","근린생활권형","주택활용형"],"ans":[1],"multi":false,"dup":false,"expl":"참여자 수는 학교교육형 > 근린생활권형 > 주택활용형 > 농장·공원형의 순으로 나타났다."},{"id":"L12-9","set":"강의록","year":null,"kind":"강의록","no":229,"lec":12,"lecName":"도시원예","src":"L","stem":"스쿨팜의 효과로 제시된 것으로 옳게 묶인 것은?","opts":["체력 향상, 다이어트, 근력 강화","경쟁심, 성취욕, 소득 증대","수확량 증대, 병해충 감소, 노동력 절감","자연사랑, 협력, 화합, 책임, 존중"],"ans":[4],"multi":false,"dup":false,"expl":"스쿨팜은 학생과 일반인의 원예활동·원예치료를 목적으로 하며 자연사랑·협력·화합·책임·존중을 통해 바람직한 사회 구성원을 기르는 효과가 있다. 영국은 80여 개 스쿨팜(SFN), 미국은 팜투스쿨, 일본은 교육팜을 운영한다."},{"id":"L12-10","set":"강의록","year":null,"kind":"강의록","no":230,"lec":12,"lecName":"도시원예","src":"L","stem":"공동체정원(community garden)에 대한 설명으로 옳은 것은?","opts":["학교 교육 과정의 체험 학습을 위해 교내에 만든 텃밭이다","기업이 옥상에 상업적 목적으로 작물을 생산하는 공간이다","근접 지역에 살며 비슷한 관심사와 가치를 공유하는 공동체가 참여해 조성한 도시농업 공간이다","지자체가 개인에게 경작을 목적으로 대여하는 253m2 규모의 작은 토지이다"],"ans":[3],"multi":false,"dup":false,"expl":"공동체정원은 근접해서 살고 비슷한 관심사와 가치를 공유하는 공동체가 참여해 삶의 질을 높이고자 근접 지역에 계획·조성한 도시농업 공간으로, 농업활동과 공동체의식, 활동·교육 장소의 역할을 한다."},{"id":"L12-11","set":"강의록","year":null,"kind":"강의록","no":231,"lec":12,"lecName":"도시원예","src":"L","stem":"캐나다 벤쿠버시의 공동체텃밭 정책에 대한 설명으로 옳은 것은?","opts":["공동체텃밭 경작자에게 연 8시간의 자원봉사를 의무화했다","토지 소유자가 유휴지를 공동체텃밭으로 임시 제공하면 재산세를 감면해 준다","지자체가 개인에게 77평 규모의 토지를 대여한다","시정부가 시민사회단체의 도시텃밭을 지원하는 그린썸 프로그램을 운영한다"],"ans":[2],"multi":false,"dup":false,"expl":"벤쿠버시는 2013년 기준 104개 공동체텃밭 4,000구획을 두고, 유휴지를 임시 제공한 토지 소유자에게 재산세를 감면했으며, 농민시장 거래 규모가 연 1,500만 달러로 도시농업이 지역경제에 기여했다."},{"id":"L12-12","set":"강의록","year":null,"kind":"강의록","no":232,"lec":12,"lecName":"도시원예","src":"L","stem":"영국의 얼랏먼트(allotment)에 대한 설명으로 옳은 것은?","opts":["지방자치단체가 개인에게 경작을 목적으로 대여하는 작은 토지 구획이다","비영리 자가 수요를 위해 300~400m2씩 나눈 독일의 텃밭이다","기업이 운영하는 옥상 농장이다","학교 교육용 텃밭으로 30m2 이상 규모이다"],"ans":[1],"multi":false,"dup":false,"expl":"얼랏먼트는 지방자치단체가 개인에게 경작을 목적으로 대여하는 작은 토지 구획(253m2, 77평)의 도시민 농장이다. 독일은 Kleingarten이 1획당 평균 300~400m2이다."},{"id":"L12-13","set":"강의록","year":null,"kind":"강의록","no":233,"lec":12,"lecName":"도시원예","src":"L","stem":"독일 연방텃밭농원법(Bundes Kleingarten Gesetz)에서 규정한 텃밭(농원)에 대한 설명으로 옳은 것은?","opts":["옥상에 설치한 경량 인공토양 정원이다","상업적 판매를 목적으로 대규모로 작물을 생산하는 농원이다","학교 교육 과정과 연계된 학생 전용 텃밭이다","비영리적으로 자가 수요를 위해 재배·수확하며 휴양을 목적으로 이용되는 농원으로, 도로·놀이터·클럽하우스 같은 공동설비를 갖춘다"],"ans":[4],"multi":false,"dup":false,"expl":"독일의 텃밭은 비영리적으로 자가 수요를 위해 재배·수확하며 휴양을 목적으로 이용되는 농원으로, 도로·놀이터·클럽하우스 같은 공동설비를 갖추고 1획당 평균 300~400m2(121평) 규모이다."},{"id":"L12-14","set":"강의록","year":null,"kind":"강의록","no":234,"lec":12,"lecName":"도시원예","src":"L","stem":"싱가포르의 기업형 도시농업 사례인 캄크랍(ComCrop)에 대한 설명으로 옳은 것은?","opts":["지하 공간에서 인공광으로만 작물을 생산한다","옥상을 활용해 557m2 면적에서 작물을 생산하고 80:20 법칙으로 수익의 20%를 사회에 환원한다","주상복합건물 옥상 60,000m2에서 작물을 재배하는 이더블가든이다","학교 옥상에 학생들이 텃밭을 만드는 프로그램이다"],"ans":[2],"multi":false,"dup":false,"expl":"캄크랍은 옥상을 활용해 557m2 면적에서 작물을 생산하고 80:20 법칙을 적용해 회사 수익의 20%를 사회에 환원하며 지역 노인들에게 일자리를 제공한다. 이더블가든은 피플스파크 콤플렉스 옥상 60,000m2에서 작물을 재배하는 사례이다."},{"id":"L12-15","set":"강의록","year":null,"kind":"강의록","no":235,"lec":12,"lecName":"도시원예","src":"L","stem":"옥상녹화 시스템을 아래에서 위로 바르게 나열한 것은?","opts":["방수층 - 방근층 - 배수·저장층 - 토양여과층 - 토 우수하고 빛이 적어도 잘 자라는 아레카야자·인도고무나무·드라세나·디펜바키아를, 베란다에는 팔손이나무·분화국화·시클라멘·꽃베고니아·허브류를 둔다."},{"id":"L13-1","set":"강의록","year":null,"kind":"강의록","no":241,"lec":13,"lecName":"가정채소","src":"L","stem":"색깔에 따른 채소 분류에서 안토시아닌을 함유한 적색채소에 속하는 것은?","opts":["비트, 적양배추, 파프리카","당근, 노란호박","마늘, 무, 양파","검정콩, 검정옥수수, 검정토마토"],"ans":[1],"multi":false,"dup":false,"expl":"적색채소는 안토시아닌을 함유하며 비트·적양배추·파프리카가 이에 속한다. 등황색은 카로티노이드, 백색은 알린·티오시안네이트, 흑색은 이소플라본이다."},{"id":"L13-2","set":"강의록","year":null,"kind":"강의록","no":242,"lec":13,"lecName":"가정채소","src":"L","stem":"호냉성 채소의 생육 적온과 해당 채소로 옳은 것은?","opts":["18~20℃, 무·배추·상추·감자","23~25℃, 고추·토마토·수박·고구마","10~12℃, 마늘·양파·파","30℃ 이상, 오이·호박"],"ans":[1],"multi":false,"dup":false,"expl":"호냉성 채소는 18~20℃에서 잘 자라는 잎·뿌리채소(무·배추·상추·감자)이고, 호온성 채소는 23~25℃를 좋아하는 열매채소(고추·토마토·수박·고구마)이다."},{"id":"L13-3","set":"강의록","year":null,"kind":"강의록","no":243,"lec":13,"lecName":"가정채소","src":"L","stem":"잎·뿌리채소를 줄뿌림 했을 때 솎음 간격으로 옳은 것은?","opts":["당근 10cm, 무 20cm, 배추 30~40cm","당근 30cm, 무 10cm, 배추 10cm","모두 5cm 간격으로 솎는다","당근 50cm, 무 50cm, 배추 60cm"],"ans":[1],"multi":false,"dup":false,"expl":"본잎 3~4매 때 솎아 주며 간격은 당근 10cm, 무 20cm, 배추 30~40cm이다. 병든 것, 생육이 부진한 것, 품종 특성을 나타내지 않는 것을 제거한다."},{"id":"L13-4","set":"강의록","year":null,"kind":"강의록","no":244,"lec":13,"lecName":"가정채소","src":"L","stem":"열매채소(고추·토마토·가지) 모종을 본밭에 아주심기 하는 시기로 가장 알맞은 것은?","opts":["토양 온도가 오르고 서리 위험이 없는 5월 초","서리가 내리는 3월 중순","장마가 끝난 8월 초","첫서리 직후인 11월 초"],"ans":[1],"multi":false,"dup":false,"expl":"열매채소는 토양 온도가 오르고 서리 위험이 없는 5월 초에 심으며, 서리 위험이 있으면 종이꼬깔을 씌운다. 상추·엔디브는 4월 말에 심어도 된다."},{"id":"L13-5","set":"강의록","year":null,"kind":"강의록","no":245,"lec":13,"lecName":"가정채소","src":"L","stem":"토양 수분 변화가 심할 때 나타나는 생리장해로 옳은 것은?","opts":["열근(무·당근)과 열과(멜론·참외)","배꼽썩음병(토마토)","탄저병(고추)","역병(고추·토마토)"],"ans":[1],"multi":false,"dup":false,"expl":"토양 수분 변화가 심하면 열근과 열과가 생긴다. 배꼽썩음병은 석회비료를 주지 않은 사질 토양에서, 탄저병·역병은 병원균에 의한 병해이다."},{"id":"L13-6","set":"강의록","year":null,"kind":"강의록","no":246,"lec":13,"lecName":"가정채소","src":"L","stem":"가정채소를 저장할 때 호온성 채소의 적정 저장온도로 옳은 것은?","opts":["10~12℃","0℃","-2℃","25℃"],"ans":[1],"multi":false,"dup":false,"expl":"호냉성 채소(배추·상추·당근·감자)는 0℃, 호온성 채소(수박·오이·토마토·고추·고구마)는 10~12℃에서 저장한다."},{"id":"L13-7","set":"강의록","year":null,"kind":"강의록","no":247,"lec":13,"lecName":"가정채소","src":"L","stem":"가정채소의 중요성에 대한 설명으로 옳은 것은?","opts":["어린이 교육과는 무관하다","농약을 많이 사용해 병해충을 완전히 막을 수 있다","부식비를 절감할 수 있어 독일에서는 여름 채소의 50%를 텃밭에서 생산한다","도시 녹화와는 관계가 없다"],"ans":[3],"multi":false,"dup":false,"expl":"가정채소는 무농약·저농약의 안전 먹거리를 생산하고 부식비를 절감하며(독일은 여름 채소 50%를 텃밭에서 생산), 육체적·정신적 효과와 어린이의 환경친화적 인성 구축, 가족 유대 강화, 도시 녹화와 탄산가스 감축 효과가 있다."},{"id":"L13-8","set":"강의록","year":null,"kind":"강의록","no":248,"lec":13,"lecName":"가정채소","src":"L","stem":"채소의 세 가지 기능으로 옳은 것은?","opts":["경운, 시비, 관수","생체방어, 생체조절, 정신조절","저장, 수송, 가공","광합성, 증산, 호흡"],"ans":[2],"multi":false,"dup":false,"expl":"채소의 3기능은 생체방어, 생체조절, 정신조절이며 영양적 측면(비타민·무기질 급원)과 보건적 측면(식물섬유, 체질 산성화 방지)도 중요하다."},{"id":"L13-9","set":"강의록","year":null,"kind":"강의록","no":249,"lec":13,"lecName":"가정채소","src":"L","stem":"햇빛 적응성에 따른 분류에서 약광에서도 자랄 수 있는 채소로 옳게 묶인 것은?","opts":["토마토, 고추, 수박","배추, 양배추, 무","콩나물, 치콘","생강, 삼엽채, 미나리, 쑥갓, 머위"],"ans":[4],"multi":false,"dup":false,"expl":"강광에는 열매채소(토마토·고추·수박), 보통광에는 잎·뿌리채소(배추·양배추·무), 약광에는 생강·삼엽채·미나리·쑥갓·머위, 암실에는 콩나물·치커리싹(치콘)이 해당한다."},{"id":"L13-10","set":"강의록","year":null,"kind":"강의록","no":250,"lec":13,"lecName":"가정채소","src":"L","stem":"재배 계절에 따른 분류에서 봄채소로 옳게 묶인 것은?","opts":["오이, 수박, 고추, 고구마","무, 배추, 당근, 갓","상추, 쑥갓, 완두, 감자","마늘, 양파, 파, 시금치"],"ans":[3],"multi":false,"dup":false,"expl":"봄채소는 상추·쑥갓·완두·감자, 여름채소는 오이·수박·고추·고구마, 가을채소는 무·배추·당근·갓·순무, 겨울채소는 마늘·양파·파·쪽파·시금치이다."},{"id":"L13-11","set":"강의록","year":null,"kind":"강의록","no":251,"lec":13,"lecName":"가정채소","src":"L","stem":"색깔에 따른 채소 분류에서 이소플라본을 함유한 흑색 채소로 옳게 묶인 것은?","opts":["당근, 노란호박, 단호박","마늘, 무, 양파","비트, 적양배추, 파프리카","검정콩, 검정옥수수, 검정토마토"],"ans":[4],"multi":false,"dup":false,"expl":"녹색은 엽록소(상추·시금치·쑥갓·청경채), 등황색은 카로티노이드(당근·노란호박), 백색은 알린·티오시안네이트(마늘·무·양파), 적색은 안토시아닌(비트·적양배추·파프리카), 흑색은 이소플라본(검정콩·검정옥수수·검정토마토)이다."},{"id":"L13-12","set":"강의록","year":null,"kind":"강의록","no":252,"lec":13,"lecName":"가정채소","src":"L","stem":"텃밭을 조성할 때 도로와의 거리로 옳은 것은?","opts":["도로와 바로 붙어 있어도 무방하다","도로로부터 100m 이상 떨어져야 한다","도로로부터 최소한 10m 이상 유지한다","도로로부터 1m만 떨어지면 된다"],"ans":[3],"multi":false,"dup":false,"expl":"텃밭은 도로변을 피해 도로로부터 최소한 10m 이상 유지하고, 오염된 도로 빗물이 텃밭으로 흘러들지 않게 해야 하며, 오염되지 않은 토양이 객토된 곳을 선택한다."},{"id":"L13-13","set":"강의록","year":null,"kind":"강의록","no":253,"lec":13,"lecName":"가정채소","src":"L","stem":"관리 능력에 따른 텃밭 면적으로 4인 가족에게 알맞은 것은?","opts":["100~150m2","10~15m2","1~2m2","500m2 이상"],"ans":[2],"multi":false,"dup":false,"expl":"4인 가족은 10~15m2를 기준으로 하며, 소규모(6.6m2, 2평)는 상추·들깨·케일·알타리, 중규모(17m2, 5평), 대규모(33m2, 10평)로 확장한다."},{"id":"L13-14","set":"강의록","year":null,"kind":"강의록","no":254,"lec":13,"lecName":"가정채소","src":"L","stem":"돌려짓기(윤작)에 대한 설명으로 옳은 것은?","opts":["연작장해를 피하기 위한 방법으로 고추·토마토는 4년 휴작이 필요하다","같은 작물을 계속 재배해 토양을 비옥하게 하는 방법이다","고추·토마토는 연작이 가능하지만 상추·무는 4년 휴작이 필요하다","모든 채소를 해마다 같은 자리에 심는 방법이다"],"ans":[1],"multi":false,"dup":false,"expl":"이어짓기(연작)는 같은 작물을 계속 재배해 연작 피해가 생기고, 돌려짓기(윤작)는 이를 피하는 방법이다. 상추·무·배추·상추·호박은 연작이 가능하지만 고추·토마토는 4년 휴작이 필요하다."},{"id":"L13-15","set":"강의록","year":null,"kind":"강의록","no":255,"lec":13,"lecName":"가정채소","src":"L","stem":"섞어짓기(혼작)에서 동반작물을 심어 병충해 방제 효과를 보는 조합으로 옳은 것은?","opts":["고추 + 가지","배추과 채소 + 토마토","상추 + 시금치","배추과 채소 + 메리골드, 바실"],"ans":[4],"multi":false,"dup":false,"expl":"채소와 허브를 함께 심으면 병충해 방제 효과가 있으며 배추과 채소에 메리골드·바실을 심는 것이 대표적이다."},{"id":"L13-16","set":"강의록","year":null,"kind":"강의록","no":256,"lec":13,"lecName":"가정채소","src":"L","stem":"싹채소를 기를 때 종자에 대한 주의사항으로 옳은 것은?","opts":["시판되는 아무 종자나 사용해도 된다","농약 코팅 종자를 써야 발아가 잘 된다","종자를 3일간 물에 담가 두었다가 그대로 먹는다","반드시 새싹용 종자를 구입하고 착색되거나 농약 코팅된 종자는 사용하지 않는다"],"ans":[4],"multi":false,"dup":false,"expl":"싹채소는 반드시 새싹용 종자를 구입해야 하며 착색 또는 농약 코팅 종자는 사용하지 않는다. 종자를 물에 불려 암조건에서 치상하고 1일 2~3회 물을 주며, 싹이 난 뒤 햇빛에 둔다."},{"id":"L13-17","set":"강의록","year":null,"kind":"강의록","no":257,"lec":13,"lecName":"가정채소","src":"L","stem":"용기재배에서 표준으로 하는 상토량으로 옳은 것은?","opts":["잎채소 10L, 열매채소 30L","잎채소는 주당 2L 내외, 열매채소는 5~10L","모든 채소 주당 20L","잎채소 0.1L, 열매채소 0.5L"],"ans":[2],"multi":false,"dup":false,"expl":"용기재배의 상토는 잎채소는 주당 2L 내외, 열매채소는 5~10L를 표준으로 하며 생육 단계와 날씨를 고려한다."},{"id":"L13-18","set":"강의록","year":null,"kind":"강의록","no":258,"lec":13,"lecName":"가정채소","src":"L","stem":"텃밭의 이랑 만들기에 대한 설명으로 옳은 것은?","opts":["두둑 폭은 잎채소 1.2m, 고랑 0.4m로 하고 고추·감자·고구마는 골이랑 60cm로 만든다","두둑 폭은 0.4m, 고랑은 1.2m로 만든다","모든 채소를 평평한 밭에 그대로 심는다","검정 비닐 멀칭은 지온을 낮추기 위해 한다"],"ans":[1],"multi":false,"dup":false,"expl":"퇴비와 밑거름을 뿌리고 경운·써레질한 뒤 두둑 폭 1.2m(잎채소), 고랑 0.4m, 골이랑 60cm(고추·감자·고구마)로 만들고 검정 비닐로 멀칭해 잡초를 억제하고 지온을 높인다."},{"id":"L13-19","set":"강의록","year":null,"kind":"강의록","no":259,"lec":13,"lecName":"가정채소","src":"L","stem":"과채류 모종을 고를 때 좋은 모의 조건으로 옳지 않은 것은?","opts":["잎의 뒷면에 병충해 피해가 없는 모","고추·토마토는 꽃이 1~2개 착생한 모","상토가 붙어 있고 뿌리가 백색으로 튼실한 모","떡잎이 떨어지고 키만 큰 모"],"ans":[4],"multi":false,"dup":false,"expl":"좋은 모는 떡잎이 붙은 튼실한 모, 상토가 붙고 뿌리가 백색인 모, 고추·토마토는 꽃이 1~2개 착생한 모, 잎 뒷면에 병충해 피해가 없는 모이다."},{"id":"L13-20","set":"강의록","year":null,"kind":"강의록","no":260,"lec":13,"lecName":"가정채소","src":"L","stem":"가정채소의 비료 주기에서 밑거름과 덧거름의 비율로 옳은 것은?","opts":["5:5","9:1","7:3","3:7"],"ans":[3],"multi":false,"dup":false,"expl":"요구도에 따라 질소·칼리를 기준으로 밑거름과 덧거름을 7:3으로 주며, 상추·시금치는 10:7:10kg/10a, 배추·양배추는 20:16:20, 고추·토마토는 30:24:30kg/10a 수준으로 준다."},{"id":"L14-1","set":"강의록","year":null,"kind":"강의록","no":261,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리의 주요 기능성 물질로, 뇌·눈 건강과 항암 작용 등에 도움을 주는 색소 성분은?","opts":["안토시아닌","카로티노이드","알린","캡사이신"],"ans":[1],"multi":false,"dup":false,"expl":"블루베리의 기능성 물질은 폴리페놀계 안토시아닌으로, 기억력 증진·시력 개선·혈압 강하·당뇨 개선·항암 작용 등이 알려져 있다."},{"id":"L14-2","set":"강의록","year":null,"kind":"강의록","no":262,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"국내에서 재배하는 북부하이부시 블루베리 가운데 6월 중순에 익는 조생종 품종은?","opts":["듀크","루벨","엘리어트","브리짓타"],"ans":[1],"multi":false,"dup":false,"expl":"조생종은 6월 중순 익는 듀크·블루제이·페트리어트, 중생종은 7월 상순의 블루크랍·챈들러, 만생종은 7월 하순의 루벨·엘리자베스·엘리어트이다."},{"id":"L14-3","set":"강의록","year":null,"kind":"강의록","no":263,"l xpl":"새가지 상단에는 꽃눈, 하단에는 잎눈(영양눈)이 형성되며, 꽃눈은 꽃송이(화방)로, 잎눈은 가지와 잎으로 발달한다."},{"id":"L14-15","set":"강의록","year":null,"kind":"강의록","no":275,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리의 흡지(sucker)에 대한 설명으로 옳은 것은?","opts":["뿌리에서 발생하므로 모두 제거해야 한다","꽃눈이 달려 열매를 맺는 가지이다","근경(지하줄기)에서 발생하며 불필요한 것은 제거하고 일부는 주축지 갱신용·번식용으로 쓴다","가을에만 발생하는 단화지이다"],"ans":[3],"multi":false,"dup":false,"expl":"흡지는 근경(지하줄기)에서 발생하며 불필요한 흡지는 제거하고 일부는 주축지 갱신용과 번식용으로 이용한다."},{"id":"L14-16","set":"강의록","year":null,"kind":"강의록","no":276,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리 뿌리의 유효근권 범위로 옳은 것은?","opts":["깊이 1m, 넓이 2m","깊이 50~60cm, 넓이 20~30cm","깊이 20~30cm, 넓이 50~60cm","깊이 5cm, 넓이 10cm"],"ans":[3],"multi":false,"dup":false,"expl":"블루베리는 천근성으로 얕게 분포해 유효근권이 깊이 20~30cm, 넓이 50~60cm이다."},{"id":"L14-17","set":"강의록","year":null,"kind":"강의록","no":277,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리 뿌리의 특성으로 옳은 것은?","opts":["뿌리 생육 적온이 30~35℃로 높다","섬유근계로 측근이 가늘고 근모가 없으며 생육 적온이 7~20℃로 낮다","주근계로 굵은 중심근이 깊게 뻗고 근모가 많다","근모가 발달해 건조에 매우 강하다"],"ans":[2],"multi":false,"dup":false,"expl":"블루베리 뿌리는 천근성 섬유근계로 중심근 직경 0.5cm, 측근 0.05cm 정도이며 근모가 없고 생육 적온이 7~20℃로 낮아 6월 초와 9월 중순에 생육이 활발하다."},{"id":"L14-18","set":"강의록","year":null,"kind":"강의록","no":278,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리 과실 비대 생장의 3단계로 옳은 것은?","opts":["유과성장기(세포분열기) - 비대정지기(종자형성기) - 성숙비대기(착색 후 20% 용적 증가)","성숙비대기 - 유과성장기 - 비대정지기","종자형성기 - 세포분열기 - 착색기","세포분열기 - 성숙비대기 - 종자형성기"],"ans":[1],"multi":false,"dup":false,"expl":"과실 비대는 1단계 유과성장기(세포분열기), 2단계 비대정지기(종자형성기), 3단계 성숙비대기(착색 후에도 20% 용적 증가)로 진행된다."},{"id":"L14-19","set":"강의록","year":null,"kind":"강의록","no":279,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리는 기온이 몇 도 이상이 되면 기공을 닫고 생장을 멈추는가?","opts":["40℃","20℃","33℃","25℃"],"ans":[3],"multi":false,"dup":false,"expl":"블루베리는 추위에는 강하고 더위에는 약해 여름에는 생장을 멈추고 33℃ 이상에서는 기공을 닫는다."},{"id":"L14-20","set":"강의록","year":null,"kind":"강의록","no":280,"lec":14,"lecName":"가정과수-블루베리(Ⅰ)","src":"L","stem":"블루베리 재배에서 차광이 꽃눈 분화에 미치는 영향으 /* ---------- 선지 순서 섞기 ---------- */
var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
function identityPerm(n){ var a = []; for(var i=0;i<n;i++) a.push(i); return a; }
function makePerm(n){ return state.optShuffle ? shuffled(identityPerm(n)) : identityPerm(n); }
/* 해설 속 ①~④ 표기를 섞인 순서에 맞게 다시 매핑 (숫자 읽는 소리에 맞춰 조사도 정리) */
function remapExpl(expl, perm){
  if(!expl) return '';
  var toDisp = {};
  for(var i=0;i<perm.length;i++){ toDisp[perm[i]+1] = i+1; }
  var out = expl.replace(/[①②③④⑤]/g, function(ch){
    var n = CIRC.indexOf(ch)+1;
    return toDisp[n] ? CIRC[toDisp[n]-1] : ch;
  });
  var WITH = {은:1, 이:1, 을:1, 과:1};      // 받침 있는 소리(일·삼)
  var WITHOUT = {는:1, 가:1, 를:1, 와:1};   // 받침 없는 소리(이·사·오)
  var toWith = {는:'은', 가:'이', 를:'을', 와:'과'};
  var toWithout = {은:'는', 이:'가', 을:'를', 과:'와'};
  return out.replace(/([①②③④⑤])(은|는|이|가|을|를|과|와)/g, function(m, num, josa){
    var noBatchim = (num === '②' || num === '④' || num === '⑤');
    if(noBatchim && WITH[josa]) return num + toWithout[josa];   // 은→는, 이→가 ...
    if(!noBatchim && WITHOUT[josa]) return num + toWith[josa];  // 는→은, 가→이 ...
    return m;
  });
}
/* perm: 화면 순서 -> 원본 인덱스(0부터). 없으면 원본 순서 그대로 */
function viewOf(q, perm){
  if(!perm || perm.length !== q.opts.length) perm = identityPerm(q.opts.length);
  var toDisp = {};
  perm.forEach(function(o, i){ toDisp[o+1] = i+1; });
  return {
    opts: perm.map(function(o){ return q.opts[o]; }),
    ans: q.ans.map(function(n){ return toDisp[n] || n; }).sort(function(a,b){ return a-b; }),
    perm: perm,
    expl: remapExpl(q.expl, perm)
  };
}

  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='dark' ? '#0f1310' : '#2f7d5d');
}

/* ---------- pool ---------- */
function scopeLabelText(scope){
  if(scope === 'all') return state.bank === 'lecture' ? '강의록 전체' : (state.bank === 'exam' ? '기출 전체' : '기출+강의록');
  if(scope === '기말') return '기말고사만';
  if(scope === '출석') return '출석대체만';
  if(scope === 'wrong') return '오답노트';
  if(scope === 'book') return '북마크';
  if(scope.indexOf('set:') === 0) return setLabel(scope.slice(4));
  if(scope.indexOf('lec:') === 0){ var n = parseInt(scope.slice(4),10); return '강의록 ' + pad2(n) + '강 ' + LEC_NAME[n]; }
  return '전체';
}
function scopeListRaw(scope){
  if(scope === 'all') return DATA.slice();
  if(scope === '기말') return DATA.filter(function(q){ return q.kind==='기말'; });
  if(scope === '출석') return DATA.filter(function(q){ return q.kind==='출석대체'; });
  if(scope === 'wrong') return Object.keys(wrongNote).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope === 'book') return Object.keys(bookmarks).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope.indexOf('set:') === 0) return DATA.filter(function(q){ return q.set === scope.slice(4); });
  if(scope.indexOf('lec:') === 0){ var n = parseInt(scope.slice(4),10); return DATA.filter(function(q){ return q.src==='L' && q.lec === n; }); }
  return DATA.slice();
}
function scopeList(scope){ return scopeListRaw(scope).filter(srcOk); }
function examPool(scope){ return scopeListRaw(scope).filter(function(q){ return q.src !== 'L'; }); }
function lecturePool(){ return DATA.filter(function(q){ return q.src === 'L'; }); }
function dedupeList(list){
  var seen = {};
  return list.filter(function(q){ var k = normStem(q.stem); if(seen[k]) return false; seen[k] = 1; return true; });
}
/* 기출:강의록 = 80:20 으로 맞춘 구성 계산 */
function planMix(limit, baseN){
  var gin, lecN;
  if(limit > 0){ lecN = Math.max(1, Math.round(limit * 0.2)); gin = limit - lecN; }
  else { gin = baseN; lecN = Math.round(baseN * 0.25); }
  if(gin > baseN){ lecN += gin - baseN; gin = baseN; }
  lecN = Math.min(lecN, LEC_COUNT);
  return {gin: gin, lec: lecN, total: gin + lecN};
}
function planPreview(){
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    return planMix(state.limit, examPool(state.scope).length);
  }
  var n = scopeList(state.scope).length;
  var t = (state.limit && n > state.limit) ? state.limit : n;
  return state.bank === 'lecture' ? {gin:0, lec:t, total:t} : {gin:t, lec:0, total:t};
}
function buildPool(){
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    var base = examPool(state.scope);
    if(state.dedupe) base = dedupeList(base);
    var lecList = lecturePool();
    if(state.shuffle){ base = shuffled(base); lecList = shuffled(lecList); }
    var plan = planMix(state.limit, base.length);
    var sel = base.slice(0, plan.gin).concat(lecList.slice(0, plan.lec));
    if(state.shuffle) sel = shuffled(sel);
    return sel.map(function(q){ return q.id; });
  }
  var list = scopeList(state.scope);
  if(state.dedupe) list = dedupeList(list);
  if(state.shuffle) list = shuffled(list);
  if(state.limit && list.length > state.limit) list = list.slice(0, state.limit);
  return list.map(function(q){ return q.id; });
}
function poolLabel(pool){
  var lec = 0;
  pool.forEach(function(id){ var q = BY_ID[id]; if(q && q.src === 'L') lec++; });
  var gin = pool.length - lec;
  if(gin && lec) return '기출 ' + gin + ' + 강의록 ' + lec;
  return lec ? '강의록만' : '기출만';
}

function startQuiz(pool, label){
  var maps = {};
  pool.forEach(function(id){ var q = BY_ID[id]; if(q) maps[id] = makePerm(q.opts.length); });
  quiz = {
    pool: pool, i: 0, picks: {}, revealed: {}, finished: false, maps: maps,
    mode: state.mode, startAt: Date.now(),
    label: label || (scopeLabelText(state.scope) + ' · ' + poolLabel(pool))
  };
  renderQuiz();
}

/* pick은 화면에 보인 번호(1~4)이므로 섞인 순서로 정답을 판정한다 */
function isRight(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  return v.ans.indexOf(pick) >= 0;
}

function recordAnswer(q, pick){
  var ok = isRight(q, pick);
  if(!ok){
    var rec = wrongNote[q.id] || {n:0};
    rec.n = (rec.n||0) + 1; rec.t = Date.now();
    wrongNote[q.id] = rec;
  } else if(state.removeOnCorrect && wrongNote[q.id]){
    delete wrongNote[q.id];
  }
  save(LS_KEYS.wrong, wrongNote);
  return ok;
}

function renderQuiz(){
  var q = BY_ID[quiz.pool[quiz.i]];
  var total = quiz.pool.length;
  var done = Object.keys(quiz.picks).length;
  var revealed = quiz.mode === 'instant' && quiz.revealed[q.id];
  var pick = quiz.picks[q.id];
  var v = viewOf(q, quiz.maps ? quiz.maps[q.id] : null);
  var correctSoFar = 0;
  quiz.pool.forEach(function(id){ if(quiz.picks[id] && isRight(BY_ID[id], quiz.picks[id])) correctSoFar++; });
  var answeredSoFar = done;

  var html = '' +
  '<div class="topbar">' +
    '<div class="wrap"><div class="inner">' +
      '<button class="iconbtn" id="btn-quit" aria-label="그만두기">✕</button>' +

      '<span>오답노트 <b>' + wrongCount() + '</b></span>' +
    '</div></div>' +
    '<div class="progress"><i style="width:' + ((quiz.i)/total*100) + '%"></i></div>' +
  '</div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta">' +
        '<span class="badge">' + esc(qLabel(q)) + '</span>' +
        lecBadge(q) +
        (q.src !== 'L' ? '<span class="badge gray">' + q.no + '번</span>' : '') +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') +
        '<button class="star" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
      '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts" id="opts">' +
        v.opts.map(function(txt, idx){
          var n = idx+1;
          var cls = 'opt';
          if(revealed){
            if(v.ans.indexOf(n) >= 0) cls += ' right';
            else if(pick === n) cls += ' wrong';
          } else if(pick === n){
            cls += ' picked';
          }
          return '<button class="' + cls + '" data-pick="' + n + '"' + ' data-picked="' + (pick===n?1:0) + '"' + (revealed ? ' disabled' : '') + '>' +
            '<span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
            (revealed && v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') +
          '</button>';
        }).join('') +
      '</div>' +
      (revealed ? feedbackHtml(q, pick) : '') +
    '</div>' +
    '<div class="navbar">' +
      '<button id="btn-prev"' + (quiz.i===0?' disabled':'') + '>이전</button>' +
      (quiz.i === total-1
        ? '<button class="primary" id="btn-next">' + (quiz.mode==='instant' ? '결과 보기' : '채점하기') + '</button>'
        : '<button class="primary" id="btn-next">다음</button>') +
    '</div>' +
    '<div class="hint">' + (quiz.mode==='instant' ? '선지를 고르면 바로 채점됩니다.' : '답을 골라 두고 마지막에 한 번에 채점합니다.') + '</div>' +

  };
  document.getElementById('btn-theme2').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme');
    state.theme = cur === 'dark' ? 'light' : 'dark';

  };

      quiz.picks[q.id] = n;

        quiz.revealed[q.id] = true;
        recordAnswer(q, n);
      }
      renderQuiz();
    };
  });
  document.getElementById('btn-prev').onclick = function(){ if(quiz.i>0){ quiz.i--; renderQuiz(); } };

      alert('선지를 먼저 고르세요.'); return;

    if(quiz.i === quiz.pool.length-1){ finishQuiz(); return; }
    quiz.i++;
    renderQuiz();
  };
  window.scrollTo(0,0);

function feedbackHtml(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  var ok = v.ans.indexOf(pick) >= 0;
  var ansText = v.ans.map(function(n){ return n + ') ' + v.opts[n-1]; }).join(' / ');
  return '<div class="feedback ' + (ok?'ok':'no') + '">' +
    '<div class="head">' + (ok ? '정답입니다' : '오답입니다') + (q.multi ? ' · 복수정답 문항(전항 정답 처리)' : '') + '</div>' +
    '<div class="ans"><b>정답</b> ' + esc(ansText) + '</div>' +
    (q.expl ? '<div>' + esc(v.expl) + '</div>' : '') +
  '</div>';
}

function finishQuiz(){
  var total = quiz.pool.length;
  var picks = quiz.picks;
  var correct = 0, unanswered = 0, wrongIds = [];
  quiz.pool.forEach(function(id){
    var p = picks[id];
    if(!p){ unanswered++; wrongIds.push(id); return; }
    if(isRight(BY_ID[id], p)) correct++;
    else { wrongIds.push(id); }
  });
  if(quiz.mode === 'exam'){
    quiz.pool.forEach(function(id){ var p = picks[id]; if(p) recordAnswer(BY_ID[id], p); });
  }
  var spent = Math.max(1, Math.round((Date.now()-quiz.startAt)/1000));
  hist.unshift({label: quiz.label, when: nowText(), correct: correct, total: total, mode: quiz.mode, sec: spent});
  hist = hist.slice(0,20);
  save(LS_KEYS.stats, hist);
  quiz.finished = true;
  quiz.result = {correct: correct, total: total, unanswered: unanswered, wrongIds: wrongIds, spent: spent};
  renderResult();
}

function renderResult(){
  var r = quiz.result;
  var p = pct(r.correct, r.total);
  var wrongItems = r.wrongIds.map(function(id){ return BY_ID[id]; });

  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">채점 결과</div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    '<div class="card">' +
      '<div class="score">' +
        '<div class="ring" style="--p:' + p + '"><div>' + p + '%</div></div>' +
        '<div>' +
          '<div class="num">' + r.correct + ' / ' + r.total + '</div>' +
          '<div class="small muted">' + (r.unanswered ? '미응답 ' + r.unanswered + '문항 · ' : '') + '소요 ' + Math.floor(r.spent/60) + '분 ' + (r.spent%60) + '초</div>' +
          '<div class="small muted">' + esc(quiz.label) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="navbar">' +
      (wrongItems.length ? '<button class="primary" id="btn-retry-wrong">오답 ' + wrongItems.length + '문항 다시 풀기</button>' : '') +
      '<button id="btn-retry-same">같은 범위 다시 풀기</button>' +
    '</div>' +
    (wrongItems.length ?
      '<div class="card"><h2>틀린 문제</h2><div class="wronglist">' + wrongItems.map(function(q){
        var v = viewOf(q, quiz.maps ? quiz.maps[q.id] : null);
        var mine = quiz.picks[q.id];
        return '<button class="wrongitem" data-detail="' + q.id + '">' +
          '<div class="row-top"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) + (q.src !== 'L' ? '<span class="meta">' + q.no + '번</span>' : '') + '</div>' +
          '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
          '<div class="mine">내 답: ' + (mine ? mine + ') ' + esc(v.opts[mine-1]) : '미응답') + '</div>' +
          '<div class="corr">정답: ' + v.ans.map(function(n){ return n+') '+esc(v.opts[n-1]); }).join(' / ') + '</div>' +
        '</button>';
      }).join('') + '</div></div>'
      : '<div class="card"><div class="empty">모두 맞혔습니다. 훌륭해요!</div></div>') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.getElementById('btn-retry-same').onclick = function(){ startQuiz(quiz.pool.slice(), quiz.label); };
  var rw = document.getElementById('btn-retry-wrong');
  if(rw) rw.onclick = function(){ startQuiz(r.wrongIds.slice(), '오답 다시 풀기'); };
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ var id = b.getAttribute('data-detail'); renderDetail(id, renderResult, quiz.maps ? quiz.maps[id] : null); };
  });
  window.scrollTo(0,0);
}

function renderList(kind){
  var ids = kind === 'wrong' ? Object.keys(wrongNote) : Object.keys(bookmarks);
  var items = ids.map(function(id){ return BY_ID[id]; }).filter(Boolean);
  items.sort(function(a,b){ return a.set < b.set ? 1 : (a.set > b.set ? -1 : a.no-b.no); });
  var title = kind === 'wrong' ? '오답노트' : '북마크';

  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">' + title + ' <span class="muted small">' + items.length + '</span></div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    (items.length ? '<div class="card"><div class="wronglist">' + items.map(function(q){
      var rec = wrongNote[q.id];
      return '<button class="wrongitem" data-detail="' + q.id + '">' +
        '<div class="row-top"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) + (q.src !== 'L' ? '<span class="meta">' + q.no + '번</span>' : '') +
        (kind==='wrong' && rec && rec.n ? '<span class="meta">· ' + rec.n + '회 틀림</span>' : '') + '</div>' +
        '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
        '<div class="corr">정답: ' + q.ans.map(function(n){ return esc(q.opts[n-1]); }).join(' / ') + '</div>' +
      '</button>';
    }).join('') + '</div></div>'
      : '<div class="card"><div class="empty">' + (kind==='wrong' ? '오답이 없습니다.<br>문제를 풀면 틀린 문제가 여기에 쌓입니다.' : '북마크한 문제가 없습니다.<br>문제 화면의 ☆를 눌러 저장하세요.') + '</div></div>') +
    (items.length ? '<div class="navbar"><button class="primary" id="btn-solve">' + (kind==='wrong'?'오답 전체 다시 풀기':'북마크 전체 풀기') + '</button></div>' : '') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ renderDetail(b.getAttribute('data-detail'), function(){ renderList(kind); }); };
  });
  var solve = document.getElementById('btn-solve');
  if(solve) solve.onclick = function(){ startQuiz(items.map(function(q){ return q.id; }), title + ' 풀기'); };
  window.scrollTo(0,0);
}

function renderDetail(id, back, perm){
  var q = BY_ID[id];
  if(!q) { renderHome(); return; }
  var v = viewOf(q, perm || null);
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-back" aria-label="뒤로">←</button>' +
    '<div class="title">문제 보기</div>' +
    '<button class="iconbtn" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) +
        (q.src !== 'L' ? '<span class="badge gray">' + q.no + '번</span>' : '') +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') + '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts">' + v.opts.map(function(txt, idx){
        var n = idx+1, cls = 'opt' + (v.ans.indexOf(n) >= 0 ? ' right' : '');
        return '<div class="' + cls + '"><span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
          (v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') + '</div>';
      }).join('') + '</div>' +
      (q.expl ? '<div class="answerbox"><b>해설</b><br>' + esc(v.expl) + '</div>' : '') +
    '</div>' +
    '<div class="navbar"><button class="ghost" id="btn-back2">목 록</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-back').onclick = back;
  document.getElementById('btn-back2').onclick = back;
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderDetail(id, back, perm);
  };
  window.scrollTo(0,0);
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if(!quiz || quiz.finished) return;
  var q = BY_ID[quiz.pool[quiz.i]];
  if(!q) return;
  if(e.key >= '1' && e.key <= '4'){
    var n = parseInt(e.key,10);
    if(!(quiz.mode==='instant' && quiz.revealed[q.id])){
      quiz.picks[q.id] = n;
      if(quiz.mode==='instant'){ quiz.revealed[q.id] = true; recordAnswer(q, n); }
      renderQuiz();
    }
  } else if(e.key === 'ArrowRight' || e.key === 'Enter'){
    var b = document.getElementById('btn-next'); if(b) b.click();
  } else if(e.key === 'ArrowLeft'){
    var p = document.getElementById('btn-prev'); if(p && !p.disabled) p.click();
  }
});

applyTheme();
renderHome();
</script>
</body>
</html>
