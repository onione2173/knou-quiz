pts":["조직의 물적, 재정적 자원의 중요성 대두","학교교육의 유용성 증가","평생직장 개념의 확대로 인한 비(非)경쟁사회 도래","과학기술의 발달로 인한 기술우위 사회의 대두"],"ans":[4],"multi":false,"dup":true,"expl":"평생교육의 필요 이유는 지식·기술의 폭발적 증가와 노후화, 기술우위 사회의 도래다.","src":"E"},{"id":"E2018-2-06-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":6,"stem":"현대사회에서 평생교육이 필요한 이유로 가장 타당한 것은?","opts":["조직의 물적, 재정적 자원의 중요성 대두","학교교육의 유용성 증가","평생직장 개념의 확대로 인한 비(非)경쟁사회 도래","과학기술의 발달로 인한 기술우위 사회의 대두"],"ans":[4],"multi":false,"dup":false,"expl":"평생교육의 필요 이유는 지식·기술의 폭발적 증가와 노후화, 기술우위 사회의 도래다.","src":"E"},{"id":"E2018-2-06-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":6,"stem":"고전적 조건형성이론에 대한 다음 설명 중 적절치 않은 것은?","opts":["음식물에 대한 개의 타액 분비는 선천적 반사행동이다","파블로프(Pavlov)에 의해 처음 체계적으로 이론화되었다","조건형성된 반응이 없어지는 소거(消去)는 학습되는 것이다","수의적 행동의 학습기제이다"],"ans":[4],"multi":false,"dup":false,"expl":"고전적 조건형성은 불수의적(반사적) 행동의 학습기제이므로 ‘수의적 행동의 학습기제’라는 진술이 적절하지 않다. 수의적 행동의 학습은 조작적 조건형성이다. ①~③은 모두 옳은 설명이다.","src":"E"},{"id":"E2018-2-07-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":7,"stem":"다음 설명 중 조작적 조건형성이론과 관련이 깊은 것은?","opts":["개의 소화계에 대한 실험으로부터 탄생된 이론이다","수의적 행동의 학습기제이다","반두라(Bandura)에 의해 체계화되었다","중성자극과 조건자극 간의 관계를 설명하고 있다"],"ans":[2],"multi":false,"dup":false,"expl":"조작적 조건형성은 수의적 행동이 결과에 따라 학습되는 기제이며 스키너가 정립했다.","src":"E"},{"id":"E2018-2-07-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":7,"stem":"예습과 복습은 학습에 있어서 매우 중요하다. 이와 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","유사의 법칙"],"ans":[1],"multi":false,"dup":false,"expl":"예습·복습처럼 반복을 통해 학습이 강화된다는 것은 연습의 법칙이다.","src":"E"},{"id":"E2018-2-08-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":8,"stem":"아이들이 바람직하지 않은 행동을 했을 때 그들이 좋아하는 컴퓨터 게임을 2시간 동안 하지 못하도록 함으로써 바람직하지 않은 행동의 빈도를 감소시키고자 하는 것과 관련이 있는 것은?","opts":["부적 강화","정적 강화","벌","소거"],"ans":[3],"multi":false,"dup":false,"expl":"좋아하는 게임을 2시간 못 하게 하는 것은 혐오자극의 제시, 즉 벌이다.","src":"E"},{"id":"E2018-2-08-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":8,"stem":"어떤 아이가 착한 행동을 했는데, 방과후의 교실 청소를 감면해줌으로써 아이의 착한 행동의 빈도를 증가시키고자 한 것과 관련이 있는 것은?","opts":["정적 강화","부적 강화","벌","소거"],"ans":[2],"multi":false,"dup":false,"expl":"혐오자극(청소)을 제거해 바람직한 행동을 늘리는 것은 부적 강화다.","src":"E"},{"id":"E2018-2-09-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":9,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재 조건형성","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":false,"expl":"소거 후 시간이 지나 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 보여 준다.","src":"E"},{"id":"E2018-2-09-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":9,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["자발적 회복","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":false,"expl":"소거 후 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 뒷받침한다.","src":"E"},{"id":"E2018-2-10-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":10,"stem":"학교에서 전체 조회시간에 어떤 아이에게 선행상을 주었다. 이것을 본 다른 아이들이 나도 착한 행동을 해야겠다고 마음먹고 유사한 선행을 했다. 직접적으로 선행상을 받지 않은 다른 아이들은 어떤 강화를 받은 것인가?","opts":["계속적 강화","부분강화","자기강화","대리강화"],"ans":[4],"multi":false,"dup":false,"expl":"다른 아이가 강화받는 장면을 관찰하고 같은 행동을 하게 된 것은 대리강화(대리적 강화)다. 직접 강화를 받지 않아도 관찰을 통해 학습이 일어난다.","src":"E"},{"id":"E2018-2-10-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":10,"stem":"일어날 확률이 높은 행동은 일어날 확률이 낮은 행동에 대해 정적 강화물로서 작용한다는 것을 바탕으로 한 행동수정방법은?","opts":["타임 아우트","토큰 강화","프리맥의 원리","소거의 원리"],"ans":[3],"multi":false,"dup":false,"expl":"빈도가 높은 활동을 강화물로 활용해 빈도가 낮은 행동을 늘리는 방법은 프리맥의 원리다.","src":"E"},{"id":"E2018-2-11-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":11,"stem":"고전적 조건형성이론에서 개는 조건화 전에는 종소리에 대해서 침을 흘리지 않는다. 이와 같이 유기체로부터 어떠한 반응도 이끌어내지 못하는 자극을 무엇이라고 하는가?","opts":["강화 자극","조건 자극","중성 자극","무조건 자극"],"ans":[3],"multi":false,"dup":false,"expl":"조건화 전 아무 반응도 이끌어내지 못하는 자극은 중성자극이다.","src":"E"},{"id":"E2018-2-11-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":11,"stem":"아이들이 TV를 시청하는 시간대에 선정적, 폭력적 방송물을 방영하지 못하도록 하는 것과 가장 관련이 깊은 이론은?","opts":["고전적 조건형성 이론","조작적 조건형성 이론","사회학습이론","도구적 조건형성 이론"],"ans":[3],"multi":false,"dup":false,"expl":"선정적·폭력적 방송을 규제하는 근거는 관찰학습을 강조하는 사회학습이론이다.","src":"E"},{"id":"E2018-2-12-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":12,"stem":"시간급, 주급, 월급은 어떤 강화계획에 해당하는가?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[1],"multi":false,"dup":false,"expl":"시간급·주급·월급은 고정간격 강화계획이다.","src":"E"},{"id":"E2018-2-12-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":12,"stem":"피아제(Piaget)의 인지발달단계 중 내재적 사고가 가능하나 자기중심성과 비가역성의 한계를 지니고 있는 발달단계는?","opts":["전조작기","형식적 조작기","구체적 조작기","감각운동기"],"ans":[1],"multi":false,"dup":true,"expl":"전조작기(2~7세)는 상징적 사고(내재적 사고)가 가능하지만 자기중심성·비가역성·중심화의 한계를 지닌다. 형식적 조작기는 가설연역적 사고, 구체적 조작기는 보존개념이 발달하는 단계다.","src":"E"},{"id":"E2018-2-13-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":13,"stem":"피아제(Piaget)의 인지발달단계 중 내재적 사고가 가능하나 자기중심성과 비가역성의 한계를 지니고 있는 발달단계는?","opts":["전조작기","형식적 조작기","구체적 조작기","감각운동기"],"ans":[1],"multi":false,"dup":false,"expl":"전조작기(2~7세)는 상징적 사고(내재적 사고)가 가능하지만 자기중심성·비가역성·중심화의 한계를 지닌다. 형식적 조작기는 가설연역적 사고, 구체적 조작기는 보존개념이 발달하는 단계다.","src":"E"},{"id":"E2018-2-13-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":13,"stem":"에릭슨(Erikson)의 성격발달 각 단계에서 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지어진 것은?","opts":["근면성 - 침체감","자율성 - 고립감","주도성 - 죄책감","자아정체성 - 절망감"],"ans":[3],"multi":false,"dup":false,"expl":"주도성-죄책감이 바른 짝이다.","src":"E"},{"id":"E2018-2-14-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":14,"stem":"에릭슨(Erikson)의 성격발달 각 단계에서 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지어진 것은?","opts":["근면성 - 열등감","자율성 - 죄책감","주도성 - 고립감","생산성 - 절망감"],"ans":[1],"multi":false,"dup":false,"expl":"근면성-열등감이 바른 짝이다.","src":"E"},{"id":"E2018-2-14-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":14,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 7가지 기초정신능력","서스턴(Thurstone) - 일반요인, 특수요인","스피어만(Spearman) - 유동성 지능, 결정성 지능","길포드(Guilford) - 180가지 요소설"],"ans":[4],"multi":false,"dup":true,"expl":"길포드는 지능을 조작×내용×결과의 180가지 요소로 분석한 요소설을 주장했다. 커텔은 유동성·결정성, 서스턴은 7가지 기초정신능력, 스피어만은 일반·특수요인이다.","src":"E"},{"id":"E2018-2-15-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":15,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 7가지 기초정신능력","서스턴(Thurstone) - 일반요인, 특수요인","스피어만(Spearman) - 유동성 지능, 결정성 지능","길포드(Guilford) - 180가지 요소설"],"ans":[4],"multi":false,"dup":false,"expl":"길포드는 지능을 조작×내용×결과의 180가지 요소로 분석한 요소설을 주장했다. 커텔은 유동성·결정성, 서스턴은 7가지 기초정신능력, 스피어만은 일반·특수요인이다.","src":"E"},{"id":"E2018-2-15-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":15,"stem":"다음 중 유동성 지능에 해당하는 것은?","opts":["어휘이해력","언어유추능력","일반 지식","수리력"],"ans":[2],"multi":false,"dup":false,"expl":"유동성 지능은 경험·교육과 무관하게 새 상황에 적응하는 능력으로 언어유추·공간지각 등이 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2018-2-16-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":16,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 적절한 것은?","opts":["대인간 지능을 측정하는 데 유용하다","터만(Terman)에 의해 개정되었다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다"],"ans":[4],"multi":false,"dup":false,"expl":"웩슬러 검사는 편차 IQ를 적용한다. 정신연령은 비네 검사, 터만 개정은 스탠포드-비네 검사다.","src":"E"},{"id":"E2018-2-16-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":16,"stem":"다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","논리-수학 지능","개인내 지능","공간 지능"],"ans":[3],"multi":false,"dup":false,"expl":"정답표는 개인내 지능을 정답으로 본다. 감성지능은 자신의 정서를 인식·조절하는 개인내 지능과 타인의 정서를 이해하는 대인간 지능 모두와 관련되며, 이 문항에서는 개인내 지능이 답이다. 언어적·논리수학·공간 지능은 해당하지 않는다.","src":"E"},{"id":"E2018-2-17-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":17,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["단기기억은 시연에 의해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 장기기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[1],"multi":false,"dup":false,"expl":"단기기억은 시연으로 지속시간이 늘어난다. 1초는 감각기억, 7±2는 단기기억 용량이다.","src":"E"},{"id":"E2018-2-17-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":17,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["논리적 추론과 같은 작업수행과정은 장기기억에 해당된다","단기기억은 시연(試演)에 의해 지속시간이 증대될 수 있다","감각기억의 지속시간은 보통 20～30초 정도이다","장기기억의 용량은 무의미한 자료의 경우 7개 정도이다"],"ans":[2],"multi":false,"dup":false,"expl":"단기기억은 시연으로 지속시간이 늘어난다. 감각기억은 1초 이내, 작업기억 용량은 7±2다.","src":"E"},{"id":"E2018-2-18-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":18,"stem":"다음 중 연결이 적절한 것은?","opts":["퀠러(Köhler) - 장(場)이론","에빙하우스(Ebbinghaus) - 망각곡선","레빈(Lewin) - 모방학습","반두라(Bandura) - 통찰학습"],"ans":[2],"multi":false,"dup":false,"expl":"에빙하우스-망각곡선이 바른 연결이다.","src":"E"},{"id":"E2018-2-18-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":18,"stem":"망각의 원인에 관한 다음 설명 중 소멸이론에 관한 설명은?","opts":["순행성 간섭과 역행성 간섭은 그 좋은 예이다","정신분석이론에 근거하고 있다","파지기간 중에 파지를 방해하는 외부적 영향 때문에 망각현상이 촉진된다","기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다"],"ans":[4],"multi":false,"dup":false,"expl":"소멸이론은 사용하지 않는 기억 흔적이 시간이 지나며 사라진다고 본다(간섭이론과 대비).","src":"E"},{"id":"E2018-2-19-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":19,"stem":"망각의 원인에 관한 다음 설명 중 간섭이론에 관한 설명은?","opts":["파지를 방해하는 외부적 영향 때문에 망각이 촉진된다","행동주의 이론에 근거하고 있다","뇌세포의 기억 흔적이 시간의 경과로 인해 흐려진다","망각 속도와 깊은 관련이 있다"],"ans":[1],"multi":false,"dup":false,"expl":"간섭이론은 앞뒤 학습이 서로를 방해해 파지를 저해한다고 설명한다(순행성·역행성 간섭).","src":"E"},{"id":"E2018-2-19-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":19,"stem":"창의력에 관한 다음 설명 중 길포드(Guilford)의 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력은 수렴적 사고와 밀접한 관련이 있다","창의력을 구성하는 기본 능력들은 지필검사로 측정할 수 있다","창의력은 하늘이 내리는 것이다"],"ans":[3],"multi":false,"dup":false,"expl":"길포드는 창의력의 구성 능력이 지필검사로 측정 가능하다고 보았다.","src":"E"},{"id":"E2018-2-20-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":20,"stem":"다음 중 창의력이 높은 사람의 사고방식의 특징으로 보기 어려운 것은?","opts":["사고의 유연성","사고의 폐쇄성","사고의 유창성","사고의 독창성"],"ans":[2],"multi":false,"dup":false,"expl":"창의적 사고는 유창성·융통성·독창성이며 폐쇄성은 이와 반대다.","src":"E"},{"id":"E2018-2-20-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":20,"stem":"창의력이 높은 사람의 특징으로 보기 어려운 것은?","opts":["문제에 대한 민감성","아이디어 산출의 독창성","사고의 유연성","사고영역의 고정성"],"ans":[4],"multi":false,"dup":false,"expl":"창의적 사람의 특징은 민감성·독창성·유연성이며 사고영역의 고정성은 반대 특성이다.","src":"E"},{"id":"E2018-2-21-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":21,"stem":"원초아의 충동이 너무 강하여 자신이 충동을 통제하지 못할 것 같을 때 경험하는 불안은?","opts":["신경증적 불안","도덕적 불안","현실 불안","상태 불안"],"ans":[1],"multi":false,"dup":false,"expl":"원초아 충동을 통제하지 못할까 봐 느끼는 불안은 신경증적 불안이다.","src":"E"},{"id":"E2018-2-21-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":21,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 적절한 것은?","opts":["대인간 지능을 측정하는 데 유용하다","터만(Terman)에 의해 개정되었다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","정신연령이라는 개념을 도입하고 있다"],"ans":[3],"multi":false,"dup":true,"expl":"웩슬러 검사는 편차 IQ를 적용한다. 정신연령은 비네 검사, 터만 개정은 스탠포드-비네 검사다.","src":"E"},{"id":"E2018-2-22-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":22,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 성장욕구에 해당하는 것은?","opts":["생리적 욕구","안전 욕구","지적 욕구","자존 욕구"],"ans":[3],"multi":false,"dup":false,"expl":"지적 욕구는 성장욕구다. 생리·안전·자존 욕구는 결핍욕구다.","src":"E"},{"id":"E2018-2-22-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":22,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘삶의 본능’과 가장 거리가 먼 것은?","opts":["성적 본능","창조적 본능","사랑의 본능","공격 본능"],"ans":[4],"multi":false,"dup":false,"expl":"프로이트의 삶의 본능(리비도)은 성·사랑·창조 등 생명을 유지·확장하는 본능이다. 공격 본능은 죽음의 본능(타나토스)에 속한다.","src":"E"},{"id":"E2018-2-23-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":23,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["원초아 - 1차과정","자아 - 쾌락원리","죽음의 본능 - 리비도(libido)","초자아 - 2차과정"],"ans":[1],"multi":false,"dup":false,"expl":"원초아-1차과정이 바른 연결이다. 자아는 현실원리, 초자아는 도덕원리를 따르고, 리비도는 삶의 본능이다.","src":"E"},{"id":"E2018-2-23-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":23,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 결핍욕구에 해당하는 것은?","opts":["자아실현 욕구","심미적 욕구","지적 욕구","자존 욕구"],"ans":[4],"multi":false,"dup":false,"expl":"결핍욕구에는 자존 욕구가 속한다. 자아실현·지적·심미적 욕구는 성장욕구다.","src":"E"},{"id":"E2018-2-24-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":24,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["히스(Heath) - 자아실현인","올포트(Allport) - 성숙한 인격","프롬(Fromm) - 합리적 모험가","매슬로우(Maslow) - 생산적인 사람"],"ans":[2],"multi":false,"dup":false,"expl":"올포트-성숙한 인격이 바른 연결이다. 매슬로는 자아실현인, 프롬은 생산적인 사람이다.","src":"E"},{"id":"E2018-2-24-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":24,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 후(後) 인습적 수준의 도덕성 발달단계에 해당하는 것은?","opts":["도구적 상대주의 지향","사회적 계약 지향","대인간 조화 지향","법과 질서 지향"],"ans":[2],"multi":false,"dup":false,"expl":"후인습적 수준에는 사회적 계약 지향, 보편적 원리 지향이 속한다.","src":"E"},{"id":"E2018-2-25-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":25,"stem":"자아정체성의 발달수준 중 자아정체성에 대한 위기도 경험하지 못한 채 마치 정체성을 확립한 것처럼 느끼는 상태를 특히 무엇이라고 하는가?","opts":["정체성 혼미","정체성 유예","정체성 조기완료","정체성 성취"],"ans":[3],"multi":false,"dup":false,"expl":"위기 없이 정체성을 확립한 듯 보이는 상태는 정체성 조기완료(조기성취)다.","src":"E"},{"id":"E2018-2-25-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":25,"stem":"팔이나 다리의 근육과 같이 우리의 의지에 의해 조절되는 것들을 관장하는 신경계는?","opts":["체성신경계","자율신경계","교감신경계","부교감신경계"],"ans":[1],"multi":false,"dup":false,"expl":"팔·다리 근육처럼 의지로 조절되는 골격근을 관장하는 것은 체성신경계다. 자율신경계(교감·부교감)는 의지와 무관하게 내장 기관을 조절한다.","src":"E"},{"id":"E2018-2-26-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":26,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 전(前)인습적 수준의 도덕성 발달단계에 해당하는 것은?","opts":["대인간 조화 지향","사회적 계약 지향","도구적 상대주의 지향","법과 질서 지향"],"ans":[3],"multi":false,"dup":false,"expl":"전인습적 수준에는 처벌과 복종 지향, 도구적 상대주의 지향이 속한다.","src":"E"},{"id":"E2018-2-26-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":26,"stem":"공격성에 대한 다음 설명 중 사회학습이론의 관점에 해당하는 것은?","opts":["공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","공격성은 선천적으로 가지고 태어나는 것이다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다"],"ans":[4],"multi":false,"dup":false,"expl":"공격성이 공격적인 남의 행동을 관찰함으로써 학습된다는 것은 사회학습이론의 관점이다.","src":"E"},{"id":"E2018-2-27-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":27,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["탐구적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 정치가, 영업사원, 광고업자","사회적 유형 - 회계사, 은행원, 사무원","실제적 유형 - 기술자, 정비사, 의료기사"],"ans":[4],"multi":false,"dup":false,"expl":"실제적 유형-기술자·정비사·의료기사가 바른 연결이다. 사회적 유형은 교사·간호사·종교지도자, 관습적은 회계사·은행원·사무원, 탐구적은 과학자·연구자다.","src":"E"},{"id":"E2018-2-27-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":27,"stem":"진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["사회이론 - 겔라트(Gelatt)","특성이론 - 윌리엄슨(Williamson)","의사결정이론 - 보딘(Bordin)","심리이론 - 홀링쉐드(Hollingshead)"],"ans":[2],"multi":false,"dup":false,"expl":"특성이론-윌리엄슨이 바른 연결이다. 사회이론은 홀링쉐드, 의사결정이론은 겔라트, 심리이론은 로우다.","src":"E"},{"id":"E2018-2-28-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":28,"stem":"직업에 대한 다음 설명 중 가장 적절한 것은?","opts":["직업은 개인의 성격형성과는 무관하다","직업은 취미로 하는 활동을 말한다","직업은 반드시 일, 즉 노동행위를 포함하고 있다","직업은 사회적 책무성이 결여되어 있어야 한다"],"ans":[3],"multi":false,"dup":false,"expl":"직업은 노동행위를 포함하며 사회적 책무성을 지니고 개인의 성격 형성과도 관련된다.","src":"E"},{"id":"E2018-2-28-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":28,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 교사, 간호사, 종교지도자","실제적 유형 - 정치가, 영업사원, 광고업자","사업가적 유형 - 회계사, 은행원, 사무원","관습적 유형 - 기술자, 정비사, 의료기사"],"ans":[1],"multi":false,"dup":false,"expl":"사회적 유형-교사·간호사·종교지도자가 바른 연결이다. 실제적은 기술자·정비사, 관습적은 회계사·은행원, 사업가적은 정치가·영업사원이다.","src":"E"},{"id":"E2018-2-29-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":29,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["특성이론 - 겔라트(Gelatt)","의사결정이론 - 보딘(Bordin)","사회이론 - 윌리엄슨(Williamson)","심리이론 - 로우(Roe)"],"ans":[4],"multi":false,"dup":false,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2018-2-29-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":29,"stem":"수퍼(Super)의 직업의식 발달단계가 순서대로 나열된 것은?","opts":["탐색기 → 성장기 → 확립기 → 유지기 → 쇠퇴기","성장기 → 탐색기 → 유지기 → 확립기 → 쇠퇴기","탐색기 → 성장기 → 유지기 → 확립기 → 쇠퇴기","성장기 → 탐색기 → 확립기 → 유지기 → 쇠퇴기"],"ans":[4],"multi":false,"dup":false,"expl":"수퍼의 직업의식 발달단계는 성장기→탐색기→확립기→유지기→쇠퇴기 순이다.","src":"E"},{"id":"E2018-2-30-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":30,"stem":"다음 중 집단상담에 가장 적합한 사람은?","opts":["여러 사람 앞에서 이야기하는 것을 두려워하는 사람","사회적 기술을 습득할 필요가 있는 사람","남의 인정에 대한 욕구가 강해서 집단을 혼자 주도할 가능성이 있는 사람","매우 복잡한 위기의 문제를 가지고 있어서 심층적인 탐색이 필요한 사람"],"ans":[2],"multi":false,"dup":false,"expl":"집단상담은 사회적 기술 습득이나 인간관계 훈련이 필요한 사람에게 적합하다. 심층적 위기 탐색은 개인상담이 적합하다.","src":"E"},{"id":"E2018-2-30-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":30,"stem":"다음 중 그 측정하고자 하는 내용이 다른 한 가지 검사는?","opts":["MMPI","Army-β","CPI","TAT"],"ans":[2],"multi":false,"dup":false,"expl":"Army-β(군대베타)는 지능검사이고, MMPI·CPI·TAT는 성격검사다.","src":"E"},{"id":"E2018-2-31-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":31,"stem":"정신분석이론에서 내담자가 초기 아동기에 어떤 중요한 타인과의 관계에서 느꼈던 감정을 현재의 상담자에게도 느끼는 것을 의미하는 개념은?","opts":["전이","훈습","자유연상","저항"],"ans":[1],"multi":false,"dup":false,"expl":"초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 옮겨 느끼는 것은 전이(transference)다. 반대로 상담자가 내담자에게 느끼는 감정은 역전이다.","src":"E"},{"id":"E2018-2-31-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":31,"stem":"다음 중 인간중심상담이론에서 가정하고 있는 인간관에 해당하는 것은?","opts":["인간은 합리적이고 건설적이며 합목적적인 존재이다","인간은 끊임없이 갈등하는 존재이다","자율적인 인간이란 없다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다"],"ans":[1],"multi":false,"dup":false,"expl":"인간중심상담은 인간을 합리적·건설적·합목적적 존재로 가정한다.","src":"E"},{"id":"E2018-2-32-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":32,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 볼 수 있는 것은?","opts":["사회문화적 구속에 동조하거나 수동적으로 반응한다","자신의 모든 경험에 대해 방어적이다","자신의 미래는 자기 자신에 의해 좌우된다고 확신한다","자신의 행동에 대해 타인에게 인정받는 데 연연해한다"],"ans":[3],"multi":false,"dup":false,"expl":"충분히 기능하는 사람은 자기 삶의 주체로서 미래를 스스로 결정한다고 확신한다. 동조·방어·타인 인정에의 연연은 그 반대 특성이다.","src":"E"},{"id":"E2018-2-32-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":32,"stem":"정신분석이론의 주요 상담기법들에 공통적으로 적용되는 기법은?","opts":["강화","해석","논리적 반박","귀인"],"ans":[2],"multi":false,"dup":false,"expl":"정신분석 상담의 여러 기법에 공통적으로 적용되는 것은 해석이다.","src":"E"},{"id":"E2018-2-33-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":33,"stem":"합리-정의적 상담이론의 ABCD기법에서 현재의 정서적․행동적 결과의 진정한 원인이라고 엘리스(Ellis)가 주장하는 것은?","opts":["A","B","C","D"],"ans":[2],"multi":false,"dup":false,"expl":"엘리스는 정서·행동적 결과(C)의 진정한 원인을 신념체계(B)라고 본다. 선행사건(A) 자체가 원인이 아니다.","src":"E"},{"id":"E2018-2-33-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":33,"stem":"우리는 타인으로부터 인정받고 싶은 마음 때문에 타인의 기대에 맞추어 살기도 한다. 하지만 이것이 많으면 많을수록 삶의 무의미와 공허감을 느끼게 된다고 로저스(Rogers)는 주장한다. 이것은?","opts":["가치조건","자동적 사고","공상","혐오자극"],"ans":[1],"multi":false,"dup":false,"expl":"타인의 기대에 맞추느라 자신의 유기체적 경험을 무시하게 만드는 조건은 로저스가 말한 가치조건이다.","src":"E"},{"id":"E2018-2-34-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":34,"stem":"상담에서 가장 중요한 것은 상담자와 내담자간의 신뢰와 협력이다. 이러한 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","부정적 전이","주종관계"],"ans":[2],"multi":false,"dup":false,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다.","src":"E"},{"id":"E2018-2-34-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":34,"stem":"직면은 내담자가 가지고 있는 불일치, 모순 등을 상담자가 기술해 주는 것이다. 직면시켜야 하는 상황으로 가장 적절치 않은 것은?","opts":["내담자의 기대와 현실적 가능성 간 괴리","내담자의 말과 행동 간에 괴리","내담자의 생각과 상담자의 생각 간 괴리","내담자의 언어적 메시지와 비언어적 메시지 간 괴리"],"ans":[3],"multi":false,"dup":false,"expl":"직면은 내담자 내부의 불일치(말과 행동, 기대와 현실 등)를 다루는 기법으로, 상담자와 생각이 다르다는 이유로 사용하지 않는다.","src":"E"},{"id":"E2018-2-35-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":35,"stem":"상담목표에 대한 다음 설명 중 가장 적절하지 않은 것은?","opts":["상담목표는 상담을 끝내기 위한 하나의 기준이다","상담목표란 내담자의 문제가 해결된 상태를 의미한다","상담목표는 가능한 한 구체적이고 작을수록 좋다","상담목표는 상담자에게 중요한 것으로 정해야 한다"],"ans":[4],"multi":false,"dup":false,"expl":"상담목표는 내담자에게 중요한 것을 중심으로 내담자의 문제 해결 상태를 구체적으로 진술한다. 상담자 중심 설정은 잘못이다.","src":"E"},{"id":"E2018-2-35-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":35,"stem":"상담목표에 대한 다음 설명 중 가장 적절하지 않은 것은?","opts":["상담목표는 상담을 끝내기 위한 하나의 기준이다","상담목표는 상담자에게 중요한 것으로 정해야 한다","상담목표는 가능한 한 구체적이고 작을수록 좋다","상담목표란 내담자의 문제가 해결된 상태를 진술해놓은 것이라고 할 수 있다."],"ans":[2],"multi":false,"dup":false,"expl":"상담목표는 내담자의 문제 해결 상태를 구체적으로 진술하며 내담자에게 중요한 것을 중심으로 정한다.","src":"E"},{"id":"E2018-H-01-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 철학․종교적 인간관과 과학적 인간관이 공통적으로 갖고 있는 생각은?","opts":["인간은 물질세계의 한 부분으로서 인과론적 법칙에 따라 행동하는 존재이다","인간에게는 불변의 본성이나 본질이 자연 또는 신에 의해 주어져 있다","인간의 고유한 형상은 이성이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[2],"multi":false,"dup":true,"expl":"마리탱은 인간을 물질세계의 일부로 보는 과학적 인간관과, 이성으로 형상을 실현하는 존재로 보는 철학·종교적 인간관이 ‘인간에게는 자연 또는 신이 준 불변의 본성·본질이 있다’는 점에서 공통한다고 보았다. ①은 과학적 인간관만의 특징, ③은 철학·종교적 인간관, ④는 칸트의 정언명령에 가깝다.","src":"E"},{"id":"E2018-H-02-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":2,"stem":"다음 중 후기 현대철학에서 강조되고 있는 인간관으로 보기에 적당하지 않은 것은?","opts":["자기형성적 존재","무의식적 존재","능동적 존재","합리적 존재"],"ans":[2],"multi":false,"dup":true,"expl":"후기 현대철학은 고정된 본질을 부정하고 자기형성적·능동적·합리적 존재를 강조한다. ‘무의식적 존재’는 정신분석적 인간관으로, 후기 현대철학에서 강조하는 인간관이 아니다.","src":"E"},{"id":"E2018-H-03-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":3,"stem":"다음 중 진보주의 교육관과 가장 거리가 먼 것은?","opts":["자연주의 교육관","경험중심 교육","실용주의 철학","인간행동의 계획적 변화"],"ans":[4],"multi":false,"dup":true,"expl":"진보주의 교육관은 경험중심·실용주의·자연주의와 통한다. ‘인간행동의 계획적 변화’는 전통적(주형적) 교육관의 특징이므로 진보주의와 가장 거리가 멀다.","src":"E"},{"id":"E2018-H-04-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":4,"stem":"수학교과서의 내용이 초등학교, 중학교, 고등학교로 갈수록 점차 심화되고 확대되는 것을 알 수 있는데, 이것과 가장 관련이 있는 교육내용 선정 및 조직의 원리는?","opts":["통합성의 원리","계열성의 원리","반복성의 원리","계속성의 원리"],"ans":[2],"multi":false,"dup":true,"expl":"학년이 올라갈수록 내용이 심화·확대되는 것은 계열성의 원리다. 계속성은 같은 내용의 반복, 통합성은 교과 간 관련을 뜻하며 반복성은 내용 조직의 원리가 아니다.","src":"E"},{"id":"E2018-H-05-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":5,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 주형으로서의 교육관","매슬로(Maslow) - 탈학교 교육론","렝그랑(Lengrand) - 평생교육","피터스(Peters) - 프로그램 수업"],"ans":[3],"multi":false,"dup":true,"expl":"렝그랑-평생교육이 바른 연결이다. 일리치는 탈학교교육론, 매슬로는 자아실현, 피터스는 교육의 기준과 연결된다.","src":"E"},{"id":"E2018-H-06-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":6,"stem":"교육의 목적은 자기결정적인 자아의 형성에 있다고 주장하는 사람은?","opts":["피터스(Peters)","부버(Buber)","파인버그(Feinberg)","만하임(Mannheim)"],"ans":[2],"multi":false,"dup":false,"expl":"교육의 목적을 자기결정적 자아의 형성에 둔다고 주장한 학자는 부버다.","src":"E"},{"id":"E2018-H-07-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":7,"stem":"현대사회에서 평생교육이 필요한 이유로 가장 타당한 것은?","opts":["조직의 물적, 재정적 자원의 중요성 대두","학교교육의 유용성 증가","과학기술의 발달로 인한 기술우위 사회의 대두","평생직장 개념의 확대로 인한 비(非)경쟁사회 도래"],"ans":[3],"multi":false,"dup":true,"expl":"평생교육의 필요 이유는 지식·기술의 폭발적 증가와 노후화, 기술우위 사회의 도래다.","src":"E"},{"id":"E2018-H-08-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":8,"stem":"고전적 조건형성이론에서 개는 조건화 전에는 종소리에 대해서 침을 흘리지 않는다. 이와 같이 유기체로부터 어떠한 반응도 이끌어내지 못하는 자극을 무엇이라고 하는가?","opts":["강화 자극","조건 자극","중성 자극","무조건 자극"],"ans":[3],"multi":false,"dup":true,"expl":"조건화 전 아무 반응도 이끌어내지 못하는 자극은 중성자극이다.","src":"E"},{"id":"E2018-H-09-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":9,"stem":"공부할 마음이 없는 아이에게 아무리 좋은 학습자료를 갖다 주어도 학습의 효과를 보기 어려운 것과 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","유사의 법칙"],"ans":[3],"multi":false,"dup":true,"expl":"학습할 준비가 되어 있지 않으면 효과가 없다는 것은 손다이크의 준비성의 법칙이다.","src":"E"},{"id":"E2018-H-10-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":10,"stem":"다음 중 일벌백계(一罰百戒)와 가장 관련이 깊은 것은?","opts":["대리 강화","부분 강화","자기 처벌","대리 처벌"],"ans":[4],"multi":false,"dup":false,"expl":"한 사람에 대한 벌이 다른 사람에게 영향을 주는 것은 대리 처벌이다.","src":"E"},{"id":"E2018-H-11-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":11,"stem":"일어날 확률이 높은 행동은 일어날 확률이 낮은 행동에 대해 정적 강화물로서 작용한다는 것을 바탕으로 한 행동수정방법은?","opts":["타임 아우트","토큰 강화","프리맥의 원리","부분 강화"],"ans":[3],"multi":false,"dup":false,"expl":"빈도가 높은 행동을 강화물로 활용해 낮은 행동을 늘리는 방법은 프리맥의 원리다.","src":"E"},{"id":"E2018-H-12-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":12,"stem":"강화와 벌을 구분하는 가장 중요한 기준은?","opts":["행동속도의 변화","행동유형의 변화","행동장소의 변화","행동빈도의 변화"],"ans":[4],"multi":false,"dup":true,"expl":"강화와 벌은 행동빈도의 변화(증가/감소)로 구분한다.","src":"E"},{"id":"E2018-H-13-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":13,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":true,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이며, 행동이 안정된 뒤에는 간헐적(부분) 강화로 옮겨 간다. 자기 강화·대리 강화는 초기 습득 단계의 강화 방법이 아니다.","src":"E"},{"id":"E2018-H-14-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":14,"stem":"피아제(Piaget)의 인지발달단계 중 어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 능력을 처음 획득하게 되는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[1],"multi":false,"dup":true,"expl":"눈앞에서 사라진 장난감이 계속 존재한다는 이해, 즉 대상영속성은 감각운동기에 획득된다.","src":"E"},{"id":"E2018-H-15-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":15,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 각 단계별로 성취해야 할 긍정적인 과업이 발달 순서대로 나열된 것은?","opts":["신뢰감 → 자율성 → 근면성 → 주도성","자율성 → 주도성 → 근면성 → 자아정체성","주도성 → 근면성 → 친밀성 → 자아정체성","신뢰감 → 주도성 → 자율성 → 친밀성"],"ans":[2],"multi":false,"dup":true,"expl":"에릭슨의 발달 순서는 신뢰감→자율성→주도성→근면성→자아정체성→친밀성→생산성→통합성이다. ③만 이 순서에 맞다.","src":"E"},{"id":"E2018-H-16-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":16,"stem":"학습과 기억에 결정적인 역할을 담당하고 있는 것으로서, 치매에 걸린 사람들은 이것에 구조적․기능적 쇠퇴가 발생한 것으로 알려지고 있다. 이것은?","opts":["해마","편도체","연수","뇌량"],"ans":[1],"multi":false,"dup":true,"expl":"학습과 기억에 결정적인 역할을 하며 치매에서 쇠퇴하는 뇌 구조는 해마.","src":"E"},{"id":"E2018-H-17-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":17,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["감각기억은 시연에 의해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 작업기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[3],"multi":false,"dup":true,"expl":"논리적 추론처럼 정보를 조작·처리하는 과정은 작업기억에 해당한다. 시연으로 지속시간이 늘어나는 것은 단기기억, 감각기억은 1초 이내이며, 7±2는 단기(작업)기억의 용량이다.","src":"E"},{"id":"E2018-H-18-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":18,"stem":"우리가 영화를 보고, 음악을 감상하고, 언어에 의한 의사소통을 할 수 있는 것은 다음 중 어떤 기억 장치가 있기 때문인가?","opts":["장기기억","단기기억","작업기억","감각기억"],"ans":[4],"multi":false,"dup":true,"expl":"영화의 영상, 음악의 소리, 언어의 소리를 순간적으로 받아들여 하나의 흐름으로 지각하게 하는 것은 감각기억이다. 감각기억이 없으면 연속된 자극을 이어서 경험할 수 없다.","src":"E"},{"id":"E2018-H-19-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":19,"stem":"망각의 원인에 관한 다음 설명 중 소멸이론에 관한 설명은?","opts":["순행성 간섭과 역행성 간섭은 그 좋은 예이다","정신분석이론에 근거하고 있다","파지기간 중에 파지를 방해하는 외부적 영향 때문에 망각현상이 촉진된다","기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다"],"ans":[4],"multi":false,"dup":true,"expl":"소멸이론은 사용하지 않는 기억 흔적이 시간이 지나며 사라진다고 본다(간섭이론과 대비).","src":"E"},{"id":"E2018-H-20-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":20,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 불어 시간에 배운 내용 때문에 영어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[1],"multi":false,"dup":true,"expl":"나중에 배운 불어가 먼저 배운 영어의 기억을 방해한 것은 역행성 간섭이다. 순행성 간섭은 반대로 먼저 배운 내용이 나중 학습을 방해하는 경우다.","src":"E"},{"id":"E2018-H-21-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":21,"stem":"서스턴(Thurstone)이 주장하는 일곱 가지 기본정신능력(Primary Mental Ability)에 해당하지 않는 것은?","opts":["지각속도","기억력","수리력","창의력"],"ans":[4],"multi":false,"dup":true,"expl":"서스턴의 7가지 기초정신능력은 언어이해·추리·수리·공간지각·언어유창성·지각속도·기억력이다. 창의력은 길포드의 확산적 사고와 관련된 개념이다.","src":"E"},{"id":"E2018-H-22-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":22,"stem":"최초의 지능검사인 비네-시몬(Binet-Simon) 지능검사에 대한 다음 설명 중 가장 적절한 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","사회적 지능을 측정하는 데 유용하다"],"ans":[2],"multi":false,"dup":true,"expl":"비네-시몬 검사는 정신연령 개념을 도입한 최초의 지능검사다. 언어성·동작성 IQ와 편차 IQ는 웩슬러 검사, 사회적 지능은 손다이크 등과 관련된다.","src":"E"},{"id":"E2018-H-23-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":23,"stem":"다음 설명 중 길포드(Guilford)가 말하는 확산적 사고와 가장 거리가 먼 것은?","opts":["문제에 대한 민감성","아이디어 산출의 유창성","타인에의 동조성","사고의 유연성"],"ans":[3],"multi":false,"dup":true,"expl":"확산적 사고는 유창성·융통성·독창성·정교성·민감성으로 설명된다. 타인에의 동조성은 이와 반대되는 특성이다.","src":"E"},{"id":"E2018-H-24-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":24,"stem":"가드너(Gardner)의 다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","논리-수학 지능","대인간 지능","공간 지능"],"ans":[3],"multi":false,"dup":true,"expl":"가드너의 다면적 지능 중 감성지능·사회적 지능과 가장 관련이 깊은 것은 대인간 지능이다.","src":"E"},{"id":"E2018-H-25-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":25,"stem":"창의력에 관한 다음 설명 중 정신분석학적 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력을 구성하는 기본 능력들은 지필검사로 측정할 수 있다","창의력은 확산적 사고와 밀접한 관련이 있다","창의력은 하늘이 부여한 것이다"],"ans":[1],"multi":false,"dup":true,"expl":"창의적 활동을 승화작용으로 보는 것은 정신분석학적 관점이다.","src":"E"},{"id":"E2018-H-26-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":26,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘삶의 본능’과 가장 거리가 먼 것은?","opts":["성적 본능","창조적 본능","사랑의 본능","공격 본능"],"ans":[4],"multi":false,"dup":true,"expl":"프로이트의 삶의 본능(리비도)은 성·사랑·창조 등 생명을 유지·확장하는 본능이다. 공격 본능은 죽음의 본능(타나토스)에 속한다.","src":"E"},{"id":"E2018-H-27-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":27,"stem":"원초아의 충동이 너무 강하여 자신이 충동을 통제하지 못할 것 같을 때 경험하는 불안은?","opts":["현실 불안","도덕적 불안","신경증적 불안","상태 불안"],"ans":[3],"multi":false,"dup":true,"expl":"원초아 충동을 통제하지 못할까 봐 느끼는 불안은 신경증적 불안이다.","src":"E"},{"id":"E2018-H-28-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":28,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["셀리그만(Seligman) - 성취동기","맥클리랜드(McClelland) - 학습된 무력감","페어번(Fairbairn) - 자기 효능감","보울비(Bowlby) - 애착이론"],"ans":[4],"multi":false,"dup":true,"expl":"보울비는 애착이론, 셀리그만은 학습된 무력감, 맥클리랜드는 성취동기와 연결된다. 따라서 ②만 바른 연결이다.","src":"E"},{"id":"E2018-H-29-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":29,"stem":"매슬로우(Maslow)의 욕구위계설에서 생리적 욕구, 안전 욕구, 애정과 소속 욕구, 자존 욕구를 총괄하여 무슨 욕구라고 하는가?","opts":["실존욕구","결핍욕구","성장욕구","자아실현 욕구"],"ans":[2],"multi":false,"dup":true,"expl":"생리·안전·애정과 소속·자존 욕구를 묶어 결핍욕구라 한다.","src":"E"},{"id":"E2018-H-30-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":30,"stem":"공격성에 대한 다음 설명 중 행동주의적 관점에 해당하는 것은?","opts":["공격성은 선천적으로 가지고 태어나는 것이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다"],"ans":[4],"multi":false,"dup":true,"expl":"행동주의 관점은 공격적 행동에 대한 직접적 보상이 행동을 반복시킨다고 본다.","src":"E"},{"id":"E2018-H-31-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":31,"stem":"자아정체성의 발달수준 중 자아정체성에 대한 위기도 경험하지 못한 채 마치 정체성을 확립한 것처럼 느끼는 상태를 특히 무엇이라고 하는가?","opts":["정체성 혼미","정체성 조기완료","정체성 유예","정체성 성취"],"ans":[2],"multi":false,"dup":true,"expl":"위기 없이 정체성을 확립한 듯 보이는 상태는 정체성 조기완료(조기성취)다.","src":"E"},{"id":"E2018-H-32-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":32,"stem":"청소년기 자아중심적 사고의 특징으로서, 자신이 타인들의 관심과 주의의 대상이 되고 있다는 믿음에서 비롯되는 심리상태를 특히 무엇이라고 하는가?","opts":["상상적 청중","자기충족적 예언","열등감","정체감 혼미"],"ans":[1],"multi":false,"dup":true,"expl":"자신이 타인의 관심과 주목의 대상이라고 믿는 청소년기 자아중심성은 상상적 청중이다.","src":"E"},{"id":"E2018-H-33-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":33,"stem":"어두운 밤길에 건널목에 빨간 불이 켜져 있었지만 오가는 차가 없어 길을 건너고도 아무렇지 않게 생각한 사람이 있었다. 이 사람은 콜버그(Kohlberg)의 도덕성 발달단계 중 어떤 단계에 있다고 판단할 수 있는가?","opts":["도구적 상대주의 지향","처벌과 복종 지향","대인간 조화 지향","법과 질서 지향"],"ans":[1],"multi":false,"dup":true,"expl":"벌이 두렵지 않고 차가 없으면 길을 건너도 된다고 판단한 것은 자신의 이익과 처벌 회피를 계산하는 도구적 상대주의 지향이다.","src":"E"},{"id":"E2018-H-34-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":34,"stem":"아동이 도덕적 개념을 이해하고 자율적인 도덕적 판단을 하기 위해서는 이에 상응하는 인지적 발달이 이루어져야 한다고 주장하는 대표적인 학자는?","opts":["프로이트(Freud)","에릭슨(Erikson)","반두라(Bandura)","피아제(Piaget)"],"ans":[4],"multi":false,"dup":true,"expl":"도덕적 개념의 이해와 자율적 도덕 판단에 인지발달이 선행해야 한다고 본 대표적 학자는 피아제다.","src":"E"},{"id":"E2018-H-35-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":35,"stem":"자아실현과 관련된 다음 설명 중 가장 적절하지 않은 것은?","opts":["자아실현은 특수한 영역의 가능성을 현실화하는 것이다","자아실현은 고도의 성취뿐만 아니라 낮은 수준의 성취도 포함한다","자아실현의 과정은 어렵고 때때로 고통스럽기도 하다","자아실현은 그 자체가 삶의 목적이다"],"ans":[1],"multi":false,"dup":false,"expl":"자아실현은 특정 영역만이 아니라 자신의 전체 잠재가능성을 현실화하는 것이다.","src":"E"},{"id":"E2018-H-36-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":36,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["로저스(Rogers) - 충분히 기능하는 인간","올포트(Allport) - 생산적인 사람","프롬(Fromm) - 합리적 모험가","매슬로우(Maslow) - 성숙한 인격"],"ans":[1],"multi":false,"dup":true,"expl":"로저스는 충분히 기능하는 사람, 매슬로는 자아실현인, 올포트는 성숙한 인격, 프롬은 생산적인 사람을 제시했다.","src":"E"},{"id":"E2018-H-37-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":37,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사업가적 유형 - 정치가, 영업사원, 광고업자","관습적 유형 - 교사, 간호사, 종교지도자","사회적 유형 - 기술자, 정비사, 의료기사","실제적 유형 - 회계사, 은행원, 사무원"],"ans":[1],"multi":false,"dup":true,"expl":"사업가적 유형-정치가·영업사원·광고업자가 바른 연결이다. 관습적은 회계사·은행원, 사회적은 교사·간호사, 실제적은 기술자다.","src":"E"},{"id":"E2018-H-38-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":38,"stem":"자기 자신을 부정적으로 평가하고 비하하게 되면 부정적인 자아개념을 갖게 되는데, 이러한 부정적 자아개념이 심할 경우에 갖게 되는 것은?","opts":["자아정체성","자기효능감","이상적 자아","학습된 무력감"],"ans":[4],"multi":false,"dup":false,"expl":"부정적 자아개념이 심해져 노력해도 결과를 바꿀 수 없다고 믿는 상태는 학습된 무력감이다.","src":"E"},{"id":"E2018-H-39-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":39,"stem":"진로지도와 관련된 이론 중, 인간은 자신의 이익을 극대화하고 손실을 최소화하는 방향으로 행동한다는 케인즈의 경제이론에 바탕을 두고 있는 이론은?","opts":["특성이론","사회이론","심리이론","의사결정이론"],"ans":[4],"multi":false,"dup":true,"expl":"이익 극대화·손실 최소화의 경제적 합리성을 바탕에 둔 진로지도 이론은 의사결정이론이다.","src":"E"},{"id":"E2018-H-40-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":40,"stem":"다음 중 ‘표준화 심리검사’와 가장 거리가 먼 것은?","opts":["전문적 제작과정","상식적 인간이해 방법","검사 조건의 표준화","규준(norm)의 설정"],"ans":[2],"multi":false,"dup":false,"expl":"표준화 심리검사는 전문적 제작, 조건의 표준화, 규준 설정을 갖추며 상식적 인간이해 방법과는 거리가 멀다.","src":"E"},{"id":"E2018-H-41-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":41,"stem":"다음 중 생활지도의 일반적 목표로 보기에 가장 적합치 않은 것은?","opts":["자신에 대한 올바른 이해","잠재가능성의 실현","특정한 문제의 해결","전인적 발달의 촉진"],"ans":[3],"multi":false,"dup":true,"expl":"생활지도의 일반적 목표는 자기이해, 잠재가능성 실현, 전인적 발달이다. 특정 문제의 해결은 상담의 목표에 가깝다.","src":"E"},{"id":"E2018-H-42-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":42,"stem":"다음 중 직업에 대한 지식․태도․기능이 어려서부터 성인기까지 발달한다는 관점을 취하고 있는 이론가는?","opts":["로우(Roe)","긴츠버그(Ginzberg)","홀랜드(Holland)","윌리암슨(Williamson)"],"ans":[2],"multi":false,"dup":true,"expl":"직업에 대한 지식·태도·기능이 어려서부터 성인기까지 발달한다고 본 이론가는 긴츠버그다.","src":"E"},{"id":"E2018-H-43-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":43,"stem":"다음 중 행동수정이론에서 가정하고 있는 것은?","opts":["인간행동의 원인은 우리 외부에 있다","인간은 끊임없이 갈등하는 존재다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다","인간은 합리적이고 건설적이며 합목적적인 존재이다"],"ans":[1],"multi":false,"dup":true,"expl":"행동수정이론은 인간행동의 원인이 외부 환경에 있다고 본다.","src":"E"},{"id":"E2018-H-44-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":44,"stem":"정신분석이론의 주요 상담기법들에 공통적으로 적용되는 기법은?","opts":["자유연상","강화","해석","논리적 반박"],"ans":[3],"multi":false,"dup":false,"expl":"정신분석 상담의 주요 기법(자유연상, 꿈 분석, 전이 분석 등)에 공통으로 적용되는 것은 해석이다.","src":"E"},{"id":"E2018-H-45-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":45,"stem":"행동수정의 진행과정에서 강화를 주어야 할 행동과 주지 말아야 할 행동을 구분해주는 기준이 되는 것은?","opts":["기초선 수준","정적 강화자극","1차 강화자극","2차 강화자극"],"ans":[1],"multi":false,"dup":true,"expl":"강화 대상 행동을 가려내는 기준은 기초선 수준이다.","src":"E"},{"id":"E2018-H-46-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":46,"stem":"합리-정의적 상담이론의 ABCD기법에서 현재의 정서적․행동적 결과의 진정한 원인이라고 엘리스(Ellis)가 주장하는 것은?","opts":["A","B","C","D"],"ans":[2],"multi":false,"dup":true,"expl":"엘리스는 정서·행동적 결과(C)의 진정한 원인을 신념체계(B)라고 본다. 선행사건(A) 자체가 원인이 아니다.","src":"E"},{"id":"E2018-H-47-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":47,"stem":"상담에서 가장 중요한 상담자와 내담자간의 신뢰와 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","부정적 전이","주종관계"],"ans":[2],"multi":false,"dup":true,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다. 역전이·부정적 전이는 상담자의 감정 반응이다.","src":"E"},{"id":"E2018-H-48-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":48,"stem":"우리는 타인으로부터 인정받고 싶은 마음 때문에 타인의 기대에 맞추어 살기도 한다. 하지만 이것이 많으면 많을수록 삶의 무의미와 공허감을 느끼게 된다고 로저스(Rogers)는 주장한다. 이것은?","opts":["가치조건","자동적 사고","공상","혐오자극"],"ans":[1],"multi":false,"dup":true,"expl":"타인의 기대에 맞추느라 자신의 유기체적 경험을 무시하게 만드는 조건은 로저스가 말한 가치조건이다.","src":"E"},{"id":"E2018-H-49-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":49,"stem":"상담자가 내담자와 대화하면서 서로간의 신뢰가 문제시 될 것 같아 다음과 같이 말했다. 이와 가장 관계있는 상담기법은?“당신이 말하기를 주저하는 것이 혹시 나와 관계되어 그런 것이 아닌가 궁금하군요. 아직은 나를 믿는 것이 어렵겠지요.”","opts":["해석","즉시성","직면","구체화"],"ans":[2],"multi":false,"dup":true,"expl":"상담자가 지금-여기에서의 관계를 내담자와 논의하는 기법은 즉시성이다.","src":"E"},{"id":"E2018-H-50-0","set":"2018-하계","year":2018,"kind":"하계","grade":"전학년","no":50,"stem":"다음 중 연결이 바르게 된 것은?","opts":["체계적 둔감법 - 월페(Wolpe)","상호제지의 원리 - 스키너(Skinner)","고전적 조건형성 - 벡(Beck)","범람법 - 반두라(Bandura)"],"ans":[1],"multi":false,"dup":true,"expl":"체계적 둔감법은 월페가 제안했다. 상호제지의 원리는 월페, 고전적 조건형성은 파블로프, 범람법은 행동주의 치료기법이다.","src":"E"},{"id":"E2019-2-01-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 철학·종교적 인간관과 과학적 인간관이 공통적으로 갖고 있는 생각은?","opts":["인간은 물질세계의 한 부분으로서 인과론적 법칙에 따라 행동하는 존재이다","인간에게는 불변의 본성이나 본질이 자연 또는 신에 의해 주어져 있다","인간의 고유한 형상은 이성이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[2],"multi":false,"dup":true,"expl":"마리탱은 인간을 물질세계의 일부로 보는 과학적 인간관과, 이성으로 형상을 실현하는 존재로 보는 철학·종교적 인간관이 ‘인간에게는 자연 또는 신이 준 불변의 본성·본질이 있다’는 점에서 공통한다고 보았다. ①은 과학적 인간관만의 특징, ③은 철학·종교적 인간관, ④는 칸트의 정언명령에 가깝다.","src":"E"},{"id":"E2019-2-02-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":2,"stem":"후기 현대철학적 인간이해의 관점이 교육과 관련하여 우리에게 주는 시사점으로 볼 수 있는 것은?","opts":["교육은 가치중립적인 활동이다","교육의 과정은 공학적 모형으로 설명될 수 있다","교육목표보다는 교수-학습의 효율성과 성취도의 평가를 강조할 필요가 있다","교육은 경험의 끊임없는 재구성을 통해 개인이 성장해 갈 수 있도록 도와주는 과정이다"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 경험의 끊임없는 재구성을 통한 성장을 교육의 핵심으로 본다.","src":"E"},{"id":"E2019-2-03-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":3,"stem":"프뢰벨, 페스탈로찌, 헤르바르트에 의해 전개된 유럽의 신교육운동의 바탕이 된 인간관은?","opts":["행동주의 교육관","진보주의 교육관","자연주의 교육관","실존주의 교육관"],"ans":[3],"multi":false,"dup":true,"expl":"프뢰벨·페스탈로찌·헤르바르트로 이어진 유럽 신교육운동의 바탕은 자연주의 교육관이다.","src":"E"},{"id":"E2019-2-04-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":4,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 주형으로서의 교육관","매슬로(Maslow) - 탈학교 교육론","피터스(Peters) - 프로그램 수업","렝그랑(Lengrand) - 평생교육"],"ans":[4],"multi":false,"dup":true,"expl":"렝그랑-평생교육이 바른 연결이다. 일리치는 탈학교교육론, 매슬로는 자아실현, 피터스는 교육의 기준과 연결된다.","src":"E"},{"id":"E2019-2-05-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":5,"stem":"수학교과서의 내용이 초등학교, 중학교, 고등학교로 갈수록 점차 심화되고 확대되는 것을 알 수 있는데, 이것과 가장 관련이 있는 교육내용 선정 및 조직의 원리는?","opts":["통합성의 원리","반복성의 원리","계열성의 원리","계속성의 원리"],"ans":[3],"multi":false,"dup":true,"expl":"학년이 올라갈수록 내용이 심화·확대되는 것은 계열성의 원리다. 계속성은 같은 내용의 반복, 통합성은 교과 간 관련을 뜻하며 반복성은 내용 조직의 원리가 아니다.","src":"E"},{"id":"E2019-2-06-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":6,"stem":"다음 설명 중 조작적 조건형성이론과 관련이 깊은 것은?","opts":["개의 소화계에 대한 실험으로부터 탄생된 이론이다","불수의적 행동의 학습기제이다","중성자극과 조건자극 간의 관계를 설명하고 있다","스키너(Skinner)에 의해 체계화되었다"],"ans":[4],"multi":false,"dup":false,"expl":"조작적 조건형성은 스키너가 체계화했으며 수의적 행동의 학습기제다.","src":"E"},{"id":"E2019-2-07-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":7,"stem":"예습과 복습은 학습에 있어서 매우 중요하다. 이와 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","유사의 법칙"],"ans":[1],"multi":false,"dup":true,"expl":"예습·복습처럼 반복을 통해 학습이 강화된다는 것은 연습의 법칙이다.","src":"E"},{"id":"E2019-2-08-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":8,"stem":"방과후의 교실 청소를 감면해줌으로써 아이의 착한 행동의 빈도를 증가시키고자 한 것과 관련이 있는 것은?","opts":["정적 강화","부적 강화","벌","소거"],"ans":[2],"multi":false,"dup":false,"expl":"혐오자극(청소)을 제거해 바람직한 행동을 늘리는 것은 부적 강화다.","src":"E"},{"id":"E2019-2-09-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":9,"stem":"일어날 확률이 높은 행동은 일어날 확률이 낮은 행동에 대해 정적 강화물로 작용한다는 것을 바탕으로 한 행동수정방법은?","opts":["프리맥의 원리","토큰 강화","타임 아웃","소거의 원리"],"ans":[1],"multi":false,"dup":false,"expl":"빈도가 높은 활동을 강화물로 삼아 바람직한 행동을 늘리는 방법은 프리맥의 원리다.","src":"E"},{"id":"E2019-2-10-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":10,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["빠른 자극 변별","자발적 회복","빈번한 자극 일반화","고차적 조건형성"],"ans":[2],"multi":false,"dup":false,"expl":"소거 후 반응이 다시 나타나는 자발적 회복은 행동의 일시적 억압을 보여 준다.","src":"E"},{"id":"E2019-2-11-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":11,"stem":"어떤 학생이 시간당 4,000원을 받기로 하고 편의점에서 아르바이트를 하고 있다. 이와 가장 관련이 깊은 강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[1],"multi":false,"dup":false,"expl":"시간당 급여를 받는 아르바이트는 고정간격 강화계획이다.","src":"E"},{"id":"E2019-2-12-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":12,"stem":"피아제(Piaget)의 인지발달단계 중 분류조작과 서열조작 능력을 갖추게 되는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[3],"multi":false,"dup":false,"expl":"분류조작·서열조작이 가능한 단계는 구체적 조작기다.","src":"E"},{"id":"E2019-2-13-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":13,"stem":"다음 중 일벌백계(一罰百戒)와 가장 관련이 깊은 것은?","opts":["소거","부분 강화","자기 처벌","대리 처벌"],"ans":[4],"multi":false,"dup":true,"expl":"한 사람이 받은 벌을 다른 사람이 관찰하고 같은 행동을 하지 않게 되는 것은 대리 처벌(대리적 벌)이다. 소거·부분 강화는 벌의 전이와 다른 학습 원리이고, 자기 처벌은 스스로에게 벌을 주는 것이다.","src":"E"},{"id":"E2019-2-14-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":14,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 초등학교 시절에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["자율성 - 수치감","근면성 - 열등감","주도성 - 죄책감","생산성 - 침체감"],"ans":[2],"multi":false,"dup":false,"expl":"초등학교 시기의 과업은 근면성 대 열등감이다.","src":"E"},{"id":"E2019-2-15-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":15,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 삼원지능이론","서스턴(Thurstone) - 7가지 기초정신능력","길포드(Guilford) - 일반요인, 특수요인","가드너(Gardner) - 유동성 지능, 결정성 지능"],"ans":[2],"multi":false,"dup":true,"expl":"서스턴-7가지 기초정신능력이 바른 연결이다. 커텔은 유동성·결정성, 길포드는 요소설, 가드너는 다면적 지능이다.","src":"E"},{"id":"E2019-2-16-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":16,"stem":"최초의 지능검사인 비네-시몬(Binet-Simon) 지능검사에 대한 다음 설명 중 가장 적절한 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","사회적 지능을 측정하는 데 유용하다"],"ans":[2],"multi":false,"dup":true,"expl":"비네-시몬 검사는 정신연령 개념을 도입한 최초의 지능검사다. 언어성·동작성 IQ와 편차 IQ는 웩슬러 검사, 사회적 지능은 손다이크 등과 관련된다.","src":"E"},{"id":"E2019-2-17-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":17,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["장기기억 - 음악 감상","감각기억 - 유목별 군집화","작업기억 - 논리적 추론","단기기억 - 영화 감상"],"ans":[3],"multi":false,"dup":true,"expl":"작업기억은 정보를 일시 저장하면서 논리적 추론 같은 사고를 수행하는 장치다. 유목별 군집화는 장기기억, 음악·영화 감상은 감각기억과 관련된다.","src":"E"},{"id":"E2019-2-18-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":18,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 불어 시간에 배운 내용 때문에 영어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[1],"multi":false,"dup":true,"expl":"나중에 배운 불어가 먼저 배운 영어의 기억을 방해한 것은 역행성 간섭이다. 순행성 간섭은 반대로 먼저 배운 내용이 나중 학습을 방해하는 경우다.","src":"E"},{"id":"E2019-2-19-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":19,"stem":"다음 설명 중 길포드(Guilford)가 말하는 확산적 사고와 가장 거리가 먼 것은?","opts":["문제에 대한 민감성","아이디어 산출의 유창성","타인에의 동조성","사고의 유연성"],"ans":[3],"multi":false,"dup":true,"expl":"확산적 사고는 유창성·융통성·독창성·정교성·민감성으로 설명된다. 타인에의 동조성은 이와 반대되는 특성이다.","src":"E"},{"id":"E2019-2-20-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":20,"stem":"망각과 관련된 가설 중 프로이트(Freud)의 정신분석이론에 기초하고 있는 것은?","opts":["억압 이론","소멸 이론","간섭 이론","전이 이론"],"ans":[1],"multi":false,"dup":false,"expl":"망각을 무의식적 억압으로 설명하는 이론은 프로이트의 정신분석에 기초한 억압 이론이다.","src":"E"},{"id":"E2019-2-21-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":21,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["삶의 본능 - 리비도(libido)","자아 - 일차 과정","원초아 - 현실 원리","초자아 - 이차 과정"],"ans":[1],"multi":false,"dup":true,"expl":"삶의 본능-리비도가 바른 연결이다. 자아는 현실원리·2차과정, 원초아는 쾌락원리·1차과정이다.","src":"E"},{"id":"E2019-2-22-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":22,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 결핍욕구에 해당하는 것은?","opts":["실존 욕구","심미적 욕구","지적 욕구","안전 욕구"],"ans":[4],"multi":false,"dup":true,"expl":"결핍욕구는 생리·안전·소속·자존 욕구이며 지적·심미적·자아실현은 성장욕구다.","src":"E"},{"id":"E2019-2-23-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":23,"stem":"프로이트(Freud)의 정신역동이론에 의하면 초자아가 발달하기 시작하는 시기는?","opts":["구강기","항문기","남근기","생식기"],"ans":[3],"multi":false,"dup":true,"expl":"초자아가 발달하기 시작하는 시기는 남근기(3~5세)다.","src":"E"},{"id":"E2019-2-24-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":24,"stem":"팔이나 다리의 근육과 같이 우리의 의지에 의해 조절되는 것들을 관장하는 신경계는?","opts":["체성신경계","자율신경계","교감신경계","부교감신경계"],"ans":[1],"multi":false,"dup":true,"expl":"팔·다리 근육처럼 의지로 조절되는 골격근을 관장하는 것은 체성신경계다. 자율신경계(교감·부교감)는 의지와 무관하게 내장 기관을 조절한다.","src":"E"},{"id":"E2019-2-25-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":25,"stem":"애착형성에 관한 다음 설명 중 가장 적절하지 않은 것은?","opts":["영아는 배고픔을 해소시켜주는 대상에게 애착을 형성한다","영아는 부모의 보살핌과 보호를 이끌어내는 능동적 존재이다","안정적인 애착관계를 형성한 유아는 격리불안을 보인다","영아기에 형성된 애착유형은 아동기 또래관계와 관련있다"],"ans":[3],"multi":false,"dup":false,"expl":"안정적 애착을 형성한 유아는 격리불안이 낮다. 격리불안이 크게 나타나는 것은 불안정 애착이다.","src":"E"},{"id":"E2019-2-26-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":26,"stem":"다음 중 자기통제력의 발달과 가장 관련이 깊은 것은?","opts":["도구적 공격성","외적 통제자","확산적 사고","만족지연능력"],"ans":[4],"multi":false,"dup":false,"expl":"자기통제력의 핵심은 만족지연능력이다.","src":"E"},{"id":"E2019-2-27-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":27,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 입장수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다"],"ans":[4],"multi":false,"dup":false,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 물리적 조망수용보다 사회적 조망수용이 상관이 높다.","src":"E"},{"id":"E2019-2-28-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":28,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["히스(Heath) - 성숙한 인격","올포트(Allport) - 생산적인 사람","프롬(Fromm) - 합리적 모험가","매슬로우(Maslow) - 자아실현인"],"ans":[4],"multi":false,"dup":false,"expl":"매슬로우-자아실현인이 바른 연결이다.","src":"E"},{"id":"E2019-2-29-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":29,"stem":"제빵 비용을 절약하여 자신의 이익을 높이기 위하여 사람들의 몸에 해가 되는 물질을 음식물에 섞어서 만들고도 아무렇지 않게 생각한 사람이 있다. 이 사람은 콜버그(Kohlberg)의 도덕성 발달단계 중 어떤 단계에 있다고 판단할 수 있는가?","opts":["대인간 조화 지향","처벌과 복종 지향","도구적 상대주의 지향","법과 질서 지향"],"ans":[3],"multi":false,"dup":false,"expl":"자신의 이익을 위해 남에게 해를 끼치고도 개의치 않는 것은 도구적 상대주의 지향(전인습 2단계)이다.","src":"E"},{"id":"E2019-2-30-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":30,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 정치가, 영업사원, 광고업자","관습적 유형 - 회계사, 은행원, 사무원","실제적 유형 - 교사, 간호사, 종교지도자","탐구적 유형 - 기술자, 정비사, 의료기사"],"ans":[2],"multi":false,"dup":true,"expl":"관습적 유형-회계사·은행원·사무원이 바른 연결이다. 사회적은 교사·간호사, 실제적은 기술자·정비사, 탐구적은 과학자다.","src":"E"},{"id":"E2019-2-31-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":31,"stem":"진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["사회이론 - 겔라트(Gelatt)","특성이론 - 윌리엄슨(Williamson)","의사결정이론 - 보딘(Bordin)","심리이론 - 홀링헤드(Hollingshead)"],"ans":[2],"multi":false,"dup":false,"expl":"특성이론-윌리엄슨이 바른 연결이다. 사회이론은 홀링쉐드, 의사결정이론은 겔라트, 심리이론은 로우다.","src":"E"},{"id":"E2019-2-32-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":32,"stem":"다음 중 직업에 대한 지식·태도·기능이 어려서부터 성인기까지 발달한다는 관점을 취하고 있는 이론가는?","opts":["수퍼(Super)","로우(Roe)","홀랜드(Holland)","윌리엄슨(Williamson)"],"ans":[1],"multi":false,"dup":false,"expl":"직업에 대한 지식·태도·기능이 어려서부터 성인기까지 발달한다고 본 이론가는 수퍼다.","src":"E"},{"id":"E2019-2-33-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":33,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 A는 무엇을 의미하는가?","opts":["정서적, 행동적 결과","신념","선행 사건","논리적 반박"],"ans":[3],"multi":false,"dup":false,"expl":"ABCD기법에서 A는 선행사건이다.","src":"E"},{"id":"E2019-2-34-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":34,"stem":"정신분석이론에서 내담자가 초기 아동기에 어떤 중요한 타인과의 관계에서 느꼈던 감정을 현재의 상담자에게도 느끼는 것을 의미하는 개념은?","opts":["전이","훈습","자유연상","저항"],"ans":[1],"multi":false,"dup":true,"expl":"초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 옮겨 느끼는 것은 전이(transference)다. 반대로 상담자가 내담자에게 느끼는 감정은 역전이다.","src":"E"},{"id":"E2019-2-35-1","set":"2019-2-기말-1학년","year":2019,"kind":"기말","grade":"1학년","no":35,"stem":"다음 중 효율적인 상담관계를 형성하기 위하여 상담자가 취해야 하는 태도조건으로 보기 어려운 것은?","opts":["일치","공감","수용","동정"],"ans":[4],"multi":false,"dup":false,"expl":"효율적 상담관계의 태도조건은 일치·공감·수용이며 동정은 포함되지 않는다.","src":"E"},{"id":"E2019-2-36-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":36,"stem":"개인은 사회가 제시하는 기존의 지식체계나 신념체계를 수동적으로 수용하고, 그에 적응해나가야 하는 존재라고 여기는 교육관은?","opts":["실존주의 교육관","진보주의 교육관","자연주의 교육관","전통적 교육관"],"ans":[4],"multi":false,"dup":true,"expl":"기존의 지식·신념체계를 수동적으로 수용하는 존재로 보는 교육관은 전통적 교육관이다.","src":"E"},{"id":"E2019-2-37-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":37,"stem":"다음 중 진보주의 교육관과 가장 거리가 먼 것은?","opts":["자연주의 교육관","경험중심 교육","실용주의 철학","인간행동의 계획적 변화"],"ans":[4],"multi":false,"dup":true,"expl":"진보주의 교육관은 경험중심·실용주의·자연주의와 통한다. ‘인간행동의 계획적 변화’는 전통적(주형적) 교육관의 특징이므로 진보주의와 가장 거리가 멀다.","src":"E"},{"id":"E2019-2-38-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":38,"stem":"수학 교과에서 배운 공식이 과학 교과에서 활용될 수 있도록 교육내용을 선정하고 조직하는 것과 가장 가까운 것은?","opts":["계속성의 원리","일관성의 원리","계열성의 원리","통합성의 원리"],"ans":[4],"multi":false,"dup":true,"expl":"서로 다른 교과의 내용을 관련지어 조직하는 것은 통합성의 원리다. 계속성은 같은 요소의 반복, 계열성은 내용의 심화·확대, 일관성은 목적과의 일치를 뜻한다.","src":"E"},{"id":"E2019-2-39-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":39,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["매슬로(Maslow) - 주형으로서의 교육관","일리치(Illich) - 탈학교 교육론","렝그랑(Lengrand) - 프로그램 수업","피터스(Peters) - 평생교육"],"ans":[2],"multi":false,"dup":false,"expl":"일리치-탈학교 교육론이 바른 연결이다. 매슬로는 자아실현, 렝그랑은 평생교육, 피터스는 교육의 기준과 연결된다.","src":"E"},{"id":"E2019-2-40-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":40,"stem":"다음 설명 중 조작적 조건형성이론과 관련이 깊은 것은?","opts":["개의 소화계에 대한 실험으로부터 탄생된 이론이다","파블로프(Pavlov)에 의해 체계화되었다","무조건자극과 조건자극 간의 관계를 설명하고 있다","수의적 행동의 학습기제이다"],"ans":[4],"multi":false,"dup":false,"expl":"조작적 조건형성은 수의적 행동의 학습기제이며 스키너가 정립했다.","src":"E"},{"id":"E2019-2-41-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":41,"stem":"고전적 조건형성이론에서 개는 조건화 전에는 종소리에 대해서 침을 흘리지 않는다. 이와 같이 유기체로부터 어떠한 반응도 이끌지 못하는 자극을 무엇이라고 하는가?","opts":["강화 자극","조건 자극","중성 자극","무조건 자극"],"ans":[3],"multi":false,"dup":true,"expl":"조건화 전 아무 반응도 이끌어내지 못하는 자극은 중성자극이다.","src":"E"},{"id":"E2019-2-42-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":42,"stem":"공부는 거의 하지 않고 종일 컴퓨터 게임만 하는 아이의 공부하는 행동을 늘리기 위하여, 일정 시간의 공부를 하면 아이가 좋아하는 컴퓨터 게임을 일정 시간 동안 할 수 있도록 해주는 것과 관련이 깊은 행동수정 방법은?","opts":["토큰 강화","범람법","프리맥의 원리","소거의 원리"],"ans":[3],"multi":false,"dup":false,"expl":"좋아하는 게임을 강화물로 삼아 공부 행동을 늘리는 방법은 프리맥의 원리다.","src":"E"},{"id":"E2019-2-43-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":43,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재 조건형성","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":true,"expl":"소거 후 시간이 지나 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 보여 준다.","src":"E"},{"id":"E2019-2-44-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":44,"stem":"학교에서 전체 조회시간에 어떤 아이에게 선행상을 주었다. 이것을 본 다른 아이들이 나도 착한 행동을 해야겠다고 마음먹고 유사한 선행을 했다. 직접 선행상을 받지 않은 다른 아이들은 어떤 강화를 받은 것인가?","opts":["계속적 강화","부분강화","자기강화","대리강화"],"ans":[4],"multi":false,"dup":true,"expl":"다른 아이가 강화받는 장면을 관찰하고 같은 행동을 하게 된 것은 대리강화(대리적 강화)다. 직접 강화를 받지 않아도 관찰을 통해 학습이 일어난다.","src":"E"},{"id":"E2019-2-45-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":45,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":false,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이다.","src":"E"},{"id":"E2019-2-46-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":46,"stem":"피아제(Piaget)의 인지발달단계 중 분류조작과 서열조작 능력을 갖추게 되는 시기는?","opts":["형식적 조작기","구체적 조작기","전조작기","감각운동기"],"ans":[2],"multi":false,"dup":true,"expl":"분류조작·서열조작이 가능한 단계는 구체적 조작기다.","src":"E"},{"id":"E2019-2-47-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":47,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 2~3세경에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝지워진 것은?","opts":["근면성 - 열등감","자아정체성 - 역할혼동","자율성 - 수치감","주도성 - 죄책감"],"ans":[3],"multi":false,"dup":false,"expl":"2~3세의 과업은 자율성 대 수치감이다.","src":"E"},{"id":"E2019-2-48-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":48,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["쾰러(Köhler) - 통찰학습","에빙하우스(Ebbinghaus) - 모방학습","레빈(Lewin) - 망각곡선","손다이크(Thorndike) - 억압이론"],"ans":[1],"multi":false,"dup":false,"expl":"쾰러-통찰학습이 바른 연결이다. 에빙하우스는 망각곡선, 레빈은 장이론, 손다이크는 시행착오학습이다.","src":"E"},{"id":"E2019-2-49-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":49,"stem":"다음 중 인간의 지능에 관심을 두고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["셜스톤(Thurstone) - 일반요인, 특수요인","스턴버그(Sternberg) - 삼원지능이론","길포드(Guilford) - 인공지능","가드너(Gardner) - 7가지 기초정신능력"],"ans":[2],"multi":false,"dup":false,"expl":"스턴버그-삼원지능이론이 바른 연결이다. 셜스턴은 7가지 기본정신능력, 가드너는 다면적 지능이다.","src":"E"},{"id":"E2019-2-50-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":50,"stem":"커텔(Cattell)에 의하면 경험과 교육을 통해 형성되는 지적인 능력을 무엇이라 하는가?","opts":["결정성 지능","유동성 지능","일반 지능","특수 지능"],"ans":[1],"multi":false,"dup":false,"expl":"경험과 교육으로 형성되는 지능은 결정성 지능이다.","src":"E"},{"id":"E2019-2-51-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":51,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["감각기억은 시연을 통해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 작업기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[3],"multi":false,"dup":false,"expl":"논리적 추론 같은 작업수행은 작업기억에서 이루어진다. 1초는 감각기억, 7±2는 단기기억 용량이다.","src":"E"},{"id":"E2019-2-52-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":52,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 가장 거리가 먼 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","아동용보다 성인용 검사가 먼저 만들어졌다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","정신연령이라는 개념을 도입하고 있다"],"ans":[4],"multi":false,"dup":true,"expl":"웩슬러 검사는 언어성·동작성 IQ를 산출하고 편차 IQ로 지능지수를 계산하며, 성인용(WAIS)이 아동용(WISC)보다 먼저 만들어졌다. 정신연령은 비네 검사의 개념이므로 가장 거리가 멀다.","src":"E"},{"id":"E2019-2-53-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":53,"stem":"평균이 100이고 표준편차가 15인 지능검사에서 I.Q. 85~115에 해당하는 정상인구의 비율은 정상분포곡선 하에서 어느 정도인가?","opts":["약 34%","약 50%","약 68%","약 95%"],"ans":[3],"multi":false,"dup":false,"expl":"평균 100에서 ±1SD(85~115) 구간은 전체의 약 68%다.","src":"E"},{"id":"E2019-2-54-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":54,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 영어 시간에 배운 내용 때문에 불어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[2],"multi":false,"dup":true,"expl":"먼저 배운 영어가 나중에 배운 불어의 기억을 방해한 것은 순행성 간섭이다. 역행성 간섭은 나중 학습이 먼저 학습을 방해하는 경우다.","src":"E"},{"id":"E2019-2-55-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":55,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 성장욕구에 해당하는 것은?","opts":["지적 욕구","자존 욕구","안전 욕구","소속 및 애정 욕구"],"ans":[1],"multi":false,"dup":false,"expl":"지적 욕구는 성장욕구다. 자존·안전·소속 욕구는 결핍욕구다.","src":"E"},{"id":"E2019-2-56-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":56,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["셀리그만(Seligman) - 성취동기","보울비(Bowlby) - 애착이론","페어번(Fairbairn) - 자기 효능감","매클리랜드(McClelland) - 학습된 무력감"],"ans":[2],"multi":false,"dup":false,"expl":"보울비-애착이론이 바른 연결이다. 셀리그만은 학습된 무력감, 매클리랜드는 성취동기다.","src":"E"},{"id":"E2019-2-57-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":57,"stem":"이상적인 공동사회의 목표를 달성하고자 타인과 협조·협력하고 그들을 위해 봉사하는 것으로서, 아들러(Adler)는 이것을 '심리적 건강의 척도'라고 주장하고 있다. 이것은?","opts":["이상적 자아","조망수용능력","자아효능감","사회적 관심"],"ans":[4],"multi":false,"dup":true,"expl":"아들러가 심리적 건강의 척도로 삼은 것은 사회적 관심이다.","src":"E"},{"id":"E2019-2-58-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":58,"stem":"아이들이 TV를 시청하는 시간대에는 폭력적인 장면을 방영하는 것을 규제하고 있다. 다음 중 이와 가장 관련이 깊은 설명은?","opts":["공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","상대의 공격을 적대적으로 해석하는 게 공격성의 원인이 된다","공격성은 공격적인 남의 행동을 우연히 관찰함으로써 학습 된다","공격성은 선천적으로 가지고 태어나는 것이다"],"ans":[3],"multi":false,"dup":false,"expl":"폭력 장면의 관찰로 공격성이 학습된다는 설명은 사회학습이론이다.","src":"E"},{"id":"E2019-2-59-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":59,"stem":"자아정체성의 발달수준 중 자아에 대한 회의와 불안정을 경험하고 있으나 적극적으로 자아를 탐색하고 정체성 확립을 위해 노력하고 있는 상태를 특히 무엇이라고 하는가?","opts":["정체성 유예","정체성 혼미","정체성 성취","정체성 조기완료"],"ans":[1],"multi":false,"dup":true,"expl":"위기를 겪고 적극적으로 탐색하는 중인 상태는 정체성 유예다.","src":"E"},{"id":"E2019-2-60-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":60,"stem":"공격성에 대한 다음 설명 중 인지주의적 관점과 가장 가까운 것은?","opts":["공격성은 선천적으로 가지고 태어나는 것이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다","공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다"],"ans":[4],"multi":false,"dup":true,"expl":"상대의 공격을 적대적으로 해석하는 것이 공격성의 원인이라는 것은 인지주의적 관점이다.","src":"E"},{"id":"E2019-2-61-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":61,"stem":"위급한 상황이 발생했을 때 몸이 '싸움 혹은 도망'(fight or flight) 하도록 준비시키는 호르몬으로서 부신에서 방출되는 것은?","opts":["코티졸","도파민","에스트로겐","테스토스테론"],"ans":[1],"multi":false,"dup":false,"expl":"싸움-도망 반응을 준비시키며 부신에서 분비되는 호르몬은 코티졸이다.","src":"E"},{"id":"E2019-2-62-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":62,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결된 것은?","opts":["생산적인 사람 - 프롬(Fromm)","성숙한 인격 - 매슬로우(Maslow)","합리적 모험가 - 올포트(Allport)","자아실현인 - 아들러(Adler)"],"ans":[1],"multi":false,"dup":false,"expl":"생산적인 사람-프롬이 바른 연결이다.","src":"E"},{"id":"E2019-2-63-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":63,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 인습적 수준(conventional period)의 발달단계에 해당하는 것은?","opts":["처벌과 복종 지향","법과 질서 지향","사회적 계약 지향","도구적 상대주의 지향"],"ans":[2],"multi":false,"dup":true,"expl":"인습적 수준은 대인간 조화 지향과 법과 질서 지향이다.","src":"E"},{"id":"E2019-2-64-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":64,"stem":"다음 중 로저스(Rogers)가 말하는 '충분히 기능을 발휘하는 사람들'의 특징으로 볼 수 있는 것은?","opts":["사회문화적 구속에 동조하거나 수동적으로 반응한다","자신의 미래는 자기 자신에 의해 좌우된다고 확신한다","자신의 모든 경험에 대해 방어적이다","자신의 행동에 대해 타인에게 인정받는 데 연연한다"],"ans":[2],"multi":false,"dup":false,"expl":"충분히 기능하는 사람은 자기 삶의 주체로서 미래를 스스로 결정한다고 확신한다.","src":"E"},{"id":"E2019-2-65-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":65,"stem":"표준화 심리검사에 대한 다음 설명 중 적절하지 않은 것은?","opts":["표준화된 검사결과의 절대적 비교를 위한 기준을 설정하는 것을 의미한다","표준화 검사란 표준화된 조건하에서 피검사자들의 심리적 특성들을 측정하기 위한 도구를 말한다","표준화 검사의 제작과정은 대규모적이며 전문적이다","담임교사가 자기 반 학생의 수업태도를 알아보기 위해 제작한 간단한 설문지는 표준화 검사라고 할 수 없다"],"ans":[1],"multi":false,"dup":false,"expl":"표준화는 검사조건과 해석의 기준을 일관되게 하는 것으로, 검사결과의 절대적 비교 기준을 설정한다는 설명은 적절하지 않다.","src":"E"},{"id":"E2019-2-66-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":66,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결된 것은?","opts":["특성이론 - 겔라트(Gelatt)","의사결정이론 - 보딘(Bordin)","사회이론 - 윌리엄슨(Williamson)","심리이론 - 로우(Roe)"],"ans":[4],"multi":false,"dup":false,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2019-2-67-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":67,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 D는 무엇을 의미하는가?","opts":["정서적, 행동적 결과","신념","선행 사건","논리적 반박"],"ans":[4],"multi":false,"dup":false,"expl":"ABCD기법에서 D는 논리적 반박이다.","src":"E"},{"id":"E2019-2-68-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":68,"stem":"상담에서 가장 중요한 상담자와 내담자간의 신뢰와 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","부정적 전이","주종관계"],"ans":[2],"multi":false,"dup":true,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다. 역전이·부정적 전이는 상담자의 감정 반응이다.","src":"E"},{"id":"E2019-2-69-3","set":"2019-2-기말-3학년","year":2019,"kind":"기말","grade":"3학년","no":69,"s ,{"id":"E2019-H-12-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":12,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재 조건형성","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":true,"expl":"소거 후 시간이 지나 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 보여 준다.","src":"E"},{"id":"E2019-H-13-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":13,"stem":"예습과 복습은 학습에 있어서 매우 중요하다. 이와 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["준비성의 법칙","효과의 법칙","연습의 법칙","유사의 법칙"],"ans":[3],"multi":false,"dup":true,"expl":"예습·복습처럼 반복을 통해 학습이 강화된다는 것은 연습의 법칙이다.","src":"E"},{"id":"E2019-H-14-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":14,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["퀠러(Köhler) - 통찰학습","에빙하우스(Ebbinghaus) - 모방학습","레빈(Lewin) - 망각곡선","손다이크(Thorndike) - 억압이론"],"ans":[1],"multi":false,"dup":false,"expl":"쾰러-통찰학습이 바른 연결이다.","src":"E"},{"id":"E2019-H-15-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":15,"stem":"피아제(Piaget)의 인지발달단계 중 내재적 사고가 가능하나 자기중심성과 비가역성의 한계를 지니고 있는 발달단계는?","opts":["감각운동기","형식적 조작기","구체적 조작기","전조작기"],"ans":[4],"multi":false,"dup":true,"expl":"전조작기(2~7세)는 상징적 사고(내재적 사고)가 가능하지만 자기중심성·비가역성·중심화의 한계를 지닌다. 형식적 조작기는 가설연역적 사고, 구체적 조작기는 보존개념이 발달하는 단계다.","src":"E"},{"id":"E2019-H-16-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":16,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 청소년기에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 연결되어 있는 것은?","opts":["근면성 - 열등감","자아정체성 - 역할혼돈","자율성 - 수치감","주도성 - 죄책감"],"ans":[2],"multi":false,"dup":false,"expl":"청소년기의 과업은 자아정체성 대 역할혼돈이다.","src":"E"},{"id":"E2019-H-17-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":17,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["장기기억 - 음악 감상","감각기억 - 유목별 군집화","작업기억 - 논리적 추론","단기기억 - 영화 감상"],"ans":[3],"multi":false,"dup":true,"expl":"작업기억은 정보를 일시 저장하면서 논리적 추론 같은 사고를 수행하는 장치다. 유목별 군집화는 장기기억, 음악·영화 감상은 감각기억과 관련된다.","src":"E"},{"id":"E2019-H-18-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":18,"stem":"망각의 원인에 관한 다음 설명 중 간섭이론에 관한 설명은?","opts":["파지를 방해하는 외부적 영향 때문에 망각이 촉진된다","행동주의 이론에 근거하고 있다","뇌세포의 기억 흔적이 시간의 경과로 인해 흐려진다","망각 속도와 깊은 관련이 있다"],"ans":[1],"multi":false,"dup":true,"expl":"간섭이론은 앞뒤 학습이 서로를 방해해 파지를 저해한다고 설명한다(순행성·역행성 간섭).","src":"E"},{"id":"E2019-H-19-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":19,"stem":"인간의 기억구조에서 컴퓨터의 중앙통제기능, 즉 CPU에 해당하는 개념은?","opts":["감각기억","작업기억","단기기억","장기기억"],"ans":[2],"multi":false,"dup":true,"expl":"작업기억은 컴퓨터의 CPU처럼 정보를 조작·통제하는 중앙통제 기능을 한다.","src":"E"},{"id":"E2019-H-20-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":20,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["스피어먼(Spearman) - 7가지 기본정신능력","서스턴(Thurstone) - 180가지 요소설","가드너(Gardner) - 다면적 지능이론","길퍼드(Guilford) - 일반요인, 특수요인"],"ans":[3],"multi":false,"dup":false,"expl":"가드너-다면적 지능이론이 바른 연결이다. 스피어먼은 일반·특수요인, 서스턴은 7가지 기본정신능력, 길포드는 요소설이다.","src":"E"},{"id":"E2019-H-21-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":21,"stem":"다음 중 유동성 지능에 해당하는 것은?","opts":["어휘이해력","언어유추능력","일반 지식","수리력"],"ans":[2],"multi":false,"dup":true,"expl":"유동성 지능은 경험·교육과 무관하게 새 상황에 적응하는 능력으로 언어유추·공간지각 등이 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2019-H-22-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":22,"stem":"다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","논리-수학 지능","개인내 지능","공간 지능"],"ans":[3],"multi":false,"dup":true,"expl":"감성지능·사회적 지능과 관련이 깊은 것은 개인내(내적) 지능 또는 대인간 지능이다.","src":"E"},{"id":"E2019-H-23-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":23,"stem":"창의력에 관한 다음 설명 중 길포드(Guilford)의 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력은 수렴적 사고와 밀접한 관련이 있다","창의력은 하늘이 내리는 것이다","창의력을 구성하는 능력들은 지필검사로 측정할 수 있다"],"ans":[4],"multi":false,"dup":false,"expl":"길포드는 창의력의 구성 능력이 지필검사로 측정 가능하다고 보았다.","src":"E"},{"id":"E2019-H-24-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":24,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 적절한 것은?","opts":["대인간 지능을 측정하는 데 유용하다","터만(Terman)에 의해 개정되었다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","정신연령이라는 개념을 도입하고 있다"],"ans":[3],"multi":false,"dup":true,"expl":"웩슬러 검사는 편차 IQ를 적용한다. 정신연령은 비네 검사, 터만 개정은 스탠포드-비네 검사다.","src":"E"},{"id":"E2019-H-25-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":25,"stem":"애착형성에 관한 다음 설명 중 가장 적절하지 않은 것은?","opts":["영아는 배고픔을 해소시켜주는 대상에게 애착을 형성한다","영아는 부모의 보살핌과 보호를 이끌어내는 능동적 존재다","안정적인 애착관계를 형성한 유아는 격리불안을 보인다","영아기에 형성된 애착유형은 아동기 또래관계와 관계있다"],"ans":[3],"multi":false,"dup":true,"expl":"안정적 애착을 형성한 유아는 격리불안이 오히려 낮다. 불안정 애착에서 격리불안이 크게 나타난다.","src":"E"},{"id":"E2019-H-26-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":26,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘죽음의 본능’과 가장 가까운 것은?","opts":["성 본능","공격 본능","사랑의 본능","창조적 본능"],"ans":[2],"multi":false,"dup":false,"expl":"프로이트의 죽음의 본능은 공격 본능과 가깝다. 삶의 본능(리비도)은 성·사랑의 본능이다.","src":"E"},{"id":"E2019-H-27-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":27,"stem":"프로이트(Freud)의 정신역동이론에 의하면 오이디푸스 콤플렉스를 해결하는 길은?","opts":["억압","퇴행","반동형성","동일시"],"ans":[4],"multi":false,"dup":true,"expl":"오이디푸스 콤플렉스는 동성 부모를 동일시하면서 해결된다. 억압·퇴행·반동형성은 불안에 대처하는 자아의 방어기제다.","src":"E"},{"id":"E2019-H-28-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":28,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["맥클리랜드(McClelland) - 이상적 자아","로저스(Rogers) - 자기효능감","셀리그만(Seligman) - 학습된 무력감","컨버그(Kernberg) - 성취동기"],"ans":[3],"multi":false,"dup":true,"expl":"셀리그만은 학습된 무력감, 맥클리랜드는 성취동기, 로저스는 자기개념·자기실현과 연결된다. ③만 바른 연결이다.","src":"E"},{"id":"E2019-H-29-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":29,"stem":"매슬로우(Maslow)의 욕구위계설에서 생리적 욕구, 안전 욕구, 애정과 소속 욕구, 자존 욕구를 총괄하여 무슨 욕구라고 하는가?","opts":["실존욕구","결핍욕구","성장욕구","자아실현 욕구"],"ans":[2],"multi":false,"dup":true,"expl":"생리·안전·애정과 소속·자존 욕구를 묶어 결핍욕구라 한다.","src":"E"},{"id":"E2019-H-30-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":30,"stem":"위급한 상황이 발생했을 때 몸으로 하여금 ‘싸움 혹은 도망’(fight or flight)하도록 준비시키는 호르몬으로서 부신에서 방출되는 것은?","opts":["코티졸","도파민","에스트로겐","테스토스테론"],"ans":[1],"multi":false,"dup":false,"expl":"위급 상황에서 부신에서 분비되어 싸움-도망 반응을 준비시키는 호르몬은 코티졸(당질코르티코이드)이다.","src":"E"},{"id":"E2019-H-31-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":31,"stem":"자아정체성의 발달수준 중 자아에 대한 회의와 불안정을 경험하고 있으나 적극적으로 자아를 탐색하고 정체성 확립을 위해 노력하고 있는 상태를 특히 무엇이라고 하는가?","opts":["정체성 유예","정체성 혼미","정체성 성취","정체성 조기완료"],"ans":[1],"multi":false,"dup":true,"expl":"위기를 겪고 적극적으로 탐색하는 중인 상태는 정체성 유예다.","src":"E"},{"id":"E2019-H-32-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":32,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다"],"ans":[3],"multi":false,"dup":true,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2019-H-33-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":33,"stem":"공격성에 대한 다음 설명 중 인지주의적 관점과 가장 가까운 것은?","opts":["공격성은 선천적으로 가지고 태어나는 것이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다","공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다"],"ans":[4],"multi":false,"dup":false,"expl":"상대의 공격을 적대적으로 해석하는 것이 공격성의 원인이라는 것은 인지주의적 관점이다.","src":"E"},{"id":"E2019-H-34-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":34,"stem":"다음 중 자기통제력의 발달과 가장 거리가 먼 것은?","opts":["만족지연능력","외적 통제사고","충동억제능력","내적 통제사고"],"ans":[2],"multi":false,"dup":true,"expl":"자기통제력은 만족지연·충동억제·내적 통제와 관련되며 외적 통제사고는 거리가 멀다.","src":"E"},{"id":"E2019-H-35-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":35,"stem":"아동이 도덕적 개념을 이해하고 자율적인 도덕적 판단을 하기 위해서는 이에 상응하는 인지적 발달이 이루어져야 한다고 주장하는 대표적인 학자는?","opts":["프로이트(Freud)","에릭슨(Erikson)","반두라(Bandura)","피아제(Piaget)"],"ans":[4],"multi":false,"dup":true,"expl":"도덕적 개념의 이해와 자율적 도덕 판단에 인지발달이 선행해야 한다고 본 대표적 학자는 피아제다.","src":"E"},{"id":"E2019-H-36-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":36,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 전(前) 인습적 수준의 도덕성 발달단계에 해당하는 것은?","opts":["도구적 상대주의 지향","사회적 계약 지향","대인간 조화 지향","법과 질서 지향"],"ans":[1],"multi":false,"dup":true,"expl":"전인습적 수준에는 처벌과 복종 지향, 도구적 상대주의 지향이 속한다.","src":"E"},{"id":"E2019-H-37-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":37,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결되어 있는 것은?","opts":["합리적 모험가 - 올포트(Allport)","성숙한 인격 - 매슬로우(Maslow)","생산적인 사람 - 프롬(Fromm)","자아실현인 - 아들러(Adler)"],"ans":[3],"multi":false,"dup":true,"expl":"생산적인 사람-프롬이 바른 연결이다. 매슬로는 자아실현인, 올포트는 성숙한 인격, 아들러는 사회적 관심이다.","src":"E"},{"id":"E2019-H-38-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":38,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 볼 수 있는 것은?","opts":["사회문화적 구속에 동조하거나 수동적으로 반응한다","자신의 미래는 자기 자신에 의해 좌우된다고 확신한다","자신의 모든 경험에 대해 방어적이다","자신의 행동에 대해 타인에게 인정받는 데 연연해 한다"],"ans":[2],"multi":false,"dup":true,"expl":"충분히 기능하는 사람은 자기 삶의 주체로서 미래를 스스로 결정한다고 확신한다. 동조·방어·타인 인정에의 연연은 그 반대 특성이다.","src":"E"},{"id":"E2019-H-39-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":39,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["관습적 유형 - 기술자, 정비사, 의료기사","실제적 유형 - 정치가, 영업사원, 광고업자","사업가적 유형 - 회계사, 은행원, 사무원","사회적 유형 - 교사, 간호사, 종교지도자"],"ans":[4],"multi":false,"dup":true,"expl":"사회적 유형-교사·간호사·종교지도자가 바른 연결이다. 실제적은 기술자·정비사, 관습적은 회계사·은행원, 사업가적은 정치가·영업사원이다.","src":"E"},{"id":"E2019-H-40-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":40,"stem":"진로지도와 관련된 이론 중 가장 오래된 것으로서, 개인과 직업의 특성을 진단하고 분석하여 연결시켜 주는 것을 요체로 하고 있는 이론은?","opts":["의사결정이론","사회이론","특성이론","심리이론"],"ans":[3],"multi":false,"dup":true,"expl":"개인과 직업의 특성을 진단해 연결하는 가장 오래된 진로지도 이론은 특성이론(특성-요인 이론)이다.","src":"E"},{"id":"E2019-H-41-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":41,"stem":"표준화 심리검사에 대한 다음 설명 중 적절하지 않은 것은?","opts":["표준화란 검사결과의 절대적 비교를 위한 기준을 설정하는 것을 의미한다","표준화 검사란 표준화된 조건하에서 피검사자들의 심리적 특성들을 측정하기 위한 도구를 말한다","표준화 검사의 제작과정은 대규모적이며 전문적이다","담임교사가 자기 반 학생의 수업태도를 알아보기 위하여 제작한 간단한 설문지는 표준화 검사라고 할 수 없다"],"ans":[1],"multi":false,"dup":false,"expl":"표준화는 검사조건과 해석 기준의 일관성을 뜻하며, 결과의 절대적 비교 기준을 설정한다는 설명은 적절하지 않다.","src":"E"},{"id":"E2019-H-42-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":42,"stem":"다음 중 그 측정하고자 하는 내용이 다른 한 가지 검사는?","opts":["MMPI","Army-β","CPI","TAT"],"ans":[2],"multi":false,"dup":true,"expl":"Army-β(군대베타)는 지능검사이고, MMPI·CPI·TAT는 성격검사다.","src":"E"},{"id":"E2019-H-43-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":43,"stem":"상담에서 가장 중요한 상담자와 내담자간의 신뢰와 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","부정적 전이","주종관계"],"ans":[2],"multi":false,"dup":true,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다. 역전이·부정적 전이는 상담자의 감정 반응이다.","src":"E"},{"id":"E2019-H-44-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":44,"stem":"다음 중 정신분석이론에서 가정하고 있는 것은?","opts":["인간행동의 원인은 우리 외부에 있다","인간은 끊임없이 갈등하는 존재다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다","인간은 합리적이고 건설적이며 합목적적인 존재이다"],"ans":[2],"multi":false,"dup":false,"expl":"정신분석이론은 인간을 끊임없이 갈등하는 존재로 가정한다.","src":"E"},{"id":"E2019-H-45-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":45,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 D는 무엇을 의미하는가?","opts":["결과","신념","선행 사건","논리적 반박"],"ans":[4],"multi":false,"dup":true,"expl":"ABCD기법에서 D는 논리적 반박(dispute)이다.","src":"E"},{"id":"E2019-H-46-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":46,"stem":"내담자의 표현 중에 불분명하고 불확실한 부분이나 애매모호해서 혼란을 주는 부분을 정밀하게 확인하기 위해서 사용하는 기법은?","opts":["공감적 이해","즉시성","자아개방","구체화"],"ans":[4],"multi":false,"dup":false,"expl":"내담자의 불분명하고 애매한 표현을 정밀하게 확인하는 기법은 구체화다.","src":"E"},{"id":"E2019-H-47-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":47,"stem":"행동수정의 진행과정에서 강화를 주어야 할 행동과 주지 말아야 할 행동을 구분해주는 기준이 되는 것은?","opts":["기초선 수준","정적 강화자극","1차 강화자극","2차 강화자극"],"ans":[1],"multi":false,"dup":true,"expl":"강화 대상 행동을 가려내는 기준은 기초선 수준이다.","src":"E"},{"id":"E2019-H-48-0","set":"2019-하계","year":2019,"kind":"하계","grade":"전학년","no":48,"stem":"내담자의 비합리적인 신념을 논리적으로 반박하는 과정에서 사용하는 기법 중 이미 일어난 사태의 원인에 대해 새롭게 생각해보도록 하는 기법을 특히 무엇이라고 하는가?","opts":["객관화 기법","심상활용법","자기행동 관찰법","재귀인 훈련"],"ans":[4],"multi":false,"dup":false,"expl":"이미 일어난 사태의 se,"dup":false,"expl":"학교의 발생은 문자가 발명되고 문자로 기록·축적된 지식의 양이 많아진 것과 깊은 관련이 있으며, 지식을 효과적으로 가르칠 필요에서 지배계층의 자녀를 모아 가르친 데서 비롯되었다.","src":"L"},{"id":"L01-10","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":10,"stem":"19세기 학교교육의 변화로 강의록이 제시한 것은?","opts":["학교교육의 의무교육화와 국가적 사업으로의 발전","학교교육의 완전한 폐지","가정교육으로의 전면적 회귀","평생교육 체제로의 전환"],"ans":[1],"multi":false,"dup":false,"expl":"19세기에는 학교교육이 의무교육화되고 국가적 사업으로 발전했으며, 18세기 이후 시민계급의 형성과 함께 교육의 대중화가 급격히 진행되었다.","src":"L"},{"id":"L01-11","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":11,"stem":"20세기 후반 일리치(Illich)와 라이머(Reimer)가 제기한 학교교육 비판의 핵심은?","opts":["학교교육이 지나치게 다양한 선택을 제공한다","제도화된 학교교육이 몰개성화와 인간소외를 심화시킨다","학교교육이 지식의 양을 너무 적게 다룬다","학교교육이 국가 재정을 절약한다"],"ans":[2],"multi":false,"dup":false,"expl":"이들은 제도화된 학교교육이 복잡·다원화된 사회가 요구하는 인간교육을 효율적으로 하지 못하고, 권위적·획일적 교육으로 몰개성화와 인간소외를 심화시킨다고 비판했다.","src":"L"},{"id":"L01-12","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":12,"stem":"평생교육이라는 용어를 최초로 제시한 사람과 그가 강조한 내용의 연결로 가장 옳은 것은?","opts":["듀이 - 경험의 재구성","렝그랑(Lengrand) - 학교교육 중심 체제의 탈피","일리치 - 탈학교교육","마리탱 - 인간 철학의 정립"],"ans":[2],"multi":false,"dup":false,"expl":"평생교육은 프랑스의 성인교육학자 렝그랑이 최초로 제시했으며, 학교교육 중심 체제를 탈피해 일생에 걸친 다양한 교육기회와 학습경험을 균형 있게 추구하는 것을 뜻한다.","src":"L"},{"id":"L01-13","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":13,"stem":"현대에 평생교육이 강조된 배경으로 보기 어려운 것은?","opts":["지식과 기술의 폭발적 증가와 노후화","평균수명과 여가시간의 증대, 삶의 질 향상 욕구","학교교육의 한계와 역기능에 대한 비판","학교교육이 모든 학습수요를 충족하게 된 것"],"ans":[4],"multi":false,"dup":false,"expl":"평생교육은 학교교육만으로는 급변하는 사회의 학습수요를 충족할 수 없다는 인식에서 강조되었다.","src":"L"},{"id":"L01-14","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":14,"stem":"인간의 품성에 대한 이해에서 ‘인간은 본질적으로 백지와 같은 존재’라고 본 학자로 옳은 것은?","opts":["맹자","순자","고자","루소"],"ans":[3],"multi":false,"dup":false,"expl":"강의록은 인간을 본질적으로 선한 존재로 본 맹자·루소, 악한 존재로 본 순자·아우구스티누스·칼뱅, 백지로 본 고자·로크를 제시한다.","src":"L"},{"id":"L01-15","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":15,"stem":"철학·종교적 인간관에 대한 설명으로 가장 옳은 것은?","opts":["경험적 관찰과 수량화만을 인간 이해의 방법으로 인정한다","인간이 무엇이어야 하며 어떻게 살아야 하는가에 대한 당위와 가치판단에 입각해 인간을 이해한다","인간의 행동을 인과론적 법칙으로만 설명한다","인간의 궁극적 존재 의미에 대한 질문을 무의미하다고 본다"],"ans":[2],"multi":false,"dup":false,"expl":"철학·종교적 인간관은 당위와 가치판단에 입각해 인간을 설명하는 반면, 과학적 인간관은 경험적 관찰·측정과 인과론적 설명을 중시한다.","src":"L"},{"id":"L01-16","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":16,"stem":"과학적 인간관이 교육에 미친 영향으로 강의록이 지적한 문제점으로 옳지 않은 것은?","opts":["교육을 통해 길러낼 인간에 대한 규범적 논의가 퇴조했다","인간이 목적보다 수단으로 간주되는 경향이 심화되었다","공학적·행동주의적 교육관이 득세했다","학습자의 자율성과 가치판단에 대한 논의가 크게 확대되었다"],"ans":[4],"multi":false,"dup":false,"expl":"과학적 인간관은 규범적 논의를 퇴조시키고 공학적·행동주의적 교육관을 득세하게 했으며, 오히려 가치판단에 대한 논의를 배제했다.","src":"L"},{"id":"L01-17","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":17,"stem":"후기 현대철학의 인식론적 관점에 대한 설명으로 옳지 않은 것은?","opts":["절대적·선험적인 인식의 기초가 존재하지 않는다고 본다(반정초주의)","인간의 인식과 지식은 인간의 관심·신념·가치관에 기초한 해석의 결과라고 본다","진리는 다원적이고 국지적이며 상대적이라고 본다","객관적이고 보편적인 진리를 누구나 동일하게 파악할 수 있다고 본다"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 순수하고 절대적이며 객관적인 지식이나 진리를 부정하고, 진리의 다원성·국지성·상대성을 강조한다.","src":"L"},{"id":"L01-18","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":18,"stem":"후기 현대철학이 말하는 인간 이해에 해당하지 않는 것은?","opts":["계속적인 경험에 의해 변화·발전하는 주체적·자기형성적 존재","사회와 문화의 영향을 배제할 수 없는 사회적·역사적 존재","가치선택과 판단을 비판적으로 음미하는 규범적·합리적 존재","자연이나 신에 의해 주어진 불변의 본질을 지닌 고정적 존재"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 인간의 변하지 않는 본질에 대한 가정을 부인하며, 자기형성적·사회적 역사적·규범적 합리적 존재로 인간을 이해한다.","src":"L"},{"id":"L01-19","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":19,"stem":"교육의 개념적 요소에 대한 설명으로 가장 옳은 것은?","opts":["우연적이고 자연 발생적인 변화도 교육에 포함된다","교육은 전인적 인간 변화를 의도적으로 추구하되 바람직한 방향의 변화를 지향한다","교육의 수단과 방법은 목표 달성만 가능하면 정당성과 무관하다","교육은 결과적으로 이루어진 변화만으로 판단해야 한다"],"ans":[2],"multi":false,"dup":false,"expl":"교육은 의도성, 전인적 인간 변화에 대한 관심, 가치 지향성, 인간존엄성 존중, 의미 충족과 자아형성감, 교육자의 자율성과 도덕적 책임이라는 개념 요소를 지닌다.","src":"L"},{"id":"L01-20","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":20,"stem":"강의록이 제시한 교육의 3요소로 바르게 묶인 것은?","opts":["교육자, 학습자, 교육내용","교사, 학부모, 행정가","목표, 평가, 피드백","학교, 사회, 국가"],"ans":[1],"multi":false,"dup":false,"expl":"교육의 3요소는 교육자(교사·부모·사회·국가 등), 학습자, 교육내용(교재 등)이다.","src":"L"},{"id":"L02-01","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":21,"stem":"강의록이 정의한 학습의 의미로 가장 옳은 것은?","opts":["일시적으로 나타났다가 사라지는 행동의 변화","외현적 행동뿐 아니라 지식·신념·가치관 등 내재적 행동까지 포함하는 비교적 지속적인 행동의 변화","선천적으로 타고난 반사행동의 발현","환경과 무관하게 개인 내부에서 저절로 일어나는 변화"],"ans":[2],"multi":false,"dup":false,"expl":"학습은 눈에 보이는 외현적 행동과 지식·신념·가치관 같은 내재적 행동을 모두 포함하며, 일시적이지 않고 비교적 지속적인 행동의 변화다.","src":"L"},{"id":"L02-02","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":22,"stem":"강의록이 제시한 학습이론과 대표자를 연결한 것으로 옳지 않은 것은?","opts":["행동주의 학습이론 - 파블로프, 손다이크, 스키너","인지주의 학습이론 - 베르타이머, 쾰러, 레빈","사회학습이론 - 반두라","인본주의 학습이론 - 왓슨, 스키너"],"ans":[4],"multi":false,"dup":false,"expl":"인본주의 학습이론의 대표자는 매슬로와 로저스이며, 왓슨과 스키너는 행동주의 학습이론의 대표자다.","src":"L"},{"id":"L02-03","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":23,"stem":"행동주의 심리학의 창시자와 그가 주장한 연구 방법으로 옳은 것은?","opts":["왓슨 - 마음의 주관적 관찰 대신 관찰·측정 가능한 행동만을 연구대상으로 삼았다","쾰러 - 내성법으로 의식의 구조를 분석했다","반두라 - 동물의 소화액 분비 실험을 했다","레빈 - 통찰 실험으로 학습을 설명했다"],"ans":[1],"multi":false,"dup":false,"expl":"행동주의는 왓슨이 창시했으며, 마음의 주관적 관찰은 신뢰할 수 없다고 보고 직접 관찰·측정할 수 있는 행동만을 과학적 연구대상으로 삼았다.","src":"L"},{"id":"L02-04","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":24,"stem":"행동주의 학습이론의 기본 전제로 가장 옳은 것은?","opts":["인간행동의 원인은 개인 내부에 있다","인간행동의 원인은 바깥 세상에 있으며 행동은 그 맥락 속에서 의미를 지닌다","부적응적 행동은 선천적으로 결정된다","행동은 맥락과 무관하게 동일한 의미를 지닌다"],"ans":[2],"multi":false,"dup":false,"expl":"행동주의는 적응적·부적응적 행동 모두 학습된 것으로 보고, 행동의 원인을 개인 내부가 아니라 외부 환경(맥락)에서 찾는다.","src":"L"},{"id":"L02-05","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":25,"stem":"고전적 조건형성 이론의 탄생 배경으로 옳은 것은?","opts":["손다이크가 고양이 실험에서 시행착오 학습을 발견한 것","파블로프가 개의 소화액 분비 실험 중 원래 반응을 일으키지 못하던 자극이 반응을 일으키는 것을 관찰한 것","스키너가 스키너 상자를 제작한 것","쾰러가 침팬지의 통찰을 관찰한 것"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성은 러시아 생리학자 파블로프가 개의 소화액 분비 실험 도중 중성자극이 반응을 일으키는 것을 관찰하면서 탄생했다.","src":"L"},{"id":"L02-06","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":26,"stem":"고전적 조건형성에서 소거된 행동에 대한 설명으로 가장 옳은 것은?","opts":["완전히 사라져 다시는 나타나지 않는다","일시적으로 억압되어 있을 뿐 자발적 회복이나 신속한 재조건형성으로 다시 나타날 수 있다","다른 자극에 대해 일반화되어 나타난다","처음부터 학습되지 않았던 행동이다"],"ans":[2],"multi":false,"dup":false,"expl":"소거된 행동은 완전히 사라진 것이 아니라 일시적으로 억압된 것이며, 자발적 회복이나 신속한 재조건형성을 통해 다시 나타난다.","src":"L"},{"id":"L02-07","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":27,"stem":"고전적 조건형성이 주로 설명하는 반응의 성격으로 옳은 것은?","opts":["수의적이고 의도적인 행동","무의식적·무의도적·불수의적 반응과 정서적 반응","복잡한 문제해결 행동","언어적 추론 행동"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성은 무의식적·무의도적·불수의적 반응과 정서적 반응을 설명하며, TV 광고가 대표적 예로 제시된다.","src":"L"},{"id":"L02-08","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":28,"stem":"조작적 조건형성과 고전적 조건형성의 차이로 가장 옳은 것은?","opts":["조작적 조건형성은 불수의적 행동, 고전적 조건형성은 수의적 행동의 학습기제다","조작적 조건형성은 수의적 행동, 고전적 조건형성은 불수의적 행동의 학습기제다","두 이론은 동일한 자극-반응 모형을 사용한다","조작적 조건형성은 정서 반응만을 설명한다"],"ans":[2],"multi":false,"dup":false,"expl":"강의록은 고전적 조건형성을 불수의적 행동의 학습 기제, 조작적 조건형성을 수의적 행동의 학습 기제로 구분한다.","src":"L"},{"id":"L02-09","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":29,"stem":"손다이크의 도구적 조건형성에서 ‘도구적’이라는 말이 붙은 이유로 옳은 것은?","opts":["성공적인 반응이 성공적인 결과를 가져다주는 도구로 사용되었기 때문","실험 도구를 직접 제작했기 때문","동물을 도구로 사용했기 때문","학습을 통찰로 설명했기 때문"],"ans":[1],"multi":false,"dup":false,"expl":"성공적인 반응이 성공적인 결과를 얻는 도구로 사용되었다는 점에서 도구적 조건형성이라 부르며, 성공까지 무수한 시행착오를 거치는 학습을 시행착오적 학습이라 한다.","src":"L"},{"id":"L02-10","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":30,"stem":"강의록이 제시한 손다이크의 학습의 법칙 세 가
