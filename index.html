kind":"기말","grade":"1학년","no":7,"stem":"어떤 어린 아이가 개, 고양이, 토끼를 보고 모두 “멍멍”이라고 하는 것과 관련이 있는 것은?","opts":["자극 일반화","재(再)조건형성","자발적 회복","고차적 조건형성"],"ans":[1],"multi":false,"dup":false,"expl":"개·고양이·토끼를 모두 “멍멍”이라 부르는 것은 유사한 자극에 같은 반응을 보이는 자극 일반화다.","src":"E"},{"id":"E2016-2-07-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":7,"stem":"현대사회에서 평생교육이 필요한 이유로 가장 타당한 것은?","opts":["조직의 물적, 재정적 자원의 중요성 대두","학교교육의 유용성 증가","과학기술의 발달로 인한 기술우위 사회의 대두","평생직장 개념의 확대로 인한 비(非)경쟁사회 도래"],"ans":[3],"multi":false,"dup":true,"expl":"평생교육의 필요 이유는 지식·기술의 폭발적 증가와 노후화, 기술우위 사회의 도래다.","src":"E"},{"id":"E2016-2-08-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":8,"stem":"공부할 마음이 없는 아이에게 아무리 좋은 학습자료를 갖다주어도 학습의 효과를 보기 어려운 것과 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","유사의 법칙"],"ans":[3],"multi":false,"dup":false,"expl":"학습할 준비가 되어 있지 않으면 효과가 없다는 것은 손다이크의 준비성의 법칙이다.","src":"E"},{"id":"E2016-2-08-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":8,"stem":"고전적 조건형성이론에서 개는 조건화 전에는 종소리에 대해서 침을 흘리지 않는다. 이와 같이 유기체로부터 어떠한 반응도 이끌어내지 못하는 자극을 무엇이라고 하는가?","opts":["강화 자극","조건 자극","중성 자극","무조건 자극"],"ans":[3],"multi":false,"dup":true,"expl":"조건화 전 아무 반응도 이끌어내지 못하는 자극은 중성자극이다.","src":"E"},{"id":"E2016-2-09-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":9,"stem":"강화와 벌을 구분하는 가장 중요한 기준은?","opts":["행동속도의 변화","행동유형의 변화","행동장소의 변화","행동빈도의 변화"],"ans":[4],"multi":false,"dup":false,"expl":"강화와 벌은 행동빈도의 변화(증가/감소)로 구분한다.","src":"E"},{"id":"E2016-2-09-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":9,"stem":"다음 중 일벌백계(一罰百戒)와 가장 관련이 깊은 것은?","opts":["소거","부분 강화","자기 처벌","대리 처벌"],"ans":[4],"multi":false,"dup":false,"expl":"한 사람이 받은 벌을 다른 사람이 관찰하고 같은 행동을 하지 않게 되는 것은 대리 처벌(대리적 벌)이다. 소거·부분 강화는 벌의 전이와 다른 학습 원리이고, 자기 처벌은 스스로에게 벌을 주는 것이다.","src":"E"},{"id":"E2016-2-10-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":10,"stem":"카지노에 있는 도박기계인 슬로트머신에 적용된 강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[4],"multi":false,"dup":true,"expl":"슬로트머신은 예측할 수 없는 변동비율 강화계획을 따른다.","src":"E"},{"id":"E2016-2-10-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":10,"stem":"공부는 거의 하지 않고 하루 종일 컴퓨터 게임만 하는 아이의 공부하는 행동을 늘리기 위하여, 일정 시간의 공부를 하면 아이가 좋아하는 컴퓨터 게임을 일정 시간동안 할 수 있도록 해주는 것과 관련이 깊은 행동수정 방법은?","opts":["토큰 강화","범람법","프리맥의 원리","소거의 원리"],"ans":[3],"multi":false,"dup":true,"expl":"빈도가 높은 행동(게임)을 강화물로 삼아 빈도가 낮은 행동(공부)을 늘리는 것은 프리맥의 원리다. 범람법은 불안 치료 기법, 토큰 강화는 상징적 강화물을 쓰는 방법, 소거는 강화를 중단하는 것이다.","src":"E"},{"id":"E2016-2-11-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":11,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재조건형성","빠른 자극 변별","빈번한 자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":false,"expl":"소거 후 다시 조건형성을 하면 처음보다 훨씬 적은 시행으로 조건반응이 되살아나는데, 이를 신속한 재조건형성이라 한다. 이는 소거가 학습을 완전히 지운 것이 아니라 일시적으로 억압했음을 보여 준다. 자발적 회복도 같은 증거이지만 이 문항의 보기에는 없다.","src":"E"},{"id":"E2016-2-11-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":11,"stem":"어떤 학생이 시간당 2,000원을 받기로 하고 편의점에서 아르바이트를 하고 있다. 이와 가장 관련이 깊은 강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[1],"multi":false,"dup":false,"expl":"시간당 급여를 받는 아르바이트는 시간 간격이 고정된 고정간격 강화계획이다.","src":"E"},{"id":"E2016-2-12-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":12,"stem":"피아제(Piaget)의 인지발달단계 중 어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 능력을 처음 획득하게 되는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[1],"multi":false,"dup":false,"expl":"눈앞에서 사라진 장난감이 계속 존재한다는 이해, 즉 대상영속성은 감각운동기에 획득된다.","src":"E"},{"id":"E2016-2-12-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":12,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":true,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이며, 행동이 안정된 뒤에는 간헐적(부분) 강화로 옮겨 간다. 자기 강화·대리 강화는 초기 습득 단계의 강화 방법이 아니다.","src":"E"},{"id":"E2016-2-13-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":13,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 4∼5세경에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝지어진 것은?","opts":["근면성-열등감","자아정체성-역할혼돈","자율성-수치감","주도성-죄책감"],"ans":[4],"multi":false,"dup":false,"expl":"4~5세의 과업은 주도성 대 죄책감이다. 근면성-열등감은 아동기, 자율성-수치감은 2~3세다.","src":"E"},{"id":"E2016-2-13-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":13,"stem":"피아제(Piaget)의 인지발달단계 중 어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 능력을 처음 획득하게 되는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[1],"multi":false,"dup":true,"expl":"눈앞에서 사라진 장난감이 계속 존재한다는 이해, 즉 대상영속성은 감각운동기에 획득된다.","src":"E"},{"id":"E2016-2-14-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":14,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 삼원지능이론","서스턴(Thurstone) - 7가지 기초정신능력","길포드(Guilford) - 일반요인, 특수요인","가드너(Gardner) - 유동성 지능, 결정성 지능"],"ans":[2],"multi":false,"dup":true,"expl":"서스턴-7가지 기초정신능력이 바른 연결이다. 커텔은 유동성·결정성, 길포드는 요소설, 가드너는 다면적 지능이다.","src":"E"},{"id":"E2016-2-14-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":14,"stem":"예습과 복습은 학습에 있어서 매우 중요하다. 이와 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["유사의 법칙","효과의 법칙","준비성의 법칙","연습의 법칙"],"ans":[4],"multi":false,"dup":true,"expl":"예습·복습처럼 반복을 통해 학습이 강화된다는 것은 연습의 법칙이다.","src":"E"},{"id":"E2016-2-15-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":15,"stem":"가드너(Gardner)의 다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","논리-수학 지능","대인간 지능","공간 지능"],"ans":[3],"multi":false,"dup":false,"expl":"가드너의 다면적 지능 중 감성지능·사회적 지능과 가장 관련이 깊은 것은 대인간 지능이다.","src":"E"},{"id":"E2016-2-15-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":15,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 각 단계별로 성취해야 할 긍정적인 과업이 발달 순서대로 나열된 것은?","opts":["신뢰감 → 자율성 → 근면성 → 주도성","자율성 → 주도성 → 근면성 → 자아정체성","주도성 → 근면성 → 친밀성 → 자아정체성","신뢰감 → 주도성 → 자율성 → 친밀성"],"ans":[2],"multi":false,"dup":false,"expl":"에릭슨의 발달 순서는 신뢰감→자율성→주도성→근면성→자아정체성→친밀성→생산성→통합성이다. ③만 이 순서에 맞다.","src":"E"},{"id":"E2016-2-16-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":16,"stem":"다음 중 유동성 지능에 해당하는 것은?","opts":["어휘이해력","언어유추능력","일반 지식","수리력"],"ans":[2],"multi":false,"dup":true,"expl":"유동성 지능은 경험·교육과 무관하게 새 상황에 적응하는 능력으로 언어유추·공간지각 등이 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2016-2-16-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":16,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["논리적 추론과 같은 작업수행과정은 장기기억에 해당된다","단기기억은 시연(試演)에 의해 지속시간이 증대될 수 있다","감각기억의 지속시간은 보통 20～30초 정도이다","작업기억의 용량은 무의미한 자료의 경우 7개 정도이다"],"ans":[2,4],"multi":true,"dup":false,"expl":"단기기억은 시연으로 지속시간이 늘어나므로 ②가 옳고, 작업기억의 용량도 무의미한 자료에서는 7개 정도로 보아 ④도 옳다. 이 문항은 정답표에 ②·④ 복수정답으로 표기되어 있다. 감각기억은 1초 이내이고 논리적 추론은 작업기억에 해당하므로 ①·③은 틀리다.","src":"E"},{"id":"E2016-2-17-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":17,"stem":"창의력에 관한 다음 설명 중 정신분석학적 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력을 구성하는 기본 능력들은 지필검사로 측정할 수 있다","창의력은 확산적 사고와 밀접한 관련이 있다","창의력은 하늘이 부여한 것이다"],"ans":[1],"multi":false,"dup":false,"expl":"창의적 활동을 승화작용으로 보는 것은 정신분석학적 관점이다.","src":"E"},{"id":"E2016-2-17-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":17,"stem":"인간의 기억과정에서 컴퓨터의 중앙통제기능, 즉 CPU에 해당하는 개념은?","opts":["감각기억","장기기억","작업기억","동작기억"],"ans":[3],"multi":false,"dup":false,"expl":"작업기억은 컴퓨터의 CPU처럼 정보를 조작·통제하는 중앙통제 기능을 한다.","src":"E"},{"id":"E2016-2-18-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":18,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["감각기억은 시연에 의해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 작업기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[3],"multi":false,"dup":false,"expl":"논리적 추론처럼 정보를 조작·처리하는 과정은 작업기억에 해당한다. 시연으로 지속시간이 늘어나는 것은 단기기억, 감각기억은 1초 이내이며, 7±2는 단기(작업)기억의 용량이다.","src":"E"},{"id":"E2016-2-18-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":18,"stem":"커텔(Cattell)에 의하면 경험과 교육에 의해 형성되는 지적인 능력을 무엇이라 하는가?","opts":["결정성 지능","유동성 지능","일반 지능","특수 지능"],"ans":[1],"multi":false,"dup":false,"expl":"경험과 교육을 통해 형성되는 지능은 결정성 지능이다.","src":"E"},{"id":"E2016-2-19-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":19,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 가장 거리가 먼 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","아동용보다 성인용 검사가 먼저 만들어졌다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는데 편차 I.Q.를 적용하였다"],"ans":[3],"multi":false,"dup":false,"expl":"웩슬러 검사는 언어성·동작성 IQ를 산출하고 편차 IQ로 지능지수를 계산하며, 성인용(WAIS)이 아동용(WISC)보다 먼저 만들어졌다. 정신연령은 비네 검사의 개념이므로 가장 거리가 멀다.","src":"E"},{"id":"E2016-2-19-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":19,"stem":"가드너(Gardner)의 다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","공간 지능","대인간 지능","자연관찰 지능"],"ans":[3],"multi":false,"dup":false,"expl":"감성지능·사회적 지능과 관련이 깊은 것은 대인간 지능이다.","src":"E"},{"id":"E2016-2-20-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":20,"stem":"망각의 원인에 관한 다음 설명 중 소멸이론에 관한 설명은?","opts":["순행성 간섭과 역행성 간섭은 그 좋은 예이다","정신분석이론에 근거하고 있다","파지기간 중에 파지를 방해하는 외부적 영향 때문에 망각현상이 촉진된다","기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다"],"ans":[4],"multi":false,"dup":true,"expl":"소멸이론은 사용하지 않는 기억 흔적이 시간이 지나며 사라진다고 본다(간섭이론과 대비).","src":"E"},{"id":"E2016-2-20-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":20,"stem":"평균이 100이고 표준편차가 15인 지능검사에서 I.Q. 85∼100에 해당하는 정상인구의 비율은 정상분포곡선 하에서 어느 정도인가?","opts":["약 34%","약 50%","약 68%","약 95%"],"ans":[1],"multi":false,"dup":false,"expl":"정상분포에서 평균(100)에서 +1SD(115)까지는 전체의 약 34%다.","src":"E"},{"id":"E2016-2-21-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":21,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["삶의 본능 - 리비도(libido)","자아 - 일차 과정","원초아 - 현실 원리","초자아 - 이차 과정"],"ans":[1],"multi":false,"dup":false,"expl":"삶의 본능-리비도가 바른 연결이다. 자아는 현실원리·2차과정, 원초아는 쾌락원리·1차과정이다.","src":"E"},{"id":"E2016-2-21-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":21,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘삶의 본능’과 가장 거리가 먼 것은?","opts":["성적 본능","창조적 본능","사랑의 본능","공격 본능"],"ans":[4],"multi":false,"dup":true,"expl":"프로이트의 삶의 본능(리비도)은 성·사랑·창조 등 생명을 유지·확장하는 본능이다. 공격 본능은 죽음의 본능(타나토스)에 속한다.","src":"E"},{"id":"E2016-2-22-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":22,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 결핍욕구에 해당하는 것은?","opts":["실존 욕구","심미적 욕구","지적 욕구","안전 욕구"],"ans":[4],"multi":false,"dup":false,"expl":"결핍욕구는 생리·안전·소속·자존 욕구이며 지적·심미적·자아실현은 성장욕구다.","src":"E"},{"id":"E2016-2-22-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":22,"stem":"이상적인 공동사회의 목표를 달성하고자 타인과 협조․협력하고 그들을 위해 봉사하는 것으로서, 아들러(Adler)는 이것을 ‘심리적 건강의 척도’라고 주장하고 있다. 이것은?","opts":["이상적 자아","조망수용능력","사회적 관심","자아효능감"],"ans":[3],"multi":false,"dup":false,"expl":"아들러가 심리적 건강의 척도로 삼은 것은 사회적 관심이다.","src":"E"},{"id":"E2016-2-23-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":23,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["셀리그만(Seligman) - 성취동기","보울비(Bowlby) - 애착이론","페어번(Fairbairn) - 자기 효능감","맥클리랜드(McClelland) - 학습된 무력감"],"ans":[2],"multi":false,"dup":false,"expl":"보울비는 애착이론, 셀리그만은 학습된 무력감, 맥클리랜드는 성취동기와 연결된다. 따라서 ②만 바른 연결이다.","src":"E"},{"id":"E2016-2-23-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":23,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["맥클리랜드(McClelland) - 이상적 자아","로저스(Rogers) - 자기효능감","셀리그만(Seligman) - 학습된 무력감","컨버그(Kernberg) - 성취동기"],"ans":[3],"multi":false,"dup":true,"expl":"셀리그만은 학습된 무력감, 맥클리랜드는 성취동기, 로저스는 자기개념·자기실현과 연결된다. ③만 바른 연결이다.","src":"E"},{"id":"E2016-2-24-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":24,"stem":"자아정체성의 발달수준 중 자아정체성에 대한 위기도 경험하지 못한 채 마치 정체성을 확립한 것처럼 느끼는 상태를 특히 무엇이라고 하는가?","opts":["정체성 혼미","정체성 조기완료","정체성 유예","정체성 성취"],"ans":[2],"multi":false,"dup":true,"expl":"위기 없이 정체성을 확립한 듯 보이는 상태는 정체성 조기완료(조기성취)다.","src":"E"},{"id":"E2016-2-24-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":24,"stem":"청소년기 자아중심적 사고의 특징으로서, 자신이 타인들의 관심과 주의의 대상이 되고 있다는 믿음에서 비롯되는 심리상태를 특히 무엇이라고 하는가?","opts":["상상적 청중","자기충족적 예언","열등감","정체감 혼미"],"ans":[1],"multi":false,"dup":false,"expl":"자신이 타인의 관심과 주목의 대상이라고 믿는 청소년기 자아중심성은 상상적 청중이다.","src":"E"},{"id":"E2016-2-25-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":25,"stem":"어두운 밤길에 건널목에 빨간 불이 켜져 있었지만 오가는 차가 없어 길을 건너고도 아무렇지 않게 생각한 사람이 있었다. 이 사람은 콜버그(Kohlberg)의 도덕성 발달단계 중 어떤 단계에 있다고 판단할 수 있는가?","opts":["도구적 상대주의 지향","처벌과 복종 지향","대인간 조화 지향","법과 질서 지향"],"ans":[1],"multi":false,"dup":false,"expl":"벌이 두렵지 않고 차가 없으면 길을 건너도 된다고 판단한 것은 자신의 이익과 처벌 회피를 계산하는 도구적 상대주의 지향이다.","src":"E"},{"id":"E2016-2-25-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":25,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다"],"ans":[4],"multi":false,"dup":true,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2016-2-26-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":26,"stem":"다음 중 창의적이고 자발적인 사람의 특징과 가장 거리가 먼 것은?","opts":["사회문화적 구속에 동조 또는 수동적으로 반응하지 않는다","타인에게 인정받는 데 연연해하지 않는다","어떤 정해진 지침에 따라 삶을 살아나간다","새로운 도전이나 자극을 추구한다"],"ans":[3],"multi":false,"dup":false,"expl":"정해진 지침에 따라 사는 것은 창의적·자발적 사람의 특징과 가장 거리가 멀다.","src":"E"},{"id":"E2016-2-26-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":26,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 후인습적 수준(post-conventional period)의 발달단계에 해당하는 것은?","opts":["처벌과 복종 지향","법과 질서 지향","사회적 계약 지향","도구적 상대주의 지향"],"ans":[3],"multi":false,"dup":false,"expl":"후인습적 수준에는 사회적 계약 지향, 보편적 원리 지향이 속한다.","src":"E"},{"id":"E2016-2-27-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":27,"stem":"공격성에 대한 다음 설명 중 행동주의적 관점에 해당하는 것은?","opts":["공격성은 선천적으로 가지고 태어나는 것이다","공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다"],"ans":[2],"multi":false,"dup":false,"expl":"행동주의 관점은 공격적 행동에 대한 직접적 보상이 행동을 반복시킨다고 본다.","src":"E"},{"id":"E2016-2-27-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":27,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결되어 있는 것은?","opts":["생산적인 사람 - 아들러(Adler)","성숙한 인격 - 프롬(Fromm)","합리적 모험가 - 올포트(Allport)","자아실현인 - 매슬로우(Maslow)"],"ans":[4],"multi":false,"dup":false,"expl":"자아실현인-매슬로우가 바른 연결이다. 프롬은 생산적인 사람, 올포트는 성숙한 인격, 아들러는 사회적 관심이다.","src":"E"},{"id":"E2016-2-28-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":28,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 정치가, 영업사원, 광고업자","실제적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 회계사, 은행원, 사무원","탐구적 유형 - 기술자, 정비사, 의료기사"],"ans":[3],"multi":false,"dup":true,"expl":"관습적 유형-회계사·은행원·사무원이 바른 연결이다. 사회적은 교사·간호사, 실제적은 기술자·정비사, 탐구적은 과학자다.","src":"E"},{"id":"E2016-2-28-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":28,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["특성이론 - 겔라트(Gelatt)","의사결정이론 - 보딘(Bordin)","사회이론 - 윌리엄슨(Williamson)","심리이론 - 로우(Roe)"],"ans":[4],"multi":false,"dup":true,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2016-2-29-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":29,"stem":"수퍼(Super)의 직업의식 발달단계가 순서대로 나열된 것은?","opts":["탐색기→성장기→확립기→유지기→쇠퇴기","성장기→탐색기→확립기→유지기→쇠퇴기","탐색기→성장기→유지기→확립기→쇠퇴기","성장기→탐색기→유지기→확립기→쇠퇴기"],"ans":[2],"multi":false,"dup":true,"expl":"수퍼의 직업의식 발달단계는 성장기→탐색기→확립기→유지기→쇠퇴기 순이다.","src":"E"},{"id":"E2016-2-29-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":29,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사업가적 유형 - 정치가, 영업사원, 광고업자","관습적 유형 - 교사, 간호사, 종교지도자","사회적 유형 - 기술자, 정비사, 의료기사","실제적 유형 - 회계사, 은행원, 사무원"],"ans":[1],"multi":false,"dup":false,"expl":"사업가적 유형-정치가·영업사원·광고업자가 바른 연결이다. 관습적은 회계사·은행원, 사회적은 교사·간호사, 실제적은 기술자다.","src":"E"},{"id":"E2016-2-30-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":30,"stem":"진로지도와 관련된 이론 중, 인간은 자신의 이익을 극대화하고 손실을 최소화하는 방향으로 행동한다는 케인즈의 경제이론에 바탕을 두고 있는 이론은?","opts":["특성이론","사회이론","심리이론","의사결정이론"],"ans":[4],"multi":false,"dup":true,"expl":"이익 극대화·손실 최소화의 경제적 합리성을 바탕에 둔 진로지도 이론은 의사결정이론이다.","src":"E"},{"id":"E2016-2-30-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":30,"stem":"수퍼(Super)의 직업의식 발달단계가 순서대로 나열된 것은?","opts":["성장기→탐색기→유지기→확립기→쇠퇴기","성장기→탐색기→확립기→유지기→쇠퇴기","탐색기→성장기→유지기→확립기→쇠퇴기","탐색기→성장기→확립기→유지기→쇠퇴기"],"ans":[2],"multi":false,"dup":true,"expl":"수퍼의 직업의식 발달단계는 성장기→탐색기→확립기→유지기→쇠퇴기 순이다.","src":"E"},{"id":"E2016-2-31-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":31,"stem":"행동수정의 진행과정에서 강화를 주어야 할 행동과 주지 말아야 할 행동을 구분해주는 기준이 되는 것은?","opts":["기초선 수준","정적 강화자극","1차 강화자극","2차 강화자극"],"ans":[1],"multi":false,"dup":false,"expl":"강화 대상 행동을 가려내는 기준은 기초선 수준이다.","src":"E"},{"id":"E2016-2-31-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":31,"stem":"다음 중 그 측정하고자 하는 내용이 다른 한 가지 검사는?","opts":["MMPI","Army-β","CPI","TAT"],"ans":[2],"multi":false,"dup":true,"expl":"Army-β(군대베타)는 지능검사이고, MMPI·CPI·TAT는 성격검사다.","src":"E"},{"id":"E2016-2-32-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":32,"stem":"다음 중 인간중심상담이론에서 가정하고 있는 인간관에 해당하는 것은?","opts":["인간은 끊임없이 갈등하는 존재다","인간은 합리적이고 건설적이며 합목적적인 존재이다","자율적인 인간이란 없다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다"],"ans":[2],"multi":false,"dup":false,"expl":"인간중심상담의 인간관은 인간을 합리적·건설적·합목적적 존재로 보는 것이다.","src":"E"},{"id":"E2016-2-32-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":32,"stem":"다음 중 행동수정이론에서 가정하고 있는 것은?","opts":["인간행동의 원인은 우리 외부에 있다","인간은 끊임없이 갈등하는 존재다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다","인간은 합리적이고 건설적이며 합목적적인 존재이다"],"ans":[1],"multi":false,"dup":false,"expl":"행동수정이론은 인간행동의 원인이 외부 환경에 있다고 본다.","src":"E"},{"id":"E2016-2-33-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":33,"stem":"정신분석이론의 주요 상담기법들에 공통적으로 적용되는 기법은?","opts":["해석","강화","논리적 반박","귀인"],"ans":[1],"multi":false,"dup":true,"expl":"정신분석 상담의 여러 기법에 공통적으로 적용되는 것은 해석이다.","src":"E"},{"id":"E2016-2-33-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":33,"stem":"로저스(Rogers)의 인간중심 상담이론에서 말하는, 효율적인 상담관계를 형성하기 위하여 상담자가 제공하는 태도조건으로 보기 어려운 것은?","opts":["동정","일치","수용","공감적 이해"],"ans":[1],"multi":false,"dup":false,"expl":"로저스의 태도조건은 일치(진실성), 무조건적 수용, 공감적 이해이며 동정은 포함되지 않는다.","src":"E"},{"id":"E2016-2-34-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":34,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 D는 무엇을 의미하는가?","opts":["결과","신념","선행 사건","논리적 반박"],"ans":[4],"multi":false,"dup":false,"expl":"ABCD기법에서 D는 논리적 반박(dispute)이다.","src":"E"},{"id":"E2016-2-34-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":34,"stem":"교사들이 초등학교 저학년을 대상으로 학기 초에 스티커 붙이는 종이를 나누어주고, 착한 일을 했거나 발표를 잘 했거나 하면 스티커를 하나씩 상으로 주는 것과 관련된 행동수정기법은?","opts":["부적 강화","범람법","타임 아우트","토큰 강화"],"ans":[4],"multi":false,"dup":false,"expl":"스티커를 상으로 주어 바람직한 행동을 강화하는 것은 토큰 강화다.","src":"E"},{"id":"E2016-2-35-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":35,"stem":"직면은 내담자가 가지고 있는 불일치, 모순 등을 상담자가 기술해 주는 것이다. 직면시켜야 하는 상황으로 가장 적절치 않은 것은?","opts":["내담자의 기대와 현실적 가능성 간에 괴리가 있을 때","내담자의 말과 행동 간에 괴리가 있을 때","내담자의 생각과 상담자의 생각 간에 괴리가 있을 때","내담자의 언어적 메시지와 비언어적 메시지 간에 괴리가 있을 때"],"ans":[3],"multi":false,"dup":false,"expl":"직면은 내담자 내부의 불일치·모순을 다룬다. 내담자와 상담자의 생각이 다르다는 이유로 직면하는 것은 적절하지 않다.","src":"E"},{"id":"E2016-2-35-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":35,"stem":"합리-정의적 상담이론의 ABCD기법에서 현재의 정서적․행동적 결과의 진정한 원인이라고 엘리스(Ellis)가 주장하는 것은?","opts":["A","B","C","D"],"ans":[2],"multi":false,"dup":false,"expl":"엘리스는 정서·행동적 결과(C)의 원인을 신념체계(B)로 본다.","src":"E"},{"id":"E2016-H-01-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":1,"stem":"다음 중 후기 현대철학에서 강조되고 있는 인간관으로 보기에 적당한 것은?","opts":["자기형성적 존재","무규범적 존재","무의식적 존재","수동적 존재"],"ans":[1],"multi":false,"dup":true,"expl":"후기 현대철학은 스스로 자신을 형성해 가는 자기형성적 존재를 강조한다.","src":"E"},{"id":"E2016-H-02-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":2,"stem":"마리탱(Maritain)이 말하는 과학적 인간관과 가장 거리가 먼 것은?","opts":["인간행동에 대한 객관적이고 가치중립적인 설명이 가능하다","실증적 연구를 바탕으로 인간행동에 대한 예언과 통제가 가 능하다","인간은 물질세계의 한 부분으로서 인과론적 법칙에 따라 행동하는 존재이다","인간의 이성을 실현하는 것이 인간존재의 의의이자 최고의 행복이다"],"ans":[4],"multi":false,"dup":false,"expl":"과학적 인간관은 인간을 물질세계의 일부이자 실증적 연구의 대상으로 본다. 이성 실현을 최고 행복으로 보는 것은 철학·종교적 인간관이다.","src":"E"},{"id":"E2016-H-03-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":3,"stem":"공학적 교육관과 가장 거리가 먼 것은?","opts":["교육의 과정은 투입-가공-산출 모형으로 설명할 수 있다","교사는 교육목표의 설정이라는 가치판단의 주체이다","교수-학습의 효율성과 성취도의 평가가 강조된다","교사와 학생의 관계는 전달, 주입, 통제의 관계로 간주된다"],"ans":[2],"multi":false,"dup":true,"expl":"공학적 교육관은 교육을 투입-가공-산출의 체제로 보고 교사를 목표 달성을 위한 기술자·관리자로 본다. 따라서 교사가 교육목표 설정의 가치판단 주체라는 진술이 공학적 교육관과 가장 거리가 멀다. ①·③·④는 모두 공학적 교육관의 특징이다.","src":"E"},{"id":"E2016-H-04-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":4,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["행동주의 교육관 - 듀이(Dewey)","진보주의 교육관 - 부버(Buber)","자연주의 교육관 - 루소(Rousseau)","실존주의 교육관 - 스키너(Skinner)"],"ans":[3],"multi":false,"dup":true,"expl":"자연주의 교육관-루소가 바른 연결이다. 행동주의는 스키너, 진보주의는 듀이, 실존주의는 부버·틸리히와 연결된다.","src":"E"},{"id":"E2016-H-05-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":5,"stem":"학교교육에 대해 급진적인 비판을 가하고 있는 대표적 인물로서, 삶의 전 과정 속에서 교육이 제대로 이루어질 수 있도록 하기 위해서는 학교라는 교육기관을 없애야 한다는 “탈학교교육론”을 주장한 사람은?","opts":["피터스(Peters)","매슬로(Maslow)","렝그랑(Lengrand)","일리히(Illich)"],"ans":[4],"multi":false,"dup":true,"expl":"학교를 없애야 한다는 탈학교교육론은 일리치가 주장했다.","src":"E"},{"id":"E2016-H-06-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":6,"stem":"‘교육’이라는 말에 포함되어 있는 개념적 요소로 보기에 가장 적절하지 않은 것은?","opts":["전인적 인간변화에의 관심","의도적인 행동과정","가치중립성","인간존엄성의 존중"],"ans":[3],"multi":false,"dup":true,"expl":"교육은 의도적·가치지향적 활동으로 가치중립성을 개념 요소로 보기 어렵다.","src":"E"},{"id":"E2016-H-07-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":7,"stem":"다음 중 교육의 이차적 목적으로 보기에 가장 적당한 것은?","opts":["전인적 변화의 추구","개인의 잠재가능성의 실현","국가경제의 발전","성장 동기(being-need)의 충족"],"ans":[3],"multi":false,"dup":false,"expl":"교육의 이차적(외재적) 목적에는 국가경제 발전, 문화 창조·보존 등이 속한다. 전인적 변화·잠재가능성 실현은 일차적(내재적) 목적이다.","src":"E"},{"id":"E2016-H-08-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":8,"stem":"다음 중 교육의 과정에서 가장 핵심적이고 실제적인 단계는?","opts":["교육목표 설정 단계","교육내용의 선정과 조직 단계","교육평가의 단계","교수-학습의 경험 단계"],"ans":[4],"multi":false,"dup":true,"expl":"교육의 과정에서 가장 핵심적이고 실제적인 단계는 교수-학습의 경험 단계다.","src":"E"},{"id":"E2016-H-09-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":9,"stem":"현대 사회에서 평생교육의 필요성이 강조되고 있는 사회문화적 배경으로 보기 어려운 것은?","opts":["조직의 물적, 재정적 자원의 중요성 대두","학교교육의 역기능과 한계에 대한 비판 증가","직업의 종류 및 구조의 변화","지식과 기술의 폭발적 증가와 급속한 노후화"],"ans":[1],"multi":false,"dup":true,"expl":"평생교육의 사회문화적 배경은 지식·기술의 증가와 노후화, 직업구조 변화, 학교교육의 한계 비판이다. 조직의 물적·재정적 자원의 중요성은 배경이 아니다.","src":"E"},{"id":"E2016-H-10-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":10,"stem":"고전적 조건형성이론에 대한 다음 설명 중 가장 적절한 것은?","opts":["음식물에 대한 개의 타액 분비는 학습된 것이다","조건형성된 반응이 없어지는 소거(消去)는 학습되는 것이다","손다이크(Thorndike)에 의해 처음 체계적으로 이론화되었다","중성자극이었던 종소리는 조건자극과 짝지워짐으로써 무조건 자극이 된다"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성에서 소거(조건반응의 약화)도 학습되는 현상이다. 타액 분비는 무조건반응이고, 이론화는 파블로프가 했다.","src":"E"},{"id":"E2016-H-11-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":11,"stem":"아이들이 바람직하지 않은 행동을 했을 때 그들이 좋아하는 컴퓨터 게임을 2시간 동안 하지 못하도록 함으로써 바람직하지 않은 행동의 빈도를 감소시키고자 하는 것과 관련이 있는 것은?","opts":["부적 강화","정적 강화","벌","소거"],"ans":[3],"multi":false,"dup":true,"expl":"좋아하는 게임을 2시간 못 하게 하는 것은 혐오자극의 제시, 즉 벌이다.","src":"E"},{"id":"E2016-H-12-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":12,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재 조건형성","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":true,"expl":"소거 후 다시 조건형성을 하면 처음보다 훨씬 적은 시행으로 조건반응이 되살아나는데, 이를 신속한 재조건형성이라 한다. 이는 소거가 학습을 완전히 지운 것이 아니라 일시적으로 억압했음을 보여 준다. 자발적 회복도 같은 증거이지만 이 문항의 보기에는 없다.","src":"E"},{"id":"E2016-H-13-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":13,"stem":"학교에서 전체 조회시간에 어떤 아이에게 선행상을 주었다. 이것을 본 다른 아이들이 나도 착한 행동을 해야겠다고 마음먹고 유사한 선행을 했다. 직접적으로 선행상을 받지 않은 다른 아이들은 어떤 강화를 받은 것인가?","opts":["계속적 강화","부분강화","자기강화","대리강화"],"ans":[4],"multi":false,"dup":true,"expl":"다른 아이가 강화받는 장면을 관찰하고 같은 행동을 하게 된 것은 대리강화(대리적 강화)다. 직접 강화를 받지 않아도 관찰을 통해 학습이 일어난다.","src":"E"},{"id":"E2016-H-14-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":14,"stem":"침팬지 실험을 통해 학습은 통찰에 의해 일어나는 것이라고 주장하는 형태주의 심리학자는?","opts":["쾰러(Köhler)","스키너(Skinner)","손다이크(Thorndike)","반두라(Bandura)"],"ans":[1],"multi":false,"dup":false,"expl":"침팬지 실험으로 통찰학습을 주장한 형태주의 심리학자는 쾰러다.","src":"E"},{"id":"E2016-H-15-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":15,"stem":"어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 것과 관련된 개념은?","opts":["자기중심성","중심화","대상영속성","불가역성"],"ans":[3],"multi":false,"dup":true,"expl":"눈앞에서 사라진 물체가 계속 존재한다는 이해는 대상영속성이다.","src":"E"},{"id":"E2016-H-16-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":16,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 각 단계마다 성취해야 할 긍정적인 과업이 발달순서대로 나열되어 있는 것은?","opts":["신뢰감→자율성→근면성→주도성","주도성→근면성→자아정체감→친밀성","신뢰감→주도성→자율성→근면성","근면성→친밀성→자아정체감→생산성"],"ans":[2],"multi":false,"dup":false,"expl":"에릭슨의 발달 순서는 신뢰감→자율성→주도성→근면성→자아정체감→친밀성→생산성→통합성이다.","src":"E"},{"id":"E2016-H-17-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":17,"stem":"학습과 기억에 결정적인 역할을 담당하고 있는 것으로서, 치매에 걸린 사람들은 이것에 구조적․기능적 쇠퇴가 발생한 것으로 알려지고 있다. 이것은?","opts":["해마","편도체","연수","뇌량"],"ans":[1],"multi":false,"dup":true,"expl":"학습과 기억에 결정적인 역할을 하며 치매에서 쇠퇴하는 뇌 구조는 해마.","src":"E"},{"id":"E2016-H-18-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":18,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["감각기억 - 논리적 추론","작업기억 - 음악 감상","장기기억 - 유목별 군집화","단기기억 - 영화 감상"],"ans":[3],"multi":false,"dup":true,"expl":"장기기억-유목별 군집화가 바른 연결이다. 논리적 추론은 작업기억, 감각기억은 순간적 감각 저장이다.","src":"E"},{"id":"E2016-H-19-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":19,"stem":"인간의 기억구조에서 컴퓨터의 중앙통제기능, 즉 CPU에 해당하는 개념은?","opts":["감각기억","작업기억","단기기억","장기기억"],"ans":[2],"multi":false,"dup":true,"expl":"작업기억은 컴퓨터의 CPU처럼 정보를 조작·통제하는 중앙통제 기능을 한다.","src":"E"},{"id":"E2016-H-20-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":20,"stem":"망각의 원인에 관한 다음 설명 중 억압이론에 관한 설명은?","opts":["기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다","순행성 간섭과 역행성 간섭은 그 좋은 예이다","파지를 방해하는 외부적 영향 때문에 망각이 촉진된다","정신분석이론에 근거하고 있다"],"ans":[4],"multi":false,"dup":true,"expl":"억압이론은 정신분석이론에 근거해 불쾌한 기억이 무의식으로 억압된다고 본다.","src":"E"},{"id":"E2016-H-21-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":21,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 삼원지능이론","가드너(Gardner) - 유동성 지능, 결정성 지능","길포드(Guilford) - 일반요인, 특수요인","서스턴(Thurstone) - 7가지 기초정신능력"],"ans":[4],"multi":false,"dup":true,"expl":"서스턴-7가지 기초정신능력이 바른 연결이다. 커텔은 유동성·결정성, 길포드는 요소설, 가드너는 다면적 지능이다.","src":"E"},{"id":"E2016-H-22-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":22,"stem":"창의력에 관한 다음 설명 중 길포드(Guilford)의 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력은 수렴적 사고와 밀접한 관련이 있다","창의력을 구성하는 능력들은 지필검사로 측정할 수 있다","창의력은 하늘이 내리는 것이다"],"ans":[3],"multi":false,"dup":true,"expl":"길포드는 창의력의 구성 능력이 지필검사로 측정 가능하다고 보았다.","src":"E"},{"id":"E2016-H-23-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":23,"stem":"다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","대인간 지능","논리-수학 지능","공간 지능"],"ans":[2],"multi":false,"dup":true,"expl":"감성지능·사회적 지능과 관련이 깊은 것은 대인간 지능이다.","src":"E"},{"id":"E2016-H-24-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":24,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 성장욕구에 해당하는 것은?","opts":["생리적 욕구","자존 욕구","소속 욕구","지적 욕구"],"ans":[4],"multi":false,"dup":true,"expl":"지적 욕구는 성장욕구다. 생리·자존·소속 욕구는 결핍욕구다.","src":"E"},{"id":"E2016-H-25-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":25,"stem":"창의력이 높은 사람의 특징으로 보기 어려운 것은?","opts":["사고영역의 폐쇄성","아이디어 산출의 독창성","문제에 대한 민감성","사고의 유연성"],"ans":[1],"multi":false,"dup":false,"expl":"창의적 사고의 특징은 독창성·민감성·유연성이며 사고영역의 폐쇄성은 이와 반대다.","src":"E"},{"id":"E2016-H-26-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":26,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘삶의 본능’과 가장 거리가 먼 것은?","opts":["성적 본능","창조적 본능","사랑의 본능","공격 본능"],"ans":[4],"multi":false,"dup":true,"expl":"프로이트의 삶의 본능(리비도)은 성·사랑·창조 등 생명을 유지·확장하는 본능이다. 공격 본능은 죽음의 본능(타나토스)에 속한다.","src":"E"},{"id":"E2016-H-27-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":27,"stem":"원초아의 충동이 너무 강하여 자신이 충동을 통제하지 못할 것 같을 때 경험하는 불안은?","opts":["신경증적 불안","도덕적 불안","현실 불안","상태 불안"],"ans":[1],"multi":false,"dup":true,"expl":"원초아 충동을 통제하지 못할까 봐 느끼는 불안은 신경증적 불안이다.","src":"E"},{"id":"E2016-H-28-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":28,"stem":"애착형성에 관한 다음 설명 중 가장 적절하지 않은 것은?","opts":["영아는 배고픔을 해소시켜주는 대상에게 애착을 형성한다","영아는 부모의 보살핌과 보호를 이끌어내는 능동적 존재다","안정적인 애착관계를 형성한 유아는 격리불안을 보인다","영아기에 형성된 애착유형은 아동기 또래관계와 관계있다"],"ans":[3],"multi":false,"dup":true,"expl":"안정적 애착을 형성한 유아는 격리불안이 오히려 낮다. 불안정 애착에서 격리불안이 크게 나타난다.","src":"E"},{"id":"E2016-H-29-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":29,"stem":"다음 중 자기통제력의 발달과 가장 거리가 먼 것은?","opts":["만족지연능력","외적 통제사고","충동억제능력","내적 통제사고"],"ans":[2],"multi":false,"dup":true,"expl":"자기통제력은 만족지연·충동억제·내적 통제와 관련되며 외적 통제사고는 거리가 멀다.","src":"E"},{"id":"E2016-H-30-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":30,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 인습적 수준(conventional period)의 발달단계에 해당하는 것은?","opts":["처벌과 복종 지향","법과 질서 지향","사회적 계약 지향","도구적 상대주의 지향"],"ans":[2],"multi":false,"dup":true,"expl":"인습적 수준은 대인간 조화 지향과 법과 질서 지향이다.","src":"E"},{"id":"E2016-H-31-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":31,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다"],"ans":[3],"multi":false,"dup":true,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2016-H-32-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":32,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["맥클리랜드(McClelland) - 이상적 자아","셀리그만(Seligman) - 학습된 무력감","로저스(Rogers) - 자기효능감","컨버그(Kernberg) - 성취동기"],"ans":[2],"multi":false,"dup":true,"expl":"셀리그만은 학습된 무력감, 맥클리랜드는 성취동기, 로저스는 자기개념·자기실현과 연결된다. ③만 바른 연결이다.","src":"E"},{"id":"E2016-H-33-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":33,"stem":"아이들이 TV를 시청하는 시간대에는 폭력적인 장면을 방영하는 것을 규제하고 있는데, 이와 가장 관련이 깊은 설명은?","opts":["공격적 행동에 대한 직접적 보상은 그 행동을 반복케 한다","상대방의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 우연히 관찰함으로써 학습된다","공격성은 선천적으로 가지고 태어나는 것이다"],"ans":[3],"multi":false,"dup":false,"expl":"TV의 폭력 장면을 관찰해 공격성이 학습된다는 것은 사회학습이론적 설명이다.","src":"E"},{"id":"E2016-H-34-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":34,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["로저스(Rogers) - 충분히 기능하는 인간","올포트(Allport) - 생산적인 사람","프롬(Fromm) - 합리적 모험가","매슬로우(Maslow) - 성숙한 인격"],"ans":[1],"multi":false,"dup":true,"expl":"로저스는 충분히 기능하는 사람, 매슬로는 자아실현인, 올포트는 성숙한 인격, 프롬은 생산적인 사람을 제시했다.","src":"E"},{"id":"E2016-H-35-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":35,"stem":"자기 자신을 부정적으로 평가하고 비하하게 되면 부정적인 자아개념을 갖게 되는데, 이러한 부정적 자아개념이 심할 경우에 갖게 되는 것은?","opts":["자아정체성","자기효능감","이상적 자아","학습된 무력감"],"ans":[4],"multi":false,"dup":true,"expl":"부정적 자아개념이 심해져 노력해도 결과를 바꿀 수 없다고 믿는 상태는 학습된 무력감이다.","src":"E"},{"id":"E2016-H-36-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":36,"stem":"다음 중 ‘충분히 기능을 발휘하는 사람’의 특징으로 보기 어려운 것은?","opts":["동조성","실존적 삶","유기체적 신뢰","경험에의 개방성"],"ans":[1],"multi":false,"dup":false,"expl":"충분히 기능하는 사람의 특징은 경험에의 개방성, 실존적 삶, 유기체적 신뢰이며 동조성은 해당하지 않는다.","src":"E"},{"id":"E2016-H-37-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":37,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["탐구적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 정치가, 영업사원, 광고업자","실제적 유형 - 기술자, 정비사, 의료기사","사회적 유형 - 회계사, 은행원, 사무원"],"ans":[3],"multi":false,"dup":true,"expl":"실제적 유형-기술자·정비사·의료기사가 바른 연결이다. 사회적 유형은 교사·간호사·종교지도자, 관습적은 회계사·은행원·사무원, 탐구적은 과학자·연구자다.","src":"E"},{"id":"E2016-H-38-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":38,"stem":"진로지도와 관련된 이론 중 가장 오래된 것으로서, 개인과 직업의 특성을 진단하고 분석하여 연결시켜 주는 것을 요체로 하고 있는 이론은?","opts":["의사결정이론","특성이론","사회이론","심리이론"],"ans":[2],"multi":false,"dup":true,"expl":"개인과 직업의 특성을 진단해 연결하는 가장 오래된 진로지도 이론은 특성이론(특성-요인 이론)이다.","src":"E"},{"id":"E2016-H-39-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":39,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["심리이론 - 로우(Roe)","의사결정이론 - 보딘(Bordin)","사회이론 - 윌리엄슨(Williamson)","특성이론 - 겔라트(Gelatt)"],"ans":[1],"multi":false,"dup":true,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2016-H-40-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":40,"stem":"심리검사를 활용할 때 유의해야 할 사항에 대한 다음 설명 중 가장 적절한 것은?","opts":["문․이과의 선택시 적성검사 결과만 가지고도 충분하다","검사결과표를 학생에게 전달하기만 하면 교사의 임무는 끝난다","다른 학교에서 하니까 우리 학교도 심리검사를 사용하지 않으면 안 된다","한 심리검사는 학생의 상태를 이해하는 데 부분적인 정보만을 제공할 뿐이다"],"ans":[4],"multi":false,"dup":false,"expl":"심리검사 결과는 학생 이해의 부분적 정보일 뿐이며 다른 자료와 함께 해석해야 한다.","src":"E"},{"id":"E2016-H-41-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":41,"stem":"다음 중 정신분석이론에서 가정하고 있는 것은?","opts":["인간행동의 원인은 우리 외부에 있다","인간은 끊임없이 갈등하는 존재다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다","인간은 합리적이고 건설적이며 합목적적인 존재이다"],"ans":[2],"multi":false,"dup":true,"expl":"정신분석이론은 인간을 끊임없이 갈등하는 존재로 가정한다.","src":"E"},{"id":"E2016-H-42-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":42,"stem":"정신분석이론에서 내담자가 초기 아동기에 어떤 중요한 타인과의 관계에서 느꼈던 감정을 현재의 상담자에게도 느끼는 것을 의미하는 개념은?","opts":["전이","훈습","자유연상","저항"],"ans":[1],"multi":false,"dup":true,"expl":"초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 옮겨 느끼는 것은 전이(transference)다. 반대로 상담자가 내담자에게 느끼는 감정은 역전이다.","src":"E"},{"id":"E2016-H-43-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":43,"stem":"직면은 내담자가 가지고 있는 불일치, 모순 등을 상담자가 기술해 주는 것이다. 직면시켜야 하는 상황으로 가장 적절치 않은 것은?","opts":["내담자의 기대와 현실적 가능성 간에 괴리가 있을 때","내담자의 말과 행동 간에 괴리가 있을 때","내담자의 생각과 상담자의 생각 간에 괴리가 있을 때","내담자의 언어적 메시지와 비언어적 메시지 간에 괴리가 있을 때"],"ans":[3],"multi":false,"dup":true,"expl":"직면은 내담자 내부의 불일치·모순을 다룬다. 내담자와 상담자의 생각이 다르다는 이유로 직면하는 것은 적절하지 않다.","src":"E"},{"id":"E2016-H-44-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":44,"stem":"교사들이 초등학교 저학년을 대상으로 학기초에 스티커 붙이는 종이를 나누어주고, 착한 일을 했거나 발표를 잘 했거나 하면 스티커를 하나씩 상으로 주는 것과 관련된 행동수정기법은?","opts":["부적 강화","범람법","타임 아우트","토큰 강화"],"ans":[4],"multi":false,"dup":true,"expl":"스티커를 상으로 주어 바람직한 행동을 강화하는 것은 토큰 강화다.","src":"E"},{"id":"E2016-H-45-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":45,"stem":"합리-정의적 상담이론의 ABCD기법에서 현재의 정서적․행동적 결과의 진정한 원인이라고 엘리스(Ellis)가 주장하는 것은?","opts":["A","B","C","D"],"ans":[2],"multi":false,"dup":true,"expl":"엘리스는 정서·행동적 결과(C)의 진정한 원인을 신념체계(B)라고 본다. 선행사건(A) 자체가 원인이 아니다.","src":"E"},{"id":"E2016-H-46-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":46,"stem":"상담목표에 대한 다음 설명 중 가장 적절하지 않은 것은?","opts":["상담목표는 상담을 끝내기 위한 하나의 기준이다","상담목표는 상담자에게 중요한 것으로 정해야 한다","상담목표는 가능한 한 구체적이고 작을수록 좋다","상담목표란 내담자의 문제가 해결된 상태를 의미한다"],"ans":[2],"multi":false,"dup":true,"expl":"상담목표는 내담자에게 중요한 것을 중심으로 내담자의 문제 해결 상태를 구체적으로 진술한다. 상담자 중심 설정은 잘못이다.","src":"E"},{"id":"E2016-H-47-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":47,"stem":"다음 중 엘리스(Ellis)가 말하는 비합리적 신념에 해당하는 것은?","opts":["현재 내가 겪고 있는 정서적인 괴로움은 주로 나의 책임이다","사랑받기보다는 사랑하는 것에 신경 쓰는 것이 바람직하고 생산적이다","걱정한다고 해서 어떤 괴로운 일이 사라지는 것은 아니다","일이 내 뜻대로 진행되지 않는다면 끔찍스러운 일이다"],"ans":[4],"multi":false,"dup":true,"expl":"“일이 뜻대로 안 되면 끔찍한 일이다”는 대표적인 비합리적 신념이다. 나머지는 합리적 신념에 가깝다.","src":"E"},{"id":"E2016-H-48-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":48,"stem":"우리는 타인으로부터 인정받고 싶은 마음 때문에 타인의 기대에 맞추어 살기도 한다. 하지만 이것이 많으면 많을수록 삶의 무의미와 공허감을 느끼게 된다고 로저스(Rogers)는 주장한다. 이것은?","opts":["가치조건","자동적 사고","공상","혐오자극"],"ans":[1],"multi":false,"dup":true,"expl":"타인의 기대에 맞추느라 자신의 유기체적 경험을 무시하게 만드는 조건은 로저스가 말한 가치조건이다.","src":"E"},{"id":"E2016-H-49-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":49,"stem":"월페(Wolpe)에 의해 제안된 것으로서 불안과 양립할 수 없는 이완반응을 이끌어낸 다음 불안을 유발시키는 경험을 상상하게 함으로써 불안유발자극의 영향을 약화시키는 방법은?","opts":["저항의 해석","토큰 강화","체계적 둔감법","혐오자극의 제공"],"ans":[3],"multi":false,"dup":true,"expl":"이완반응과 불안을 양립시켜 불안을 약화시키는 월페의 기법은 체계적 둔감법이다.","src":"E"},{"id":"E2016-H-50-0","set":"2016-하계","year":2016,"kind":"하계","grade":"전학년","no":50,"stem":"다음 <보기>의 대화에서 상담자의 반응과 가장 관련이 깊은 것은 다음 중 어느 것인가? 내담자: “선생님은 너무 무심하신 것 같아요.”상담자: “어떻게 그런 생각을 하게 되었는지 말해줄 수 있겠니?”","opts":["구체화","무조건적 존중","공감적 이해","경청"],"ans":[1],"multi":false,"dup":false,"expl":"“어떻게 그런 생각을 하게 되었는지”라고 물어 구체적인 근거를 확인하는 것은 구체화 기법이다.","src":"E"},{"id":"E2017-2-01-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":1,"stem":"후기 현대철학의 인식론적 관점과 가장 가까운 것은?","opts":["자연이나 신에 의해 주어진, 변화하지 않으며 절대 고정된 인간의 본질이 존재한다","절대 객관적 지식으로서의 진리를 파악하는 것이 가능하다","인간의 인식과 지식은 인간의 관심, 신념, 가치관에 기초하여 세계를 해석하고 탐구한 결과로 이루어지는 것이다","인간인식에 있어서 궁극적이고 절대적인 기초가 존재한다"],"ans":[3],"multi":false,"dup":false,"expl":"후기 현대철학의 인식론은 지식이 인간의 관심·신념·가치관에 기초한 해석의 결과라고 본다.","src":"E"},{"id":"E2017-2-01-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 철학․종교적 인간관과 관련이 깊은 것은?","opts":["인간의 정신과 육체는 물질로 이루어져 있다","인간행동은 외부 자극에 대한 습관화된 반응이다","인간의 고유한 형상은 이성이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[3],"multi":false,"dup":true,"expl":"마리탱의 철학·종교적 인간관은 인간의 고유한 형상이 이성이라고 본다.","src":"E"},{"id":"E2017-2-02-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":2,"stem":"공학적 교육관과 가장 거리가 먼 것은?","opts":["교육의 과정은 투입-가공-산출 모형으로 설명할 수 있다","교사와 학생의 관계는 전달, 주입, 통제의 관계로 간주된다","교수-학습의 효율성과 성취도의 평가가 강조된다","교사는 교육목표의 설정이라는 가치판단의 주체이다"],"ans":[4],"multi":false,"dup":true,"expl":"공학적 교육관은 교육을 투입-가공-산출의 체제로 보고 교사를 목표 달성을 위한 기술자·관리자로 본다. 따라서 교사가 교육목표 설정의 가치판단 주체라는 진술이 공학적 교육관과 가장 거리가 멀다. ①·③·④는 모두 공학적 교육관의 특징이다.","src":"E"},{"id":"E2017-2-02-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":2,"stem":"개인은 사회가 제시하는 기존의 지식체계나 신념체계를 수동적으로 수용하고, 그에 적응해 나가야 하는 존재라고 여기는 교육관은?","opts":["실존주의 교육관","진보주의 교육관","자연주의 교육관","전통적 교육관"],"ans":[4],"multi":false,"dup":false,"expl":"기존의 지식·신념체계를 수동적으로 수용하는 존재로 보는 교육관은 전통적 교육관이다.","src":"E"},{"id":"E2017-2-03-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":3,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["행동주의 교육관 - 듀이(Dewey)","진보주의 교육관 - 부버(Buber)","실존주의 교육관 - 스키너(Skinner)","자연주의 교육관 - 루소(Rousseau)"],"ans":[4],"multi":false,"dup":false,"expl":"자연주의 교육관-루소가 바른 연결이다. 행동주의는 스키너, 진보주의는 듀이, 실존주의는 부버·틸리히와 연결된다.","src":"E"},{"id":"E2017-2-03-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":3,"stem":"다음 중 연결이 적절한 것은?","opts":["자연주의 교육관 - 스키너(Skinner)","진보주의 교육관 - 틸리히(Tillich)","실존주의 교육관 - 부버(Buber)","행동주의 교육관 - 루소(Rousseau)"],"ans":[3],"multi":false,"dup":false,"expl":"실존주의 교육관은 부버(Buber)·틸리히 등과 연결된다. 자연주의는 루소, 행동주의는 스키너, 진보주의는 듀이와 연결되므로 ①·②·④는 잘못된 연결이다.","src":"E"},{"id":"E2017-2-04-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":4,"stem":"다음 중 교육이 이루어지는 과정을 순서대로 나열한 것은?","opts":["교육내용 선정과 조직 → 교육목표의 설정 → 교수-학습 → 평가","교육목표의 설정 → 교수-학습 → 교육내용 선정과 조직 → 평가","교육내용 선정과 조직 → 교수-학습 → 교육목표의 설정 → 평가","교육목표의 설정 → 교육내용 선정과 조직 → 교수-학습 → 평가"],"ans":[4],"multi":false,"dup":false,"expl":"교육의 과정은 교육목표의 설정 → 교육내용의 선정과 조직 → 교수-학습 → 평가 순으로 이루어진다. 목표가 먼저 서고 그에 따라 내용을 조직한 뒤 실제 수업과 평가가 뒤따른다.","src":"E"},{"id":"E2017-2-04-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":4,"stem":"수학교과서의 내용이 초등학교, 중학교, 고등학교로 갈수록 점차 심화되고 확대되는 것을 알 수 있는데, 이것과 가장 관련이 있는 교육내용 선정 및 조직의 원리는?","opts":["통합성의 원리","계속성의 원리","반복성의 원리","계열성의 원리"],"ans":[4],"multi":false,"dup":false,"expl":"학년이 올라갈수록 내용이 심화·확대되는 것은 계열성의 원리다. 계속성은 같은 내용의 반복, 통합성은 교과 간 관련을 뜻하며 반복성은 내용 조직의 원리가 아니다.","src":"E"},{"id":"E2017-2-05-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":5,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 탈학교 교육론","매슬로(Maslow) - 주형으로서의 교육관","렝그랑(Lengrand) - 프로그램 수업","구스리(Guthrie) - 평생교육"],"ans":[1],"multi":false,"dup":false,"expl":"일리치-탈학교 교육론이 바른 연결이다. 매슬로는 자아실현, 렝그랑은 평생교육과 연결된다.","src":"E"},{"id":"E2017-2-05-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":5,"stem":"‘교육’이라는 말에 포함되어 있는 개념적 요소로 보기에 가장 적절하지 않은 것은?","opts":["전인적 인간변화에의 관심","의도적인 행동과정","가치중립성","인간존엄성의 존중"],"ans":[3],"multi":false,"dup":false,"expl":"교육은 의도적·가치지향적 활동으로 가치중립성을 개념 요소로 보기 어렵다.","src":"E"},{"id":"E2017-2-06-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":6,"stem":"현대 사회에서 평생교육의 필요성이 강조되고 있는 사회문화적 배경으로 보기 어려운 것은?","opts":["학교교육의 역기능과 한계에 대한 비판 증가","직업의 종류 및 구조의 변화","조직의 물적, 재정적 자원의 중요성 대두","지식과 기술의 폭발적 증가와 급속한 노후화"],"ans":[3],"multi":false,"dup":false,"expl":"평생교육의 사회문화적 배경은 지식·기술의 증가와 노후화, 직업구조 변화, 학교교육의 한계 비판이다. 조직의 물적·재정적 자원의 중요성은 배경이 아니다.","src":"E"},{"id":"E2017-2-06-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":6,"stem":"다음 중 교육의 과정에서 가장 핵심적이고 실제적인 단계는?","opts":["교육목표 설정 단계","교육내용의 선정과 조직 단계","교육평가의 단계","교수-학습의 경험 단계"],"ans":[4],"multi":false,"dup":false,"expl":"교육의 과정에서 가장 핵심적이고 실제적인 단계는 교수-학습의 경험 단계다.","src":"E"},{"id":"E2017-2-07-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":7,"stem":"고전적 조건형성이론에 대한 다음 설명 중 가장 적절한 것은?","opts":["음식물에 대한 개의 타액 분비는 학습된 것이다","조건형성된 반응이 없어지는 소거(消去)는 학습되는 것이다","손다이크(Thorndike)에 의해 체계적으로 이론화되었다","중성자극이었던 종소리는 조건자극과 짝지워짐으로써 무조건자극이 된다"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성에서 소거도 학습되는 현상이다. 타액 분비는 무조건반응, 이론화는 파블로프가 했다.","src":"E"},{"id":"E2017-2-07-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":7,"stem":"고전적 조건형성이론에 대한 다음 설명 중 가장 적절하지 않은 것은?","opts":["음식물에 대한 개의 타액 분비는 무조건적인 것이다","손다이크에 의해 처음 체계적으로 이론화되었다","중성자극이었던 종소리는 무조건자극과 짝지워짐으로써 조건자극이 된다","조건형성된 반응이 없어지는 소거는 학습되는 것이다"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성을 처음 체계화한 것은 파블로프이지 손다이크가 아니다.","src":"E"},{"id":"E2017-2-08-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":8,"stem":"어떤 아이가 어른에게 인사를 하였더니 그 어른으로부터 칭찬을 받았다. 그 이후 이 아이는 어른을 보면 인사하는 행동을 자주 하게 되었다. 이와 가장 관련이 있는 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","반복의 법칙"],"ans":[2],"multi":false,"dup":false,"expl":"칭찬이라는 결과가 행동을 강화해 반복하게 만든 것은 효과의 법칙이다.","src":"E"},{"id":"E2017-2-08-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":8,"stem":"아이들이 바람직하지 않은 행동을 했을 때 그들이 좋아하는 컴퓨터 게임을 일정 시간 동안 하지 못하도록 함으로써 바람직하지 않은 행동의 빈도를 감소시키고자 하는 것과 관련이 있는 것은?","opts":["부적 강화","정적 강화","벌","소거"],"ans":[3],"multi":false,"dup":false,"expl":"좋아하는 게임을 일정 시간 하지 못하게 하는 것은 혐오자극을 제시해 행동을 감소시키는 벌이다. 부적 강화는 혐오자극을 제거해 행동을 증가시키고, 정적 강화는 자극을 더해 행동을 늘린다.","src":"E"},{"id":"E2017-2-09-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":9,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["사회학습 - 대리강화","고전적 조건형성 - 통찰","모델링 - 컴퓨터 보조학습","인지학습 - 부분강화계획"],"ans":[1],"multi":false,"dup":false,"expl":"사회학습-대리강화가 바른 연결이다. 고전적 조건형성은 통찰과 무관하고, 모델링은 관찰학습이다.","src":"E"},{"id":"E2017-2-09-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":9,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["신속한 재 조건형성","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":true,"expl":"소거 후 시간이 지나 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 보여 준다.","src":"E"},{"id":"E2017-2-10-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":10,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":false,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이며, 행동이 안정된 뒤에는 간헐적(부분) 강화로 옮겨 간다. 자기 강화·대리 강화는 초기 습득 단계의 강화 방법이 아니다.","src":"E"},{"id":"E2017-2-10-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":10,"stem":"카지노에 있는 도박기계인 슬로트머신에 적용된 강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[4],"multi":false,"dup":false,"expl":"슬로트머신은 예측할 수 없는 변동비율 강화계획을 따른다.","src":"E"},{"id":"E2017-2-11-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":11,"stem":"어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 것과 관련된 개념은?","opts":["자기중심성","중심화","대상영속성","불가역성"],"ans":[3],"multi":false,"dup":false,"expl":"눈앞에서 사라진 물체가 계속 존재한다는 이해는 대상영속성이다.","src":"E"},{"id":"E2017-2-11-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":11,"stem":"공부는 거의 하지 않고 하루 종일 컴퓨터 게임만 하는 아이의 공부하는 행동을 늘리기 위하여, 일정 시간의 공부를 하면 아이가 좋아하는 컴퓨터 게임을 일정 시간동안 할 수 있도록 해주는 것과 관련이 깊은 행동수정 방법은?","opts":["토큰 강화","프리맥의 원리","범람법","소거의 원리"],"ans":[2],"multi":false,"dup":false,"expl":"빈도가 높은 행동(게임)을 강화물로 삼아 빈도가 낮은 행동(공부)을 늘리는 것은 프리맥의 원리다. 범람법은 불안 치료 기법, 토큰 강화는 상징적 강화물을 쓰는 방법, 소거는 강화를 중단하는 것이다.","src":"E"},{"id":"E2017-2-12-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":12,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 2～3세경에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["자율성 - 수치감","근면성 - 열등감","주도성 - 죄책감","생산성 - 침체감"],"ans":[1],"multi":false,"dup":false,"expl":"2~3세의 과업은 자율성 대 수치감이다.","src":"E"},{"id":"E2017-2-12-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":12,"stem":"침팬지 실험을 통해 학습은 통찰에 의해 일어나는 것이라고 주장하는 형태주의 심리학자는?","opts":["퀠러(Köhler)","스키너(Skinner)","손다이크(Thorndike)","반두라(Bandura)"],"ans":[1],"multi":false,"dup":false,"expl":"통찰학습을 주장한 형태주의 심리학자는 쾰러(퀠러)다.","src":"E"},{"id":"E2017-2-13-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":13,"stem":"학습과 기억에 결정적인 역할을 담당하고 있는 것으로서, 치매에 걸린 사람들은 이것에 구조적․기능적 쇠퇴가 발생한 것으로 알려지고 있다. 이것은?","opts":["해마","편도체","연수","뇌량"],"ans":[1],"multi":false,"dup":false,"expl":"학습과 기억에 결정적인 역할을 하며 치매에서 쇠퇴하는 뇌 구조는 해마.","src":"E"},{"id":"E2017-2-13-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":13,"stem":"피아제(Piaget)의 인지발달단계 중 가설연역적 사고가 가능한 발달단계는?","opts":["전조작기","형식적 조작기","구체적 조작기","감각운동기"],"ans":[2],"multi":false,"dup":false,"expl":"가설연역적 사고가 가능한 단계는 형식적 조작기다.","src":"E"},{"id":"E2017-2-14-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":14,"stem":"인간의 기억구조에서 컴퓨터의 중앙통제기능, 즉 CPU에 해당하는 개념은?","opts":["감각기억","작업기억","단기기억","장기기억"],"ans":[2],"multi":false,"dup":false,"expl":"작업기억은 컴퓨터의 CPU처럼 정보를 조작·통제하는 중앙통제 기능을 한다.","src":"E"},{"id":"E2017-2-14-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":14,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 초등학교 시절에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["근면성 - 열등감","자아정체성 - 역할혼돈","자율성 - 수치감","주도성 - 죄책감"],"ans":[1],"multi":false,"dup":false,"expl":"초등학교 시기의 과업은 근면성 대 열등감이다.","src":"E"},{"id":"E2017-2-15-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":15,"stem":"망각의 원인에 관한 다음 설명 중 억압이론에 관한 설명은?","opts":["기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다","순행성 간섭과 역행성 간섭은 그 좋은 예이다","정신분석이론에 근거하고 있다","파지를 방해하는 외부적 영향 때문에 망각이 촉진된다"],"ans":[3],"multi":false,"dup":false,"expl":"억압이론은 정신분석이론에 근거해 불쾌한 기억이 무의식으로 억압된다고 본다.","src":"E"},{"id":"E2017-2-15-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":15,"stem":"인간은 다양하게 머리가 좋을 수 있다는 다면적 지능이론을 주장한 사람은?","opts":["가드너(Gardner)","비네(Binet)","손다이크(Thorndike)","베르타이머(Wertheimer)"],"ans":[1],"multi":false,"dup":false,"expl":"다면적(다중) 지능이론을 주장한 사람은 가드너다.","src":"E"},{"id":"E2017-2-16-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":16,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 영어 시간에 배운 내용 때문에 불어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[2],"multi":false,"dup":false,"expl":"먼저 배운 영어가 나중에 배운 불어의 기억을 방해한 것은 순행성 간섭이다. 역행성 간섭은 나중 학습이 먼저 학습을 방해하는 경우다.","src":"E"},{"id":"E2017-2-16-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":16,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["반두라(Bandura) - 억압 이론","에빙하우스(Ebbinghaus) - 망각곡선","레빈(Lewin) - 모방학습","손다이크(Thorndike) - 통찰학습"],"ans":[2],"multi":false,"dup":false,"expl":"에빙하우스-망각곡선이 바른 연결이다. 반두라는 관찰학습, 레빈은 장이론, 손다이크는 시행착오학습이다.","src":"E"},{"id":"E2017-2-17-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":17,"stem":"다음 중 결정성 지능에 해당하지 않는 것은?","opts":["어휘이해력","언어유추능력","일반 지식","수리력"],"ans":[2],"multi":false,"dup":false,"expl":"언어유추능력은 유동성 지능에 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2017-2-17-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":17,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["감각기억 - 논리적 추론","작업기억 - 음악 감상","장기기억 - 유목별 군집화","단기기억 - 영화 감상"],"ans":[3],"multi":false,"dup":false,"expl":"장기기억-유목별 군집화가 바른 연결이다. 논리적 추론은 작업기억, 감각기억은 순간적 감각 저장이다.","src":"E"},{"id":"E2017-2-18-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":18,"stem":"서스턴(Thurstone)이 주장하는 일곱 가지 기본정신능력(Primary Mental Ability)에 해당하지 않는 것은?","opts":["지각속도","기억력","수리력","창의력"],"ans":[4],"multi":false,"dup":false,"expl":"서스턴의 7가지 기초정신능력은 언어이해·추리·수리·공간지각·언어유창성·지각속도·기억력이다. 창의력은 길포드의 확산적 사고와 관련된 개념이다.","src":"E"},{"id":"E2017-2-18-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":18,"stem":"망각의 원인에 관한 다음 설명 중 간섭이론에 관한 설명은?","opts":["뇌세포의 기억 흔적이 시간의 경과로 인해 흐려진다","행동주의 이론에 근거하고 있다","파지를 방해하는 외부적 영향 때문에 망각이 촉진된다","망각 속도와 깊은 관련이 있다"],"ans":[3],"multi":false,"dup":true,"expl":"간섭이론은 앞뒤 학습이 서로를 방해해 파지를 저해한다고 설명한다(순행성·역행성 간섭).","src":"E"},{"id":"E2017-2-19-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":19,"stem":"창의력에 관한 다음 설명 중 길포드(Guilford)의 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력은 수렴적 사고와 밀접한 관련이 있다","창의력을 구성하는 기본능력은 지필검사로 측정할 수 있다","창의력은 하늘이 내리는 것이다"],"ans":[3],"multi":false,"dup":false,"expl":"길포드는 창의력을 확산적 사고의 구성 요소(유창성·융통성·독창성·정교성)로 보고 지필검사로 측정 가능하다고 보았다.","src":"E"},{"id":"E2017-2-19-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":19,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 삼원지능이론","가드너(Gardner) - 유동성 지능, 결정성 지능","길포드(Guilford) - 일반요인, 특수요인","서스턴(Thurstone) - 7가지 기초정신능력"],"ans":[4],"multi":false,"dup":false,"expl":"서스턴-7가지 기초정신능력이 바른 연결이다. 커텔은 유동성·결정성, 길포드는 요소설, 가드너는 다면적 지능이다.","src":"E"},{"id":"E2017-2-20-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":20,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["원초아 - 현실 원리","자아 - 이차 과정","죽음의 본능 - 리비도(libido)","초자아 - 일차 과정"],"ans":[2],"multi":false,"dup":false,"expl":"자아-이차 과정이 바른 연결이다. 원초아는 1차 과정·쾌락원리, 초자아는 도덕원리를 따른다.","src":"E"},{"id":"E2017-2-20-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":20,"stem":"다면적 지능이론에서 말하는 여러 가지 지능 중 감성지능, 사회적 지능과 가장 관련이 깊은 지능은?","opts":["언어적 지능","대인간 지능","논리-수학 지능","공간 지능"],"ans":[2],"multi":false,"dup":false,"expl":"감성지능·사회적 지능과 관련이 깊은 것은 대인간 지능이다.","src":"E"},{"id":"E2017-2-21-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":21,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 성장욕구에 해당하는 것은?","opts":["생리적 욕구","자존 욕구","소속 욕구","지적 욕구"],"ans":[4],"multi":false,"dup":false,"expl":"지적 욕구는 성장욕구다. 생리·자존·소속 욕구는 결핍욕구다.","src":"E"},{"id":"E2017-2-21-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":21,"stem":"다음 중 유동성 지능에 해당하는 것은?","opts":["언어유추능력","어휘이해력","일반 지식","수리력"],"ans":[1],"multi":false,"dup":true,"expl":"유동성 지능은 경험·교육과 무관하게 새 상황에 적응하는 능력으로 언어유추·공간지각 등이 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2017-2-22-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":22,"stem":"자아정체성의 발달수준 중 자아에 대한 회의와 불안정을 경험하고 있으나 적극적으로 자아를 탐색하고 정체성 확립을 위해 노력하고 있는 상태를 특히 무엇이라고 하는가?","opts":["정체성 유예","정체성 혼미","정체성 성취","정체성 조기완료"],"ans":[1],"multi":false,"dup":false,"expl":"위기를 겪고 적극적으로 탐색하는 중인 상태는 정체성 유예다.","src":"E"},{"id":"E2017-2-22-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":22,"stem":"생활연령이 8세인 아동의 정신연령이 12세라면 이 아동의 비율I.Q.는?","opts":["80","120","75","150"],"ans":[4],"multi":false,"dup":false,"expl":"비율 IQ = 정신연령/생활연령 × 100 = 12/8 × 100 = 150이다.","src":"E"},{"id":"E2017-2-23-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":23,"stem":"공격성에 대한 다음 설명 중 사회학습이론의 관점에 해당하는 것은?","opts":["공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","공격성은 선천적으로 가지고 태어나는 것이다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다"],"ans":[4],"multi":false,"dup":true,"expl":"공격성이 공격적인 남의 행동을 관찰함으로써 학습된다는 것은 사회학습이론의 관점이다.","src":"E"},{"id":"E2017-2-23-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":23,"stem":"원초아의 충동이 너무 강하여 자신이 충동을 통제하지 못할 것 같을 때 경험하는 불안은?","opts":["신경증적 불안","도덕적 불안","현실 불안","상태 불안"],"ans":[1],"multi":false,"dup":true,"expl":"원초아 충동을 통제하지 못할까 봐 느끼는 불안은 신경증적 불안이다.","src":"E"},{"id":"E2017-2-24-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":24,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["맥클리랜드(McClelland) - 이상적 자아","로저스(Rogers) - 자기효능감","셀리그만(Seligman) - 학습된 무력감","컨버그(Kernberg) - 성취동기"],"ans":[3],"multi":false,"dup":false,"expl":"셀리그만은 학습된 무력감, 맥클리랜드는 성취동기, 로저스는 자기개념·자기실현과 연결된다. ③만 바른 연결이다.","src":"E"},{"id":"E2017-2-24-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":24,"stem":"애착형성에 관한 다음 설명 중 가장 적절하지 않은 것은?","opts":["영아는 배고픔을 해소시켜주는 대상에게 애착을 형성한다","영아는 부모의 보살핌과 보호를 이끌어내는 능동적 존재다","안정적인 애착관계를 형성한 유아는 격리불안을 보인다","영아기에 형성된 애착유형은 아동기 또래관계와 관계있다"],"ans":[3],"multi":false,"dup":false,"expl":"안정적 애착을 형성한 유아는 격리불안이 오히려 낮다. 불안정 애착에서 격리불안이 크게 나타난다.","src":"E"},{"id":"E2017-2-25-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":25,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 인습적 수준(conventional period)의 발달단계에 해당하는 것은?","opts":["처벌과 복종 지향","법과 질서 지향","사회적 계약 지향","도구적 상대주의 지향"],"ans":[2],"multi":false,"dup":false,"expl":"인습적 수준은 대인간 조화 지향과 법과 질서 지향이다.","src":"E"},{"id":"E2017-2-25-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":25,"stem":"매슬로우(Maslow)의 욕구위계설에서 생리적 욕구, 안전 욕구, 애정과 소속 욕구, 자존 욕구를 총괄하여 무슨 욕구라고 하는가?","opts":["실존욕구","결핍욕구","성장욕구","자아실현 욕구"],"ans":[2],"multi":false,"dup":false,"expl":"생리·안전·애정과 소속·자존 욕구를 묶어 결핍욕구라 한다.","src":"E"},{"id":"E2017-2-26-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":26,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다"],"ans":[3],"multi":false,"dup":false,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2017-2-26-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":26,"stem":"다음 중 자기통제력의 발달과 가장 거리가 먼 것은?","opts":["만족지연능력","외적 통제사고","충동억제능력","내적 통제사고"],"ans":[2],"multi":false,"dup":false,"expl":"자기통제력은 만족지연·충동억제·내적 통제와 관련되며 외적 통제사고는 거리가 멀다.","src":"E"},{"id":"E2017-2-27-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":27,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결되어 있는 것은?","opts":["생산적인 사람 - 프롬(Fromm)","성숙한 인격 - 매슬로우(Maslow)","합리적 모험가 - 올포트(Allport)","자아실현인 - 아들러(Adler)"],"ans":[1],"multi":false,"dup":false,"expl":"생산적인 사람-프롬이 바른 연결이다. 매슬로는 자아실현인, 올포트는 성숙한 인격, 아들러는 사회적 관심이다.","src":"E"},{"id":"E2017-2-27-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":27,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 전인습적 수준의 발달단계에 해당하는 것은?","opts":["대인간 조화 지향","법과 질서 지향","사회적 계약 지향","도구적 상대주의 지향"],"ans":[4],"multi":false,"dup":false,"expl":"전인습적 수준에 해당하는 것은 도구적 상대주의 지향이다. 대인간 조화·법과 질서는 인습적, 사회적 계약은 후인습적이다.","src":"E"},{"id":"E2017-2-28-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":28,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 보기 어려운 것은?","opts":["경험에의 개방성","실존적 삶","유기체적 신뢰","동조성"],"ans":[4],"multi":false,"dup":false,"expl":"충분히 기능하는 사람의 특징은 경험에의 개방성·실존적 삶·유기체적 신뢰이며 동조성은 해당하지 않는다.","src":"E"},{"id":"E2017-2-28-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":28,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결되어 있는 것은?","opts":["성숙한 인격 - 올포트(Allport)","생산적인 사람 - 매슬로우(Maslow)","합리적 모험가 - 프롬(Fromm)","자아실현인 - 아들러(Adler)"],"ans":[1],"multi":false,"dup":false,"expl":"성숙한 인격-올포트가 바른 연결이다. 프롬은 생산적인 사람, 매슬로는 자아실현인, 아들러는 사회적 관심이다.","src":"E"},{"id":"E2017-2-29-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":29,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 교사, 간호사, 종교지도자","실제적 유형 - 정치가, 영업사원, 광고업자","탐구적 유형 - 회계사, 은행원, 사무원","관습적 유형 - 기술자, 정비사, 의료기사"],"ans":[1],"multi":false,"dup":false,"expl":"사회적 유형-교사·간호사·종교지도자가 바른 연결이다.","src":"E"},{"id":"E2017-2-29-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":29,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 정치가, 영업사원, 광고업자","실제적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 회계사, 은행원, 사무원","탐구적 유형 - 기술자, 정비사, 의료기사"],"ans":[3],"multi":false,"dup":false,"expl":"관습적 유형-회계사·은행원·사무원이 바른 연결이다. 사회적은 교사·간호사, 실제적은 기술자·정비사, 탐구적은 과학자다.","src":"E"},{"id":"E2017-2-30-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":30,"stem":"다음 중 생활지도의 일반적 목표로 보기에 가장 적합치 않은 것은?","opts":["자신에 대한 올바른 이해","잠재가능성의 실현","전인적 발달의 촉진","특정한 문제의 해결"],"ans":[4],"multi":false,"dup":false,"expl":"생활지도의 일반적 목표는 자기이해, 잠재가능성 실현, 전인적 발달이다. 특정 문제의 해결은 상담의 목표에 가깝다.","src":"E"},{"id":"E2017-2-30-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":30,"stem":"다음 중 그 측정하는 ‘내용’이 다른 한 가지 검사는?","opts":["주제통각검사","로샤 검사","군대알파검사","다면인성검사"],"ans":[3],"multi":false,"dup":false,"expl":"군대알파 검사는 지능검사이고, 주제통각·로샤·다면인성검사(MMPI)는 성격검사다.","src":"E"},{"id":"E2017-2-31-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":31,"stem":"다음 중 ‘표준화 심리검사’와 가장 거리가 먼 것은?","opts":["전문적 제작과정","상식적 이해 방법","검사 조건의 표준화","규준(norm)의 설정"],"ans":[2],"multi":false,"dup":false,"expl":"표준화 심리검사는 전문적 제작과정, 검사조건의 표준화, 규준 설정을 갖추며 상식적 이해 방법과는 거리가 멀다.","src":"E"},{"id":"E2017-2-31-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":31,"stem":"진로지도와 관련된 이론 중, 인간은 자신의 이익을 극대화하고 손실을 최소화하는 방향으로 행동한다는 케인즈의 경제이론에 바탕을 두고 있는 이론은?","opts":["특성이론","사회이론","심리이론","의사결정이론"],"ans":[4],"multi":false,"dup":false,"expl":"이익 극대화·손실 최소화의 경제적 합리성을 바탕에 둔 진로지도 이론은 의사결정이론이다.","src":"E"},{"id":"E2017-2-32-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":32,"stem":"다음 중 직업에 대한 지식․태도․기능이 어려서부터 성인기까지 발달한다는 관점을 취하고 있는 이론가는?","opts":["긴츠버그(Ginzberg)","로우(Roe)","홀랜드(Holland)","윌리암슨(Williamson)"],"ans":[1],"multi":false,"dup":false,"expl":"직업에 대한 지식·태도·기능이 어려서부터 성인기까지 발달한다고 본 이론가는 긴츠버그다.","src":"E"},{"id":"E2017-2-32-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":32,"stem":"정신분석이론에서 내담자가 초기 아동기에 어떤 중요한 타인과의 관계에서 느꼈던 감정을 현재의 상담자에게도 느끼는 것을 의미하는 개념은?","opts":["전이","훈습","자유연상","저항"],"ans":[1],"multi":false,"dup":true,"expl":"초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 옮겨 느끼는 것은 전이(transference)다. 반대로 상담자가 내담자에게 느끼는 감정은 역전이다.","src":"E"},{"id":"E2017-2-33-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":33,"stem":"다음 중 행동수정이론에서 가정하고 있는 인간관에 해당하는 것은?","opts":["인간은 끊임없이 갈등하는 존재다","자율적인 인간이란 없다","인간은 합리적이고 건설적이며 합목적적인 존재이다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다"],"ans":[2],"multi":false,"dup":false,"expl":"행동수정이론은 인간행동의 원인을 외부 환경에서 찾으며 자율적인 인간을 가정하지 않는다.","src":"E"},{"id":"E2017-2-33-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":33,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 C는 무엇을 의미하는가?","opts":["신념","정서적․행동적 결과","선행 사건","논리적 반박"],"ans":[2],"multi":false,"dup":false,"expl":"ABCD기법에서 C는 정서적·행동적 결과다.","src":"E"},{"id":"E2017-2-34-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":34,"stem":"내담자와 대화를 하면서 대화에 진전이 없을 때나 상담자와 내담자간에 긴장이 있을 경우에, 상담자가 현재 내적으로 경험하는 것을 활용하여 ‘현재’와 ‘대인관계’의 측면에서 피드백을 주는 것을 특히 무엇이라고 하는가?","opts":["즉시성","자아개방","직면","명료화"],"ans":[1],"multi":false,"dup":false,"expl":"지금-여기에서의 대인관계와 상담자 자신의 내적 경험을 피드백하는 기법은 즉시성이다.","src":"E"},{"id":"E2017-2-34-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":34,"stem":"월페(Wolpe)에 의해 제안된 것으로서 불안과 양립할 수 없는 이완반응을 이끌어낸 다음 불안을 유발시키는 경험을 상상하게 함으로써 불안유발자극의 영향을 약화시키는 방법은?","opts":["체계적 둔감법","토큰 강화","저항의 해석","혐오자극의 제공"],"ans":[1],"multi":false,"dup":false,"expl":"이완반응과 불안을 양립시켜 불안을 약화시키는 월페의 기법은 체계적 둔감법이다.","src":"E"},{"id":"E2017-2-35-1","set":"2017-2-기말-1학년","year":2017,"kind":"기말","grade":"1학년","no":35,"stem":"행동수정의 진행과정에서 강화를 주어야 할 행동과 말아야 할 행동을 구분해주는 기준이 되는 것은?","opts":["일차 강화자극","이차 강화자극","불안 유발자극","기초선 수준"],"ans":[4],"multi":false,"dup":false,"expl":"강화 대상 행동을 가려내는 기준은 기초선 수준이다.","src":"E"},{"id":"E2017-2-35-3","set":"2017-2-기말-3학년","year":2017,"kind":"기말","grade":"3학년","no":35,"stem":"로저스(Rogers)의 인간중심 상담이론에서 말하는, 효율적인 상담관계를 형성하기 위하여 상담자가 제공하는 태도조건으로 보기 어려운 것은?","opts":["공감적 이해","일치","수용","동정"],"ans":[4],"multi":false,"dup":false,"expl":"로저스의 태도조건은 일치·무조건적 수용·공감적 이해이며 동정은 포함되지 않는다.","src":"E"},{"id":"E2017-H-01-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":1,"stem":"후기 현대철학의 인식론적 관점과 가장 가까운 것은?","opts":["자연이나 신에 의해 주어진, 변화하지 않으며 절대 고정된 인간의 본질이 존재한다","절대 객관적인 지식으로서의 진리를 파악하는 것이 가능하다","인간의 인식과 지식은 인간의 관심, 신념, 가치관에 기초하여 세계를 해석하고 탐구한 결과로 이루어지는 것이다","인간인식에 있어서 궁극적이고 절대적인 기초가 존재한다"],"ans":[3],"multi":false,"dup":false,"expl":"후기 현대철학은 지식을 인간의 관심·신념·가치관에 기초한 해석의 결과로 본다.","src":"E"},{"id":"E2017-H-02-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":2,"stem":"개인은 사회가 제시하는 기존의 지식체계나 신념체계를 수동적으로 수용하고, 그에 적응해나가야 하는 존재라고 여기는 교육관은?","opts":["실존주의 교육관","진보주의 교육관","자연주의 교육관","전통적 교육관"],"ans":[4],"multi":false,"dup":true,"expl":"기존의 지식·신념체계를 수동적으로 수용하는 존재로 보는 교육관은 전통적 교육관이다.","src":"E"},{"id":"E2017-H-03-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":3,"stem":"다음 중 연결이 적절한 것은?","opts":["자연주의 교육관 - 스키너(Skinner)","진보주의 교육관 - 틸리히(Tillich)","실존주의 교육관 - 부버(Buber)","행동주의 교육관 - 루소(Rousseau)"],"ans":[3],"multi":false,"dup":true,"expl":"실존주의 교육관은 부버(Buber)·틸리히 등과 연결된다. 자연주의는 루소, 행동주의는 스키너, 진보주의는 듀이와 연결되므로 ①·②·④는 잘못된 연결이다.","src":"E"},{"id":"E2017-H-04-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":4,"stem":"공학적 교육관과 가장 거리가 먼 것은?","opts":["교육의 과정은 투입-가공-산출 모형으로 설명할 수 있다","교사와 학생의 관계는 전달, 주입, 통제의 관계로 간주된다","교수-학습의 효율성과 성취도의 평가가 강조된다","교사는 교육목표의 설정이라는 가치판단의 주체이다"],"ans":[4],"multi":false,"dup":true,"expl":"공학적 교육관은 교육을 투입-가공-산출의 체제로 보고 교사를 목표 달성을 위한 기술자·관리자로 본다. 따라서 교사가 교육목표 설정의 가치판단 주체라는 진술이 공학적 교육관과 가장 거리가 멀다. ①·③·④는 모두 공학적 교육관의 특징이다.","src":"E"},{"id":"E2017-H-05-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":5,"stem":"다음 중 교육이 이루어지는 과정을 순서대로 나열한 것은?","opts":["교육목표의 설정 → 교육내용 선정과 조직 → 교수-학습 → 평가","교육내용 선정과 조직 → 교육목표의 설정 → 교수-학습 → 평가","교육목표의 설정 → 교수-학습 → 교육내용 선정과 조직 → 평가","교육내용 선정과 조직 → 교수-학습 → 교육목표의 설정 → 평가"],"ans":[1],"multi":false,"dup":true,"expl":"교육의 과정은 교육목표의 설정 → 교육내용의 선정과 조직 → 교수-학습 → 평가 순으로 이루어진다. 목표가 먼저 서고 그에 따라 내용을 조직한 뒤 실제 수업과 평가가 뒤따른다.","src":"E"},{"id":"E2017-H-06-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":6,"stem":"수학 교과에서 배운 내용이 과학 교과에서 활용될 수 있도록 교육내용을 선정하고 조직하는 것과 가장 가까운 것은?","opts":["계속성의 원리","통합성의 원리","계열성의 원리","일관성의 원리"],"ans":[2],"multi":false,"dup":false,"expl":"다른 교과에서 배운 내용을 활용하도록 조직하는 것은 통합성의 원리다.","src":"E"},{"id":"E2017-H-07-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":7,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 탈학교 교육론","매슬로(Maslow) - 주형으로서의 교육관","렝그랑(Lengrand) - 프로그램 수업","구스리(Guthrie) - 평생교육"],"ans":[1],"multi":false,"dup":true,"expl":"일리치-탈학교 교육론이 바른 연결이다. 매슬로는 자아실현, 렝그랑은 평생교육과 연결된다.","src":"E"},{"id":"E2017-H-08-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":8,"stem":"고전적 조건형성이론에 대한 다음 설명 중 가장 적절하지 않은 것은?","opts":["음식물에 대한 개의 타액 분비는 무조건적인 것이다","조건형성된 반응이 없어지는 소거는 학습되는 것이다","중성자극이었던 종소리는 무조건자극과 짝지워짐으로써 조건자극이 된다","손다이크에 의해 처음 체계적으로 이론화되었다"],"ans":[4],"multi":false,"dup":true,"expl":"고전적 조건형성을 처음 체계화한 것은 파블로프이지 손다이크가 아니다.","src":"E"},{"id":"E2017-H-09-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":9,"stem":"공부는 거의 하지 않고 하루 종일 컴퓨터 게임만 하는 아이의 공부하는 행동을 늘리기 위하여, 일정 시간의 공부를 하면 아이가 좋아하는 컴퓨터 게임을 일정 시간동안 할 수 있도록 해주는 것과 관련이 깊은 행동수정 방법은?","opts":["토큰 강화","범람법","프리맥의 원리","소거의 원리"],"ans":[3],"multi":false,"dup":true,"expl":"빈도가 높은 행동(게임)을 강화물로 삼아 빈도가 낮은 행동(공부)을 늘리는 것은 프리맥의 원리다. 범람법은 불안 치료 기법, 토큰 강화는 상징적 강화물을 쓰는 방법, 소거는 강화를 중단하는 것이다.","src":"E"},{"id":"E2017-H-10-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":10,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["사회학습 - 대리강화","고전적 조건형성 - 통찰","모델링 - 컴퓨터 보조학습","인지학습 - 부분강화계획"],"ans":[1],"multi":false,"dup":true,"expl":"사회학습-대리강화가 바른 연결이다. 고전적 조건형성은 통찰과 무관하고, 모델링은 관찰학습이다.","src":"E"},{"id":"E2017-H-11-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":11,"stem":"어떤 아이가 어른에게 인사를 하였더니 그 어른으로부터 칭찬을 받았다. 그 이후 이 아이는 어른을 보면 인사하는 행동을 자주 하게 되었다. 이와 가장 관련이 있는 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","반복의 법칙"],"ans":[2],"multi":false,"dup":true,"expl":"칭찬이라는 결과가 행동을 강화해 반복하게 만든 것은 효과의 법칙이다.","src":"E"},{"id":"E2017-H-12-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":12,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":true,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이며, 행동이 안정된 뒤에는 간헐적(부분) 강화로 옮겨 간다. 자기 강화·대리 강화는 초기 습득 단계의 강화 방법이 아니다.","src":"E"},{"id":"E2017-H-13-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":13,"stem":"카지노에 있는 도박기계인 슬로트머신에 적용된 강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[4],"multi":false,"dup":true,"expl":"슬로트머신은 예측할 수 없는 변동비율 강화계획을 따른다.","src":"E"},{"id":"E2017-H-14-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":14,"stem":"에릭슨(Erikson)의 성격발달 각 단계에서 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["근면성 - 침체감","자율성 - 수치감","주도성 - 고립감","자아정체성 - 절망감"],"ans":[2],"multi":false,"dup":false,"expl":"자율성-수치감이 바른 짝이다. 근면성은 열등감, 주도성은 죄책감, 자아정체성은 역할혼돈과 짝지어진다.","src":"E"},{"id":"E2017-H-15-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":15,"stem":"피아제(Piaget)의 인지발달단계 중 분류조작과 서열조작 능력을 갖추기 시작하는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[3],"multi":false,"dup":false,"expl":"분류·서열조작이 가능해지는 단계는 구체적 조작기다.","src":"E"},{"id":"E2017-H-16-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":16,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["퀠러(Köhler) - 억압 이론","에빙하우스(Ebbinghaus) - 망각곡선","레빈(Lewin) - 모방학습","스키너(Skinner) - 통찰학습"],"ans":[2],"multi":false,"dup":false,"expl":"에빙하우스-망각곡선이 바른 연결이다. 쾰러는 통찰, 레빈은 장이론, 스키너는 조작적 조건형성이다.","src":"E"},{"id":"E2017-H-17-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":17,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["장기기억 - 유목별 군집화","작업기억 - 음악 감상","감각기억 - 논리적 추론","단기기억 - 영화 감상"],"ans":[1],"multi":false,"dup":true,"expl":"장기기억-유목별 군집화가 바른 연결이다. 논리적 추론은 작업기억, 감각기억은 순간적 감각 저장이다.","src":"E"},{"id":"E2017-H-18-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":18,"stem":"망각의 원인에 관한 다음 설명 중 억압이론에 관한 설명은?","opts":["기억된 정보는 사용하지 않으면 않을수록 점점 망각하게 되어 있다","순행성 간섭과 역행성 간섭은 그 좋은 예이다","정신분석이론에 근거하고 있다","파지를 방해하는 외부적 영향 때문에 망각이 촉진된다"],"ans":[3],"multi":false,"dup":true,"expl":"억압이론은 정신분석이론에 근거해 불쾌한 기억이 무의식으로 억압된다고 본다.","src":"E"},{"id":"E2017-H-19-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":19,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 영어 시간에 배운 내용 때문에 불어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[2],"multi":false,"dup":true,"expl":"먼저 배운 영어가 나중에 배운 불어의 기억을 방해한 것은 순행성 간섭이다. 역행성 간섭은 나중 학습이 먼저 학습을 방해하는 경우다.","src":"E"},{"id":"E2017-H-20-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":20,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 7가지 기초정신능력","서스턴(Thurstone) - 일반요인, 특수요인","스피어만(Spearman) - 유동성 지능, 결정성 지능","길포드(Guilford) - 180가지 요소설"],"ans":[4],"multi":false,"dup":true,"expl":"길포드는 지능을 조작×내용×결과의 180가지 요소로 분석한 요소설을 주장했다. 커텔은 유동성·결정성, 서스턴은 7가지 기초정신능력, 스피어만은 일반·특수요인이다.","src":"E"},{"id":"E2017-H-21-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":21,"stem":"다음 중 결정성 지능에 해당하지 않는 것은?","opts":["언어유추능력","어휘이해력","일반 지식","수리력"],"ans":[1],"multi":false,"dup":true,"expl":"언어유추능력은 유동성 지능에 해당한다. 어휘·상식·수리는 결정성 지능이다.","src":"E"},{"id":"E2017-H-22-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":22,"stem":"스턴버그(Sternberg)의 삼원지능이론에 의하면 어떤 사태에든 잘 적응하는 사람은 지능의 어떤 요소가 특별히 강하다고 할 수 있는가?","opts":["성분적 요소","맥락적 요소","논리적 요소","경험적 요소"],"ans":[2],"multi":false,"dup":false,"expl":"스턴버그 삼원지능의 맥락적 요소는 환경에 적응·선택·조형하는 능력이다.","src":"E"},{"id":"E2017-H-23-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":23,"stem":"평균이 100이고 표준편차가 15인 지능검사에서 I.Q. 100∼115에 해당하는 정상인구의 비율은 정상분포곡선 하에서 어느 정도인가?","opts":["약 50%","약 68%","약 95%","약 34%"],"ans":[4],"multi":false,"dup":false,"expl":"정상분포에서 평균(100)에서 +1SD(115)까지는 약 34%다.","src":"E"},{"id":"E2017-H-24-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":24,"stem":"다음 중 창의적이고 자발적인 사람의 특징과 가장 거리가 먼 것은?","opts":["사회문화적 구속에 동조 또는 수동적으로 반응하지 않는다","타인에게 인정받는 데 연연해하지 않는다","어떤 정해진 지침에 따라 삶을 살아나간다","새로운 도전이나 자극을 추구한다"],"ans":[3],"multi":false,"dup":true,"expl":"정해진 지침에 따라 사는 것은 창의적·자발적 사람의 특징과 가장 거리가 멀다.","src":"E"},{"id":"E2017-H-25-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":25,"stem":"프로이트(Freud)의 정신역동이론에 의하면 초자아가 발달하기 시작하는 시기는?","opts":["구강기","항문기","남근기","생식기"],"ans":[3],"multi":false,"dup":false,"expl":"초자아가 발달하기 시작하는 시기는 남근기(3~5세)다.","src":"E"},{"id":"E2017-H-26-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":26,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["원초아 - 현실 원리","자아 - 이차 과정","죽음의 본능 - 리비도(libido)","초자아 - 일차 과정"],"ans":[2],"multi":false,"dup":true,"expl":"자아-이차 과정이 바른 연결이다. 원초아는 1차 과정·쾌락원리, 초자아는 도덕원리를 따른다.","src":"E"},{"id":"E2017-H-27-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":27,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 결핍욕구에 해당하는 것은?","opts":["자아실현 욕구","자존 욕구","지적 욕구","심미적 욕구"],"ans":[2],"multi":false,"dup":true,"expl":"결핍욕구에는 자존 욕구가 속한다. 자아실현·지적·심미적 욕구는 성장욕구다.","src":"E"},{"id":"E2017-H-28-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":28,"stem":"공격성에 대한 다음 설명 중 사회학습이론의 관점에 해당하는 것은?","opts":["공격적 행동에 대한 직접적 보상은 행동을 반복하게 한다","공격성은 선천적으로 가지고 태어나는 것이다","남의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 관찰함으로써 학습된다"],"ans":[4],"multi":false,"dup":true,"expl":"공격성이 공격적인 남의 행동을 관찰함으로써 학습된다는 것은 사회학습이론의 관점이다.","src":"E"},{"id":"E2017-H-29-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":29,"stem":"팔이나 다리의 근육과 같이 우리의 의지에 의해 조절되는 것들을 관장하는 신경계는?","opts":["체성신경계","자율신경계","교감신경계","부교감신경계"],"ans":[1],"multi":false,"dup":true,"expl":"팔·다리 근육처럼 의지로 조절되는 골격근을 관장하는 것은 체성신경계다. 자율신경계(교감·부교감)는 의지와 무관하게 내장 기관을 조절한다.","src":"E"},{"id":"E2017-H-30-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":30,"stem":"어떤 남자 아이가 ‘인형을 가지고 노는 것은 여자의 행동’이라고 생각하지만, 사실 자기는 인형을 가지고 노는 것을 좋아할 때 경험하는 갈등과 가장 관련이 깊은 개념은?","opts":["내적 통제사고","외적 통제사고","상상적 청중","인지적 부조화"],"ans":[4],"multi":false,"dup":true,"expl":"자신의 행동과 성역할 신념이 서로 어긋날 때 느끼는 불편한 심리 상태는 인지적 부조화다.","src":"E"},{"id":"E2017-H-31-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":31,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 후인습적 수준(post-conventional period)의 발달단계에 해당하는 것은?","opts":["처벌과 복종 지향","사회적 계약 지향","법과 질서 지향","도구적 상대주의 지향"],"ans":[2],"multi":false,"dup":true,"expl":"후인습적 수준에는 사회적 계약 지향, 보편적 원리 지향이 속한다.","src":"E"},{"id":"E2017-H-32-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":32,"stem":"건강한 인간의 모습과 그것을 주장하고 있는 학자가 가장 적절하게 연결되어 있는 것은?","opts":["생산적인 사람 - 프롬(Fromm)","성숙한 인격 - 매슬로우(Maslow)","합리적 모험가 - 올포트(Allport)","자아실현인 - 아들러(Adler)"],"ans":[1],"multi":false,"dup":true,"expl":"생산적인 사람-프롬이 바른 연결이다. 매슬로는 자아실현인, 올포트는 성숙한 인격, 아들러는 사회적 관심이다.","src":"E"},{"id":"E2017-H-33-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":33,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 보기 어려운 것은?","opts":["경험에의 개방성","실존적 삶","유기체적 신뢰","동조성"],"ans":[4],"multi":false,"dup":true,"expl":"충분히 기능하는 사람의 특징은 경험에의 개방성·실존적 삶·유기체적 신뢰이며 동조성은 해당하지 않는다.","src":"E"},{"id":"E2017-H-34-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":34,"stem":"직업에 대한 다음 설명 중 가장 적절한 것은?","opts":["직업은 개인의 성격형성과는 무관하다","직업은 취미로 하는 활동을 말한다","직업은 반드시 일, 즉 노동행위를 포함하고 있다","직업은 사회적 책무성이 결여되어 있어야 한다"],"ans":[3],"multi":false,"dup":true,"expl":"직업은 노동행위를 포함하며 사회적 책무성을 지니고 개인의 성격 형성과도 관련된다.","src":"E"},{"id":"E2017-H-35-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":35,"stem":"수퍼(Super)의 직업의식 발달단계가 순서대로 나열된 것은?","opts":["성장기 → 탐색기 → 확립기 → 유지기 → 쇠퇴기","탐색기 → 성장기 → 확립기 → 유지기 → 쇠퇴기","성장기 → 탐색기 → 유지기 → 확립기 → 쇠퇴기","탐색기 → 성장기 → 유지기 → 확립기 → 쇠퇴기"],"ans":[1],"multi":false,"dup":true,"expl":"수퍼의 직업의식 발달단계는 성장기→탐색기→확립기→유지기→쇠퇴기 순이다.","src":"E"},{"id":"E2017-H-36-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":36,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 정치가, 영업사원, 광고업자","실제적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 회계사, 은행원, 사무원","탐구적 유형 - 기술자, 정비사, 의료기사"],"ans":[3],"multi":false,"dup":true,"expl":"관습적 유형-회계사·은행원·사무원이 바른 연결이다. 사회적은 교사·간호사, 실제적은 기술자·정비사, 탐구적은 과학자다.","src":"E"},{"id":"E2017-H-37-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":37,"stem":"다음 중 ‘표준화 심리검사’와 가장 거리가 먼 것은?","opts":["규준(norm)의 설정","전문적 제작과정","검사 조건의 표준화","상식적 인간이해 방법"],"ans":[4],"multi":false,"dup":true,"expl":"표준화 심리검사는 전문적 제작, 조건의 표준화, 규준 설정을 갖추며 상식적 인간이해 방법과는 거리가 멀다.","src":"E"},{"id":"E2017-H-38-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":38,"stem":"다음 중 그 측정하는 ‘내용’이 다른 한 가지 검사는?","opts":["주제통각검사","군대알파검사","로샤 검사","다면인성검사"],"ans":[2],"multi":false,"dup":true,"expl":"군대알파 검사는 지능검사이고, 주제통각·로샤·다면인성검사(MMPI)는 성격검사다.","src":"E"},{"id":"E2017-H-39-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":39,"stem":"다음 중 생활지도의 일반적 목표로 보기에 가장 적합치 않은 것은?","opts":["자신에 대한 올바른 이해","잠재가능성의 실현","특정한 문제의 해결","전인적 발달의 촉진"],"ans":[3],"multi":false,"dup":true,"expl":"생활지도의 일반적 목표는 자기이해, 잠재가능성 실현, 전인적 발달이다. 특정 문제의 해결은 상담의 목표에 가깝다.","src":"E"},{"id":"E2017-H-40-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":40,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["사회이론 - 윌리엄슨(Williamson)","의사결정이론 - 보딘(Bordin)","심리이론 - 로우(Roe)","특성이론 - 겔라트(Gelatt)"],"ans":[3],"multi":false,"dup":true,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2017-H-41-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":41,"stem":"다음 중 집단상담에 가장 적합한 사람은?","opts":["매우 복잡한 위기의 문제를 가지고 있어서 심층적인 탐색이 필요한 사람","사회적 기술을 습득할 필요가 있는 사람","여러 사람 앞에서 이야기하는 것을 두려워하는 사람","남의 인정에 대한 욕구가 강해서 집단을 혼자 주도할 가능성이 있는 사람"],"ans":[2],"multi":false,"dup":true,"expl":"집단상담은 사회적 기술 습득이나 인간관계 훈련이 필요한 사람에게 적합하다. 심층적 위기 탐색은 개인상담이 적합하다.","src":"E"},{"id":"E2017-H-42-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":42,"stem":"정신분석이론에서 내담자가 초기 아동기에 어떤 중요한 타인과의 관계에서 느꼈던 감정을 현재의 상담자에게도 느끼는 것을 의미하는 개념은?","opts":["전이","훈습","자유연상","저항"],"ans":[1],"multi":false,"dup":true,"expl":"초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 옮겨 느끼는 것은 전이(transference)다. 반대로 상담자가 내담자에게 느끼는 감정은 역전이다.","src":"E"},{"id":"E2017-H-43-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":43,"stem":"다음 중 행동수정이론에서 가정하고 있는 인간관에 해당하는 것은?","opts":["인간은 끊임없이 갈등하는 존재다","자율적인 인간이란 없다","인간은 합리적이고 건설적이며 합목적적인 존재이다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다"],"ans":[2],"multi":false,"dup":true,"expl":"행동수정이론은 인간행동의 원인을 외부 환경에서 찾으며 자율적인 인간을 가정하지 않는다.","src":"E"},{"id":"E2017-H-44-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":44,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 C는 무엇을 의미하는가?","opts":["정서적․행동적 결과","신념","선행 사건","논리적 반박"],"ans":[1],"multi":false,"dup":true,"expl":"ABCD기법에서 C는 정서적·행동적 결과다.","src":"E"},{"id":"E2017-H-45-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":45,"stem":"내담자의 비합리적인 신념을 논리적으로 반박하는 과정에서 사용하는 기법 중 이미 일어난 사태의 원인에 대해 새롭게 생각해보도록 하는 기법을 특히 무엇이라고 하는가?","opts":["객관화 기법","재귀인 훈련","자기행동 관찰법","심상활용법"],"ans":[2],"multi":false,"dup":true,"expl":"이미 일어난 사태의 원인을 새롭게 생각하도록 하는 엘리스의 기법은 재귀인 훈련이다.","src":"E"},{"id":"E2017-H-46-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":46,"stem":"로저스(Rogers)의 인간중심 상담이론에서 말하는, 효율적인 상담관계를 형성하기 위하여 상담자가 제공하는 태도조건으로 보기 어려운 것은?","opts":["동정","일치","수용","공감적 이해"],"ans":[1],"multi":false,"dup":true,"expl":"로저스의 태도조건은 일치(진실성), 무조건적 수용, 공감적 이해이며 동정은 포함되지 않는다.","src":"E"},{"id":"E2017-H-47-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":47,"stem":"교사들이 초등학교 저학년을 대상으로 학기초에 스티커 붙이는 종이를 나누어주고, 착한 일을 했거나 발표를 잘 했거나 하면 스티커를 하나씩 상으로 주는 것과 관련된 행동수정기법은?","opts":["부적 강화","범람법","타임 아우트","토큰 강화"],"ans":[4],"multi":false,"dup":true,"expl":"스티커를 상으로 주어 바람직한 행동을 강화하는 것은 토큰 강화다.","src":"E"},{"id":"E2017-H-48-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":48,"stem":"내담자와 대화를 하면서 대화에 진전이 없을 때나 상담자와 내담자간에 긴장이 있을 경우에, 상담자가 현재 내적으로 경험하는 것을 활용하여 ‘현재’와 ‘대인관계’의 측면에서 피드백을 주는 것을 특히 무엇이라고 하는가?","opts":["즉시성","자아개방","직면","명료화"],"ans":[1],"multi":false,"dup":true,"expl":"지금-여기에서의 대인관계와 상담자 자신의 내적 경험을 피드백하는 기법은 즉시성이다.","src":"E"},{"id":"E2017-H-49-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":49,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다"],"ans":[4],"multi":false,"dup":true,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2017-H-50-0","set":"2017-하계","year":2017,"kind":"하계","grade":"전학년","no":50,"stem":"직면은 내담자가 가지고 있는 불일치, 모순 등을 상담자가 기술해 주는 것이다. 직면시켜야 하는 상황으로 가장 적절치 않은 것은?","opts":["내담자의 기대와 현실적 가능성 간에 괴리가 있을 때","내담자의 말과 행동 간에 괴리가 있을 때","내담자의 생각과 상담자의 생각 간에 괴리가 있을 때","내담자의 언어적 메시지와 비언어적 메시지 간에 괴리가 있을 때"],"ans":[3],"multi":false,"dup":true,"expl":"직면은 내담자 내부의 불일치·모순을 다룬다. 내담자와 상담자의 생각이 다르다는 이유로 직면하는 것은 적절하지 않다.","src":"E"},{"id":"E2018-2-01-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 철학․종교적 인간관과 관련이 깊은 것은?","opts":["인간의 정신과 육체는 물질로 이루어져 있다","인간행동은 외부 자극에 대한 습관화된 반응이다","인간의 고유한 형상은 이성이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[3],"multi":false,"dup":false,"expl":"마리탱의 철학·종교적 인간관은 인간의 고유한 형상이 이성이라고 본다.","src":"E"},{"id":"E2018-2-01-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 과학적 인간관과 가장 거리가 먼 것은?","opts":["인간의 정신과 육체는 물질로 이루어져 있다","인간행동은 외부 자극에 대한 습관화된 반응이다","이성을 실현하는 것이 인간의 최고 행복이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[3],"multi":false,"dup":false,"expl":"이성 실현을 최고의 행복으로 보는 것은 철학·종교적 인간관이다. 마리탱의 과학적 인간관은 인간을 물질세계의 일부로 본다.","src":"E"},{"id":"E2018-2-02-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":2,"stem":"다음 중 후기 현대철학에서 강조되고 있는 인간관으로 보기에 적당한 것은?","opts":["수동적 존재","무규범적 존재","무의식적 존재","자기형성적 존재"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 스스로 자신을 형성해 가는 자기형성적 존재를 강조한다.","src":"E"},{"id":"E2018-2-02-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":2,"stem":"후기 현대철학적 인간이해의 관점이 교육과 관련하여 우리에게 주는 시사점으로 볼 수 있는 것은?","opts":["교육은 경험의 끊임없는 재구성을 통해 개인이 성장해 갈 수 있도록 도와주는 과정이다","교육의 과정은 투입-가공-산출이라는 공학적 모형에 의해 설명될 수 있다","교육목표보다는 교수-학습의 효율성과 성취도의 평가를 강조할 필요가 있다","교육은 가치중립적인 활동이다"],"ans":[1],"multi":false,"dup":false,"expl":"후기 현대철학은 경험의 끊임없는 재구성을 통한 개인의 성장을 교육의 핵심으로 본다. 가치중립성·공학적 모형은 전통적·과학적 관점이다.","src":"E"},{"id":"E2018-2-03-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":3,"stem":"공학적 교육관과 가장 거리가 먼 것은?","opts":["교육의 과정은 투입-가공-산출 모형으로 설명할 수 있다","교사는 교육목표의 설정이라는 가치판단의 주체이다","교수-학습의 효율성과 성취도의 평가가 강조된다","교사와 학생의 관계는 전달, 주입, 통제의 관계로 간주된다"],"ans":[2],"multi":false,"dup":false,"expl":"공학적 교육관은 교육을 투입-가공-산출의 체제로 보고 교사를 목표 달성을 위한 기술자·관리자로 본다. 따라서 교사가 교육목표 설정의 가치판단 주체라는 진술이 공학적 교육관과 가장 거리가 멀다. ①·③·④는 모두 공학적 교육관의 특징이다.","src":"E"},{"id":"E2018-2-03-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":3,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 주형으로서의 교육관","매슬로(Maslow) - 탈학교 교육론","렝그랑(Lengrand) - 평생교육","피터스(Peters) - 프로그램 수업"],"ans":[3],"multi":false,"dup":false,"expl":"렝그랑-평생교육이 바른 연결이다. 일리치는 탈학교교육론, 매슬로는 자아실현, 피터스는 교육의 기준과 연결된다.","src":"E"},{"id":"E2018-2-04-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":4,"stem":"교육내용을 선정하고 조직할 때 고려해야 할 사항으로 보기에 가장 적절하지 않은 것은?","opts":["통합성","교사에의 타당성","계열성","계속성"],"ans":[2],"multi":false,"dup":false,"expl":"교육내용 선정·조직의 고려 사항은 통합성·계열성·계속성 등이며 교사에의 타당성은 해당하지 않는다.","src":"E"},{"id":"E2018-2-04-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":4,"stem":"교육은 학습자 내부에 잠재해 있는 가능성들이 자연스럽고 올바른 방향으로 커 나갈 수 있도록 도와주는 과정이라고 보는 교육관과 가장 거리가 먼 것은?","opts":["전통적 교육관","진보주의 교육관","자연주의 교육관","실존주의 교육관"],"ans":[1],"multi":false,"dup":false,"expl":"잠재가능성의 자연스러운 발현을 돕는다는 것은 진보주의·자연주의·실존주의 교육관의 공통된 이해다. 전통적 교육관은 교사를 주형으로, 학습자를 재료로 보아 이와 정반대다.","src":"E"},{"id":"E2018-2-05-1","set":"2018-2-기말-1학년","year":2018,"kind":"기말","grade":"1학년","no":5,"stem":"다음 중 진보주의 교육관과 가장 거리가 먼 것은?","opts":["자연주의 교육관","경험중심 교육","실용주의 철학","인간행동의 계획적 변화"],"ans":[4],"multi":false,"dup":false,"expl":"진보주의 교육관은 경험중심·실용주의·자연주의와 통한다. ‘인간행동의 계획적 변화’는 전통적(주형적) 교육관의 특징이므로 진보주의와 가장 거리가 멀다.","src":"E"},{"id":"E2018-2-05-3","set":"2018-2-기말-3학년","year":2018,"kind":"기말","grade":"3학년","no":5,"stem":"현대사회에서 평생교육이 필요한 이유로 가장 타당한 것은?","o
