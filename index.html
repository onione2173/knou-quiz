ti":false,"dup":false,"expl":"프로그램학습은 수행 결과에 따라 다음 학습 과제를 제시하는 개별화 학습으로, 컴퓨터 보조학습(CAI)이 대표적 예이다.","src":"L"},{"id":"L02-16","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":36,"stem":"형태주의 심리학의 창시자와 핵심 개념의 연결로 옳은 것은?","opts":["분트 - 내성법","베르타이머·쾰러·코프카 - 형태(Gestalt)","왓슨 - 자극-반응","에빙하우스 - 망각곡선"],"ans":[2],"multi":false,"dup":false,"expl":"형태주의 심리학은 베르타이머·쾰러·코프카가 창시했고, 전체적인 모양과 조직인 형태(Gestalt)를 중시하며 베르타이머의 파이 현상 논문이 기원이다.","src":"L"},{"id":"L02-17","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":37,"stem":"형태주의의 지각 법칙 네 가지로 바르게 묶인 것은?","opts":["근접성, 유사성, 폐쇄성, 계속성","강화, 소거, 일반화, 변별","주의집중, 파지, 운동재생, 동기유발","부호화, 저장, 인출, 재인"],"ans":[1],"multi":false,"dup":false,"expl":"형태주의의 주요 4가지 법칙은 근접성, 유사성, 폐쇄성(완결성), 계속성(연속성) 법칙이며, 전경과 배경의 법칙도 제시된다.","src":"L"},{"id":"L02-18","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":38,"stem":"쾰러의 통찰학습이론에 대한 설명으로 옳지 않은 것은?","opts":["학습은 단 한 순간의 통찰에 의해 일어난다","통찰은 문제 상황의 중요한 부분들 간 관계가 전체적으로 지각될 때 이루어지기 쉽다","통찰로 얻은 문제해결은 새로운 상황에 적용될 수 있다","통찰에 의한 학습은 오래 유지되지 않고 쉽게 사라진다"],"ans":[4],"multi":false,"dup":false,"expl":"통찰에 의해 문제가 해결되면 그 학습은 상당 기간 유지되고 쉽게 반복될 수 있으며 새로운 상황에도 적용된다.","src":"L"},{"id":"L02-19","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":39,"stem":"레빈의 장(場)이론에 대한 설명으로 가장 옳은 것은?","opts":["인간행동은 과거의 사건에 의해서만 결정된다","장은 개인의 전체적인 생활공간이며 인간행동은 개인과 환경의 상호작용의 산물이다","환경은 개인에게 일방적으로 영향을 미칠 뿐 개인은 환경에 영향을 주지 못한다","학습은 자극과 반응의 결합으로만 설명된다"],"ans":[2],"multi":false,"dup":false,"expl":"장은 개인의 전체적인 생활공간이고, B=f(P×E)처럼 인간행동은 개인의 심성과 환경의 상호작용의 산물이며 장은 항상 현재적 의미를 지닌다.","src":"L"},{"id":"L02-20","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":40,"stem":"반두라의 사회학습이론에서 관찰학습의 과정을 순서대로 나열한 것은?","opts":["주의집중 → 파지 → 운동재생 → 동기유발","파지 → 주의집중 → 동기유발 → 운동재생","동기유발 → 주의집중 → 파지 → 운동재생","운동재생 → 주의집중 → 파지 → 동기유발"],"ans":[1],"multi":false,"dup":false,"expl":"관찰학습은 학습자가 매력 있는 모델에 주의집중하고, 관찰한 것을 언어·심상으로 파지하며, 운동으로 재생하고, 자기강화·대리강화로 동기유발되는 과정을 거친다.","src":"L"},{"id":"L03-01","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":41,"stem":"강의록에 따르면 발달을 구성하는 세 요소로 바르게 묶인 것은?","opts":["성장, 성숙, 학습","유전, 환경, 교육","동화, 조절, 평형","감각, 지각, 사고"],"ans":[1],"multi":false,"dup":false,"expl":"발달은 성장(양적 증가), 성숙(유전적 요인에 의한 변화), 학습(경험에 의한 변화)의 상호작용 결과이며 수정 순간부터 시작된다.","src":"L"},{"id":"L03-02","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":42,"stem":"태내 발달에 영향을 미치는 환경적 요인으로 강의록이 든 것으로 옳지 않은 것은?","opts":["태모의 영양상태와 질병","태모의 정서 상태와 약물 사용","태모의 연령과 환경 공해","태아 자신의 학습 의지"],"ans":[4],"multi":false,"dup":false,"expl":"태내 발달에는 태모의 영양·질병·정서·약물·연령·환경 공해 등이 영향을 미친다.","src":"L"},{"id":"L03-03","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":43,"stem":"인간발달의 주요 원리 중 ‘결정적 시기’에 대한 설명으로 가장 옳은 것은?","opts":["모든 발달 영역이 동시에 완성되는 시기이다","특정 발달 영역이 우세하게 나타나는 시기로, 놓치면 그 영역에 장애를 가져올 수 있다","유전의 영향이 완전히 사라지는 시기이다","학습이 전혀 일어나지 않는 시기이다"],"ans":[2],"multi":false,"dup":false,"expl":"결정적 시기는 특정 발달 영역이 우세하게 나타나는 시기로, 그 시기를 놓치면 해당 영역에 장애가 생길 수 있다.","src":"L"},{"id":"L03-04","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":44,"stem":"발달을 ‘연속적 현상’으로 보는 관점과 ‘단계적 현상’으로 보는 관점의 대비로 옳은 것은?","opts":["연속적 관점은 질적으로 다른 인지구조의 변화를 강조한다","단계적 관점은 인간을 기계에 비유하고 변화를 수동적 반응의 부가로 본다","연속적 관점은 변화를 환경에 대한 수동적 반응이 계속 부가되는 과정으로 본다","단계적 관점은 발달단계가 존재하지 않는다고 본다"],"ans":[3],"multi":false,"dup":false,"expl":"연속적 관점은 인간을 기계에 비유하며 변화를 수동적 반응의 부가로 보는 반면, 단계적 관점은 질적으로 다른 인지구조의 변화와 일정한 순서의 발달단계를 강조한다.","src":"L"},{"id":"L03-05","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":45,"stem":"피아제 이론의 전제로 옳지 않은 것은?","opts":["유기체는 태어날 때부터 적응하려는 힘을 지닌다","지적 적응은 인식 주체와 대상의 상호작용 과정이다","유기체의 적응은 균형 상태를 추구하는 경향이 있다","인지는 성인기에 이르러서야 갑자기 형성된다"],"ans":[4],"multi":false,"dup":false,"expl":"피아제는 인식을 점진적인 진화의 결과로 보며, 적응은 균형 상태를 추구하는 경향을 지닌다고 보았다.","src":"L"},{"id":"L03-06","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":46,"stem":"피아제의 적응 기제에서 동화와 조절에 대한 설명으로 옳은 것은?","opts":["동화는 환경의 영향으로 개인의 조직이 수정되는 과정이다","조절은 외부 요소를 내부 구조 속으로 통합하는 과정이다","동화는 외부 요소를 내부 구조로 통합하고, 조절은 환경의 영향으로 조직이 수정되는 과정이다","동화와 조절은 유아기에만 나타난다"],"ans":[3],"multi":false,"dup":false,"expl":"동화는 외부 요소를 기존 인지구조 속으로 통합하는 것이고, 조절은 환경의 영향으로 기존 조직이 수정되는 과정이며, 둘은 전 생애에 걸쳐 균형을 추구한다.","src":"L"},{"id":"L03-07","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":47,"stem":"피아제 이론에서 ‘도식(schema)’에 대한 설명으로 가장 옳은 것은?","opts":["유기체가 외계의 사물을 인지하고 대응하는 데 사용하는 지각·반응의 틀","환경에 대한 수동적 반응의 총합","지능검사의 표준화된 규준","성격의 무의식적 구조"],"ans":[1],"multi":false,"dup":false,"expl":"도식은 유기체가 사물을 인지하고 대응하는 데 쓰는 ‘세상을 바라보는 눈’이며, 발달 후기에는 인지적 구조를 갖추게 된다.","src":"L"},{"id":"L03-08","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":48,"stem":"감각동작기(0~2세)의 특징으로 옳지 않은 것은?","opts":["언어 발달 전으로 감각과 동작에 의해 학습한다","반사적 행동에서 협응 능력이 발달한다","대상 항구성 개념이 이 단계 말에 발달한다","보존개념과 서열조작이 발달한다"],"ans":[4],"multi":false,"dup":false,"expl":"보존개념과 분류·서열조작은 구체적 조작기의 특징이다. 감각동작기의 말기에는 대상 항구성이 발달한다.","src":"L"},{"id":"L03-09","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":49,"stem":"전조작기(2~6세)의 특징으로 옳은 것은?","opts":["상징적 사고가 가능해지고 자기중심성·중심화·비가역성이 나타난다","가설연역적 사고가 가능하다","보존개념이 완전히 습득된다","분류조작과 서열조작이 가능하다"],"ans":[1],"multi":false,"dup":false,"expl":"전조작기는 언어 발달로 상징적 사고가 가능해지지만 자기중심성, 중심화, 비가역성(보존개념 미발달)의 한계를 지닌다.","src":"L"},{"id":"L03-10","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":50,"stem":"구체적 조작기(6~12세)에 대한 설명으로 가장 옳은 것은?","opts":["추상적 개념만 다룰 수 있고 구체적 사물에는 적용하지 못한다","탈중심화가 이루어지고 구체적·관찰 가능한 사물에 대한 논리적 사고가 가능하다","대상 항구성이 처음 발달하는 단계이다","자기중심적 독백이 가장 활발한 단계이다"],"ans":[2],"multi":false,"dup":false,"expl":"구체적 조작기에는 탈중심화와 보존개념, 분류·서열조작이 발달하지만 논리적 사고는 구체적이고 관찰 가능한 사물과 사건에 적용된다.","src":"L"},{"id":"L03-11","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 성, 지각 속도, 기억력이다.","src":"L"},{"id":"L05-03","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":83,"stem":"길포드가 말한 수렴적 사고와 확산적 사고에 대한 설명으로 옳은 것은?","opts":["수렴적 사고는 다양한 대안을 찾는 사고이고 확산적 사고는 하나의 정답을 찾는 사고다","수렴적 사고는 하나의 정답을 찾기 위해 생각을 모으는 사고이고, 확산적 사고는 다양한 대안을 찾기 위해 생각을 퍼뜨리는 사고다","창의력은 수렴적 사고와 관련이 깊다","두 사고는 길포드와 무관한 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"수렴적 사고는 하나의 정답을 향해 생각을 모으는 방식이고, 확산적 사고는 다양한 가능성 있는 대안을 찾는 방식이며 창의력은 확산적 사고와 관련이 깊다.","src":"L"},{"id":"L05-04","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":84,"stem":"카텔의 유동성 지능에 해당하는 것으로 가장 옳은 것은?","opts":["어휘력","일반적 지식","언어 유추력","수리력"],"ans":[3],"multi":false,"dup":false,"expl":"유동성 지능은 학습된 능력이 아니면서 문화권 보편적인 문제해결 능력으로 언어 유추력, 단순 암기력, 도형지각능력 등이 해당한다.","src":"L"},{"id":"L05-05","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":85,"stem":"최초의 개인용 지능검사와 그 특징의 연결로 옳은 것은?","opts":["비네-시몬 검사 - 정신연령 개념 도입","스탠포드-비네 검사 - 편차 IQ 도입","웩슬러 검사 - 최초의 집단용 검사","Army-α 검사 - 최초의 개인용 검사"],"ans":[1],"multi":false,"dup":false,"expl":"비네-시몬 검사는 1905년 학습부진아 판별을 위해 제작된 최초의 개인용 지능검사로 정신연령 개념을 도입했다.","src":"L"},{"id":"L05-06","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":86,"stem":"비율 IQ를 계산하는 공식과 그 적용상의 한계로 옳은 것은?","opts":["IQ = (생활연령 ÷ 정신연령) × 100, 모든 연령에 적용 가능","IQ = (정신연령 ÷ 생활연령) × 100, 20세 이전 사람에게만 적합","IQ = 100 + Z × 15, 모든 연령에 적용 가능","IQ = (정신연령 × 생활연령) ÷ 100, 20세 이후에만 적합"],"ans":[2],"multi":false,"dup":false,"expl":"비율 IQ는 (정신연령 ÷ 생활연령) × 100이며, 모든 문항을 맞혀도 정신연령이 최대 20세까지만 나오므로 20세 이전 사람에게만 적합하다.","src":"L"},{"id":"L05-07","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":87,"stem":"웩슬러 지능검사가 비네 검사와 구별되는 특징으로 옳지 않은 것은?","opts":["비언어적 지능을 측정하는 수행 검사를 추가했다","언어성 IQ와 동작성 IQ, 전체 IQ를 산출한다","편차 IQ를 도입했다","정신연령 개념을 최초로 도입했다"],"ans":[4],"multi":false,"dup":false,"expl":"정신연령 개념은 비네-시몬 검사가 도입했으며, 웩슬러 검사는 편차 IQ(IQ = 100 + Z×15)를 도입했다.","src":"L"},{"id":"L05-08","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":88,"stem":"편차 IQ에 대한 설명으로 가장 옳은 것은?","opts":["정신연령을 생활연령으로 나누어 계산한다","같은 연령 집단 내에서의 상대적 위치로 지능을 규정하며 평균 100, 표준편차 15의 정상분포를 가정한다","20세 이전에만 적용할 수 있다","언어성 IQ만을 산출한다"],"ans":[2],"multi":false,"dup":false,"expl":"편차 IQ는 한 사람의 지능을 같은 연령 집단 내 상대적 위치로 규정한 것으로, 평균 100·표준편차 15의 정상분포를 가정해 IQ = 100 + Z×15로 산출한다.","src":"L"},{"id":"L05-09","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":89,"stem":"Army-α 검사와 Army-β 검사에 대한 설명으로 옳은 것은?","opts":["최초의 개인용 지능검사이다","최초의 집단용 지능검사로, 알파는 언어성, 베타는 비언어성 검사로 구성되었다","베타 검사는 언어성 검사, 알파 검사는 비언어성 검사이다","제2차 세계대전 때 개발되었다"],"ans":[2],"multi":false,"dup":false,"expl":"Army-α·β 검사는 제1차 세계대전 당시 모병을 위해 제작된 최초의 집단용 지능검사로, 알파는 언어성, 베타는 비언어성 검사다.","src":"L"},{"id":"L05-10","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":90,"stem":"표준화 심리검사의 양호도를 판별하는 가장 중요한 두 기준은?","opts":["신뢰도와 타당도","객관도와 실용도","규준과 표준편차","난이도와 변별도"],"ans":[1],"multi":false,"dup":false,"expl":"신뢰도·타당도·객관도·실용도 중 가장 중요한 두 기준은 신뢰도와 타당도다.","src":"L"},{"id":"L05-11","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":91,"stem":"신뢰도와 타당도의 의미를 바르게 연결한 것은?","opts":["신뢰도 - 검사가 재려는 것을 얼마나 충실히 재는가","타당도 - 얼마나 일관성 있고 오차 없이 측정하는가","신뢰도 - 얼마나 일관성 있고 오차 없이 측정하는가, 타당도 - 재려는 능력과 특성을 얼마나 충실히 재는가","두 개념은 같은 의미로 사용된다"],"ans":[3],"multi":false,"dup":false,"expl":"신뢰도는 측정의 일관성·오차 없는 정도이고, 타당도는 검사가 재려고 하는 능력과 특성을 얼마나 충실하게 재는가를 뜻한다.","src":"L"},{"id":"L05-12","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":92,"stem":"지능검사 점수로 지적 장애와 영재성을 판단하는 통계적 기준으로 옳은 것은?","opts":["평균에서 1 표준편차 이상 떨어진 경우","평균에서 2 표준편차 이상 떨어진 경우로, 대개 70점 이하와 130점 이상","평균에서 3 표준편차 이상 떨어진 경우로, 55점 이하와 145점 이상","평균과 정확히 일치하는 경우"],"ans":[2],"multi":false,"dup":false,"expl":"평균에서 2 표준편차 이상 떨어진 경우를 기준으로 하여 대부분의 지능검사에서 70점 이하는 지적 장애, 130점 이상은 영재로 판정한다.","src":"L"},{"id":"L05-13","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":93,"stem":"지능검사를 활용할 때의 유의점으로 옳지 않은 것은?","opts":["최신 규준을 가진 검사인지 확인한다","점수를 점수 띠(범위)로 생각한다","검사 결과만으로 지적 장애나 영재성을 단정한다","검사 받을 때의 개인적·환경적 요인을 고려해 해석한다"],"ans":[3],"multi":false,"dup":false,"expl":"지능검사는 유일한 기준이 아니며 일상생활·학교생활·학업수행 등 여러 요인을 고려해 판단해야 한다.","src":"L"},{"id":"L05-14","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":94,"stem":"가드너의 다면적 지능이론에 대한 설명으로 가장 옳은 것은?","opts":["언어적·논리수학적 지능만을 중시한다","인간의 지적 활동을 서로 독립적인 분야로 나누어 여러 가지 지능을 구분하고, 다방면에서 각기 머리가 좋을 수 있다고 본다","지능을 일반요인과 특수요인으로 구분한다","지능을 성분·경험·맥락의 세 요소로 설명한다"],"ans":[2],"multi":false,"dup":false,"expl":"가드너는 기존 이론이 언어적·논리수학적 지능만 강조했다고 비판하며, 서로 독립적인 여러 지능을 구분하고 다방면에서 각기 머리가 좋을 수 있다고 주장했다.","src":"L"},{"id":"L05-15","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":95,"stem":"가드너가 1993년에 일곱 가지 지능에 추가한 두 가지 지능은?","opts":["언어 지능과 논리수학 지능","자연관찰 지능과 실존 지능","대인간 지능과 개인내 지능","음악 지능과 공간 지능"],"ans":[2],"multi":false,"dup":false,"expl":"가드너는 1993년 동식물·사물을 관찰해 공통점과 차이를 분석하는 자연관찰 지능과, 존재·삶과 죽음·가치를 철학적·종교적으로 사고하는 실존 지능을 추가했다.","src":"L"},{"id":"L05-16","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":96,"stem":"스턴버그의 삼원지능이론에서 ‘어떤 상황이든 잘 적응하는 사람’에게 특히 강한 요소는?","opts":["성분적 요소","경험적 요소","맥락적 요소","논리적 요소"],"ans":[3],"multi":false,"dup":false,"expl":"맥락적 요소는 현실 상황에의 적응력을 강조하며, 전통적 지능검사 IQ나 학업성적과는 무관하게 어떤 상황이든 잘 적응하는 사람과 관련된다.","src":"L"},{"id":"L05-17","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":97,"stem":"정서지능(감성지능)에 대한 설명으로 옳지 않은 것은?","opts":["살로비와 메이어가 EQ라는 개념을 처음 사용했다","골먼은 정서지능이 성공 가능성을 예측하는 데 중요하다고 보았다","가드너의 대인간 지능·개인내 지능, 스턴버그의 실제적 지능과 유사하다","정서지능은 손다이크가 최초로 제안한 개념으로 사회적 지능과 무관하다"],"ans":[4],"multi":false,"dup":false,"expl":"정서지능은 손다이크가 제안한 사회적 지능의 한 하위 요소로, 자신과 타인의 내부 상태·동기·행동을 인식하고 그 정보에 기초해 적절히 행동하는 능력이다.","src":"L"},{"id":"L05-18","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":98,"stem":"정서지능의 ‘4영역 4수준 16요소’ 모형에 해당하지 않는 영역은?","opts":["정서의 인식과 표현","정서의 사고 촉진","정서 지식의 활용","정서의 억제와 통제"],"ans":[4],"multi":false,"dup":false,"expl":"네 영역은 정서의 인식과 표현, 정서의 사고 촉진, 정서 지식의 활용, 정서의 반영적 조절이다.","src":"L"},{"id":"L05-19","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":99,"stem":"지능과 창의력의 관계에 대한 설명으로 가장 옳은 것은?","opts":["지능은 창의력의 필요조건이자 충분조건이다","지능은 창의력의 필요조건이지만 충분조건은 아니며, 대개 IQ 120 이하에서는 정적 상관을 보인다","지능과 창의력은 항상 부적 상관을 보인다","창의력이 높으면 지능도 반드시 높다"],"ans":[2],"multi":false,"dup":false,"expl":"지능은 창의력의 필요조건이지만 충분조건은 아니며, 대개 IQ 120 이하에서는 정적 상관을 보이지만 그 이상에서는 상관이 거의 없거나 부적 상관을 보인다.","src":"L"},{"id":"L05-20","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":100,"stem":"창의력에 대한 심리측정론적 주장으로 가장 옳은 것은?","opts":["창의력은 하늘이 내린 천재만의 능력이다","창의적 활동은 일종의 승화작용이다","창의력을 구성하는 기본 능력이 있으며 그 능력은 지필검사로 측정할 수 있다","창의적 사고는 보통 사고와 근본적으로 다르다"],"ans":[3],"multi":false,"dup":false,"expl":"길포드를 중심으로 한 심리측정론은 창의력을 구성하는 기본 능력(민감성, 유창성, 독창성, 유연성)이 있고 지필검사로 측정 가능하다고 보았다.","src":"L"},{"id":"L06-01","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":101,"stem":"성격 관련 용어의 연결로 옳지 않은 것은?","opts":["인격(character) - 사회의 도덕·가치·관습과 관련한 성격","기질(temperament) - 생물학적 배경과 관련한 성격","개성(individuality) - 다른 사람과 구분되는 독특한 성격","인성(personality) - 생물학적 유전만을 뜻하는 성격"],"ans":[4],"multi":false,"dup":false,"expl":"인성(personality)은 한 개인이 다른 사람에게 드러내 보이는 전체적인 상으로, 생물학적 유전만을 뜻하지 않는다.","src":"L"},{"id":"L06-02","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":102,"stem":"강의록이 제시한 성격 정의들의 공통점으로 옳지 않은 것은?","opts":["성격은 가설적 조직체이다","성격에는 개인차가 있다","성격은 개인의 생활사·발달사에 비추어 조망해야 한다","성격은 환경에 따라 매 순간 완전히 새로 만들어진다"],"ans":[4],"multi":false,"dup":false,"expl":"성격은 역동적이면서도 항상성을 띠는 고정적 조직체이며, 가설적 조직체이고 개인차가 있으며 생활사·발달사에 비추어 조망해야 한다.","src":"L"},{"id":"L06-03","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":103,"stem":"프로이트의 정신역동이론을 ‘갈등의 심리학’이라 부르는 이유로 가장 옳은 것은?","opts":["인간의 내면이 자연적·생물학적 존재와 사회적·문화적 존재, 원초아·자아·초자아 간의 갈등으로 이루어져 있기 때문","인간이 사회적 규범과 타협하지 않기 때문","무의식이 존재하지 않는다고 보기 때문","인간을 완전히 합리적인 존재로 보기 때문"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 인간의 내면세계를 끊임없이 갈등하는 힘들의 전쟁터로 보았으며, 생물학적 존재와 사회문화적 존재, 원초아·자아·초자아 간의 갈등을 중시했다.","src":"L"},{"id":"L06-04","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":104,"stem":"프로이트 이론의 ‘무의식의 심리학’이라는 특징에 대한 설명으로 가장 옳은 것은?","opts":["인간의 모든 심리적 사상에는 원인이 있으며 그 원인의 대부분은 무의식에 있다","무의식은 의식보다 힘이 약하다","인간행동은 의식적 판단에 의해서만 결정된다","무의식은 성인기에만 형성된다"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 모든 심리적 사상에 반드시 원인이 있고 인간행동의 원인의 대부분은 무의식에 있다고 보았다.","src":"L"},{"id":"L06-05","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":105,"stem":"프로이트의 결정론적 관점에 대한 설명으로 가장 옳은 것은?","opts":["인간은 자유의지로 모든 행동을 결정한다","인간행동은 비합리적 힘, 무의식적 동기, 생애 초기 4~5년의 심리성적 사상에 의해 결정된다","인간행동은 성인기의 합리적 판단에 의해서만 결정된다","인간은 환경의 영향을 받지 않는다"],"ans":[2],"multi":false,"dup":false,"expl":"프로이트는 인간본성에 대해 기본적으로 결정론의 입장을 취하며, 행동이 비합리적 힘과 무의식적 동기, 생애 초기 4~5년의 심리성적 사상에 의해 결정된다고 보았다.","src":"L"},{"id":"L06-06","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":106,"stem":"프로이트가 말한 죽음의 본능에 해당하는 것으로 가장 옳은 것은?","opts":["성 본능","생식 본능","공격 본능","종족 번식 본능"],"ans":[3],"multi":false,"dup":false,"expl":"삶의 본능에는 성·생식·종족 번식 본능이, 죽음의 본능에는 자연회귀 본능과 공격 본능이 속한다.","src":"L"},{"id":"L06-07","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":107,"stem":"원초아(id)의 작동 원리와 과정의 연결로 옳은 것은?","opts":["쾌락원리 - 일차과정","현실원리 - 일차과정","도덕원리 - 이차과정","쾌락원리 - 이차과정"],"ans":[1],"multi":false,"dup":false,"expl":"원초아는 쾌락원리에 따라 일차과정으로 작동하며 정신적 에너지의 저장소 역할을 한다.","src":"L"},{"id":"L06-08","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":108,"stem":"자아(ego)의 기능에 대한 설명으로 가장 옳은 것은?","opts":["도덕적 이상만을 추구하며 현실을 무시한다","현실원리에 따라 이차과정으로 작동하며 원초아와 초자아를 통합·조정하는 중재자 역할을 한다","쾌락원리에 따라 긴장을 즉각 해소한다","부모의 가치를 내면화해 형성된다"],"ans":[2],"multi":false,"dup":false,"expl":"자아는 현실원리에 따라 이차과정으로 작동하며, 원초아의 욕구와 초자아의 도덕적 요구, 현실을 고려해 통합·조정하는 중재자 역할을 한다.","src":"L"},{"id":"L06-09","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":109,"stem":"초자아(superego)에 대한 설명으로 옳지 않은 것은?","opts":["도덕(양심)의 원리를 따른다","현실보다 이상, 쾌락보다 완성을 추구한다","부모의 가치를 내면화함으로써 발달한다","정신적 에너지의 저장소로서 반사작용을 담당한다"],"ans":[4],"multi":false,"dup":false,"expl":"정신적 에너지의 저장소와 반사작용은 원초아의 특징이다.","src":"L"},{"id":"L06-10","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":110,"stem":"프로이트가 말한 신경증적 불안에 대한 설명으로 가장 옳은 것은?","opts":["현실적 근거가 있는 객관적인 불안이다","성적·공격적 충동을 자아가 적절히 조절하지 못해 벌을 받게 될까 봐 느끼는 불안으로 그 원인을 의식하지 못한다","양심의 두려움으로 초자아로부터 벌의 위협을 받을 때 일어난다","공포증과 동일한 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"신경증적 불안은 성적 충동이나 공격적 충동을 자아가 조절하지 못해 벌을 받게 될까 봐 느끼는 불안으로, 그 원인을 개인이 의식하지 못한다.","src":"L"},{"id":"L06-11","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":111,"stem":"도덕적 불안에 대한 설명으로 옳은 것은?","opts":["현실적 근거가 있는 객관적 불안이다","자아가 초자아로부터 벌의 위협을 받을 때 일어나는 양심의 두려움이다","성적 충동이 억압되어 생기는 불안이다","상태불안과 같은 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"도덕적 불안은 자아가 초자아로부터 벌의 위협을 받을 때 일어나는 정서적 반응으로 양심의 두려움이라 할 수 있다.","src":"L"},{"id":"L06-12","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":112,"stem":"방어기제에 대한 설명으로 가장 옳은 것은?","opts":["현실을 정확히 지각하도록 돕는 의식적 기제이다","현실을 거부·왜곡해 지각함으로써 불안으로부터 자아를 보호하는 무의식적 기제이다","그 자체로 항상 부적응적이다","성숙한 사람에게는 나타나지 않는다"],"ans":[2],"multi":false,"dup":false,"expl":"방어기제는 현실을 거부하거나 왜곡해 지각하게 함으로써 불안으로부터 자아를 보호하는 무의식적 작용이며, 그 자체로 부적응적인 것은 아니다.","src":"L"},{"id":"L06-13","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":113,"stem":"방어기제의 수준별 분류에서 성숙한 수준에 해당하는 것으로 묶인 것은?","opts":["지성화, 억압, 전치","투사, 합리화, 행동화","이타심, 유머, 승화","망상적 투사, 부인, 왜곡"],"ans":[3],"multi":false,"dup":false,"expl":"성숙한 수준의 방어기제는 이타심·유머·승화·억제이고, 신경증적 수준은 지성화·억압·전치·반동 형성, 미성숙 수준은 투사·합리화·수동 공격성·행동화, 정신병적 수준은 망상적 투사·부인·왜곡이다.","src":"L"},{"id":"L06-14","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":114,"stem":"프로이트의 심리성적 발달단계에 대한 설명으로 옳은 것은?","opts":["성적 에너지(libido)가 집중되는 부위의 이동에 따라 단계가 명명된다","단계는 청소년기에 시작되어 성인기에 완성된다","성격의 기본 골격은 성인 초기에 형성된다","각 단계의 명칭은 사회적 관계의 범위에 따라 정해진다"],"ans":[1],"multi":false,"dup":false,"expl":"리비도가 집중되는 신체 부위의 이동에 따라 단계가 명명되며, 출생 후 5년 사이에 성격의 기본 골격이 형성된다.","src":"L"},{"id":"L06-15","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":115,"stem":"구강기(0~1세)의 특징으로 옳지 않은 것은?","opts":["입과 입술이 성감대이다","어머니의 젖을 빪으로써 쾌락욕구와 기아욕구를 만족시킨다","원초아가 발달하는 시기이다","배변훈련을 통해 자아가 발달하는 시기이다"],"ans":[4],"multi":false,"dup":false,"expl":"배변훈련을 통한 자아의 발달은 항문기(2~3세)의 특징이다.","src":"L"},{"id":"L06-16","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":116,"stem":"남근기(4~5세)에 대한 설명으로 가장 옳은 것은?","opts":["초자아가 발달하고 오이디푸스 콤플렉스를 경험하며 성 정체감이 형성된다","리비도가 잠복해 지적 흥미가 증가한다","대소변 억제를 통해 자율성을 획득한다","이성에 대해 성숙한 사랑을 표현하는 시기이다"],"ans":[1],"multi":false,"dup":false,"expl":"남근기는 초자아가 발달하고 오이디푸스 콤플렉스를 경험하며, 동성 부모와의 동일시를 통해 성 정체감이 형성되는 시기다.","src":"L"},{"id":"L06-17","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":117,"stem":"잠재기(6~11세)의 특징으로 옳은 것은?","opts":["리비도 에너지가 잠복해 신체적 관심이 줄고 지적 흥미가 증가한다","성적 에너지가 생식기에 집중된다","원초아가 처음 발달한다","오이디푸스 콤플렉스가 가장 강하게 나타난다"],"ans":[1],"multi":false,"dup":false,"expl":"잠재기는 리비도 에너지가 잠복해 신체적 관심이 감소하고 지적 흥미가 증가하며, 환경 적응 기술 습득과 사회적·도덕적 자아 형성이 이루어지는 시기다.","src":"L"},{"id":"L06-18","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":118,"stem":"볼비의 애착이론에 대한 설명으로 가장 옳은 것은?","opts":["애착은 학습된 반응에 불과하다고 본다","인간은 본질적으로 대상을 추구해 애착을 형성하는 존재이며, 초기 경험이 현재의 인간관계에 영향을 준다","애착은 성인기에 처음 형성된다","애착 형성에서 영아는 수동적 존재일 뿐이다"],"ans":[2],"multi":false,"dup":false,"expl":"애착이론은 볼비가 주장한 대상관계이론의 하나로, 인간이 본질적으로 대상을 추구해 애착을 형성하며 초기 경험에 의해 형성된 이미지를 토대로 현재의 인간관계를 맺어간다고 본다.","src":"L"},{"id":"L06-19","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":119,"stem":"애착 형성 단계에 대한 설명으로 옳지 않은 것은?","opts":["1단계(0~3개월) - 인간에 대한 무분별한 반응","2단계(3~6개월) - 요구에 가장 잘 응해 주는 사람에게 애착 형성","3단계(6개월~3세) - 낯가림이나 분리불안이 표출되기도 함","4단계(3세~아동기 말) - 부모와의 분리를 전혀 허용하지 못함"],"ans":[4],"multi":false,"dup":false,"expl":"4단계에서는 부모와의 격리(분리)가 허용되며, 발달 후기에는 애착 대상으로부터 분리·분화되는 것이 필요하다.","src":"L"},{"id":"L06-20","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":120,"stem":"성격의 구조 이론 중 특질이론에 대한 설명으로 가장 옳은 것은?","opts":["여러 상황에서 규칙성과 일관성을 지닌 행동을 나타나게 하는 성향을 다룬다","인간을 외향성-내향성으로만 분류한다","요인분석을 사용하지 않는다","특질은 상황에 따라 완전히 달라진다고 본다"],"ans":[1],"multi":false,"dup":false,"expl":"특질은 여러 상황이나 시기에 걸쳐 규칙성과 일관성을 가진 행동을 나타나게 하는 성향이며, 일반적인 성격검사는 특질이론을 바탕으로 제작된다.","src":"L"},{"id":"L07-01","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":121,"stem":"동기(motivation)에 대한 정의로 가장 옳은 것은?","opts":["유기체의 행동을 활성화하고 행동의 방향을 결정해 주는 힘","행동의 결과로 나타나는 학습의 정도","정서 경험의 생리적 반응","자신의 능력에 대한 자기평가"],"ans":[1],"multi":false,"dup":false,"expl":"동기는 유기체의 행동을 활성화하고 행동의 방향을 결정해 주는 힘으로, 무언가 하고 싶은 마음을 행동으로 나타나게 하는 힘이다.","src":"L"},{"id":"L07-02","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":122,"stem":"머레이(Murray)의 욕구 분류에 대한 설명으로 옳은 것은?","opts":["생리적 욕구는 성취욕구·친애욕구와 같은 2차적 욕구이다","심리적 욕구는 식욕·수면욕과 같은 1차적 욕구이다","성욕은 생리적 욕구이면서 심리적 욕구이기도 하다","머레이는 욕구를 분류하지 않았다"],"ans":[3],"multi":false,"dup":false,"expl":"머레이는 생리적(1차적) 욕구와 심리적(2차적) 욕구를 구분했으며, 성욕은 생리적 욕구이면서 심리적 욕구이기도 하다.","src":"L"},{"id":"L07-03","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":123,"stem":"동기에 대한 정신분석적 접근의 설명으로 가장 옳은 것은?","opts":["인간을 움직이는 힘은 삶의 본능(eros)과 죽음의 본능(thanatos)이다","행동의 원인은 전적으로 외부 환경에 있다","성공과 실패의 귀인 양식이 동기를 결정한다","자기효능감이 동기의 핵심이다"],"ans":[1],"multi":false,"dup":false,"expl":"정신분석적 접근은 갈등의 심리학·무의식의 심리학으로, 인간을 움직이는 힘을 삶의 본능과 죽음의 본능으로 본다.","src":"L"},{"id":"L07-04","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":124,"stem":"동기에 대한 행동주의적 접근의 특징으로 옳은 것은?","opts":["무의식과 내면의 가상적 실체의 존재를 ,"src":"L"},{"id":"L08-01","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":141,"stem":"사회화에 대한 정의로 가장 옳은 것은?","opts":["개인이 속한 사회의 문화를 내면화해 그 사회 구성원으로 요구되는 가치관·태도·신념·행동을 갖추는 과정","개인의 타고난 기질을 그대로 발현하는 과정","사회의 문화를 개인이 새로 창조해 내는 과정","생물학적 성숙만을 의미하는 과정"],"ans":[1],"multi":false,"dup":false,"expl":"사회화는 개인이 속한 사회의 문화를 내면화함으로써 그 사회의 구성원으로서 요구되는 자질, 즉 가치관·태도·신념·행동 등을 갖추는 과정이다.","src":"L"},{"id":"L08-02","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":142,"stem":"개인과 사회의 조화를 위해 개인이 갖추어야 할 특성으로 강의록이 든 것으로 옳지 않은 것은?","opts":["친사회적 이타 행동","유연한 성역할 개념","자기통제력과 도덕성","고정적이고 경직된 성역할 개념"],"ans":[4],"multi":false,"dup":false,"expl":"현대사회에서는 지나치게 고정적인 성역할 개념을 갖는 것이 바람직하지 않으며, 유연한 성역할 개념이 필요하다.","src":"L"},{"id":"L08-03","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":143,"stem":"이타성(altruism)의 의미로 가장 옳은 것은?","opts":["타인을 이용해 자신의 이익을 얻으려는 심리적 특성","타인의 행복과 이익에 관심을 갖고 배려하는 심리적 특성","사회의 규범을 거부하는 심리적 특성","자신의 감정을 억제하는 심리적 특성"],"ans":[2],"multi":false,"dup":false,"expl":"이타성은 타인의 행복과 이익에 관심을 갖고 배려하는 심리적 특성이며, 이것이 행동으로 나타난 것이 친사회적 행동(나누기·돕기·위로하기·협조하기 등)이다.","src":"L"},{"id":"L08-04","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":144,"stem":"아들러가 ‘심리적 건강의 척도’라고 부른 개념으로 옳은 것은?","opts":["자아효능감","사회적 관심","자기통제력","조망수용능력"],"ans":[2],"multi":false,"dup":false,"expl":"이상적인 공동사회의 목표를 달성하고자 타인과 협조·협력하고 봉사하는 것, 즉 사회적 관심을 아들러는 심리적 건강의 척도라고 보았다.","src":"L"},{"id":"L08-05","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":145,"stem":"친사회적 행동의 발달에 대한 설명으로 가장 옳은 것은?","opts":["연령이 증가할수록 친사회적 행동은 감소한다","친사회적 행동은 인간의 본성이며 연령의 증가에 따라 증가하는 경향이 있다","친사회적 행동은 학습되지 않는다","친사회적 행동은 성인기에 처음 나타난다"],"ans":[2],"multi":false,"dup":false,"expl":"친사회적 행동은 인간의 본성이며, 아동이 성장하며 협조의 가치와 방법을 이해하는 인지능력이 발달하기 때문에 연령 증가에 따라 증가하는 경향이 있다.","src":"L"},{"id":"L08-06","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":146,"stem":"친사회적 행동의 촉진요인으로 강의록이 든 것으로 옳지 않은 것은?","opts":["조망수용능력","공감","강화와 모방","공격성"],"ans":[4],"multi":false,"dup":false,"expl":"촉진요인은 조망수용능력, 공감, 강화, 모방 등이며 공격성은 친사회적 행동과 반대된다.","src":"L"},{"id":"L08-07","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":147,"stem":"물리적 조망수용능력과 사회적 조망수용능력에 대한 설명으로 옳은 것은?","opts":["물리적 조망수용능력은 타인의 생각과 감정을 이해하는 능력이다","사회적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이다","물리적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이고, 사회적 조망수용능력은 타인의 생각과 감정을 타인 입장에서 이해하는 능력이다","두 능력은 같은 개념이다"],"ans":[3],"multi":false,"dup":false,"expl":"물리적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이고, 사회적 조망수용능력은 타인의 생각과 감정을 타인의 입장에서 식별·이해하는 능력이다.","src":"L"},{"id":"L08-08","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":148,"stem":"공감에 대한 설명으로 가장 옳은 것은?","opts":["타인의 위치에서 현상을 이해하는 인지적 능력만을 뜻한다","타인의 감정을 식별·이해할 뿐 아니라 같이 경험하고 느끼는 능력이다","공격성을 높이는 요인이다","조망수용능력보다 낮은 차원의 경험이다"],"ans":[2],"multi":false,"dup":false,"expl":"공감은 사회적 조망수용능력보다 한 차원 높은 경험으로, 타인의 감정을 식별·이해할 뿐 아니라 같이 경험하고 느끼는 능력이다.","src":"L"},{"id":"L08-09","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":149,"stem":"성차와 성역할에 대한 설명으로 옳지 않은 것은?","opts":["여성과 남성은 생물학적으로 차이가 있을 뿐 모두 존중받아야 할 인간이다","생물학적 차이를 바탕으로 경험하는 사회문화적 영향은 후천적 차이를 만든다","성역할은 각 개인이 발달과정에서 성별에 적합한 특성·동기·가치·행동을 습득하는 과정과 관련된다","성역할은 생물학적 성에 의해 완전히 결정된다"],"ans":[4],"multi":false,"dup":false,"expl":"성역할은 생물학적 성에 의해 완전히 결정되는 것이 아니라 사회문화적 영향과 후천적 학습을 통해 형성된다.","src":"L"},{"id":"L08-10","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":150,"stem":"성역할 갈등과 인지부조화에 대한 설명으로 옳은 것은?","opts":["남녀가 서로 다른 성역할 개념을 가지고 있을 때 갈등이 발생한다","자신의 신념과 행동이 일치할 때 갈등이 발생한다","성역할 갈등은 인지부조화와 무관하다","고정적인 성역할 개념을 가질수록 갈등이 줄어든다"],"ans":[1],"multi":false,"dup":false,"expl":"남녀가 서로 다른 성역할 개념을 가질 때, 그리고 자신의 신념과 행동 간 괴리를 인식할 때 갈등이 발생한다.","src":"L"},{"id":"L08-11","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":151,"stem":"공격성의 의미에 대한 설명으로 옳은 것은?","opts":["타인에게 이익을 주려는 행동이다","타인 또는 어떤 대상에 고통이나 해를 가 ":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":157,"stem":"죄의식과 수치심에 대한 설명으로 옳은 것은?","opts":["죄의식은 타인이 자신을 부정적으로 평가할 때 일어나는 정서다","수치심은 자신의 행동이 스스로 지켜야 한다고 느끼는 도덕적 가치에 모순되었음을 알 때 일어난다","죄의식은 자신의 행동이 스스로 지켜야 한다고 느끼는 도덕적 가치에 모순되었음을 알 때 일어나는 부정적 자기평가이고, 수치심은 타인의 부정적 평가 또는 그럴 것이라는 생각에서 자기비하를 일으키는 불쾌한 정서다","죄의식과 수치심은 완전히 같은 개념이다"],"ans":[3],"multi":false,"dup":false,"expl":"죄의식은 내적 도덕 기준에 어긋났음을 알 때의 부정적 자기평가이고, 수치심은 타인의 부정적 평가와 관련된 자기비하의 불쾌한 정서적 반응이다.","src":"L"},{"id":"L08-18","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":158,"stem":"피아제의 도덕성 발달이론에 대한 설명으로 가장 옳은 것은?","opts":["성인기까지의 도덕성 발달을 다룬다","타율적 → 호혜적 → 자율적 도덕성 단계로 발달한다고 본다","도덕성 발달은 인지능력과 무관하다고 본다","도덕성 발달단계는 건너뛸 수 있다고 본다"],"ans":[2],"multi":false,"dup":false,"expl":"피아제는 아동기까지의 발달을 다루며 타율적 → 호혜적 → 자율적 도덕성 단계로 발달한다고 보았고, 도덕성 형성·발달이 인지능력 발달과 관련된다고 보았다.","src":"L"},{"id":"L08-19","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":159,"stem":"콜버그의 도덕성 발달이론에 대한 설명으로 옳지 않은 것은?","opts":["피아제의 이론을 청소년기와 성인기까지 확장했다","각 단계는 도덕적 결정을 합리화·정당화하는 ‘사고의 체제’다","발달단계의 순서는 불변이며 단계를 건너뛰는 것은 불가능하다","높은 단계로 갈수록 감정이입은 감소한다"],"ans":[4],"multi":false,"dup":false,"expl":"높은 단계로 갈수록 추상적 사고, 감정이입, 일반적 원리에 근거한 사회문제 해결이 가능해진다.","src":"L"},{"id":"L08-20","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":160,"stem":"콜버그의 인습 수준에 해당하는 단계로 바르게 묶인 것은?","opts":["처벌과 복종 지향, 도구적 상대주의 지향","대인간 조화 지향, 법과 질서 지향","사회적 계약 지향, 보편적 도덕원리 지향","도구적 상대주의 지향, 사회적 계약 지향"],"ans":[2],"multi":false,"dup":false,"expl":"인습 수준은 3단계 대인간 조화 지향과 4단계 법과 질서 지향이며, 전인습 수준은 처벌과 복종·도구적 상대주의, 후인습 수준은 사회적 계약·보편적 도덕원리 지향이다.","src":"L"},{"id":"L09-01","set":"강의록","year":null,"kind":"강의록","lec":9,"lecName":"사회적 존재로서 인간과 교육(2)","no":161,"stem":"청소년기의 신체적 변화에 대한 설명으로 가장 옳은 것은?","opts":["성장 급증과 2차 성징이 나타나며 개인차가 있다","신체적 변화는 모든 청소년에게 동일한 시기에 일어난다","신체상은 학업성취와 무관하다","몸무게에 대한 민감함은 섭식장애와 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"청소년기에는 성장 급증과 2차 성징이 나타나며 신체적 변화의 개인차에 따라 신체상(신체적 자아개념)이 형성된다.","src pts":["현실 여건과 자신의 능력을 고려하지 않고 독단적으로 특정 직업을 선택하며 놀이로 표출한다","흥미·능력·가치를 고려하지만 현실 요인은 고려하지 않는다","직업의 요구 조건과 교육 기회를 고려해 타협한다","정년퇴직을 준비한다"],"ans":[1],"multi":false,"dup":false,"expl":"환상기에는 현실 여건·능력·가능성을 고려하지 않고 독단적으로 직업을 선택하고 놀이활동으로 표출하며, 자기가 원하는 것은 무엇이든 할 수 있다고 믿는다.","src":"L"},{"id":"L11-11","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":211,"stem":"긴즈버그의 잠정기(11~17세)에 대한 설명으로 옳은 것은?","opts":["직업선택에서 흥미·능력·가치가 고려되나 현실적 요인은 고려하지 않아 잠정적 선택 단계라 불린다","현실적 요인을 모두 고려해 진로를 확정한다","직업을 놀이로만 표출한다","이미 선택한 직업에 정착한다"],"ans":[1],"multi":false,"dup":false,"expl":"잠정기에는 흥미·능력·가치가 고려되지만 현실적 요인은 고려되지 않아 잠정적 선택 단계라고 불린다.","src":"L"},{"id":"L11-12","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":212,"stem":"수퍼의 생애진로발달이론에 대한 설명으로 가장 옳은 것은?","opts":["진로발달은 진로에 대한 자아개념의 발달을 의미하며 전 생애에 걸쳐 이루어진다","진로발달은 청소년기에 완성된다","직업선택은 우연에 의해 결정된다","진로발달은 직업선택의 문제만을 다룬다"],"ans":[1],"multi":false,"dup":false,"expl":"수퍼는 진로발달을 진로에 대한 자아개념의 발달로 보았고, 전 생애에 걸쳐 이루어지며 일의 세계와 관련된 다양한 삶의 영역과 역할을 포괄한다고 보았다.","src":"L"},{"id":"L11-13","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":213,"stem":"수퍼의 발달단계 순서로 옳은 것은?","opts":["성장기 → 탐색기 → 확립기 → 유지기 → 쇠퇴기","탐색기 → 성장기 → 확립기 → 유지기 → 쇠퇴기","성장기 → 확립기 → 탐색기 → 쇠퇴기 → 유지기","환상기 → 잠정기 → 현실기 → 확립기 → 쇠퇴기"],"ans":[1],"multi":false,"dup":false,"expl":"수퍼의 단계는 성장기(4~13세) → 탐색기(14~24세) → 확립기(25~44세) → 유지기(45~65세) → 쇠퇴기(65세 이후)다.","src":"L"},{"id":"L11-14","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":214,"stem":"수퍼의 확립기(25~44세)에 대한 설명으로 옳은 것은?","opts":["자신에게 적합한 분야를 발견하고 영구적인 위치를 확보하기 위해 노력한다","학교생활과 시간제 일을 통해 직업적 탐색을 한다","직업전선에서 은퇴해 다른 활동을 찾는다","욕구와 환상이 지배적이다"],"ans":[1],"multi":false,"dup":false,"expl":"확립기는 자신에게 적합한 분야를 발견하고 그 분야에서 영구적인 위치를 확보하기 위해 노력하는 시기다.","src":"L"},{"id":"L11-15","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":215,"stem":"진로 미결정에 대한 설명으로 가장 옳은 것은?","opts":["다양한 진로 관련 의사결정 상황에서 결정을 미루고 있는 상태이다","이미 진로를 결정했으나 실행하지 못하는 상태이다","진로를 결정한 후 전직을 고민하는 상태이다","진로와 무관한 일상적 우유부단함만을 뜻한다"],"ans":[1],"multi":false,"dup":false,"expl":"진로 미결정은 다양한 진로 관련 의사결정 상황에서 결정을 미루고 있는 상태로, 발달 과정상의 자연스러운 미결정과 만성적 우유부단으로 구분된다.","src":"L"},{"id":"L11-16","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":216,"stem":"진로 미결정의 두 가지 유형에 대한 설명으로 옳은 것은?","opts":["발달 과정상의 미결정은 정보 부족으로 아직 확실히 결정하지 못한 자연스러운 상태이다","만성적 우유부단은 정보가 충분해지면 자연히 해소된다","발달 과정상의 미결정은 결정을 내릴 심리적 능력이 결여된 상태이다","두 유형은 같은 개념이다"],"ans":[1],"multi":false,"dup":false,"expl":"발달 과정상의 미결정은 정보가 부족한 상태에서 미래 진로를 확실히 결정하지 못한 자연스러운 현상이고, 만성적 우유부단은 결정을 내리고 행동할 심리적 능력이 결여된 상태다.","src":"L"},{"id":"L11-17","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":217,"stem":"진로 미결정의 원인으로 강의록이 든 것으로 옳지 않은 것은?","opts":["진로의사결정에 참여하려는 동기의 부족","자신과 일의 세계에 대한 정보 부족","내적 갈등과 외적 갈등","지나치게 많은 진로 정보의 완벽한 습득"],"ans":[4],"multi":false,"dup":false,"expl":"진로 미결정의 원인은 동기 부족, 우유부단, 잘못된 진로 신념, 정보 부족, 신뢰할 수 없는 정보, 내적·외적 갈등 등이다.","src":"L"},{"id":"L11-18","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":218,"stem":"진로의사결정에 필요한 정보로 강의록이 든 것으로 옳지 않은 것은?","opts":["능력과 적성","흥미와 관심","성격과 가치관","부모의 경제력"],"ans":[4],"multi":false,"dup":false,"expl":"진로의사결정에는 능력·적성, 흥미·관심, 성격, 가치관 등의 정보가 필요하며 표준화 심리검사를 통한 객관적 이해가 요청된다.","src":"L"},{"id":"L11-19","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":219,"stem":"개인-직업 매칭에 대한 설명으로 가장 옳은 것은?","opts":["자신에 관한 정보만으로 직업을 선택한다","자신과 직업에 관한 정보를 종합적으로 고려해 최선의 직업을 선택하며, 갈등이 있을 때는 절충과 타협이 필요하다","관심과 꿈만 있으면 현실적 여건은 고려할 필요가 없다","생각만 가지고 있으면 실행은 필요 없다"],"ans":[2],"multi":false,"dup":false,"expl":"개인-직업 매칭은 자신과 직업에 관한 정보를 종합해 최선의 직업을 선택하는 것이며, 현실적 가능성·여건·사회문화적 기대와 갈등이 있을 때 절충과 타협이 필요하고 행동으로 실천하는 것이 중요하다.","src":"L"},{"id":"L11-20","set":"강의록","year":null,"kind":"강의록","lec":11,"lecName":"인간: 자아실현을 추구하는 존재(2)","no":220,"stem":"일(work)·직업(occupation)·진로(career)에 대한 설명으로 가장 옳은 것은?","opts":["세 용어는 완전히 같은 뜻으로만 쓰인다","직업은 계속적으로 수행하는 경제 및 사회활동의 종류이고, 진로는 일과 관련된 삶의 경로 전반을 뜻한다","진로는 단 하루의 직업 선택을 뜻한다","일은 반드시 금전적 소득을 전제로만 정의된다"],"ans":[2],"multi":false,"dup":false,"expl":"직업은 개인이 계속 수행하는 경제·사회활동의 종류이고, 진로는 일과 관련된 삶의 경로 전반을 포괄하는 개념으로 설명된다.","src":"L"},{"id":"L12-01","set":"강의록","year":null,"kind":"강의록","lec":12,"lecName":"실천적 교육활동으로서 생활지도(1)","no":221,"stem":"현대 산업사회에서 교육이 지식과 기술의 전수에 급급한 결과로 강의록이 지적한 것은?","opts":["인간교육의 부실·부재를 초래했다","청소년의 학업성취가 급격히 향상되었다","생활지도의 필요성이 줄어들었다","교과지도가 완전히 사라졌다"],"ans":[1],"multi":false,"dup":false,"expl":"지식과 기술의 전수에 급급한 교육은 인간교육의 부실·부재를 초래했고, 이는 청소년 일탈 행동을 부추기는 한 원인이 되었다.","src":"L"},{"id":"L12-02","set":"강의록","year":null,"kind":"강의록","lec":12,"lecName":"실천적 교육활동으로서 생활지도(1)","no":222,"stem":"생활지도의 역할과 기능에 대한 설명으로 옳지 않은 것은?","opts":["청소년이 당면하는 복잡·다양한 문제와 갈등을 치유하는 역할을 한다","사회 구성원으로 만족스럽게 적응할 수 있는 힘을 길러 주는 예방적 기능을 지닌다","인간교육에서 필수적인 활동이다","교과교육을 마친 뒤 여력이 있을 때만 하는 부수적 활동이다"],"ans":[4],"multi":false,"dup":false,"expl":"생활지도는 인간교육에서 필수적인 실천적 교육활동이며, 교과지도에 부수되는 활동이 아니다.","src":"L"},{"id":"L12-03","set":"강의록","year":null,"kind":"강의록","lec":12,"lecName":"실천적 교육활동으로서 생활지도(1)","no":223,"stem":"생활지도의 의미가 교육관에 따라 달라지는 것을 설명한 내용으로 옳지 않은 것은?","opts":["문화유산의 전수·사회화 과정으로 보는 교육관에서는 생활지도의 의미가 달라진다","경제발전·국가발전의 수단으로 보는 교육관에서는 생활지도의 비중이 달라진다","자아실현의 조력과정으로 보는 교육관에서는 그에 맞는 생활지도가 이루어진다","생활지도는 교육관과 무관하게 언제나 동일하게 이루어진다"],"ans":[4],"multi":false,"dup":false,"expl":"생활지도의 의미는 교육을 보는 관점과 교육적 원리에 따라 달라지며, 그에 따라 생활지도도 각기 다른 모습을 띤다.","src":"L"},{"id":"L12-04","set":"강의록","year":null,"kind":"강의록","lec":12,"lecName":"실천적 교육활동으로서 생활지도(1)","no":224,"stem":"생활지도라는 용어의 유래로 가장 옳은 것은?","opts":["1945년 해방 이후 미국의 가이던스(guidance) 운동이 도입되면서 그 번역어로 생겼다","조선시대 유교 교육에서 비롯되었다","유럽의 자연주의 교육사상에서 직접 번역되었다","일제강점기의 훈육 개념이 그대로 이어진 것이다"],"ans":[1],"multi":false,"dup":false,"expl":"생활지도라는 용어는 1945년 해방 이후 미국의 가이던스 운동이 도입되면서 그 번역어로 탄생했으며, 가이던스 운동은 처음에는 직업·진로지도 분야에서 출발했다.","src":"L"},{"id":"L12-05","set":"강의록","year":null,"kind":"강의록","lec":12,"lecName":"실천적 교육활동으로서 생활지도(1)","no":225,"stem":"미국의 가이 06","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":266,"stem":"정신분석이론의 인간관에 대한 설명으로 옳지 않은 것은?","opts":["인간의 내면세계는 끊임없이 갈등하는 힘들의 전쟁터로 본다","인간행동의 원인의 대부분은 무의식에 있다고 본다","인간본성에 관해 기본적으로 결정론의 입장을 취한다","인간행동은 의식적 합리적 판단에 의해 전적으로 결정된다고 본다"],"ans":[4],"multi":false,"dup":false,"expl":"프로이트는 인간행동이 비합리적 힘, 무의식적 동기, 생애 초기 4~5년의 심리성적 사상에 의해 결정된다고 보는 결정론의 입장을 취했다.","src":"L"},{"id":"L14-07","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":267,"stem":"정신분석적 상담의 목표로 가장 옳은 것은?","opts":["바람직한 행동을 강화하고 바람직하지 않은 행동을 감소시키는 것","무의식적 갈등을 의식화하고 성격 구조를 변화시켜 잘 적응하는 개인으로 성장하도록 돕는 것","자동적 사고를 변화시키는 것","내담자의 잠재가능성을 최대한 실현하는 것"],"ans":[2],"multi":false,"dup":false,"expl":"정신분석적 상담은 무의식적 갈등의 의식화와 성격 구조의 변화를 통해 진정 사랑하고 일할 수 있는 잘 적응하는 개인으로의 성장을 돕는 것을 목표로 한다.","src":"L"},{"id":"L14-08","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":268,"stem":"정신분석적 상담에서 전이(transference)에 대한 설명으로 가장 옳은 것은?","opts":["상담자가 내담자에게 느끼는 감정이다","내담자가 초기 아동기에 중요한 타인에게 느꼈던 감정을 현재의 상담자에게 느끼는 것이다","내담자가 꿈에서 상징을 표현하는 것이다","상담의 진전을 방해하는 의도적 행동이다"],"ans":[2],"multi":false,"dup":false,"expl":"전이는 내담자가 초기 아동기의 중요 타인에게 느꼈던 감정을 현재 상담자에게 느끼는 것으로, 정신분석적 접근의 핵심 개념이다.","src":"L"},{"id":"L14-09","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":269,"stem":"정신분석적 상담의 과정 순서로 옳은 것은?","opts":["초기 면접단계 → 전이의 발달단계 → 훈습단계 → 전이/역전이 해결단계","전이의 발달단계 → 초기 면접단계 → 전이/역전이 해결단계 → 훈습단계","훈습단계 → 초기 면접단계 → 전이의 발달단계 → 해결단계","초기 면접단계 → 훈습단계 → 전이의 발달단계 → 해결단계"],"ans":[1],"multi":false,"dup":false,"expl":"정신분석적 상담은 초기 면접단계, 전이의 발달단계, 훈습단계, 전이/역전이 해결단계의 과정을 거친다.","src":"L"},{"id":"L14-10","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":270,"stem":"훈습(working through)에 대한 설명으로 옳은 것은?","opts":["초기 아동기의 무의식적 자료와 방어기제를 탐색하며 반복·정교화·확충하는 활동이다","상담의 첫 면접에서 이루어지는 진단 활동이다","내담자의 저항을 강화하는 과정이다","상담의 종결 후에 이루어지는 평가 활동이다"],"ans":[1],"multi":false,"dup":false,"expl":"훈습은 초기 아동기의 무의식적 자료와 방어기제를 탐색하는 것으로, 반복·정교화·확충하는 활동으로 이루어진다.","src":"L"},{"id":"L14-11","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":271,"stem":"자유연상(free association)에 대한 설명으로 가장 옳은 것은?","opts":["내담자에게 모호한 그림을 보여 주고 반응을 분석하는 기법이다","마음에 떠오르는 것을 무엇이든 말하게 하고 상담자가 그 관계와 의미를 해석하는 기법이다","내담자의 꿈 상징을 분석하는 기법이다","상담자가 내담자에게 조언을 제공하는 기법이다"],"ans":[2],"multi":false,"dup":false,"expl":"자유연상은 내담자로 하여금 마음에 떠오르는 것을 무엇이든 말하게 하고 상담자가 연상 내용의 관계와 의미를 해석해 주는 기법이다.","src":"L"},{"id":"L14-12","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":272,"stem":"자유연상 과정에서 연상이 진행되지 않을 때 정신분석적으로 해석하는 것은?","opts":["내담자가 상담을 성공적으로 마쳤다는 신호","저항을 보인다고 판단하고 분석한다","전이가 해결되었다는 신호","상담목표가 달성되었다는 신호"],"ans":[2],"multi":false,"dup":false,"expl":"자유연상이 진행되지 않으면 내담자가 저항을 보인다고 판단하고 이에 대해 분석한다.","src":"L"},{"id":"L14-13","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":273,"stem":"저항(resistance)에 대한 설명으로 가장 옳은 것은?","opts":["억압된 욕구나 감정이 드러나는 것을 방해하는 의식적이고 계획적인 행동이다","억압된 욕구나 감정을 알았을 때 느끼는 불안으로부터 자아를 보호하기 위해 상담의 진전을 방해하는 무의식적 행동이다","상담자가 느끼는 부정적 감정이다","상담 초기에만 나타나는 정상적 현상이다"],"ans":[2],"multi":false,"dup":false,"expl":"저항은 내담자가 억압된 욕구나 감정을 알았을 때 느끼는 불안으로부터 자아를 보호하기 위해 상담의 진전과 무의식적 욕구·감정의 노출을 방해하는 무의식적 행동이다.","src":"L"},{"id":"L14-14","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":274,"stem":"꿈의 분석에 대한 설명으로 옳은 것은?","opts":["수면 중에는 방어가 강화되어 꿈에 무의식이 나타나지 않는다","수면 중 방어가 약화되어 억압된 욕구와 감정이 꿈속에 표출되므로 상징적 의미를 분석한다","꿈은 의식적 사고의 직접적 표현이다","꿈의 분석은 행동수정이론의 기법이다"],"ans":[2],"multi":false,"dup":false,"expl":"수면 중에는 방어가 약화되어 억압된 욕구와 감정이 꿈속에 표출되므로, 꿈에 나타난 상징적 의미를 분석해 무의식적 동기에 대한 통찰을 돕는다.","src":"L"},{"id":"L14-15","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":275,"stem":"해석(interpretation)에 대한 설명으로 옳지 않은 것은?","opts":["자유연상·꿈·저항·전이를 분석해 그 의미를 내담자에게 지적·설명하는 절차이다","내담자가 아직 깨닫지 못했더라도 견뎌낼 수 있다고 판단될 때 해석한다","내용에 대한 해석보다 저항에 대한 해석이 우선되어야 한다","해석은 표면적인 것부터 시작하지 않고 곧바로 가장 깊은 층을 다룬다"],"ans":[4],"multi":false,"dup":false,"expl":"해석은 표면적인 것에서 시작해 점점 깊이 다가가도록 해야 하며, 저항에 대한 해석이 내용 해석에 우선한다.","src":"L"},{"id":"L14-16","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":276,"stem":"인간중심 상담이론의 철학적 배경으로 가장 옳은 것은?","opts":["행동주의 철학","실존주의 철학과 현상학적 관점","정신분석적 결정론","구조주의 언어학"],"ans":[1],"multi":false,"dup":false,"expl":"인간중심 상담이론은 로저스가 창시했으며 실존주의 철학을 근거로 발달했고, 개인의 주관적 경험과 내적 참조체계를 이해하려는 현상학적 관점을 취한다.","src":"L"},{"id":"L14-17","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":277,"stem":"로저스의 인간관에 대한 설명으로 가장 옳은 것은?","opts":["인간은 무의식적 본능에 의해 결정되는 존재이다","인간은 기본적으로 자유롭고 자신의 행동에 책임을 지며 합리적·건설적인 방향으로 성장하는 미래지향적 존재이다","인간은 환경에 수동적으로 반응하는 존재이다","인간은 선천적 잠재력을 발휘할 수 없다"],"ans":[2],"multi":false,"dup":false,"expl":"로저스는 인간을 기본적으로 자유롭고 책임을 지며 유목적적이고 합리적·건설적인 방향으로 성장하는 미래지향적 존재로 보았고, 조건이 갖추어지면 무한한 성장이 가능하다고 보았다.","src":"L"},{"id":"L14-18","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":278,"stem":"로저스의 ‘현상적 장’에 대한 설명으로 가장 옳은 것은?","opts":["객관적으로 측정 가능한 외부 환경 그 자체를 의미한다","특정 순간에 개인이 지각하고 경험하는 모든 것으로, 개인적 현실을 의미한다","무의식에 저장된 과거 경험의 총체이다","상담자가 설정한 치료적 환경이다"],"ans":[2],"multi":false,"dup":false,"expl":"현상적 장은 경험적 세계 또는 주관적 경험으로도 불리며, 특정 순간에 개인이 지각하고 경험하는 모든 것을 의미한다. 로저스는 개인적 현실인 현상적 장만이 존재한다고 보았다.","src":"L"},{"id":"L14-19","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":279,"stem":"프로이트와 로저스의 인간행동 결정 요인에 대한 관점 차이로 옳은 것은?","opts":["프로이트는 과거 경험이 행동을 결정한다고 보고, 로저스는 과거 그 자체가 아니라 과거에 대한 현재의 해석이 행동을 결정한다고 본다","프로이트는 현재의 해석을, 로저스는 과거 경험을 중시한다","두 사람 모두 무의식을 중시한다","두 사람 모두 행동을 환경의 산물로만 본다"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 과거 경험이 인간행동을 결정하는 요인이라고 보았고, 로저스는 현재 행동을 결정하는 것은 과거 자체가 아니라 과거에 대한 각 개인의 현재 해석이라고 보았다.","src":"L"},{"id":"L14-20","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":280,"stem":"로저스의 자아개념과 방어기제에 대한 설명으로 옳지 않은 것은?","opts":["현실 자아는 현재 자신의 모습에 대한 인식이고 이상적 자아는 되고자 하는 자신에 대한 인식이다","현재 경험이 자아 구조와 불일치할 때 불안을 경험한다","인지적 왜곡과 부인은 자아가 사용하는 기본적 방어기제이다","부인은 받아들이기 어려운 경험을 자아상과 일치하는 형태로 변형하는 것이다"],"ans":[4],"multi":false,"dup":false,"expl":"받아들이기 어려운 경험을 자아상과 일치하는 형태로 변형하는 것은 인지적 왜곡이며, 부인은 자아개념과 일치하지 않는 경험이 존재한다는 사실을 완전히 무시하는 것이다.","src":"L"},{"id":"L15-01","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":281,"stem":"인지중심 상담에서 인지·정서·행동의 관계를 보는 관점으로 가장 옳은 것은?","opts":["인지, 정서, 행동은 서로 무관한 별개의 실체다","인지, 정서, 행동은 얽혀 있는 복합체이며 그중 인지가 다른 두 특성에 선행한다","정서가 인지와 행동에 선행한다","행동이 인지와 정서를 결정한다"],"ans":[2],"multi":false,"dup":false,"expl":"인지중심 상담은 인지·정서·행동이 함께 얽힌 복합체이며 그중 ‘인지’가 다른 두 특성에 선행한다는 관점을 취한다.","src":"L"},{"id":"L15-02","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":282,"stem":"개인의 내면화된 자기-대화(self-talk)에 대한 설명으로 가장 옳은 것은?","opts":["자기-대화의 내용이 비합리적이면 적응에 장애가 생기고, 합리적이면 행복한 삶을 영위할 수 있다","자기-대화는 의식되지 않으므로 변화시킬 수 없다","자기-대화는 정서와 무관하다","자기-대화는 타인의 평가에 의해서만 형성된다"],"ans":[1],"multi":false,"dup":false,"expl":"인지는 사고·신념·태도·의견·철학의 형태로 내면화된 자기-대화 방식으로 전개되며, 그 내용이 비합리적이면 적응 장애가, 합리적이면 행복한 삶이 가능하다.","src":"L"},{"id":"L15-03","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":283,"stem":"엘리스(Ellis)와 벡(Beck)의 공통된 주장으로 가장 옳은 것은?","opts":["동일한 사건을 겪어도 그 사건을 어떤 생각으로 받아들이느냐에 따라 영향이 다르다","무의식적 갈등이 정서 장애의 원인이다","행동의 결과가 행동을 결정한다","인간은 선천적으로 비합리적이다"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스와 벡은 모두 동일한 사건을 겪더라도 그 사건에 대한 해석, 즉 어떤 생각으로 받아들이느냐에 따라 개인에게 미치는 영향이 다르다고 주장했다.","src":"L"},{"id":"L15-04","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":284,"stem":"켈리(Kelly)의 개인적 구성개념(personal construct)에 대한 설명으로 가장 옳은 것은?","opts":["인간은 세상을 바라보는 자신만의 눈을 가지고 있으며, 그것이 현실 이해에 부적합해도 고집하면 문제가 생긴다","인간은 세상을 객관적으로만 바라본다","구성개념은 학습되지 않는 선천적 요소이다","구성개념은 정서와 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"켈리는 인간이 세상을 바라보는 자신만의 눈(개인적 구성개념)을 가지고 있으며, 그것이 현실을 이해·설명·예측하는 데 적합하지 않는데도 고집하면 문제가 생긴다고 보았다.","src":"L"},{"id":"L15-05","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":285,"stem":"엘리스의 합리·정서·행동치료(REBT)의 변천 순서로 옳은 것은?","opts":["합리 치료(RT) → 합리·정서 치료(RET) → 합리·정서·행동치료(REBT)","합리·정서·행동치료 → 합리 치료 → 합리·정서 치료","합리·정서 치료 → 합리·정서·행동치료 → 합리 치료","정신분석 → 합리·정서·행동치료 → 합리 치료"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스는 합리 치료(1955) → 합리·정서 치료(1961) → 합리·정서·행동치료(1993)로 이론을 발전시켰다.","src":"L"},{"id":"L15-06","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":286,"stem":"엘리스 이론의 사상적 배경으로 가장 옳은 것은?","opts":["그리스 스토아 학파의 “사람을 혼란스럽게 하는 것은 사건이 아니라 사건에 대한 판단이다”","행동주의의 자극-반응 이론","정신분석의 무의식 이론","형태주의의 통찰 이론"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스의 이론은 개인의 주관적 생각과 판단을 강조하는 현상학적 관점과 맥을 같이하며, 그리스 스토아 학파의 “사람의 마음을 혼란스럽게 하는 것은 사건 자체가 아니라 사건에 대한 판단”이라는 사상에 바탕을 둔다.","src":"L"},{"id":"L15-07","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":287,"stem":"엘리스의 인간관에 대한 설명으로 옳지 않은 것은?","opts":["인간은 합리적 사고와 비합리적 사고를 모두 가질 수 있는 존재이다","인간은 자기와 대화하고 자기를 평가하며 자기를 유지할 수 있는 존재이다","인간은 자신의 한계를 이해하고 기본 관점과 가치를 변화시킬 능력을 지닌다","인간은 비합리적 신념을 바꿀 수 없는 존재이다"],"ans":[4],"multi":false,"dup":false,"expl":"엘리스는 인간이 자신의 한계를 이해할 수 있는 힘과, 아동기에 주입된 기본 관점과 가치를 변화시킬 능력, 자기 패배적 경향에 도전할 능력을 갖고 있다고 보았다.","src":"L"},{"id":"L15-08","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":288,"stem":"엘리스의 A-B-C 모형에 대한 설명으로 가장 옳은 것은?","opts":["선행 사건(A)이 정서적·행동적 결과(C)를 직접 일으킨다","신념체제(B)가 정서적·행동적 결과(C)의 진정한 원인이다","결과(C)가 신념(B)을 결정한다","A와 B는 같은 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"A-B-C 모형은 선행 사건(A)이 결과(C)를 직접 일으키는 것이 아니라 그 사람의 신념체제(B)가 C의 진정한 원인이라는 것이 요체다.","src":"L"},{"id":"L15-09","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":289,"stem":"엘리스가 말한 비합리적 신념의 예로 옳지 않은 것은?","opts":["중요한 타인으로부터 사랑받고 인정받는 것은 절대적으로 중요한 일이다","모든 영역에서 빈틈없이 유능하고 성공해야 가치 있는 사람이다","어떤 일이 원하는 대로 되지 않으면 끔찍한 일이다","일이 뜻대로 되지 않을 때도 인내하며 대안을 찾을 수 있다"],"ans":[4],"multi":false,"dup":false,"expl":"인내하며 대안을 찾는 것은 합리적 신념이며, 나머지는 절대적 당위·파국적 사고 등 비합리적 신념의 예다.","src":"L"},{"id":"L15-10","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":290,"stem":"비합리적 신념의 유형으로 강의록이 든 것으로 옳지 않은 것은?","opts":["절대적 당위의 사고 - “~해야만 한다”","파국적 사고 - “~하면 큰일난다”","자기 및 타인 비하","현실적 수용과 인내"],"ans":[4],"multi":false,"dup":false,"expl":"비합리적 신념의 유형은 절대적 당위 사고, 파국적 사고, 자기 및 타인 비하, 좌절에 대한 인내심 부족이다.","src":"L"},{"id":"L15-11","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":291,"stem":"엘리스가 제시한 정신건강의 기준으로 옳지 않은 것은?","opts":["자기 관심과 자기 지향","사회적 관심과 관용·융통성","위험 감수와 불확실성의 수용","완벽한 유토피아의 실현 추구"],"ans":[4],"multi":false,"dup":false,"expl":"엘리스의 정신건강 기준에는 자기 관심·자기 지향·자기 수용, 사회적 관심, 관용과 융통성, 몰입, 과학적 사고, 위험 감수, 불확실성의 수용, 탈유토피아주의가 포함된다.","src":"L"},{"id":"L15-12","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":292,"stem":"합리·정서·행동치료(REBT)의 상담 과정에 대한 설명으로 가장 옳은 것은?","opts":["상담자는 내담자를 평가하고 판단하며 훈계한다","상담자는 내담자를 한 인간으로서 완전하게 수용하면서 비합리적 사고와 자기 파괴적 행동에 도전하게 한다","내담자의 비합리적 신념은 그대로 두고 행동만 바꾼다","개인적 온정을 최대한 제공하는 것이 핵심이다"],"ans":[2],"multi":false,"dup":false,"expl":"REBT는 내담자가 자기 경멸을 하지 않도록 돕는 것을 기본 생각으로 하며, 내담자를 평가하지 않고 완전히 수용하면서 비합리적 사고와 자기 파괴적 행동에 도전하게 하고 개인적 온정보다 객관적 기법을 사용한다.","src":"L"},{"id":"L15-13","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":293,"stem":"엘리스가 제시한 논리적 반박의 세 형태로 옳은 것은?","opts":["논리성에 근거한 논박, 현실성에 근거한 논박, 실용성에 근거한 논박","강화, 벌, 소거","수용, 공감, 일치","자유연상, 해석, 전이"],"ans":[1],"multi":false,"dup":false,"expl":"논리적 반박은 논리성, 현실성, 실용성에 근거한 논박의 세 형태로 이루어진다.","src":"L"},{"id":"L15-14","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":294,"stem":"행동수정이론의 이론적 배경으로 옳게 묶인 것은?","opts":["정신분석이론과 인간중심 상담이론","행동주의 학습이론과 사회학습이론","인지상담이론과 실존주의 철학","형태주의 심리학과 구조주의 심리학"],"ans":[1],"multi":false,"dup":false,"expl":"행동수정이론은 조건형성이론(파블로프·손다이크·스키너)과 사회학습이론(반두라)에 근거를 두고 있다.","src":"L"},{"id":"L15-15","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":295,"stem":"행동수정이론의 기본 가정으로 옳 var HIDE_MS = 24*60*60*1000;
function pruneHidden(){

}

/* 같은 문제 묶음: 현재 과목의 기출+강의록 전체에서 지문·보기(순서 무관)·정답이 모두 같은 문항 */
function normTxt(s){ return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function qSig(q){
  var opts = (q.opts || []).map(normTxt).slice().sort();
  var ansTxt = [];
  (q.ans || []).forEach(function(n){
    var i = (n|0) - 1;
    if(i >= 0 && i < q.opts.length) ansTxt.push(normTxt(q.opts[i]));
  });
  ansTxt.sort();
  return JSON.stringify([normTxt(q.stem), opts, ansTxt]);
}
var SIG_GROUPS = null;
function sigGroups(){
  if(SIG_GROUPS) return SIG_GROUPS;
  var g = {};
  DATA.forEach(function(q){
    var k = qSig(q);
    if(!g[k]) g[k] = [];
    g[k].push(q.id);
  });
  SIG_GROUPS = g;
  return g;
}
function sameQIds(id){
  var q = BY_ID[id];
  if(!q) return [id];
  var ids = sigGroups()[qSig(q)];
  if(!ids || !ids.length) return [id];
  return ids.indexOf(id) < 0 ? ids.concat([id]) : ids.slice();
}
function hideFor24h(id){
  var until = Date.now() + HIDE_MS;
  sameQIds(id).forEach(function(x){ hiddenUntil[x] = until; });
  save(LS_KEYS.hide, hiddenUntil);
}
function unhideQ(id){

}

/* ---------- 3연속 정답 → 자동 24시간 안 보기 ---------- */
/* 같은 문제 묶음(지문·보기·정답 일치)이 하나의 연속 정답 기록을 공유한다 */
function streakKey(q){
  var s = qSig(q), h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36) + 'x' + s.length.toString(36);
}
/* 24시간이 지난 기록은 버리고 남은 정답 시각만 돌려준다 */
function liveStreak(k){
  var cut = Date.now() - HIDE_MS, a = streaks[k] || [], out = [], i;
  for(i=0;i<a.length;i++){ if(a[i] > cut) out.push(a[i]); }
  if(out.length !== a.length){
    if(out.length) streaks[k] = out; else delete streaks[k];
    save(LS_KEYS.streak, streaks);
  }
  return out;
}
function streakCountOf(id){
  var q = BY_ID[id]; if(!q) return 0;
  return liveStreak(streakKey(q)).length;
}
/* 정답 1회 기록. 24시간 안 3회가 되면 자동 숨김까지 실행한다 */
function noteCorrect(q, allowDrop){
  var k = streakKey(q);
  /* 한 학습 안에서 같은 문제 사본(다른 회차)이 여러 번 나와도 1회로 센다 */
  if(quiz && quiz.streakCounted && quiz.streakCounted[k]){
    return { streak: 0, need: STREAK_NEED, auto: false, hidden: 0, repeat: true };
  }
  var a = liveStreak(k);
  a.push(Date.now());
  streaks[k] = a;
  save(LS_KEYS.streak, streaks);
  if(quiz && quiz.streakCounted) quiz.streakCounted[k] = 1;
  var res = { streak: a.length, need: STREAK_NEED, auto: false, hidden: 0 };
  if(a.length >= STREAK_NEED){
    var grp = sameQIds(q.id);
    hideFor24h(q.id);
    var until = hiddenUntil[q.id] || (Date.now() + HIDE_MS);
    grp.forEach(function(x){ autoHidden[x] = until; });
    save(LS_KEYS.auto, autoHidden);
    /* 24시간 뒤 새로 1/3부터 셀 수 있도록 카운터를 바운다 */
    delete streaks[k];
    save(LS_KEYS.streak, streaks);
    res.streak = 0; res.auto = true; res.hidden = grp.length;
    if(allowDrop) dropQueuedFromQuiz(grp);
    if(quiz && quiz.autoHiddenIds){ quiz.autoHiddenIds = quiz.autoHiddenIds.concat(grp); }
    showToast('🎯 3연속 정답! 이 문제는 24시간 안 보기에 들어갔어요');
  }
  return res;
}
/* 오답이면 "연속"이 깨지므로 해당 문제 묶음의 기록을 버린다 */

/* ---------- 동일 문항 병합 ---------- */
/* 지문 + 보기(순서 무관) + 정답 텍스트가 모두 같은 문항은 애초에 한 문항으로 통일한다.
   대표는 기출을 우선하고 그중 가장 이른 회차를 쓴다. 나머지 회차는 appearances에 남긴다. */
var SUBJ_MERGED = {};
var REP_OF = {};
function appLabelOf(q){
  if(q.src === 'L') return { examKey: 'lec:' + q.lec, examLabel: pad2(q.lec) + '강 ' + q.lecName, num: q.no, kind: '강의록', src: 'L', lec: q.lec };
  return { examKey: q.set, examLabel: setLabel(q.set), num: q.no, kind: q.kind, src: 'E', lec: null };
}
/* 연대순 정렬용: 기출 먼저 → 이른 연도 → 하계계절 → 학년 → 문항 번호 */
function appRank(q){
  var y = (q.src === 'L') ? 9999 : (q.year || 0);
  var sem = (q.src !== 'L' && String(q.set||'').indexOf('-하계') > 0) ? 1 : 2;
  var gr = /-(\d)학년$/.test(String(q.set||'')) ? parseInt(String(q.set).slice(-3), 10) : 0;
  return [y, sem, gr, q.no || 0];
}
function compareAppRank(a, b){
  var x = appRank(a), y = appRank(b);
  for(var i=0;i<4;i++){ if(x[i] !== y[i]) return x[i] - y[i]; }
  return 0;
}
function buildMerged(rawExam, rawLec){
  var raw = (rawExam||[]).concat(rawLec||[]);
  raw.forEach(function(q){ if(!q.src) q.src = 'E'; });
  var groups = {}, order = [];
  raw.forEach(function(q){
    var k = qSig(q);
    if(!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(q);
  });
  var list = [], repOf = {};
  order.forEach(function(k){
    var members = groups[k].slice().sort(compareAppRank);
    var rep = members[0];
    var q = {};
    for(var f in rep) q[f] = rep[f];
    q.appearances = members.map(appLabelOf);
    q.appearCount = q.appearances.length;
    if(!q.expl){
      for(var i=1;i<members.length;i++){ if(members[i].expl){ q.expl = members[i].expl; break; } }
    }
    if(!q.multi){
      for(var j=1;j<members.length;j++){ if(members[j].multi){ q.multi = true; break; } }
    }
    members.forEach(function(o){ repOf[o.id] = rep.id; });
    list.push(q);
  });
  return { list: list, repOf: repOf, raw: raw, rawExam: rawExam || [], rawLec: rawLec || [] };
}
function subjectMerged(key){
  if(!SUBJ_MERGED[key]){
    var raw = SUBJECT_DATA[key];
    var m = buildMerged(raw.exam, raw.lec);
    var ex = 0, lec = 0;
    m.list.forEach(function(q){ if(q.src === 'L') lec++; else ex++; });
    m.stats = { total: m.list.length, exam: ex, lec: lec, appear: m.raw.length };
    SUBJ_MERGED[key] = m;
  }
  return SUBJ_MERGED[key];
}
function qApps(q){
  if(q && q.appearances && q.appearances.length) return q.appearances;
  return q ? [appLabelOf(q)] : [];
}
function hasApp(q, pred){
  var a = qApps(q);
  for(var i=0;i<a.length;i++){ if(pred(a[i])) return true; }
  return false;
}

/* ---------- 저장 데이터의 옛 id → 대표 id 매핑 ---------- */
function migrateId(id){
  if(REP_OF && REP_OF[id]) return REP_OF[id];
  return BY_ID[id] ? id : null;
}
function migrateStores(){
  var w = {}, b = {}, h = {}, a = {};
  var chW = false, chB = false, chH = false, chA = false;
  Object.keys(wrongNote || {}).forEach(function(id){
    var nid = migrateId(id);
    if(!nid){ chW = true; return; }
    if(nid !== id) chW = true;
    var rec = wrongNote[id] || {};
    if(!w[nid]) w[nid] = { n: rec.n || 0, t: rec.t || 0 };
    else w[nid] = { n: (w[nid].n||0) + (rec.n||0), t: Math.max(w[nid].t||0, rec.t||0) };
  });
  Object.keys(bookmarks || {}).forEach(function(id){
    var nid = migrateId(id);
    if(!nid){ chB = true; return; }
    if(nid !== id) chB = true;
    b[nid] = Math.max(b[nid] || 0, bookmarks[id] || 0);
  });
  Object.keys(hiddenUntil || {}).forEach(function(id){
    var nid = migrateId(id);
    if(!nid){ chH = true; return; }
    if(nid !== id) chH = true;
    h[nid] = Math.max(h[nid] || 0, hiddenUntil[id] || 0);
  });
  Object.keys(autoHidden || {}).forEach(function(id){
    var nid = migrateId(id);
    if(!nid){ chA = true; return; }
    if(nid !== id) chA = true;
    a[nid] = Math.max(a[nid] || 0, autoHidden[id] || 0);
  });
  wrongNote = w; bookmarks = b; hiddenUntil = h; autoHidden = a;
  if(chW) save(LS_KEYS.wrong, wrongNote);
  if(chB) save(LS_KEYS.book, bookmarks);
  if(chH) save(LS_KEYS.hide, hiddenUntil);
  if(chA) save(LS_KEYS.auto, autoHidden);
}

function initSubject(key){
  var s = null;
  SUBJECTS.forEach(function(x){ if(x.key === key) s = x; });
  if(!s) s = SUBJECTS[0];
  curKey = s.key;
  save(LS_PREF.subject, curKey);
  var mg = subjectMerged(curKey);
  DATA = mg.list;
  REP_OF = mg.repOf;
  LEC_DATA = DATA.filter(function(q){ return q.src === 'L'; });
  EXAM_COUNT = mg.stats.exam;
  LEC_COUNT = mg.stats.lec;

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function shuffled(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- 선지 순서 섞기 ---------- */
var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
function identityPerm(n){ var a = []; for(var i=0;i<n;i++) a.push(i); return a; }
function makePerm(n){ return state.optShuffle ? shuffled(identityPerm(n)) : identityPerm(n); }
/* 해설 속 ①~④ 표기를 섞인 순서에 맞게 다시 매핑 (숫자 읽는 소리에 맞춰 조사도 정리) */
function remapExpl(expl, perm){
  if(!expl) return '';
  var toDisp = {};
  for(var i=0;i<perm.length;i++){ toDisp[perm[i]+1] = i+1; }
  var out = expl.replace(/[①②③④⑤]/g, function(ch){
    var n = CIRC.indexOf(ch)+1;
    return toDisp[n] ? CIRC[toDisp[n]-1] : ch;
  });
  var WITH = {은:1, 이:1, 을:1, 과:1};      // 받침 있는 소리(일·삼)
  var WITHOUT = {는:1, 가:1, 를:1, 와:1};   // 받침 없는 소리(이·사·오)
  var toWith = {는:'은', 가:'이', 를:'을', 와:'과'};
  var toWithout = {은:'는', 이:'가', 을:'를', 과:'와'};
  return out.replace(/([①②③④⑤])(은|는|이|가|을|를|과|와)/g, function(m, num, josa){
    var noBatchim = (num === '②' || num === '④' || num === '⑤');
    if(noBatchim && WITH[josa]) return num + toWithout[josa];   // 은→는, 이→가 ...
    if(!noBatchim && WITHOUT[josa]) return num + toWith[josa];  // 는→은, 가→이 ...
    return m;
  });
}
/* perm: 화면 순서 -> 원본 인덱스(0부터). 없으면 원본 순서 그대로 */
function viewOf(q, perm){
  if(!perm || perm.length !== q.opts.length) perm = identityPerm(q.opts.length);
  var toDisp = {};
  perm.forEach(function(o, i){ toDisp[o+1] = i+1; });
  return {
    opts: perm.map(function(o){ return q.opts[o]; }),
    ans: q.ans.map(function(n){ return toDisp[n] || n; }).sort(function(a,b){ return a-b; }),
    perm: perm,
    expl: remapExpl(q.expl, perm)
  };
}

function bookCount(){ return Object.keys(bookmarks).length; }
function normStem(s){ return s.replace(/[^가-힣A-Za-z0-9]/g,'').slice(0,40); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function nowText(){

/* ---------- pool ---------- */
function scopeLabelText(scope){

  if(scope === 'wrong') return '오답노트';
  if(scope === 'book') return '북마크';
  if(scope.indexOf('set:') === 0) return setLabel(scope.slice(4));
  if(scope.indexOf('lec:') === 0){ var n = parseInt(scope.slice(4),10); return '강의록 ' + pad2(n) + '강 ' + LEC_NAME[n]; }
  return '전체';
}
function scopeListRaw(scope){
  if(scope === 'all') return DATA.slice();
  if(scope === '기말') return DATA.filter(function(q){ return hasApp(q, function(a){ return a.kind === '기말'; }); });
  if(scope === '출석') return DATA.filter(function(q){ return hasApp(q, function(a){ return a.kind === '출석대체'; }); });
  if(scope === 'wrong') return Object.keys(wrongNote).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope === 'book') return Object.keys(bookmarks).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope.indexOf('set:') === 0){
    var key = scope.slice(4);
    return DATA.filter(function(q){ return hasApp(q, function(a){ return a.examKey === key; }); });
  }
  if(scope.indexOf('lec:') === 0){
    var n = parseInt(scope.slice(4),10);
    return DATA.filter(function(q){ return hasApp(q, function(a){ return a.src === 'L' && a.lec === n; }); });
  }
  return DATA.slice();
}
/* 순서 섞기를 끄면 원본(연대) 순서대로 */
function canonSort(ids){
  return ids.slice().sort(function(a,b){
    var x = (CANON_AT[a] === undefined ? 0 : CANON_AT[a]);
    var y = (CANON_AT[b] === undefined ? 0 : CANON_AT[b]);
    return x - y;
  });
}
function scopeList(scope){ return scopeListRaw(scope).filter(srcOk).filter(function(q){ return !isHidden(q.id); }); }
function examPool(scope){ return scopeListRaw(scope).filter(function(q){ return q.src !== 'L' && !isHidden(q.id); }); }
function lecturePool(){ return DATA.filter(function(q){ return q.src === 'L' && !isHidden(q.id); }); }
function dedupeList(list){
  var seen = {};
  return list.filter(function(q){ var k = normStem(q.stem); if(seen[k]) return false; seen[k] = 1; return true; });
}
/* 기출:강의록 = 80:20 으로 맞춘 구성 계산 */
function planMix(limit, baseN, lecAvail){
  var lecCap = (typeof lecAvail === 'number') ? lecAvail : LEC_COUNT;
  var gin, lecN;
  if(baseN <= 0){
    lecN = Math.min(limit > 0 ? limit : lecCap, lecCap);
    return {gin: 0, lec: lecN, total: lecN};
  }
  if(limit > 0){ lecN = Math.max(1, Math.round(limit * 0.2)); gin = limit - lecN; }
  else { gin = baseN; lecN = Math.round(baseN * 0.25); }
  if(gin > baseN){ lecN += gin - baseN; gin = baseN; }
  lecN = Math.min(lecN, lecCap);
  return {gin: gin, lec: lecN, total: gin + lecN};
}
function planPreview(){
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    return planMix(state.limit, examPool(state.scope).length, lecturePool().length);
  }
  var n = scopeList(state.scope).length;
  var t = (state.limit && n > state.limit) ? state.limit : n;
  return state.bank === 'lecture' ? {gin:0, lec:t, total:t} : {gin:t, lec:0, total:t};
}
function buildPool(){
  /* 출제 문항 선택은 항상 전체 후보를 무작위로 섞은 뒤 한다 (특정 연도·강에 치우치지 않도록) */
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    var base = examPool(state.scope);
    if(state.dedupe) base = dedupeList(base);
    var lecList = lecturePool();
    base = shuffled(base);
    lecList = shuffled(lecList);
    var plan = planMix(state.limit, base.length, lecList.length);
    var sel = base.slice(0, plan.gin).concat(lecList.slice(0, plan.lec));
    var ids = sel.map(function(q){ return q.id; });
    return state.shuffle ? shuffled(ids) : canonSort(ids);
  }
  var list = scopeList(state.scope);
  if(state.dedupe) list = dedupeList(list);
  var pool = shuffled(list);
  if(state.limit && pool.length > state.limit) pool = pool.slice(0, state.limit);
  var out = pool.map(function(q){ return q.id; });
  return state.shuffle ? out : canonSort(out);
}
function poolLabel(pool){
  var lec = 0;
  pool.forEach(function(id){ var q = BY_ID[id]; if(q && q.src === 'L') lec++; });
  var gin = pool.length - lec;
  if(gin && lec) return '기출 ' + gin + ' + 강의록 ' + lec;
  return lec ? '강의록만' : '기출만';
}

function startQuiz(pool, label){
  var maps = {};
  pool.forEach(function(id){ var q = BY_ID[id]; if(q) maps[id] = makePerm(q.opts.length); });
  quiz = {
    pool: pool, i: 0, picks: {}, revealed: {}, finished: false, maps: maps,
    mode: state.mode, startAt: Date.now(), streakInfo: {}, autoHiddenIds: [], streakCounted: {},
    label: label || (scopeLabelText(state.scope) + ' · ' + poolLabel(pool))
  };
  renderQuiz();
}

/* 함께 숨긴 같은 문제 중 아직 풀지 않은 문항은 이번 학습 대기열에서도 뺀다 */
function dropQueuedFromQuiz(ids){
  if(!quiz || quiz.finished) return;
  var drop = {};
  ids.forEach(function(x){ drop[x] = 1; });
  delete drop[quiz.pool[quiz.i]];
  quiz.pool = quiz.pool.filter(function(x, idx){
    return !(drop[x] && idx > quiz.i && !quiz.picks[x]);
  });
}

/* pick은 화면에 보인 번호(1~4)이므로 섞인 순서로 정답을 판정한다 */
function isRight(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  return v.ans.indexOf(pick) >= 0;
}

function recordAnswer(q, pick, opts){
  var ok = isRight(q, pick);
  var info = { ok: ok, streak: 0, need: STREAK_NEED, auto: false, hidden: 0, reset: false, had: 0 };
  if(!ok){
    var rec = wrongNote[q.id] || {n:0};
    rec.n = (rec.n||0) + 1; rec.t = Date.now();
    wrongNote[q.id] = rec;
    var w = noteWrong(q);
    info.reset = w.reset; info.had = w.had;
  } else {
    if(state.removeOnCorrect && wrongNote[q.id]) delete wrongNote[q.id];
    var c = noteCorrect(q, !(opts && opts.noDrop));
    info.streak = c.streak; info.auto = c.auto; info.hidden = c.hidden; info.repeat = !!c.repeat;
  }
  save(LS_KEYS.wrong, wrongNote);
  if(quiz){
    if(!quiz.streakInfo) quiz.streakInfo = {};
    quiz.streakInfo[q.id] = info;
  }
  return info;
}

function finishQuiz(){
  var total = quiz.pool.length;
  var picks = quiz.picks;
  var correct = 0, unanswered = 0, wrongIds = [];
  quiz.pool.forEach(function(id){
    var p = picks[id];
    if(!p){ unanswered++; wrongIds.push(id); return; }
    if(isRight(BY_ID[id], p)) correct++;
    else { wrongIds.push(id); }
  });
  if(quiz.mode === 'exam'){
    quiz.pool.forEach(function(id){ var p = picks[id]; if(p) recordAnswer(BY_ID[id], p, {noDrop:true}); });
  }
  var spent = Math.max(1, Math.round((Date.now()-quiz.startAt)/1000));
  hist.unshift({label: quiz.label, when: nowText(), correct: correct, total: total, mode: quiz.mode, sec: spent});
  hist = hist.slice(0,20);
  save(LS_KEYS.stats, hist);
  quiz.finished = true;
  quiz.result = {correct: correct, total: total, unanswered: unanswered, wrongIds: wrongIds, spent: spent};
  renderResult();
}

/* ---------- 오답노트 복사 ---------- */
/* 많이 틀린 순 → 최근 회차 → 번호 순 */
function wrongNoteSorted(){
  var items = Object.keys(wrongNote).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  items.sort(function(a,b){
    var na = (wrongNote[a.id] && wrongNote[a.id].n) || 0;
    var nb = (wrongNote[b.id] && wrongNote[b.id].n) || 0;
    if(nb !== na) return nb - na;
    if(a.set !== b.set) return a.set < b.set ? 1 : -1;
    return a.no - b.no;
  });
  return items;
}
function wrongSrcText(q){
  var t = qLabel(q);
  if(q.src !== 'L') t += ' ' + q.no + '번';
  return t;
}
function oneLine(s, max){
  var t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  if(max && t.length > max) t = t.slice(0, max).replace(/[\s,·]+$/, '') + '…';
  return t;
}
function wrongCopyText(onlyRepeat){
  var all = wrongNoteSorted();
  var rep = all.filter(function(q){ return ((wrongNote[q.id] || {}).n || 0) >= 2; });
  var list = onlyRepeat ? rep : all;
  var head = '[' + CS().name + ' 오답노트' + (onlyRepeat ? ' · 2회 이상 반복만' : '') + '] 총 ' + list.length + '문항';
  if(!onlyRepeat) head += ' (2회 이상 반복 ' + rep.length + '문항)';
  var lines = [head];
  list.forEach(function(q){
    var n = (wrongNote[q.id] || {}).n || 1;
    lines.push('- [' + n + '회 오답] (' + wrongSrcText(q) + ') ' + oneLine(q.stem));
    var ans = (q.ans || []).map(function(i){ return (q.opts || [])[i - 1]; }).filter(function(x){ return x != null; }).map(function(x){ return oneLine(x); }).join(' / ');
    lines.push('  정답: ' + ans);
    if(q.expl) lines.push('  해설: ' + oneLine(q.expl, 90));
  });
  return lines.join('\n');
}
/* navigator.clipboard 실패 시 textarea + execCommand 로 대체 (안드로이드 크롬·인앱 브라우저 대비) */
function copyPlainText(text){
  function fallback(){
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
        ta.style.width = '1px'; ta.style.height = '1px';
        ta.style.padding = '0'; ta.style.border = '0'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        var sel = document.getSelection ? document.getSelection() : null;
        var saved = (sel && sel.rangeCount) ? sel.getRangeAt(0) : null;
        ta.focus(); ta.select();
        try{ ta.setSelectionRange(0, text.length); }catch(e){}
        var ok = false;
        try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
        document.body.removeChild(ta);
        if(saved && sel){ sel.removeAllRanges(); sel.addRange(saved); }
        if(ok) resolve(); else reject(new Error('execCommand copy failed'));
      }catch(e){ reject(e); }
    });
  }
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false){
    return navigator.clipboard.writeText(text).catch(fallback);
  }
  return fallback();
}
function copyWrongNote(onlyRepeat){
  var text = wrongCopyText(onlyRepeat);
  copyPlainText(text).then(function(){
    showToast('📋 오답노트가 복사됐어요! 채팅창에 붙여넣어 주세요');
  }).catch(function(){
    showToast('복사하지 못했어요. 다시 한 번 눌러 주세요.');
  });
}

  var title = kind === 'wrong' ? '오답노트' : '북마크';
  var repeatN = 0;
  if(kind === 'wrong') items.forEach(function(q){ if(((wrongNote[q.id] || {}).n || 0) >= 2) repeatN++; });

  var copyCard = (kind === 'wrong' && items.length)

    : '';

  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">' + title + ' <span class="muted small">' + items.length + '</span></div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    copyCard +
    (items.length ? '<div class="card"><div class="wronglist">' + items.map(function(q){
      var rec = wrongNote[q.id];
      return '<button class="wrongitem" data-detail="' + q.id + '">' +
        '<div class="row-top"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) + (q.src !== 'L' ? '<span class="meta">' + q.no + '번</span>' : '') + freqBadgeHtml(q) +
        (kind==='wrong' && rec && rec.n ? '<span class="meta">· ' + rec.n + '회 틀림</span>' : '') + '</div>' +
        '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
        '<div class="corr">정답: ' + q.ans.map(function(n){ return esc(q.opts[n-1]); }).join(' / ') + '</div>' +
      '</button>';
    }).join('') + '</div></div>'
      : '<div class="card"><div class="empty">' + (kind==='wrong' ? '오답이 없습니다.<br>문제를 풀면 틀린 문제가 여기에 쌓입니다.' : '북마크한 문제가 없습니다.<br>문제 화면의 ☆를 눌러 저장하세요.') + '</div></div>') +
    (items.length ? '<div class="navbar"><button class="primary" id="btn-solve">' + (kind==='wrong'?'오답 전체 다시 풀기':'북마크 전체 풀기') + '</button></div>' : '') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ renderDetail(b.getAttribute('data-detail'), function(){ renderList(kind); }); };
  });
  var copyAll = document.getElementById('btn-copy-wrong');
  if(copyAll) copyAll.onclick = function(){ copyWrongNote(false); };
  var copyRep = document.getElementById('btn-copy-wrong-rep');
  if(copyRep) copyRep.onclick = function(){ if(!this.disabled) copyWrongNote(true); };
  var solve = document.getElementById('btn-solve');
  if(solve) solve.onclick = function(){ startQuiz(items.map(function(q){ return q.id; }), title + ' 풀기'); };
  window.scrollTo(0,0);
}

function renderHiddenList(){
  var ids = hiddenIds();
  ids.sort(function(a,b){ return (hiddenUntil[a]||0) - (hiddenUntil[b]||0); });
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">🙈 24시간 안 보기 <span class="muted small">' + ids.length + '</span></div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    (ids.length
      ? '<div class="card"><div class="small muted" style="margin-bottom:10px;">숨김을 해제하면 바로 다시 출제됩니다. 시간이 지나면 저절로 풀립니다.</div>' +
        ids.map(function(id){
          var q = BY_ID[id]; if(!q) return '';
          return '<div class="hiddenitem">' +
            '<div class="row-top"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) +
              (q.src !== 'L' ? '<span class="meta">' + q.no + '번</span>' : '') +
              freqBadgeHtml(q) +
              (autoHidden[id] ? '<span class="badge">🎯 자동 숨김</span>' : '') +
              '<span class="meta" style="margin-left:auto;">' + remainText(hiddenUntil[id]) + '</span></div>' +
            '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
            '<div class="act">' +
              '<button data-detail="' + id + '">문제 보기</button>' +
              '<button data-unhide="' + id + '">숨김 해제</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>'
      : '<div class="card"><div class="empty">24시간 안 보기로 숨긴 문제가 없습니다.<br>문제 화면의 🙈 버튼으로 잘 아는 문제를 잠시 뺄 수 있습니다.</div></div>') +
    (ids.length ? '<div class="navbar"><button class="primary" id="btn-unhide-all">숨김 전체 해제 (' + ids.length + '문제)</button></div>' : '') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ renderDetail(b.getAttribute('data-detail'), renderHiddenList); };
  });
  document.querySelectorAll('[data-unhide]').forEach(function(b){
    b.onclick = function(){ unhideQ(b.getAttribute('data-unhide')); renderHiddenList(); };
  });
  var all = document.getElementById('btn-unhide-all');
  if(all) all.onclick = function(){ unhideAll(); renderHiddenList(); };
  window.scrollTo(0,0);
}

function renderDetail(id, back, perm){
  var q = BY_ID[id];
  if(!q) { renderHome(); return; }
  var v = viewOf(q, perm || null);
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-back" aria-label="뒤로">←</button>' +
    '<div class="title">문제 보기</div>' +
    '<button class="iconbtn" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) +
        (q.src !== 'L' ? '<span class="badge gray">' + q.no + '번</span>' : '') +
        freqBadgeHtml(q) +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') + '</div>' +
      appHistoryHtml(q) +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts">' + v.opts.map(function(txt, idx){
        var n = idx+1, cls = 'opt' + (v.ans.indexOf(n) >= 0 ? ' right' : '');
        return '<div class="' + cls + '"><span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
          (v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') + '</div>';
      }).join('') + '</div>' +
      (q.expl ? '<div class="answerbox"><b>해설</b><br>' + esc(v.expl) + '</div>' : '') +
      hideBarHtml(q.id) +
    '</div>' +
    '<div class="navbar"><button class="ghost" id="btn-back2">목 록</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-back').onclick = back;
  document.getElementById('btn-back2').onclick = back;
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderDetail(id, back, perm);
  };
  var hideBtn = document.getElementById('btn-hide');
  if(hideBtn) hideBtn.onclick = function(){
    if(isHidden(q.id)) unhideQ(q.id); else hideFor24h(q.id);
    renderDetail(id, back, perm);
  };
  window.scrollTo(0,0);
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if(!quiz || quiz.finished) return;
  var q = BY_ID[quiz.pool[quiz.i]];
  if(!q) return;
  if(e.key >= '1' && e.key <= '4'){
    var n = parseInt(e.key,10);
    if(!(quiz.mode==='instant' && quiz.revealed[q.id])){
      quiz.picks[q.id] = n;
      if(quiz.mode==='instant'){ quiz.revealed[q.id] = true; recordAnswer(q, n); }
      renderQuiz();
    }
  } else if(e.key === 'ArrowRight' || e.key === 'Enter'){
    var b = document.getElementById('btn-next'); if(b) b.click();
  } else if(e.key === 'ArrowLeft'){
    var p = document.getElementById('btn-prev'); if(p && !p.disabled) p.click();
  }
});

state.theme = load(LS_PREF.theme, '');
state.mode = load(LS_PREF.mode, 'instant');
state.bank = load(LS_PREF.bank, 'mixed');
state.optShuffle = load(LS_PREF.optshuf, true);
initSubject(load(LS_PREF.subject, 'horti'));
applyTheme();
renderHome();
</script>
</body>
