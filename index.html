<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>방통대 문제은행 · 생활원예 + 인간과교육</title>
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --text:#1b2420; --muted:#616e68; --line:#e0e7e2;
  --accent:#2f7d5d; --accent-2:#24634a; --accent-weak:#e4f1ea;
  --right:#1e8a5c; --right-bg:#e7f7ef; --right-line:#8fd6b3;
  --wrong:#c0392b; --wrong-bg:#fdecea; --wrong-line:#f0a9a2;
  --shadow:0 1px 2px rgba(16,32,24,.05), 0 8px 24px rgba(16,32,24,.06);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0f1310; --card:#181d19; --text:#e8ede9; --muted:#9aa79f; --line:#28322b;
  --accent:#6bcf9c; --accent-2:#8ee0b6; --accent-weak:#1b2a22;
  --right:#6fdcae; --right-bg:#16342a; --right-line:#2e6b53;
  --wrong:#ff9a8f; --wrong-bg:#3a1e1b; --wrong-line:#7a3a33;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
body{
  font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-0.01em;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px;}
button{font-family:inherit; font-size:inherit; color:inherit; touch-action:manipulation;}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-0.02em;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.tiny{font-size:12px;}

/* top bar */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .inner{display:flex; align-items:center; gap:10px; height:56px;}
.iconbtn{
  border:1px solid var(--line); background:var(--card); border-radius:12px;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; flex:0 0 auto;
}
.iconbtn:active{transform:scale(.96);}
.title{font-size:17px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.progress{height:4px; background:var(--line);}
.progress > i{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width .25s ease;}
.metrics{display:flex; gap:12px; font-size:12.5px; color:var(--muted); padding:6px 0 8px;}
.metrics b{color:var(--text); font-weight:700;}

/* home */
.hero{padding:22px 0 10px;}
.hero h1{font-size:26px; line-height:1.3;}
.hero p{margin:8px 0 0; color:var(--muted); font-size:14px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin:14px 0;
}
.card h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.seg.three{grid-template-columns:1fr 1fr 1fr;}
.seg button{
  border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:12px 8px;
  cursor:pointer; font-weight:600; font-size:14px; line-height:1.35;
}
.seg button small{display:block; font-weight:500; color:var(--muted); font-size:11.5px; margin-top:2px;}
.seg button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-weak); color:var(--accent-2);}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--accent);}
select{
  width:100%; padding:13px 12px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card); color:var(--text); font-size:15px; font-family:inherit; appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) calc(50% + 1px), calc(100% - 14px) calc(50% + 1px);
  background-size:6px 6px, 6px 6px; background-repeat:no-repeat;
}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0;}
.row + .row{border-top:1px solid var(--line);}
.switch{position:relative; width:46px; height:28px; flex:0 0 auto;}
.switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
.switch span{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.2s;}
.switch span::after{content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + span{background:var(--accent);}
.switch input:checked + span::after{transform:translateX(18px);}
.cta{
  display:block; width:100%; margin-top:6px; padding:16px; border-radius:14px; border:0;
  background:var(--accent); color:#fff; font-size:17px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 18px rgba(47,125,93,.28);
}
[data-theme="dark"] .cta{color:#08120d;}
.cta:active{transform:translateY(1px);}
.ghost{
  width:100%; padding:14px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); font-weight:600; cursor:pointer;
}
.ghost:active{background:var(--accent-weak);}
.quicklinks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.quicklinks button{
  border:1px solid var(--line); background:var(--card); border-radius:14px; padding:14px 10px;
  font-weight:600; font-size:14px; cursor:pointer; text-align:left; box-shadow:var(--shadow);
}
.quicklinks b{display:block; font-size:18px; margin-top:2px; color:var(--accent);}

/* quiz */
.qmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.badge{
  font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px;
  background:var(--accent-weak); color:var(--accent-2);
}
[data-theme="dark"] .badge{color:var(--accent);}
.badge.gray{background:var(--line); color:var(--muted);}
.badge.lec{background:#fff0d1; color:#8a5a12;}
[data-theme="dark"] .badge.lec{background:#3a2b12; color:#f3c97d;}
.star{margin-left:auto; border:0; background:transparent; font-size:22px; line-height:1; cursor:pointer; padding:6px; color:var(--muted);}
.star[aria-pressed="true"]{color:#f0b429;}
.stem{font-size:18px; font-weight:600; line-height:1.5; margin:2px 0 16px; word-break:keep-all;}
.opts{display:flex; flex-direction:column; gap:9px;}
.opt{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:14px 14px; border-radius:13px; border:1.5px solid var(--line);
  background:var(--card); cursor:pointer; font-size:15.5px; line-height:1.45;
  transition:border-color .12s, background .12s; word-break:keep-all;
}
.opt .num{
  flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--muted);
  margin-top:1px;
}
.opt .txt{flex:1;}
.opt[data-picked="1"]{border-color:var(--accent); background:var(--accent-weak);}
.opt[data-picked="1"] .num{border-color:var(--accent); color:var(--accent-2);}
.opt.right{border-color:var(--right-line); background:var(--right-bg);}
.opt.right .num{border-color:var(--right); background:var(--right); color:#fff;}
.opt.wrong{border-color:var(--wrong-line); background:var(--wrong-bg);}
.opt.wrong .num{border-color:var(--wrong); background:var(--wrong); color:#fff;}
.opt[disabled]{cursor:default;}
.opt .mark{margin-left:auto; font-weight:700; font-size:13px; color:var(--muted);}
.feedback{
  margin-top:14px; padding:14px; border-radius:13px; border:1px solid var(--line);
  background:var(--card); font-size:14.5px; line-height:1.6; word-break:keep-all;
}
.feedback.ok{border-color:var(--right-line); background:var(--right-bg);}
.feedback.no{border-color:var(--wrong-line); background:var(--wrong-bg);}
.feedback .head{font-weight:800; margin-bottom:6px;}
.feedback .ans{margin-bottom:6px;}
.navbar{
  display:flex; gap:10px; margin-top:18px;
}
.navbar button{flex:1; padding:15px; border-radius:14px; font-weight:700; font-size:16px; cursor:pointer; border:1.5px solid var(--line); background:var(--card);}
.navbar .primary{background:var(--accent); border-color:var(--accent); color:#fff;}
[data-theme="dark"] .navbar .primary{color:#08120d;}
.navbar button[disabled]{opacity:.4; cursor:default;}
.hint{margin-top:14px; font-size:12px; color:var(--muted); text-align:center;}

/* 24시간 안 보기 */
.hidebar{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); text-align:center;}
.hidebtn{
  width:100%; padding:11px 14px; border-radius:12px; border:1.5px dashed var(--line);
  background:var(--card); font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;
}
.hidebtn:active{transform:scale(.99);}
.hidebar.on .hidebtn{border-style:solid; border-color:var(--accent); background:var(--accent-weak); color:var(--accent-2);}
[data-theme="dark"] .hidebar.on .hidebtn{color:var(--accent);}
.hiddenitem{
  border:1px solid var(--line); background:var(--card); border-radius:12px;
  padding:12px; margin-bottom:8px; font-size:14.5px; line-height:1.5;
}
.hiddenitem .row-top{display:flex; gap:8px; align-items:center; margin-bottom:4px; flex-wrap:wrap;}
.hiddenitem .meta{font-size:11.5px; color:var(--muted);}
.hiddenitem .act{display:flex; gap:8px; margin-top:10px;}
.hiddenitem .act button{
  flex:1; padding:9px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); font-size:13px; font-weight:600; cursor:pointer;
}
.hiddenitem .act button:active{background:var(--accent-weak);}

/* result */
.score{display:flex; align-items:center; gap:18px;}
.ring{
  --p:0; width:96px; height:96px; border-radius:50%; flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);
  display:flex; align-items:center; justify-content:center;
}
.ring > div{
  width:76px; height:76px; border-radius:50%; background:var(--card);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;
}
.score .num{font-size:22px; font-weight:800;}
.wronglist{margin-top:8px;}
.wrongitem{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--card);
  border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer; font-size:14.5px; line-height:1.5;
}
.wrongitem .row-top{display:flex; gap:8px; align-items:center; margin-bottom:4px;}
.wrongitem .meta{font-size:11.5px; color:var(--muted);}
.wrongitem .mine{color:var(--wrong); font-size:13px;}
.wrongitem .corr{color:var(--right); font-size:13px;}
.empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:14px;}

/* detail */
.detail .stem{margin-top:4px;}
.answerbox{margin-top:14px; padding:14px; border-radius:13px; background:var(--accent-weak); border:1px solid var(--line); font-size:14.5px; line-height:1.6; word-break:keep-all;}
.footer{margin:28px 0 6px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7;}
a.link{color:var(--accent-2); text-decoration:none; border-bottom:1px solid currentColor;}
@media (min-width:560px){
  .stem{font-size:19px;}
  .opt{font-size:16px;}
}
</style>
</head>

r":2019,"kind":"기말","no":50,"stem":"다음 중 잔디 종류의 식별을 위한 주요 부위가 아닌 것은?","opts":["입혀","잎귀","종자","꽃"],"ans":[4],"multi":false,"dup":false,"expl":"잔디 식별은 잎혀·잎귀·잎깃·종자 등의 형태로 하며, 꽃은 주요 식별 부위로 쓰지 않는다."},{"id":"2019-2-기말-51","set":"2019-2-기말","year":2019,"kind":"기말","no":51,"stem":"다음 잔디 중 한지형이며 골프경기 등을 목적으로 집약적으로 관리할 때 높은 질감을 갖는 것은?","opts":["버팔로그래스","페스큐","켄터키 블루그래스","벤트그래스"],"ans":[4],"multi":false,"dup":false,"expl":"벤트그래스는 한지형 중에서도 5mm 이하로 낮게 깎아 균일하고 질감이 좋아 골프 그린 조성에 쓰인다."},{"id":"2019-2-기말-52","set":"2019-2-기말","year":2019,"kind":"기말","no":52,"stem":"잔디식재에서 종자파종의 장점은?","opts":["조성에 드는 비용이 비싸다","대단위 면적 피복이 가능하다","단기간에 잔디조성이 가능하다","잔디 깎기를 하지 않아도 된다"],"ans":[2],"multi":false,"dup":true,"expl":"종자파종은 비용이 적게 들고 대단위 면적을 한 번에 피복할 수 있다는 것이 장점이다."},{"id":"2019-2-기말-53","set":"2019-2-기말","year":2019,"kind":"기말","no":53,"stem":"난류의 특성을 바르게 설명한 것은?","opts":["쌍자엽식물이다","종류가 단순하다","주로 자가수정한다","미숙 배를 가지고 있다"],"ans":[4],"multi":false,"dup":true,"expl":"난과식물은 씨방 안에 미숙한 배가 있고 종자에 지질을 저장한다. 단자엽식물이며 주로 타가수정한다."},{"id":"2019-2-기말-54","set":"2019-2-기말","year":2019,"kind":"기말","no":54,"stem":"서양란에 대한 설명으로 옳은 것은?","opts":["분포범위가 좁다","대부분 산악지대가 원산지다","종류가 많지 않다","종류로는 덴드로비움이 있다"],"ans":[4],"multi":false,"dup":true,"expl":"교재상 서양란에는 덴드로비움·카틀레야·팔레놉시스 등이 포함된다."},{"id":"2019-2-기말-55","set":"2019-2-기말","year":2019,"kind":"기말","no":55,"stem":"다음 중 난의 영양번식 중 포기나누기를 이용한 번식법에 해당하는 것은?","opts":["분주법","위구경번식법","삽목번식법","조직배양"],"ans":[1],"multi":false,"dup":true,"expl":"포기나누기(포기 나눔)를 이용한 영양번식법이 분주법이다."},{"id":"2019-2-기말-56","set":"2019-2-기말","year":2019,"kind":"기말","no":56,"stem":"다음 중 영년생 허브는?","opts":["바실","캐모마일","딜","오레가노"],"ans":[4],"multi":false,"dup":false,"expl":"오레가노는 영년생(다년생) 허브이다. 바실·캐모마일·딜은 일년생 허브로 분류된다."},{"id":"2019-2-기말-57","set":"2019-2-기말","year":2019,"kind":"기말","no":57,"stem":"허브의 삽목 시에 많이 사용하는 발근제는?","opts":["지베렐린","루톤","사이토키닌","오옥신"],"ans":[2],"multi":false,"dup":false,"expl":"허브 삽목에는 발근촉진제인 루톤(인돌부티르산)을 많이 사용한다."},{"id":"2019-2-기말-58","set":"2019-2-기말","year":2019,"kind":"기말","no":58,"st -2-출석-12","set":"2019-2-출석","year":2019,"kind":"출석대체","no":12,"stem":"다음 중 생태순화형의 일종인 수경재배 방식은?","opts":["아쿠아포닉스","자루재배","암면배지재배","입상암면배지재배"],"ans":[1],"multi":false,"dup":false,"expl":"생태순화형 수경재배의 대표적인 방식은 아쿠아포닉스이다."},{"id":"2019-2-출석-13","set":"2019-2-출석","year":2019,"kind":"출석대체","no":13,"stem":"다음 중 수확까지 소요일수가 가장 긴 채소는?","opts":["20일 무","오이","가지","아스파라거스"],"ans":[4],"multi":false,"dup":true,"expl":"수확까지 소요일수가 가장 긴 채소는 아스파라거스이다."},{"id":"2019-2-출석-14","set":"2019-2-출석","year":2019,"kind":"출석대체","no":14,"stem":"다음 중 월동하여 재배하는 겨울채소는 어느 것인가?","opts":["고추","수박","양파","쑥갓"],"ans":[3],"multi":false,"dup":false,"expl":"월동하여 재배하는 겨울채소는 양파이다."},{"id":"2019-2-출석-15","set":"2019-2-출석","year":2019,"kind":"출석대체","no":15,"stem":"다음 중 블루베리 뿌리에 대한 설명으로 옳지 않은 것은?","opts":["심토(깊이 50cm 이상)까지 깊게 분포한다","뿌리 생장에 적합한 온도는 7∼20℃이다","뿌리 신장이 가장 활발한 시기는 6월 초순이다","뿌리는 근모가 없기 때문에 양수분 흡수력이 약하다"],"ans":[1],"multi":false,"dup":false,"expl":"블루베리 뿌리는 천근성으로 얕게 분포하므로 '심토 50cm 이상 깊게 분포한다'는 설명이 옳지 않다."},{"id":"2018-2-기말-36","set":"2018-2-기말","year":2018,"kind":"기말","no":36,"stem":"다음 중 생활원예의 효과로 볼 수 없는 것은?","opts":["정원에서 토마토를 묶어 주면서 자연과 인생을 공부하는 것","주말농장에서 기르고 수확한 신선한 토마토를 먹는 것","선비들이 눈 내린 겨울날 가헌에 모여 분매(盆梅)를 감상한 것","과수재배에서 전정기술을 익혀 사과 생산량을 극대화하는 것"],"ans":[4],"multi":false,"dup":false,"expl":"생활원예의 효과는 정서 안정·신선한 식품 생산·자연과 인생 공부 등이지, 과수 전정으로 생산량을 극대화하는 상업적 소득 추구가 아니다."},{"id":"2018-2-기말-37","set":"2018-2-기말","year":2018,"kind":"기말","no":37,"stem":"다음 생활원예 활동 중 투명한 용기 안에 흙을 채우고 적절한 식물을 배치하여 꾸미는 정원을 의미하는 것은?","opts":["테라리움","디쉬가든","분경","비바리움"],"ans":[1],"multi":false,"dup":false,"expl":"투명한 용기 안에 흙을 채우고 식물을 배치해 꾸미는 정원이 테라리움이다. ②는 디시가든, ③은 분경, ④는 비바리움이다."},{"id":"2018-2-기말-38","set":"2018-2-기말","year":2018,"kind":"기말","no":38,"stem":"원예활동 중 포푸리를 바르게 설명한 것은?","opts":["말림꽃을 화훼장식에 소재로 사용한 것","향기롭고 색깔이 고운 꽃잎이나 허브를 말려 감상하는 것","누름꽃을 화훼장식에 소재로 사용한 것","접시위에 자연의 풍경을 연출한 것"],"ans":[2],"multi":false,"dup":true,"expl":"포푸리는 향기롭고 색깔이 고운 꽃잎이나 허브를 말려 향과 색을 감상하는 것이다."},{"id":"2018-2-기말-39","set":"2018-2-기말","year":2018,"kind":"기말","no":39,"stem":"다음 중 포자로 번식하는 하등식물로 엽록체가 발달하여 독립 영양생활을 하는 식물문은?","opts":["선태식물문","양치식물문","나자식물문","피자식물문"],"ans":[1],"multi":false,"dup":false,"expl":"선태식물문은 포자로 번식하는 하등식물이지만 엽록체가 있어 독립영양을 한다. 양치식물은 관다발이 발달한 하등식물이다."},{"id":"2018-2-기말-40","set":"2018-2-기말","year":2018,"kind":"기말","no":40,"stem":"다음 중 완전한 꽃의 구성요소를 가지고 있어서 현화식물로 분류되고 중복수정 후 자방은 과실로 발달하는 식물문은?","opts":["선태식물문","양치식물문","나자식물문","피자식물문"],"ans":[4],"multi":false,"dup":false,"expl":"완전한 꽃을 갖고 중복수정 후 자방이 과실로 발달하는 식물문은 피자식물문(현화식물)이다."},{"id":"2018-2-기말-41","set":"2018-2-기말","year":2018,"kind":"기말","no":41,"stem":"다음 학명을 이루고 있는 이름에서 종을 지칭하는 이름은?","opts":["속명","종소명","아종명","변종명"],"ans":[2],"multi":false,"dup":false,"expl":"학명의 두 번째 단어인 종소명이 종을 지칭한다. 첫 단어는 속명이다."},{"id":"2018-2-기말-42","set":"2018-2-기말","year":2018,"kind":"기말","no":42,"stem":"방울다다기양배추의 학명 Brassica oleracea var. gemmifera에서 gemmifera는 무엇을 나타내는가?","opts":["과명","속명","변종명","명명자"],"ans":[3],"multi":false,"dup":false,"expl":"var. 뒤에 오는 gemmifera는 변종명이다."},{"id":"2018-2-기말-43","set":"2018-2-기말","year":2018,"kind":"기말","no":43,"stem":"일년초화류 중 춘파일년초의 특징으로 가장 적합한 것은?","opts":["아한대 원산","저온에서 생육 양호","장일성 식물","여름에서 가을에 걸쳐 개화"],"ans":[4],"multi":false,"dup":false,"expl":"춘파일년초는 봄에 파종해 여름∼가을에 걸쳐 개화한다. 추파일년초는 가을에 파종해 이듬해 봄에 개화하는 장일식물이다."},{"id":"2018-2-기말-44","set":"2018-2-기말","year":2018,"kind":"기말","no":44,"stem":"다음 중 줄기의 마디사이와 잎의 엽초와 엽신의 기부에 분포하는 분열조직은?","opts":["정단분열조직","개재분열조직","측재분열조직","유합조직"],"ans":[2],"multi":false,"dup":false,"expl":"마디사이와 잎의 엽초·엽신 기부에 남아 있는 분열조직은 개재분열조직이다."},{"id":"2018-2-기말-45","set":"2018-2-기말","year":2018,"kind":"기말","no":45,"stem":"다음 잎 내부구조에서 기공이 분포되어 있는 조직은?","opts":["표피조직","책상조직","유관속초세포","해면조직"],"ans":[1],"multi":false,"dup":false,"expl":"기공은 잎의 표피조직에 분포한다. 책상조직·해면조직은 엽육조직이다."},{"id":"2018-2-기말-46","set":"2018-2-기말","year":2018,"kind":"기말","no":46,"stem":"다음 뿌리에서 양분과 수분 흡수가 가장 활발한 조직은?","opts":["생장점","신장대","뿌리골무","뿌리털"],"ans":[4],"multi":false,"dup":false,"expl":"양분과 수분 흡수는 표피세포가 뿌리털로 변형된 뿌리털(성숙대)에서 가장 활발하다."},{"id":"2018-2-기말-47","set":"2018-2-기말","year":2018,"kind":"기말","no":47,"stem":"다음 중 쌍자엽식물 광합성의 90%가 이루어지는 곳은?","opts":["큐티클","책상엽육조직","유관속조직","표피조직"],"ans":[2],"multi":false,"dup":false,"expl":"쌍자엽식물 잎에서 광합성의 90%는 책상엽육조직에서 이루어진다."},{"id":"2018-2-기말-48","set":"2018-2-기말","year":2018,"kind":"기말","no":48,"stem":"암술을 구성하는 기본 단위는 심피이다. 다음 중 심피를 구성하는 조직이 아닌 것은?","opts":["꽃실","암술머리","씨방","암술대"],"ans":[1],"multi":false,"dup":false,"expl":"심피는 암술머리·암술대·씨방으로 구성된다. 꽃실은 수술의 구성 요소이다."},{"id":"2018-2-기말-49","set":"2018-2-기말","year":2018,"kind":"기말","no":49,"stem":"다음 종자에 대한 설명으로 바르지 않은 것은?","opts":["씨방 안에 있는 밑씨는 수정 후에 종자로 발달한다","밑씨의 표피는 과피로 발달한다","배유는 영양분 저장조직이다","씨방벽이 종피에 말라붙은 종자를 여윈과실이라 한다"],"ans":[2],"multi":false,"dup":false,"expl":"밑씨의 표피는 종피로 발달하며, 과피는 씨방벽이 발달한 것이다."},{"id":"2018-2-기말-50","set":"2018-2-기말","year":2018,"kind":"기말","no":50,"stem":"잔디 종류의 식별을 위한 방법으로 바르지 않은 것은?","opts":["잎혀의 막과 털로 식별한다","잎귀의 길이로 식별한다","줄기 길이로 식별한다","잎깃이 연결되거나 양분된 것으로 식별한다"],"ans":[3],"multi":false,"dup":false,"expl":"잔디 식별에는 잎혀·잎귀·잎깃의 형태를 이용하지 줄기 길이로 식별하지는 않는다."},{"id":"2018-2-기말-51","set":"2018-2-기말","year":2018,"kind":"기말","no":51,"stem":"다음 중 난지형 잔디류에 해당하는 것은?","opts":["한국잔디류","켄터키 블루그래스","벤트그래스류","페스큐류"],"ans":[1],"multi":false,"dup":false,"expl":"난지형 잔디에는 한국잔디류(들잔디)·버뮤다그래스 등이 있고, 켄터키 블루그래스·벤트그래스·페스큐는 한지형이다."},{"id":"2018-2-기말-52","set":"2018-2-기말","year":2018,"kind":"기말","no":52,"stem":"다음 잔디 중 잎 끝은 보트형으로 둥글게 홈져 있으며 잎의 중앙 엽맥의 양쪽에 연한 선이 있는 것은?","opts":["켄터키 블루그래스","페스큐류","한국잔디류","벤트그래스류"],"ans":[1],"multi":false,"dup":false,"expl":"잎 끝이 보트 모양으로 둥글고 엽맥 양쪽에 연한 선이 있는 것은 켄터키 블루그래스이다."},{"id":"2018-2-기말-53","set":"2018-2-기말","year":2018,"kind":"기말","no":53,"stem":"난 재배환경으로 바르게 설명한 것은?","opts":["광도가 4000lux 이하 조건에서 잘 자란다","동양란은 겨울에는 5℃이상, 여름엔 30℃이하에서 재배한다","공중습도는 40% 정도로 유지시킨다","토양공극 사이에 공기보다 물이 많은 조건에서 재배한다"],"ans":[2],"multi":false,"dup":true,"expl":"동양란은 겨울 5℃ 이상, 여름 30℃ 이하에서 재배한다. 난은 40%보다 높은 60∼70% 습도가 필요하고 통기성이 중요하다."},{"id":"2018-2-기말-54","set":"2018-2-기말","year":2018,"kind":"기말","no":54,"stem":"난의 영양번식 방법 중 2~3개의 촉(shoot)을 하나의 단위로 나누어 화분에 심는 것은?","opts":["삽목번식법","생장점배양","분주법","화경배양"],"ans":[3],"multi":false,"dup":false,"expl":"2∼3개의 촉을 한 단위로 나누어 화분에 심는 영양번식법은 분주법이다."},{"id":"2018-2-기말-55","set":"2018-2-기말","year":2018,"kind":"기말","no":55,"stem":"다음 허브 식물들 중 사람의 신경을 안정시키는 효능이 있는 것으로 알려진 허브식물은?","opts":["카라웨이","고수","쿠민","캐모마일"],"ans":[4],"multi":false,"dup":false,"expl":"캐모마일은 신경을 안정시키는 효능이 있는 허브로 알려져 있다."},{"id":"2018-2-기말-56","set":"2018-2-기말","year":2018,"kind":"기말","no":56,"stem":"다음 허브 식물들 중 월동가능 온도가 가장 높은 것은?","opts":["알로에","민들레","인삼","레몬밤"],"ans":[1],"multi":false,"dup":false,"expl":"알로에는 열대·아열대성이라 월동 가능 온도가 가장 높다. 인삼·민들레·레몬밤은 내한성이 강하다."},{"id":"2018-2-기말-57","set":"2018-2-기말","year":2018,"kind":"기말","no":57,"stem":"다음 중 허브식물 영양번식에 대한 설명으로 바르지 않은 것은?","opts":["허브의 영양번식은 삽목, 휘묻이, 포기나누기법이 있다","삽수 끝을 발근제인 루톤을 묻혀서 심으면 발근이 잘된다","삽목 후 수일간 햇볕이 잘 드는 곳에 건조한 조건으로 놔둔다","포기나누기는 박하, 레몬밤, 차이브 같은 영년생 초본 식물을 삽으로 캐서 분리하여 심는 방법이다"],"ans":[3],"multi":false,"dup":false,"expl":"삽목 후에는 직사광선을 피하고 습도를 높게 유지해야 한다. 햇볕이 잘 드는 건조한 곳에 두는 것은 잘못이다."},{"id":"2018-2-기말-58","set":"2018-2-기말","year":2018,"kind":"기말","no":58,"stem":"다음 꽃꽂이에 이용되는 식물소재 중 절화 거베라, 국화 등은 어느 형태에 속하는가?","opts":["라인플라워","매스플라워","필러플라워","폼플라워"],"ans":[2],"multi":false,"dup":false,"expl":"거베라·국화처럼 꽃 한 송이가 덩어리를 이루어 공간을 채우는 소재는 매스플라워이다."},{"id":"2018-2-기말-59","set":"2018-2-기말","year":2018,"kind":"기말","no":59,"stem":"다음 절화의 수명을 연장시키기 위한 관리방법과 그 이유를 설명한 것 중 바람직한 것은?","opts":["줄기 재절단은 막힌 도관을 뚫어주기 위함이다","절화보존용액을 사용하여 증산이 활발하게 되도록 한다","줄기에 있는 모든 잎을 따주어 에틸렌 발생을 최소화한다","세균이나 미생물 번식억제를 위하여 저장고 습도는 50% 미만으로 유지한다"],"ans":[1],"multi":false,"dup":false,"expl":"줄기 재절단은 막힌 도관을 뚫어 물올림을 좋게 하기 위해서이다. 저장습도는 오히려 높게(90% 이상) 유지한다."},{"id":"2018-2-기말-60","set":"2018-2-기말","year":2018,"kind":"기말","no":60,"stem":"다음 간이 수경재배 종류 중 순수수경 방식에서 베드 내 뿌리의 윗부분이 공기 중에 노출되고 밑부분은 흐르는 양액에 접촉되며 베드 내 양액이 잘 순환될 수 있도록 1/60～1/80의 경사도를 유지하는 방식은?","opts":["박막수경","담액수경","분무경","분무수경"],"ans":[1],"multi":false,"dup":false,"expl":"베드에 경사(1/60∼1/80)를 두고 양액을 얇게 흘려 뿌리 일부는 공기 중에 노출되게 하는 방식은 박막수경(NFT)이다."},{"id":"2018-2-기말-61","set":"2018-2-기말","year":2018,"kind":"기말","no":61,"stem":"최근 씨감자 생산을 위한 수경재배 방식으로 가장 많이 이용하는 방식은?","opts":["담액수경","박막수경","저면관수","분무경"],"ans":[4],"multi":false,"dup":false,"expl":"씨감자 생산에는 분무경이 가장 많이 이용된다."},{"id":"2018-2-기말-62","set":"2018-2-기말","year":2018,"kind":"기말","no":62,"stem":"다음 중 가정에서 수경재배방식과 함께 사용할 수 있는 경제적인 광원은?","opts":["수은등","LED등","백열등","고압나트륨등"],"ans":[2],"multi":false,"dup":true,"expl":"가정용 수경재배에는 전력 소모가 적고 수명이 긴 LED등이 경제적이다."},{"id":"2018-2-기말-63","set":"2018-2-기말","year":2018,"kind":"기말","no":63,"stem":"다음 양액관리에 대해 설명한 것 중 바르지 않은 것은?","opts":["양액의 pH가 7.0 이상이 되면 Fe, B, Mn이 결핍된다","전기전도도(EC) 증가는 양액의 총염류농도 증가를 뜻한다","저온성 식물의 경우 양액온도는 8～12℃로 유지한다","여름철 양액온도가 높아질수록 포화용존산소량은 부족해진다"],"ans":[3],"multi":false,"dup":false,"expl":"저온성 식물의 양액온도는 15∼20℃ 정도로 유지한다. 8∼12℃는 너무 낮다."},{"id":"2018-2-기말-64","set":"2018-2-기말","year":2018,"kind":"기말","no":64,"stem":"다음 중 스쿨팜의 효과에 대한 설명으로 바르지 않은 것은?","opts":["자연을 사랑하는 마음을 갖게 한다","농업, 식품, 영양에 대한 지식과 경험을 쌓을 수 있게 한다","동료학생 및 선생님과의 협력의 기회를 제공한다","식물재배와 관련된 이론을 집중적으로 교육받는다"],"ans":[4],"multi":false,"dup":false,"expl":"스쿨팜은 자연 사랑, 농업·식품·영양 지식, 협력 기회를 주는 체험 활동이지 이론을 집중 교육하는 곳이 아니다."},{"id":"2018-2-기말-65","set":"2018-2-기말","year":2018,"kind":"기말","no":65,"stem":"다음 해외 국가들의 공동체 정원활동의 주요 목적으로 바르지 않은 것은?","opts":["공동체 의식 키우기","자연․환경보호 활동","아이들 야외학습장소","지역구 행정비용 마련"],"ans":[4],"multi":false,"dup":false,"expl":"공동체 정원의 목적은 공동체 의식·환경보호·아이들 야외학습 등이며, 행정비용 마련과는 무관하다."},{"id":"2018-2-기말-66","set":"2018-2-기말","year":2018,"kind":"기말","no":66,"stem":"다음 중 국가별 공동체 정원의 프로그램이나 단체 연결이 바른 것은?","opts":["미국 - P-패치","영국 - 클라인가르텐","독일 - 캐피털 그로스","일본 - 얼로트먼트"],"ans":[1],"multi":false,"dup":false,"expl":"미국의 공동체 정원 프로그램은 P-패치이다. 클라인가르텐은 독일, 얼로트먼트는 영국이다."},{"id":"2018-2-기말-67","set":"2018-2-기말","year":2018,"kind":"기말","no":67,"stem":"실내정원의 기능 중 환경적 기능을 바르게 설명한 것은?","opts":["대체로 잎이 작고 두꺼운 식물이 음이온을 많이 발생시킨다","목본식물에서 발생되는 피톤치드는 쾌적감과 항균효과를 준다","선인장류는 밤에 이산화탄소를 대기에 방출한다","식물의 증산작용은 실내 습도를 높여 쾌적함을 떨어  넓고 다양하고, 일반원예(생산원예)는 좁고 단순하다. 나머지 비교는 강의록 표와 같다."},{"id":"L01-3","set":"강의록","year":null,"kind":"강의록","no":3,"lec":1,"lecName":"생활원예란","src":"L","stem":"식물의 기능과 효용가치를 1차(생존)·2차(환경)·3차(관상) 기능으로 나눌 때, 3차 기능에 해당하는 것은?","opts":["산소 공급과 이산화탄소 흡수","기후 조절과 홍수·침식 방지","정서 안정과 스트레스 해소, 원예치료","약제와 사료 원료 공급"],"ans":[3],"multi":false,"dup":false,"expl":"3차(관상) 기능은 정서 안정, 스트레스 해소, 휴식과 오락, 여가 선용, 원예치료이며, 산소 공급·약제·사료는 1차(생존), 기후 조절·홍수 방지는 2차(환경) 기능이다."},{"id":"L01-4","set":"강의록","year":null,"kind":"강의록","no":4,"lec":1,"lecName":"생활원예란","src":"L","stem":"생활원예가 필요해진 사회적 배경과 그로 인한 질병의 연결로 옳지 않은 것은?","opts":["산업화 - 환경파괴 - 육체적 질병","도시화 - 정서불안 - 정신적 질병","정보화 - 기계인간 - 사회적 질병","도시화 - 환경파괴 - 육체적 질병"],"ans":[4],"multi":false,"dup":false,"expl":"강의록은 산업화로 인한 환경파괴를 육체적 질병, 도시화로 인한 정서불안을 정신적 질병, 정보화로 인한 기계인간을 사회적 질병과 연결한다."},{"id":"L01-5","set":"강의록","year":null,"kind":"강의록","no":5,"lec":1,"lecName":"생활원예란","src":"L","stem":"조선시대 강희안이 지은 책으로, 화훼를 재배하는 까닭을 '오직 마음과 뜻을 더욱 닦고 덕성을 함양하고자 함'이라고 밝힌 것은?","opts":["양화소록","매화시첩","초충도수병","가헌관매도"],"ans":[1],"multi":false,"dup":false,"expl":"양화소록은 조선시대 강희안(1417~1494)이 꽃을 사랑한 선비의 마음을 담아 쓴 책으로, 화훼 재배의 목적을 수양과 덕성 함양에 두었다."},{"id":"L01-6","set":"강의록","year":null,"kind":"강의록","no":6,"lec":1,"lecName":"생활원예란","src":"L","stem":"생활원예 용기소품 가운데 접시 모양의 얕은 용기에 흙을 담고 식물을 배치해 만든 작은 정원을 이르는 말은?","opts":["디시가든","테라리움","비바리움","분경"],"ans":[1],"multi":false,"dup":false,"expl":"디시가든(dish garden)은 접시에 담은 정원이다. 테라리움은 투명 용기 안의 정원, 비바리움은 소동물과 함께 기르는 것, 분경은 분재의 일종으로 바위·모래로 자연 풍경을 담은 것이다."},{"id":"L01-7","set":"강의록","year":null,"kind":"강의록","no":7,"lec":1,"lecName":"생활원예란","src":"L","stem":"원예를 뜻하는 영어 Gardening의 어원으로 옳은 것은?","opts":["울타리를 치다라는 뜻의 gyrdan에서 유래했다","물을 준다는 뜻의 hydro에서 유래했다","성 밖의 밭이라는 뜻의 agri에서 유래했다","재배하다는 뜻의 cultura에서 유래했다"],"ans":[1],"multi":false,"dup":false,"expl":"강의록은 Gardening을 gyrdan(울타리를 치다)에서 유래한 말로 설명한다. agri는 농업(agriculture), cultura는 원예(horticulture)의 어원이다."},{"id":"L01-8","set":"강의록","year":null,"kind":"강의록","no":8,"lec":1,"lecName":"생활원예란","src":"L","stem":"원예를 뜻하는 한자 園藝의 풀이로 옳은 것은?","opts":["園(정원) + 藝(예술)","園(울타리) + 藝(재배하다)","園(과수) + 藝(채소)","園(재배하다) + 藝(울타리)"],"ans":[2],"multi":false,"dup":false,"expl":"園藝는 園(울타리)과 藝(재배하다)로 이루어진 말로, 울타리로 에워싼 밭에서 식물을 가꾼다는 뜻이다."},{"id":"L01-9","set":"강의록","year":null,"kind":"강의록","no":9,"lec":1,"lecName":"생활원예란","src":"L","stem":"라틴어 어근 horti-와 agri-에 대한 설명으로 옳은 것은?","opts":["horti-는 성 안의, agri-는 성 밖의라는 뜻이다","horti-는 나무, agri-는 풀이라는 뜻이다","horti-는 물, agri-는 흙이라는 뜻이다","horti-는 성 밖의, agri-는 성 안의라는 뜻이다"],"ans":[1],"multi":false,"dup":false,"expl":"Horticulture의 horti-는 성 안의, Agriculture의 agri-는 성 밖의라는 뜻으로 원예와 농업의 장소적 차이를 보여 준다."},{"id":"L01-10","set":"강의록","year":null,"kind":"강의록","no":10,"lec":1,"lecName":"생활원예란","src":"L","stem":"원예의 정의에 담긴 특징으로 옳지 않은 것은?","opts":["자본과 노동을 최소로 하는 조방적 재배이다","대상은 귀하고 경제성이 큰 식물이다","장소는 가까운 생활 주변이다","규모는 작고 제한된 공간이다"],"ans":[1],"multi":false,"dup":false,"expl":"원예는 자본·노동·토지·기술을 집약적으로 투입하는 재배 방식이며 조방적 재배가 아니다."},{"id":"L01-11","set":"강의록","year":null,"kind":"강의록","no":11,"lec":1,"lecName":"생활원예란","src":"L","stem":"식물의 기능 가운데 1차(생존) 기능에 해당하는 것은?","opts":["산소 공급과 이산화탄소 흡수, 약제·사료 원료 공급","기후 조절과 홍수·침식 방지","대기 정화와 방음, 건축 환경 조성","정서 안정과 스트레스 해소, 원예치료"],"ans":[1],"multi":false,"dup":false,"expl":"1차(생존) 기능은 산소 공급·이산화탄소 흡수와 의식주, 약제·사료 원료 공급이고, 기후 조절·대기 정화는 2차, 정서 안정은 3차 기능이다."},{"id":"L01-12","set":"강의록","year":null,"kind":"강의록","no":12,"lec":1,"lecName":"생활원예란","src":"L","stem":"식물의 기능 가운데 2차(환경) 기능에 해당하지 않는 것은?","opts":["기후 조절","홍수와 침식 방지","방음과 건축 환경 조성","식량과 의복 재료 공급"],"ans":[4],"multi":false,"dup":false,"expl":"식량·의복 등 의식주와 관련된 것은 1차(생존) 기능이고, 2차(환경) 기능은 기후 조절, 홍수·침식 방지, 대기 정화, 방음, 건축 환경이다."},{"id":"L01-13","set":"강의록","year":null,"kind":"강의록","no":13,"lec":1,"lecName":"생활원예란","src":"L","stem":"강의록이 소개한 연구에서 녹색 공간을 응시할 때 나타나는 효과는?","opts":["면역력 저하","창의성 향상","시력 회복","식욕 증진"],"ans":[2],"multi":false,"dup":false,"expl":"나무와 숲이 우거진 곳에서 운동하면 운동 효과가 향상되고, 녹색 공간을 응시하면 창의성이 향상된다고 소개한다."},{"id":"L01-14","set":"강의록","year":null,"kind":"강의록","no":14,"lec":1,"lecName":"생활원예란","src":"L","stem":"생활원예의 효과 가운데 주말농장을 통해 특히 기대할 수 있는 것은?","opts":["상품 구매 촉진","노후 소외감 극복","가족 간 유대 강화","자연 학습 공간 확보"],"ans":[3],"multi":false,"dup":false,"expl":"강의록은 주말농장을 가족 간 유대를 강화하는 효과의 대표 사례로 든다. 노후 소외감 극복은 노인에게 적정한 일거리를 제공하는 것과 연결된다."},{"id":"L01-15","set":"강의록","year":null,"kind":"강의록","no":15,"lec":1,"lecName":"생활원예란","src":"L","stem":"생활원예가 노인에게 적정한 일거리를 제공함으로써 나타나는 효과로 옳은 것은?","opts":["청정 식품 공급","가족 간 유대 강화","노후 소외감 극복","상품 구매 촉진"],"ans":[3],"multi":false,"dup":false,"expl":"노인에게 적정한 일거리를 제공하는 것은 노후 소외감을 극복하는 효과로 설명된다."},{"id":"L01-16","set":"강의록","year":null,"kind":"강의록","no":16,"lec":1,"lecName":"생활원예란","src":"L","stem":"매화를 자신의 정신세계를 표상하는 등가적 존재로 인식한 퇴계의 저작은?","opts":["초충도수병","매화시첩","책거리","양화소록"],"ans":[2],"multi":false,"dup":false,"expl":"매화시첩은 매화를 사랑한 퇴계가 매화를 자신의 정신세계를 표상하는 등가적 존재로 인식한 기록이다."},{"id":"L01-17","set":"강의록","year":null,"kind":"강의록","no":17,"lec":1,"lecName":"생활원예란","src":"L","stem":"오이와 개구리, 수박과 들쥐 등을 그린 초충도수병을 남긴 인물은?","opts":["정선","신사임당","조희룡","강희안"],"ans":[2],"multi":false,"dup":false,"expl":"초충도수병(草蟲圖繡屛)은 신사임당의 작품으로 오이와 개구리, 수박과 들쥐 등이 그려져 있다."},{"id":"L01-18","set":"강의록","year":null,"kind":"강의록","no":18,"lec":1,"lecName":"생활원예란","src":"L","stem":"분재의 일종으로 그릇에 자연의 풍경을 담고 식물과 함께 바위나 모래를 돋보이게 하는 것은?","opts":["비바리움","테라리움","분경","디시가든"],"ans":[3],"multi":false,"dup":false,"expl":"분경(盆景)은 분재의 일종으로 자연의 풍경을 담아 식물과 바위·모래를 함께 감상하는 것이다."},{"id":"L01-19","set":"강의록","year":null,"kind":"강의록","no":19,"lec":1,"lecName":"생활원예란","src":"L","stem":"생활원예의 종류 가운데 복지효용에 속하는 것으로 묶인 것은?","opts":["꽃꽂이, 화환, 웨딩부케, 코사지","테라리움, 디시가든, 분경, 비바리움","가정채소, 가정과수, 난, 잔디","사회원예, 환경원예, 원예치료, 도시원예"],"ans":[4],"multi":false,"dup":false,"expl":"복지효용에는 사회원예·관상원예·환경원예·원예치료·도시원예·주말농장이, 용기소품에는 테라리움·디시가든·분경·비바리움 등이 속한다."},{"id":"L01-20","set":"강의록","year":null,"kind":"강의록","no":20,"lec":1,"lecName":"생활원예란","src":"L","stem":"꽃잎을 눌러 화훼장식품의 소재로 사용하는 것은?","opts":["포푸리","압화","말림꽃","코사지"],"ans":[2],"multi":false,"dup":false,"expl":"압화(pressed flower)는 꽃잎을 눌러 장식 소재로 쓰는 것이고, 말림꽃은 꽃잎을 말린 것, 포푸리는 향기로운 꽃잎·허브잎을 말려 담은 것이다."},{"id":"L02-1","set":"강의록","year":null,"kind":"강의록","no":21,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"3영역(domain) 가운데 세포핵이 없는 단세포 미생물로 원핵생물의 한 부류에 속하는 것은?","opts":["박테리아(진정세균)","아르케아(고세균)","유카리아(진핵생물)","곰팡이계"],"ans":[2],"multi":false,"dup":false,"expl":"아르케아(Archaea)는 세포핵이 없는 단세포 미생물로 원핵생물의 한 부류이다. 박테리아는 진정세균, 유카리아는 진핵생물이다."},{"id":"L02-2","set":"강의록","year":null,"kind":"강의록","no":22,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"양치식물문에 대한 설명으로 옳은 것은?","opts":["유관속이 없어 물관과 체관이 분화하지 않는다","포자로 번식하며 뿌리·잎·줄기가 발달한 은화식물이다","종자로 번식하며 꽃이 완전한 현화식물이다","중복수정을 하여 배와 배유를 만드는 종자식물이다"],"ans":[2],"multi":false,"dup":false,"expl":"양치식물문은 고등식물로 유관속이 발달하고 포자로 번식하는 은화식물이며, 뿌리·잎·줄기가 발달한다. 일부는 식용·약용·관상용으로 쓰인다."},{"id":"L02-3","set":"강의록","year":null,"kind":"강의록","no":23,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"나자식물에 대한 설명으로 옳지 않은 것은?","opts":["종자로 번식한다","꽃이 불완전하여 은화식물로 분류된다","중복수정을 하여 배유를 형성한다","구과나무로 방울열매를 만드는 종류가 있다"],"ans":[3],"multi":false,"dup":false,"expl":"나자식물은 단일수정을 하며 배유 형성을 위한 수정은 일어나지 않는다. 중복수정은 피자식물의 특징이다."},{"id":"L02-4","set":"강의록","year":null,"kind":"강의록","no":24,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"단자엽식물과 쌍자엽식물의 비교로 옳지 않은 것은?","opts":["자엽은 단자엽이 1개, 쌍자엽이 2개이다","꽃잎 수는 단자엽이 3의 배수, 쌍자엽이 4 또는 5의 배수이다","줄기 유관속은 단자엽이 산재, 쌍자엽이 환상으로 배열된다","엽맥은 단자엽이 망상, 쌍자엽이 평행상이다"],"ans":[4],"multi":false,"dup":false,"expl":"엽맥은 단자엽식물이 평행상, 쌍자엽식물이 망상이다. 근계도 단자엽은 섬유근계, 쌍자엽은 주근계로 다르다."},{"id":"L02-5","set":"강의록","year":null,"kind":"강의록","no":25,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"초본식물과 목본식물에 대한 설명으로 옳은 것은?","opts":["초본식물은 목질화가 없어 부드럽고 형성층이 없어 비대생장을 하지 않는다","목본식물은 형성층이 없어 비대생장을 하지 않는다","초본식물의 90% 이상이 쌍자엽식물이다","나자식물의 90% 이상이 초본식물이다"],"ans":[1],"multi":false,"dup":false,"expl":"초본식물은 목질화가 없고 형성층이 없어 부드럽고 비대생장이 없다. 단자엽식물의 90% 이상이 초본이며, 나자식물의 90% 이상은 목본이다."},{"id":"L02-6","set":"강의록","year":null,"kind":"강의록","no":26,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"구근류를 비대한 기관에 따라 구분할 때, 저장엽이 비대한 인경에 해당하는 것은?","opts":["히야신스","글라디올러스","달리아","시클라멘"],"ans":[1],"multi":false,"dup":false,"expl":"인경은 저장엽이 비대한 것으로 히야신스가 대표적이다. 글라디올러스는 구경(단축된 줄기), 달리아는 괴근(뿌리 비대), 시클라멘은 괴경(땅속줄기)이다."},{"id":"L02-7","set":"강의록","year":null,"kind":"강의록","no":27,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"선태식물(이끼식물)의 특징으로 옳은 것은?","opts":["종자로 번식하는 은화식물이다","고등식물이며 유관속이 발달해 꽃으로 번식한다","하등식물이며 무관속으로 포자로 번식하고 엽록체가 발달한다","뿌리·잎·줄기가 발달한 유관속 식물이다"],"ans":[3],"multi":false,"dup":false,"expl":"선태식물은 하등·무관속·포자번식하는 은화식물로 엽록체가 발달해 독립 영양생활을 한다."},{"id":"L02-8","set":"강의록","year":null,"kind":"강의록","no":28,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"나자식물 가운데 잎은 활엽이지만 침엽수로 분류되는 수종은?","opts":["은행나무","가문비나무","소나무","전나무"],"ans":[1],"multi":false,"dup":false,"expl":"강의록은 은행나무를 활엽이지만 침엽수인 나자식물의 예로 든다."},{"id":"L02-9","set":"강의록","year":null,"kind":"강의록","no":29,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"소나무의 구화수에 대한 설명으로 옳은 것은?","opts":["수구화수는 가지 끝에, 암구화수는 가지 밑부분에 달린다","수구화수와 암구화수 모두 가지 끝에 1~4개씩 달린다","수구화수는 새로 난 가지 밑부분에 달리고 암구화수는 가지 끝에 달린다","암구화수가 노란색 타원형이고 수구화수가 진한 자주색이다"],"ans":[3],"multi":false,"dup":false,"expl":"수구화수는 새로 난 가지 밑부분에 타원형·노란색으로, 암구화수는 가지 끝에 달걀모양·진한 자주색으로 달리며 수구화수 위쪽에 1~4개씩 붙는다."},{"id":"L02-10","set":"강의록","year":null,"kind":"강의록","no":30,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"단자엽식물로만 묶인 것은?","opts":["무궁화, 진달래, 개나리, 배롱나무","해바라기, 토마토, 사과, 콩","옥수수, 양파, 백합, 대나무","장미, 카네이션, 거베라, 국화"],"ans":[3],"multi":false,"dup":false,"expl":"단자엽식물에는 옥수수·양파·마늘·난·백합·대나무가, 쌍자엽식물에는 해바라기·토마토·선인장·사과·콩이 속한다."},{"id":"L02-11","set":"강의록","year":null,"kind":"강의록","no":31,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"자연분류(식물학적 분류)의 기준으로 옳은 것은?","opts":["재배 방법과 소비 형태","식물의 형태적·생태적 유연관계","이용 목적과 행정적 편의","꽃의 색과 개화 시기"],"ans":[2],"multi":false,"dup":false,"expl":"자연분류는 계통적·학술적 분류로 식물의 형태적·생태적 유연관계를 기준으로 하며, 이용상 특성이나 행정적 편의는 인위분류의 기준이다."},{"id":"L02-12","set":"강의록","year":null,"kind":"강의록","no":32,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"무궁화의 분류계급을 큰 단계에서 작은 단계로 바르게 나열한 것은?","opts":["식물계 - 피자식물문 - 아욱과 - 쌍자엽식물강 - 아욱목 - 무궁화종 - 무궁화속","식물계 - 쌍자엽식물강 - 피자식물문 - 아욱목 - 아욱과 - 무궁화종 - 무궁화속","식물계 - 나자식물문 - 쌍자엽식물강 - 아욱과 - 아욱목 - 무궁화속 - 무궁화종","식물계 - 피자식물문 - 쌍자엽식물강 - 아욱목 - 아욱과 - 무궁화속 - 무궁화종"],"ans":[4],"multi":false,"dup":false,"expl":"무궁화는 식물계-피자식물문-쌍자엽식물강-아욱목-아욱과-무궁화속-무궁화종으로 분류된다."},{"id":"L02-13","set":"강의록","year":null,"kind":"강의록","no":33,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"국제식물명명규약(ICBN)에 따른 학명 표기로 옳지 않은 것은?","opts":["라틴어 또는 라틴어화한 영어를 사용한다","이탤릭체로 쓰고 그럴 수 없으면 밑줄을 긋는다","속명과 종소명 모두 대문자로 시작한다","이명법을 사용하며 속명 뒤에 종소명을 쓴다"],"ans":[2],"multi":false,"dup":false,"expl":"속명은 명사로 대문자로 시작하지만 종소명은 형용사로 소문자로 시작하며 속명의 성(남성 -us, 중성 -um, 여성 -a)과 일치시킨다."},{"id":"L02-14","set":"강의록","year":null,"kind":"강의록","no":34,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"린네가 고안한 이명법의 구성으로 옳은 것은?","opts":["속명 + 종소명 + (명명자)","종소명 + 명명자 + 연도","속명 + 변종명 + 재배품종명","과명 + 속명 + 품종명"],"ans":[1],"multi":false,"dup":false,"expl":"이명법은 속명과 종소명에 명명자를 덧붙이는 방식이며, 변종이 들어가면 삼명법이 된다."},{"id":"L02-15","set":"강의록","year":null,"kind":"강의록","no":35,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"숙근초화류 가운데 온실에서 기르는 온실숙근초로 묶인 것은?","opts":["국화, 카네이션","군자란, 서양란, 제라늄","히야신스, 프리지어, 시클라멘","접시꽃, 원추리, 꽃잔디"],"ans":[2],"multi":false,"dup":false,"expl":"노지숙근초는 접시꽃·원추리·꽃잔디, 반노지숙근초는 국화·카네이션, 온실숙근초는 군자란·서양란·제라늄이다."},{"id":"L02-16","set":"강의록","year":null,"kind":"강의록","no":36,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"구근류 가운데 단축된 줄기가 비대해진 구경에 해당하는 것은?","opts":["시클라멘","글라디올러스","달리아","히야신스"],"ans":[2],"multi":false,"dup":false,"expl":"글라디올러스·프리지어는 구경, 히야신스는 인경, 달리아는 괴근, 시클라멘은 괴경이다."},{"id":"L02-17","set":"강의록","year":null,"kind":"강의록","no":37,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"관엽식물의 일반적 특성으로 옳지 않은 것은?","opts":["영양번식으로 번식한다","내한성이 강해 노지에서도 월동한다","고온다습성이며 반음지 식물이다","열대·아열대 원산이다"],"ans":[2],"multi":false,"dup":false,"expl":"관엽식물은 열대·아열대 원산의 고온다습성 반음지 식물로 영양번식하며, 내한성이 강해 노지 월동한다는 설명은 맞지 않는다."},{"id":"L02-18","set":"강의록","year":null,"kind":"강의록","no":38,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"선인장과 다육식물에서 잎·줄기·뿌리가 다육화하는 주된 이유는?","opts":["목질화로 줄기를 단단하게 하기 위해서","저수조직을 발달시켜 건조에 견디기 위해서","종자 결실을 촉진하기 위해서","광합성 면적을 넓히기 위해서"],"ans":[2],"multi":false,"dup":false,"expl":"선인장과 다육식물은 고온·건조에 강하며 잎·줄기·뿌리가 다육화해 저수조직을 이룬다."},{"id":"L02-19","set":"강의록","year":null,"kind":"강의록","no":39,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"온대과수(낙엽과수) 가운데 관목성 과수로 묶인 것은?","opts":["나무딸기, 블루베리","포도나무, 키위","사과, 복숭아","호도, 밤나무"],"ans":[1],"multi":false,"dup":false,"expl":"온대과수의 교목성에는 인과류(사과)·핵과류(복숭아)·각과류(호도), 관목성에는 나무딸기·블루베리, 덩굴성에는 포도나무·머루나무·키위가 속한다."},{"id":"L02-20","set":"강의록","year":null,"kind":"강의록","no":40,"lec":2,"lecName":"원예식물의 분류","src":"L","stem":"채소의 인위분류에서 양채류에 속하는 것은?","opts":["피망, 케일, 셀러리, 파슬리","무, 당근, 우엉, 토란","고추, 마늘, 양파, 생강","수박, 딸기, 토마토, 풋고추"],"ans":[1],"multi":false,"dup":false,"expl":"근채류는 무·당근·우엉·연근·토란, 과채류는 수박·딸기·토마토·풋고추, 조미채류는 고추·마늘·양파·생강·파, 양채류는 피망·케일·셀러리·파슬리이다."},{"id":"L03-1","set":"강의록","year":null,"kind":"강의록","no":41,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"상처 부위에서 유조직이 분열해 형성되며, 접목의 접수와 대목 절단면이나 삽목에서 부정근이 분화하는 조직은?","opts":["유합조직","후벽조직","유관속조직","표피조직"],"ans":[1],"multi":false,"dup":false,"expl":"유합조직(callus)은 상처부의 유조직이 분열해 생기며, 접목·삽목의 상처를 봉합하고 부정근 분화의 바탕이 된다."},{"id":"L03-2","set":"강의록","year":null,"kind":"강의록","no":42,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"뿌리 선단부의 구조를 뿌리 끝에서부터 바르게 나열한 것은?","opts":["뿌리골무 - 생장점 - 신장대 - 성숙대","생장점 - 뿌리골무 - 성숙대 - 신장대","성숙대 - 신장대 - 생장점 - 뿌리골무","뿌리골무 - 신장대 - 생장점 - 성숙대"],"ans":[1],"multi":false,"dup":false,"expl":"뿌리 끝에서 뿌리골무, 생장점, 세포가 빠르게 자라는 신장대, 뿌리털이 발생하는 성숙대 순으로 이어진다."},{"id":"L03-3","set":"강의록","year":null,"kind":"강의록","no":43,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"자연계 원소 82종 중 식물에서 발견되는 원소는 약 60종이며, 산소·탄소·수소·질소가 전체의 95%를 차지한다. 여기에 더해 엽록소를 구성하는 원소는?","opts":["황","마그네슘","칼슘","철"],"ans":[2],"multi":false,"dup":false,"expl":"단백질은 위 4원소에 황이 더해져 구성되고, 엽록소는 위 4원소에 마그네슘이 더해져 구성된다."},{"id":"L03-4","set":"강의록","year":null,"kind":"강의록","no":44,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"다음 중 잎의 변형으로 보기 어려운 것은?","opts":["덩굴손","가시","인엽","수염뿌리"],"ans":[4],"multi":false,"dup":false,"expl":"잎의 변형에는 덩굴손, 가시, 눈비늘, 포, 인엽, 자엽이 있다. 수염뿌리는 단자엽식물의 뿌리 형태이다."},{"id":"L03-5","set":"강의록","year":null,"kind":"강의록","no":45,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"줄기의 변형 가운데 땅속줄기가 비대해진 덩이줄기(괴경)에 해당하는 것은?","opts":["감자","콜라비","글라디올러스","선인장"],"ans":[1],"multi":false,"dup":false,"expl":"덩이줄기(괴경)는 감자이며, 콜라비는 비대경, 글라디올러스는 구경(단축된 줄기), 선인장은 다육질줄기이다."},{"id":"L03-6","set":"강의록","year":null,"kind":"강의록","no":46,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"다음 중 씨방 이외의 조직이 발달해 만들어진 위과(헛열매)에 해당하는 것은?","opts":["복숭아","포도","사과","감"],"ans":[3],"multi":false,"dup":false,"expl":"위과는 씨방 이외의 조직이 함께 발달한 열매로 사과·배·오이·호박·참외·딸기가 이에 속한다. 복숭아·포도·감·고추·토마토는 씨방조직만으로 된 진과이다."},{"id":"L03-7","set":"강의록","year":null,"kind":"강의록","no":47,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"식물세포에만 있고 동물세포에는 없는 것으로 묶인 것은?","opts":["세포막, 핵, 미토콘드리아","세포벽, 엽록체, 액포","리보솜, 골지체, 소포체","중심체, 편모, 섬모"],"ans":[2],"multi":false,"dup":false,"expl":"강의록은 세포벽·엽록체·액포를 식물세포에만 있는 구조로 제시한다."},{"id":"L03-8","set":"강의록","year":null,"kind":"강의록","no":48,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"산소·탄소·수소·질소에 더해 단백질을 구성하는 원소는?","opts":["철","마그네슘","칼슘","황"],"ans":[4],"multi":false,"dup":false,"expl":"단백질은 산소·탄소·수소·질소에 황을 더한 원소이고, 엽록소는 같은 네 원소에 마그네슘을 더한 것이다."},{"id":"L03-9","set":"강의록","year":null,"kind":"강의록","no":49,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"표피조직의 기능으로 옳지 않은 것은?","opts":["뿌리에서는 물을 흡수한다","기공을 통해 기체를 교환한다","물과 양분을 수송한다","식물체를 보호한다"],"ans":[3],"multi":false,"dup":false,"expl":"표피조직은 보호와 기체 교환, 뿌리에서의 물 흡수를 맡고, 물과 양분의 수송은 물관·체관으로 이루어지는 유관속조직의 기능이다."},{"id":"L03-10","set":"강의록","year":null,"kind":"강의록","no":50,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"후벽조직에 대한 설명으로 옳은 것은?","opts":["표피 아래에서 코르크를 만들어 주피를 형성한다","유조직에서 분화해 물과 양분을 수송한다","세포벽이 불균등하게 비후되어 자라는 줄기를 지지한다","두껍고 단단한 2차 세포벽을 가지며 더 이상 생장하지 않는 부분을 지지·강화한다"],"ans":[4],"multi":false,"dup":false,"expl":"후벽조직은 리그닌 등으로 굳은 두꺼운 2차 세포벽을 가진 단단한 조직으로 배과육·셀러리 줄기에서 볼 수 있고, 세포벽이 불균등하게 두꺼운 것은 후각조직이다."},{"id":"L03-11","set":"강의록","year":null,"kind":"강의록","no":51,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"유관속조직을 이루는 물관과 체관의 기능으로 옳은 것은?","opts":["물과 양분의 수송 통로이다","광합성을 하는 동화조직이다","줄기를 지지하는 기계조직이다","식물체를 보호하는 보호조직이다"],"ans":[1],"multi":false,"dup":false,"expl":"유관속조직은 물관과 체관으로 이루어진 통도조직으로 물과 양분을 수송한다."},{"id":"L03-12","set":"강의록","year":null,"kind":"강의록","no":52,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"생장점과 형성층에 대한 설명으로 옳은 것은?","opts":["생장점은 부피생장, 형성층은 길이생장을 담당한다","생장점은 길이생장, 형성층은 부피생장을 담당한다","둘 다 상처 부위에 유합조직을 만든다","둘 다 성숙조직에 속한다"],"ans":[2],"multi":false,"dup":false,"expl":"생장점은 정단분열조직으로 줄기와 뿌리의 길이생장을, 형성층은 측재분열조직으로 부피생장을 맡는다."},{"id":"L03-13","set":"강의록","year":null,"kind":"강의록","no":53,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"개재분열조직(조직간분열조직)이 분포하는 곳으로 옳은 것은?","opts":["뿌리 끝의 뿌리골무 바로 위","접목의 절단면과 상처 부위","줄기의 마디 사이와 잎의 기부","줄기와 뿌리의 표피 아래"],"ans":[3],"multi":false,"dup":false,"expl":"개재분열조직은 절간분열조직이라고도 하며 줄기의 마디 사이와 잎(엽초·엽신)의 기부에 있다."},{"id":"L03-14","set":"강의록","year":null,"kind":"강의록","no":54,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"목본 쌍자엽식물에서 코르크형성층이 만들어지는 위치와 그 결과로 옳은 것은?","opts":["목부 안쪽에서 나이테를 만든다","잎의 표피 아래에서 엽육조직을 만든다","뿌리 내피에서 중심주를 만든다","사부와 표피 사이에서 코르크조직을 만들어 주피를 형성한다"],"ans":[4],"multi":false,"dup":false,"expl":"코르크형성층은 사부와 표피 사이에 생겨 코르크조직을 만들고 이것이 쌓여 주피가 되며, 나이테는 유관속형성층의 비대생장 결과이다."},{"id":"L03-15","set":"강의록","year":null,"kind":"강의록","no":55,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"잎겨드랑이에 형성되는 겨드랑이눈(곁눈)에 대한 설명으로 옳은 것은?","opts":["자라서 가지가 되며 줄기와 잎을 만드는 눈은 잎눈이라 한다","항상 꽃만 만들고 가지는 만들지 못한다","자라서 뿌리가 되며 근모를 만든다","줄기 끝에만 형성되어 생장점을 이룬다"],"ans":[1],"multi":false,"dup":false,"expl":"마디의 잎겨드랑이에 겨드랑이눈이 생겨 자라면 가지가 되며, 줄기와 잎을 만드는 눈은 잎눈, 장차 꽃이 되는 눈은 꽃눈이다."},{"id":"L03-16","set":"강의록","year":null,"kind":"강의록","no":56,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"뿌리털(근모)의 역할로 옳은 것은?","opts":["뿌리를 땅에 단단히 고정한다","뿌리의 표면적을 넓혀 수분과 무기양분의 흡수력을 높인다","뿌리 끝을 보호한다","양분을 저장한다"],"ans":[2],"multi":false,"dup":false,"expl":"근모는 성숙대에서 발생해 표면적을 넓힘으로써 수분·무기양분의 흡수력을 높이며, 뿌리 끝 보호는 뿌리골무의 역할이다."},{"id":"L03-17","set":"강의록","year":null,"kind":"강의록","no":57,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"줄기의 변형으로 옳지 않은 것은?","opts":["비대경","다육질줄기","덩굴손","구경"],"ans":[3],"multi":false,"dup":false,"expl":"다육질줄기(선인장)·비대경(콜라비)·덩이줄기(감자)·구경(글라디올러스)은 줄기의 변형이고, 덩굴손은 잎의 변형이다."},{"id":"L03-18","set":"강의록","year":null,"kind":"강의록","no":58,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"잎의 기능 세 가지로 옳은 것은?","opts":["증산작용, 고정작용, 번식작용","동화작용, 증산작용, 호흡작용","수분작용, 수정작용, 결실작용","흡수작용, 고정작용, 저장작용"],"ans":[2],"multi":false,"dup":false,"expl":"잎은 동화작용(광합성)과 증산작용, 호흡작용을 한다."},{"id":"L03-19","set":"강의록","year":null,"kind":"강의록","no":59,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"배낭모세포가 분열해 만들어지는 8개의 핵 구성으로 옳은 것은?","opts":["반족세포 3개, 극핵 2개, 조세포 2개, 난세포 1개","반족세포 2개, 극핵 2개, 조세포 3개, 난세포 1개","반족세포 3개, 극핵 1개, 조세포 3개, 난세포 1개","반족세포 1개, 극핵 3개, 조세포 2개, 난세포 2개"],"ans":[1],"multi":false,"dup":false,"expl":"배낭모세포가 감수분열해 4개의 배낭세포가 되고 3개가 퇴화한 뒤 남은 1개가 3회 핵분열해 반족세포 3개, 극핵 2개, 조세포 2개, 난세포 1개를 이룬다."},{"id":"L03-20","set":"강의록","year":null,"kind":"강의록","no":60,"lec":3,"lecName":"원예식물의 형태와 구조","src":"L","stem":"씨방 조직만으로 이루어진 진과(참열매)에 해당하는 것은?","opts":["오이, 호박, 참외","사과, 배, 딸기","딸기, 참외, 호박","복숭아, 포도, 감"],"ans":[4],"multi":false,"dup":false,"expl":"진과는 자방이 과육으로, 밑씨가 종자로 발달한 복숭아·자두·포도·감·고추·토마토 등이며, 사과·배·오이·호박·참외·딸기는 씨방 이외 조직이 발달한 위과이다."},{"id":"L04-1","set":"강의록","year":null,"kind":"강의록","no":61,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디의 식물학적 분류로 옳은 것은?","opts":["쌍자엽식물, 벼과, 다년생 초본","단자엽식물, 벼과, 다년생 초본","단자엽식물, 사초과, 일년생 초본","쌍자엽식물, 국화과, 다년생 초본"],"ans":[2],"multi":false,"dup":false,"expl":"잔디는 단자엽식물이며 벼목 벼과의 다년생 초본으로, 경관성 지면피복용 식물이다."},{"id":"L04-2","set":"강의록","year":null,"kind":"강의록","no":62,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디가 지니는 기능적 특징 세 가지로 옳은 것은?","opts":["지면피복성, 내답압성, 재생력","내한성, 내건성, 내병성","내음성, 내습성, 내염성","지면피복성, 내한성, 내음성"],"ans":[1],"multi":false,"dup":false,"expl":"잔디의 기능적 특징은 지면을 잘 덮는 지면피복성, 밟기에 강한 내답압성, 깎여도 다시 자라는 재생력이다."},{"id":"L04-3","set":"강의록","year":null,"kind":"강의록","no":63,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디에서 줄기 마디나 잎몸·잎집의 아랫부분에 있는 분열조직으로, 잎이 깎이거나 손상되었을 때 회복·생장하는 근원이 되는 부위는?","opts":["수관(crown)","잎혀(엽설)","포복경","잎귀(엽이)"],"ans":[1],"multi":false,"dup":false,"expl":"줄기 마디와 잎몸·잎집 아랫부분에 있는 분열조직이 수관(crown)이며, 여기서 새 잎과 뿌리가 발생한다. 포복경은 떼 형성과 회복에 중요한 줄기이다."},{"id":"L04-4","set":"강의록","year":null,"kind":"강의록","no":64,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디의 근계에 대한 설명으로 옳은 것은?","opts":["부정근이 발달한 수염뿌리이며 수관의 아랫마디·포복경·지하경에서 발생한다","원뿌리가 발달한 주근계로 종자에서만 발생한다","뿌리는 포복경에서만 발생하고 수관과는 관계가 없다","뿌리의 생육 정도는 잔디 종류와 관계없이 일정하다"],"ans":[1],"multi":false,"dup":false,"expl":"잔디 근계는 부정근이 발달한 수염뿌리로, 수관 아랫마디·포복경·지하경에서 발생하며 생육 정도는 잔디 종류에 따라 다르다."},{"id":"L04-5","set":"강의록","year":null,"kind":"강의록","no":65,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"난지형 잔디와 한지형 잔디의 생육 적온으로 옳은 것은?","opts":["난지형 지상부 25~35℃, 한지형 지상부 15~25℃","난지형 지상부 15~25℃, 한지형 지상부 25~35℃","난지형·한지형 모두 지상부 20~30℃","난지형 지상부 10~18℃, 한지형 지상부 25~35℃"],"ans":[1],"multi":false,"dup":false,"expl":"난지형은 고온성으로 지상부 25~35℃, 지하부 24~29℃이고, 한지형은 서늘한 기후를 좋아해 지상부 15~25℃, 지하부 10~18℃이다."},{"id":"L04-6","set":"강의록","year":null,"kind":"강의록","no":66,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"난지형 잔디 가운데 지하경과 포복경에 의한 수평생장이 활발해 생육이 가장 빠르고, 번식력과 내답압성이 우수해 스포츠 잔디로 이용되는 것은?","opts":["버뮤다그래스","버팔로그래스","켄터키블루그래스","벤트그래스"],"ans":[1],"multi":false,"dup":false,"expl":"버뮤다그래스는 난지형 잔디 중 생육이 가장 빠르고 번식력·내답압성이 좋아 스포츠 잔디로 활용된다. 우리나라에서는 우산잔디로도 불린다."},{"id":"L04-7","set":"강의록","year":null,"kind":"강의록","no":67,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디의 기능적 효용 가치를 실용적 효용, 미적 기능, 환경공학적 기능으로 나눌 때 환경공학적 기능에 해당하는 것은?","opts":["푸른 기반 조성과 건물과의 조화","경관성 지면 피복","토양 유실 방지","휴식과 스포츠 수용"],"ans":[3],"multi":false,"dup":false,"expl":"실용적 효용은 휴식·스포츠 수용, 미적 기능은 푸른 기반 조성과 조화의 미, 환경공학적 기능은 토양 유실 방지 등이다."},{"id":"L04-8","set":"강의록","year":null,"kind":"강의록","no":68,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"세계적으로 잔디로 이용되는 식물의 수로 옳은 것은?","opts":["약 2,000종","약 200~300종","약 2~3종","약 20~30여 종"],"ans":[4],"multi":false,"dup":false,"expl":"세계적으로 잔디로 이용되는 식물은 약 20~30여 종으로, 다른 식물과 생육 형태와 구조적 특성이 다르다."},{"id":"L04-9","set":"강의록","year":null,"kind":"강의록","no":69,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디의 포복경에 대한 설명으로 옳은 것은?","opts":["뿌리를 땅속 깊이 고정하는 저장기관이다","꽃대를 밀어 올려 종자를 맺게 하는 기관이다","잎의 변형으로 만들어져 광합성만 담당한다","잔디가 떼(sod)를 형성하는 데 중요하며 지상부가 손상될 때 회복·생장하는 근원이 된다"],"ans":[4],"multi":false,"dup":false,"expl":"포복경은 떼 형성에 매우 중요한 역할을 하고, 지상부가 깎이거나 손상을 받았을 때 회복·생장하는 근원이 된다."},{"id":"L04-10","set":"강의록","year":null,"kind":"강의록","no":70,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디의 꽃에 대한 설명으로 옳은 것은?","opts":["충매화로 꽃잎이 크고 화려하며 오래 달려 있다","꽃이 피지 않고 포자로만 번식한다","풍매화로 꽃대 윗부분에 수술, 아랫부분에 암술이 있으며 새벽에 피었다가 수분 후 바로 없어진다","꽃대 아래쪽에 수술, 위쪽에 암술이 있다"],"ans":[3],"multi":false,"dup":false,"expl":"잔디는 풍매화이며 꽃대 윗부분에 수술, 아랫부분에 암술이 있고 꽃은 새벽에 피었다가 수분 후 바로 없어진다."},{"id":"L04-11","set":"강의록","year":null,"kind":"강의록","no":71,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"한국잔디류 종자의 휴면을 타파하는 방법으로 옳은 것은?","opts":["강염기에 25~30분 처리한 뒤 물로 씻고 젖은 상태에서 빛을 쪼인 후 건조해 냉장 건조 보관한다","60℃ 온탕에 24시간 담근 뒤 바로 파종한다","소금물에 3일간 침지한 뒤 그늘에서 말린다","종피를 벗겨 내고 습한 모래에 6개월간 묻어 둔다"],"ans":[1],"multi":false,"dup":false,"expl":"한국잔디류 종자는 강염기에 25~30분 처리해 수차례 세척하고, 젖은 상태에서 하루~이틀 빛을 쪼인 뒤 발아 직전 상태에서 건조해 파종 때까지 냉장 건조 보관한다."},{"id":"L04-12","set":"강의록","year":null,"kind":"강의록","no":72,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"난지형 잔디의 지하부 생육 적온으로 옳은 것은?","opts":["24~29℃","5~10℃","15~25℃","10~18℃"],"ans":[1],"multi":false,"dup":false,"expl":"난지형 잔디는 지상부 25~35℃, 지하부 24~29℃를 좋아하며, 한지형은 지상부 15~25℃, 지하부 10~18℃이다."},{"id":"L04-13","set":"강의록","year":null,"kind":"강의록","no":73,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"한국들잔디(Zoysia japonica)의 특성으로 옳은 것은?","opts":["내서성과 내한성은 강하지만 내음성은 약하다","내건성과 내병성만 뛰어나고 내답압성은 없다","내음성은 강하지만 내한성은 약하다","열대 원산으로 겨울에는 반드시 온실에서 기른다"],"ans":[1],"multi":false,"dup":false,"expl":"한국들잔디는 야생들잔디와 개량된 세엽 계통으로 내서성·내한성은 강하나 내음성이 약하다."},{"id":"L04-14","set":"강의록","year":null,"kind":"강의록","no":74,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"금잔디(고려잔디)의 학명으로 옳은 것은?","opts":["Zoysia matrella","Zoysia tenuifolia","Zoysia sinica","Zoysia japonica"],"ans":[1],"multi":false,"dup":false,"expl":"금잔디(고려잔디)는 Zoysia matrella, 한국들잔디는 Zoysia japonica, 비로도잔디는 Zoysia tenuifolia, 갯잔디는 Zoysia sinica이다."},{"id":"L04-15","set":"강의록","year":null,"kind":"강의록","no":75,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"버팔로그래스에 대한 설명으로 옳지 않은 것은?","opts":["잎이 가늘고 털이 많아 연녹색으로 보인다","난지형 잔디 중 내건조성·내한성·내병성이 우수한 최소관리 지향형이다","미국·중국 등지에서 자생한다","잔디 중 생육이 가장 빨라 스포츠 잔디로 쓰인다"],"ans":[4],"multi":false,"dup":false,"expl":"생육이 가장 빠르고 번식력·내답압성이 우수해 스포츠 잔디로 쓰이는 것은 버뮤다그래스이며, 버팔로그래스는 최소관리 지향형 잔디이다."},{"id":"L04-16","set":"강의록","year":null,"kind":"강의록","no":76,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"한지형 잔디의 특성으로 옳지 않은 것은?","opts":["연중 거의 녹색 기간을 유지한다","서늘한 기후를 좋아한다","집약적인 관리를 요구한다","여름 고온에서 생육이 왕성하다"],"ans":[4],"multi":false,"dup":false,"expl":"한지형 잔디는 서늘한 기후를 좋아해 지상부 적온 15~25℃, 지하부 10~18℃이며 연중 녹색 기간이 길고 집약적 관리가 필요하다. 여름 고온에서 왕성한 것은 난지형 잔디이다."},{"id":"L04-17","set":"강의록","year":null,"kind":"강의록","no":77,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"페레니얼라이그래스의 특성으로 옳은 것은?","opts":["재질이 부드럽고 균일하며 발아와 조성 속도가 빨라 급속 녹화에 적합하다","잎 끝이 보트 모양으로 둥근 홈이 있다","초기 생육이 매우 느려 발아에 10~30일이 걸린다","낮은 예고에 잘 견디어 골프 그린에 쓰인다"],"ans":[1],"multi":false,"dup":false,"expl":"페레니얼라이그래스는 재질이 부드럽고 균일성이 좋으며 잎 뒷면에 광택이 있고 발아·조성 속도가 빨라 급속 녹화에 적합하다. 다만 극히 추운 곳, 더운 곳, 건조지에서는 생육이 불량하다."},{"id":"L04-18","set":"강의록","year":null,"kind":"강의록","no":78,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"페스큐류에 대한 설명으로 옳은 것은?","opts":["발아가 가장 늦고 조성 속도가 느리다","재질이 가장 고와 골프 그린 전용으로 쓰인다","습하고 비옥한 토양에서만 자란다","내건성과 내음성이 한지형 잔디 중 가장 좋고 관리가 쉽다"],"ans":[4],"multi":false,"dup":false,"expl":"페스큐류는 광엽·세엽으로 구분되며 건조하고 척박한 산성 토양에서 잘 자라고 내건성·내음성이 한지형 중 가장 좋아 관리가 쉽다."},{"id":"L04-19","set":"강의록","year":null,"kind":"강의록","no":79,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"버뮤다그래스(Cynodon dactylon)를 우리나라에서 부르는 이름으로 옳은 것은?","opts":["들잔디 또는 고려잔디","비로도잔디","갯잔디","우산잔디 또는 우산바랭이"],"ans":[4],"multi":false,"dup":false,"expl":"버뮤다그래스는 우리나라에서 우산잔디 혹은 우산바랭이라 부른다."},{"id":"L04-20","set":"강의록","year":null,"kind":"강의록","no":80,"lec":4,"lecName":"잔디(Ⅰ)","src":"L","stem":"잔디 잎을 이루는 부위로 옳게 묶인 것은?","opts":["잎집, 덩굴손, 가시, 인엽","잎혀, 잎귀, 포엽, 자엽","잎몸, 잎자루, 탁엽, 턱잎","잎몸(엽신), 잎집(엽초), 잎혀(엽설), 잎귀(엽이)"],"ans":[4],"multi":false,"dup":false,"expl":"잔디 잎은 잎몸·잎집·잎혀·잎귀로 구성되며 종 특유의 구조를 가져 종류를 구별하는 데 이용된다."},{"id":"L05-1","set":"강의록","year":null,"kind":"강의록","no":81,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"한지형 잔디(켄터키블루그래스·광엽페스큐·퍼레니얼라이그래스 등)의 종자 파종 최적기로 옳은 것은?","opts":["4~6월 초","7~8월","9~10월","11~12월"],"ans":[3],"multi":false,"dup":false,"expl":"한지형 잔디의 파종 최적기는 9~10월이며 봄 파종은 3~4월, 여름 파종은 7~8월이다. 난지형 한국들잔디의 적기는 4~6월 초이다."},{"id":"L05-2","set":"강의록","year":null,"kind":"강의록","no":82,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"뗏장심기(sodding)의 장점으로 옳지 않은 것은?","opts":["빠른 시간 안에 질 좋은 잔디 조성이 가능하다","시공 후 즉시 사용할 수 있다","잡초 발생이 적다","피복 비용이 적게 들고 이질층 상토 형성의 우려가 없다"],"ans":[4],"multi":false,"dup":false,"expl":"뗏장심기는 피복 비용이 많이 들고 이질층 상토 형성이 우려된다는 것이 단점이고, 나머지는 장점이다."},{"id":"L05-3","set":"강의록","year":null,"kind":"강의록","no":83,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디에 비료를 지나치게 많이 주었을 때 나타나는 현상으로 옳지 않은 것은?","opts":["지상부 생육이 촉진되어 지상부와 뿌리의 비율이 높아진다","뿌리 깊이와 포복경 생육이 불량해져 잔디 밀도가 낮아진다","답압에 약해지고 병해 발생 확률이 높아진다","잔디 밀도가 높아지고 병해에 강해진다"],"ans":[4],"multi":false,"dup":false,"expl":"비료 과다는 지상부만 웃자라 뿌리와 포복경 생육이 나빠져 밀도가 떨어지고 답압·병해에 약해진다. 생육기 동안 적당량을 여러 번 나누어 주는 것이 바람직하다."},{"id":"L05-4","set":"강의록","year":null,"kind":"강의록","no":84,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 종류별 적정 시비량(g/㎡/년)에서 질소 요구량이 가장 많은 잔디는?","opts":["한국들잔디(10~20)","금잔디(20~30)","벤트그래스(20~40)","버뮤다그래스(30~50)"],"ans":[4],"multi":false,"dup":false,"expl":"질소 시비량은 한국들잔디 10~20, 금잔디 20~30, 벤트그래스 20~40, 버뮤다그래스 30~50g/㎡/년으로 버뮤다그래스가 가장 많다."},{"id":"L05-5","set":"강의록","year":null,"kind":"강의록","no":85,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 갱신작업의 목적으로 옳지 않은 것은?","opts":["잔디의 분얼을 유도해 군락의 노화를 억제한다","북데기 잔디층을 제거한다","나빠진 토양 물리성을 개선한다","잔디 깎는 높이를 높여 잎 면적을 늘린다"],"ans":[4],"multi":false,"dup":false,"expl":"갱신작업은 분얼 유도로 노화를 억제하고 북데기층 제거와 토양 물리성 개선을 목적으로 하며, 잔디 깎는 높이와는 관계가 없다."},{"id":"L05-6","set":"강의록","year":null,"kind":"강의록","no":86,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 뿌리에 피해를 주어 잔디가 부정형으로 죽어가게 하는 해충군은?","opts":["굼뱅이·잔디애기바구미·땅강아지·선충류","잔디포충나방·멸강나방·거세미나방","노린재류·진딧물류·응애류","개미·벌"],"ans":[1],"multi":false,"dup":false,"expl":"뿌리를 갉아먹는 해충군은 굼뱅이, 잔디애기바구미, 땅강아지, 선충류이다. 나방류는 잎과 줄기, 노린재·진딧물·응애는 수액을 빨아먹는다."},{"id":"L05-7","set":"강의록","year":null,"kind":"강의록","no":87,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디밭을 만들기 위해 식재할 잔디 종류를 결정할 때 고려할 요인으로 옳지 않은 것은?","opts":["잔디의 사용 목적에 적합한가","조성 후의 관리 방법과 관리 능력","잔디 조성지의 환경 조건","종자의 판매 단가"],"ans":[4],"multi":false,"dup":false,"expl":"잔디 종류는 사용 목적, 조성지의 환경 조건, 조성 후 관리 방법과 관리 능력을 고려해 결정한다."},{"id":"L05-8","set":"강의록","year":null,"kind":"강의록","no":88,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"월드컵 축구장에 공통적으로 설치된 지반 조성 공법의 구조로 옳은 것은?","opts":["모래층 없이 유공관만 매설한 구조","표토와 심토만으로 된 단층 구조","상토층, 굵은 모래층(필터층), 콩자갈층과 배수구를 갖춘 다층 구조","점토층 위에 차수막을 깐 폐쇄 구조"],"ans":[3],"multi":false,"dup":false,"expl":"월드컵 축구장은 상토층, 굵은 모래층(필터층), 콩자갈층과 배수구가 설치된 다층 구조로 설계되었다."},{"id":"L05-9","set":"강의록","year":null,"kind":"강의록","no":89,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"한국잔디류로 잔디밭을 조성하는 방법으로 옳은 것은?","opts":["한국잔디류는 종자파종이 불가능해 플러그만 이용한다","대규모일수록 뗏장을, 소규모일수록 종자파종을 이용한다","조성 면적이 대규모이거나 지형이 특수하면 종자파종하고 소규모는 뗏장으로 조성한다","면적과 지형에 관계없이 항상 뗏장으로만 조성한다"],"ans":[3],"multi":false,"dup":false,"expl":"한국잔디류는 조성 면적이 대규모이거나 특수한 지형에는 종자파종을, 소규모 잔디밭은 뗏장으로 조성한다."},{"id":"L05-10","set":"강의록","year":null,"kind":"강의록","no":90,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"난지형 잔디인 한국들잔디의 종자 파종 적기로 옳은 것은?","opts":["4~6월 초","9~10월","1~2월","11~12월"],"ans":[1],"multi":false,"dup":false,"expl":"한국들잔디는 4~6월 초가 파종 적기이고, 한지형 잔디는 9~10월이 최적기, 봄 파종은 3~4월, 여름 파종은 7~8월이다."},{"id":"L05-11","set":"강의록","year":null,"kind":"강의록","no":91,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"가정에서 종자로 잔디밭을 만들 때의 파종 방법으로 옳은 것은?","opts":["전체 면적을 1/4씩 나누어 아래쪽, 위쪽, 오른쪽에서 왼쪽, 왼쪽에서 오른쪽으로 방향을 달리해 뿌린다","종자를 물에 띄워 흘려보내듯 뿌린다","중앙에서 사방으로 원을 그리며 뿌린다","한 방향으로만 여러 번 겹쳐 뿌린다"],"ans":[1],"multi":false,"dup":false,"expl":"파종 날짜를 정해 밭을 만들고, 면적을 1/4씩 나누어 서로 다른 방향으로 파종한 뒤 마무리 작업과 발아 후 관리를 한다."},{"id":"L05-12","set":"강의록","year":null,"kind":"강의록","no":92,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 관리에서 고려해야 할 사항으로 옳지 않은 것은?","opts":["잔디의 키를 최대한 크게 유지하는 것","사용자의 안전을 고려한 탄성","집중적으로 사용해도 견디는 조밀성과 내마모성","사용하기에 알맞은 표면의 견고성"],"ans":[1],"multi":false,"dup":false,"expl":"잔디 관리에서는 표면의 견고성, 사용자 안전을 고려한 탄성, 조밀성·내마모성, 계속 깎아도 견디는 내구성을 고려한다."},{"id":"L05-13","set":"강의록","year":null,"kind":"강의록","no":93,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"가정에서 뗏장을 식재해 잔디밭을 만들 때의 순서로 옳은 것은?","opts":["뗏장 깔기 → 잔디 주문 → 마무리 작업 → 부지 준비 → 초기 관리 → 뗏장 관리","마무리 작업 → 뗏장 관리 → 잔디 주문 → 초기 관리 → 부지 준비","부지 준비 → 초기 잔디 관리 → 뗏장 깔기 → 잔디 주문 → 마무리 작업","식재 시기 결정·잔디 주문 → 식재 부지 준비 → 배달된 뗏장 관리 → 뗏장 깔기 → 마무리 작업 → 초기 잔디 관리"],"ans":[4],"multi":false,"dup":false,"expl":"뗏장을 이용한 잔디밭 만들기는 식재 시기를 정해 잔디를 주문하고, 부지를 준비한 뒤 배달된 뗏장을 관리해 깔고, 마무리 작업과 초기 관리를 하는 순서로 한다."},{"id":"L05-14","set":"강의록","year":null,"kind":"강의록","no":94,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디깎기에 대한 설명으로 옳은 것은?","opts":["잔디를 해치는 작업이므로 생육기에는 하지 않는다","한 방향으로만 깎아야 무늬가 생긴다","깎는 높이는 계절과 관계없이 항상 일정하게 유지한다","잔디 관리에서 가장 기본적이고 중요한 작업으로 깎는 높이·기계·빈도·형식을 고려한다"],"ans":[4],"multi":false,"dup":false,"expl":"잔디깎기는 가장 기본적이고 중요한 관리 작업으로 깎는 높이, 기계, 빈도, 그루터기와 뽑힘 현상, 형식을 고려하며, 방향을 달리해 깎으면 무늬가 만들어진다."},{"id":"L05-15","set":"강의록","year":null,"kind":"강의록","no":95,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 갱신작업의 종류로 옳지 않은 것은?","opts":["버티컬모잉(vertical mowing)","코아링·에어레이션(coring, aeration)","멀칭(mulching)","슬라이싱(slicing)"],"ans":[3],"multi":false,"dup":false,"expl":"갱신작업에는 슬라이싱, 코아링·에어레이션, 스파이킹, 배토(top dressing), 버티컬모잉이 있다. 멀칭은 토양의 수분·온도 유지와 잡초 억제를 위한 관리이다."},{"id":"L05-16","set":"강의록","year":null,"kind":"강의록","no":96,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디 물관리 시 주의사항으로 옳지 않은 것은?","opts":["하루 중 관수 시간을 결정한다","가능한 최소한의 양으로 관수한다","가뭄 때에는 잔디 위의 통행을 늘려 흙을 다진다","소수성 토양 여부를 확인한다"],"ans":[3],"multi":false,"dup":false,"expl":"가뭄 시에는 잔디 위의 통행을 제한해 답압 피해를 줄여야 하며, 가능한 최소량으로 관수하고 소수성 토양 여부와 관수 시간을 확인한다."},{"id":"L05-17","set":"강의록","year":null,"kind":"강의록","no":97,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디밭 잡초 방제의 원리로 옳은 것은?","opts":["일년생과 다년생 모두 지상부만 제거한다","일년생 잡초는 발아 자체를 억제하고 다년생 잡초는 식물 전체를 사멸시킨다","제초제는 잔디에 품목 고시되지 않은 것도 사용할 수 있다","다년생 잡초는 발아 억제로, 일년생 잡초는 전체 사멸로 방제한다"],"ans":[2],"multi":false,"dup":false,"expl":"일년생 잡초는 발아 억제, 다년생 잡초는 식물 전체 사멸로 방제하며, 제초제는 잔디에 품목 고시된 것만 사용한다. 주기적인 깎기도 잡초 생육을 억제한다."},{"id":"L05-18","set":"강의록","year":null,"kind":"강의록","no":98,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디밭의 대표적인 병해로 옳게 묶인 것은?","opts":["무름병, 탄저병, 흑반병","잎마름병, 바이러스병, 위조병","피티움 브라이트병, 갈색잎마름병, 달러스팟","녹병, 흰가루병, 노균병"],"ans":[3],"multi":false,"dup":false,"expl":"잔디밭의 대표적 병해로 피티움 브라이트병, 갈색잎마름병, 달러스팟이 제시된다. 무름병·탄저병·흑반병은 난에서 다루는 병해이다."},{"id":"L05-19","set":"강의록","year":null,"kind":"강의록","no":99,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"잔디의 잎과 줄기에 피해를 주어 잔디가 부정형으로 죽어가게 하는 해충군은?","opts":["개미, 벌","지네류, 여치류","잔디포충나방, 멸강나방, 거세미나방","노린재류, 진딧물류, 응애류"],"ans":[3],"multi":false,"dup":false,"expl":"잔디포충나방·멸강나방·거세미나방은 잎과 줄기를 가해하며, 노린재·진딧물·응애는 수액을 빨아 먹고, 개미·벌은 표면을 불균일하게 하며 지네·여치는 기생하나 큰 피해를 주지 않는다."},{"id":"L05-20","set":"강의록","year":null,"kind":"강의록","no":100,"lec":5,"lecName":"잔디(Ⅱ)","src":"L","stem":"경관성 식물 소재로 쓰이는 벼과 키큰풀(ornamental grasses)로 옳게 묶인 것은?","opts":["세덤류, 맥문동, 무스카리, 옥잠화","수크령류, 신품종 억새류, 스위치그래스, 산조풀류","케일, 적양배추, 비트, 근대","라일락, 철쭉류, 조팝나무류, 산수국"],"ans":[2],"multi":false,"dup":false,"expl":"수크령류(Pennisetum), 억새류(Miscanthus), 스위치그래스(Panicum virgatum), 산조풀류(Calamagrostis) 등이 경관용 벼과 키큰풀로 소개된다."},{"id":"L06-1","set":"강의록","year":null,"kind":"강의록","no":101,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"꽃이 피는 식물 가운데 약 7%를 차지하며 25,000~30,000종이 알려져 있는 식물과는?","opts":["벼과","난초과","진달래과","국화과"],"ans":[2],"multi":false,"dup":false,"expl":"난과식물은 25,000~30,000종으로 꽃이 피는 식물의 약 7%를 차지하며, 열대 다우 지역의 삼림지대에 많은 종이 자란다."},{"id":"L06-2","set":"강의록","year":null,"kind":"강의록","no":102,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"동양란과 서양란의 특성 비교로 옳은 것은?","opts":["동양란은 온대란·지생란으로 향기가 좋고 화색이 소박하다","동양란은 열대란·착생란으로 화색이 화려하다","서양란은 온대란·지생란으로 향기가 은은하다","서양란은 향기가 강하고 화색이 소박하다"],"ans":[1],"multi":false,"dup":false,"expl":"동양란은 온대란·지생란으로 향기가 좋고 화색이 소박하며, 서양란은 열대란·착생란으로 향기가 대부분 없거나 약하고 화색이 화려하다."},{"id":"L06-3","set":"강의록","year":null,"kind":"강의록","no":103,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난에서 흔히 벌브(bulb)라고 부르며 양분과 수분을 저장하고 잎과 뿌리를 지지하는 단축줄기는?","opts":["위구경","근경","원괴체","괴경"],"ans":[1],"multi":false,"dup":false,"expl":"위구경(僞球莖, pseudobulb)은 벌브라고도 하며 단축줄기로 양분·수분을 저장하고 잎과 뿌리를 지지한다. 잎이 떨어지고 위구경만 남은 것은 백벌브라 한다."},{"id":"L06-4","set":"강의록","year":null,"kind":"강의록","no":104,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 꽃의 구성 요소로 보기 어려운 것은?","opts":["순판(설판)","위구경","주두","화분괴"],"ans":[2],"multi":false,"dup":false,"expl":"난의 꽃은 꽃잎·순판(설판)·꽃받침·주두·화분괴·씨방·꽃대 등으로 구성되며, 위구경은 줄기의 변형이다."},{"id":"L06-5","set":"강의록","year":null,"kind":"강의록","no":105,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 종자의 특징으로 옳은 것은?","opts":["배유가 없고 크기가 매우 작은 미세종자이다","배유가 많아 저장양분이 충분하다","껍질이 두꺼워 그대로 파종하면 잘 발아한다","종자 하나에 배가 여러 개 들어 있다"],"ans":[1],"multi":false,"dup":false,"expl":"난의 종자는 무배유의 미세종자라서 자연 상태에서는 공생균(난균)의 도움을 받아야 발아한다."},{"id":"L06-6","set":"강의록","year":null,"kind":"강의록","no":106,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"다음 중 우리나라 자생란으로 보기 어려운 것은?","opts":["보춘화(춘란)","제주한란","금새우난초","팔레놉시스"],"ans":[4],"multi":false,"dup":false,"expl":"팔레놉시스(호접란)는 열대란·착생란인 서양란이다. 보춘화, 제주한란, 금새우난초, 자란, 복주머니란 등은 자생란이다."},{"id":"L06-7","set":"강의록","year":null,"kind":"강의록","no":107,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난과식물의 식물학적 위치로 옳은 것은?","opts":["단자엽식물 가운데 가장 진화된 식물이다","양치식물에 속하는 포자식물이다","나자식물에 속하는 관상식물이다","쌍자엽식물 가운데 가장 원시적인 식물이다"],"ans":[1],"multi":false,"dup":false,"expl":"난초는 단자엽식물 중 가장 진화된 식물로 꽃·잎·줄기의 형태가 매우 다양하다."},{"id":"L06-8","set":"강의록","year":null,"kind":"강의록","no":108,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난과식물의 분포에 대한 설명으로 옳은 것은?","opts":["오직 열대 지역에만 분포한다","건조한 사막 지역에 주로 분포한다","극지를 제외한 세계 전 지역에 분포하며 열대 다우 지역의 삼림지대에 많은 종이 자란다","남반구 대륙에만 분포한다"],"ans":[3],"multi":false,"dup":false,"expl":"난과식물은 극지를 제외한 세계 전 지역에 분포하고, 열대 지방의 다우 지역 삼림지대에 많은 종이 자란다."},{"id":"L06-9","set":"강의록","year":null,"kind":"강의록","no":109,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 꽃에서 꽃잎 가운데 특별히 발달해 입술 모양을 이룬 부위를 이르는 말은?","opts":["주두(stigma)","화분괴(pollinium)","순판(설판, labellum)","악편(sepal)"],"ans":[3],"multi":false,"dup":false,"expl":"난 꽃의 꽃잎 가운데 하나가 특별히 발달한 것을 순판(설판, labellum, lip)이라 하며, 꽃받침은 악편, 암술머리는 주두, 화분 덩어리는 화분괴라 한다."},{"id":"L06-10","set":"강의록","year":null,"kind":"강의록","no":110,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 뿌리에서 중심주와 피층을 덮어 수분 흡수를 돕는 조직은?","opts":["근피층(velamen layer)","근모대","유합조직","근관(뿌리골무)"],"ans":[1],"multi":false,"dup":false,"expl":"난의 뿌리는 중심주(stele), 피층(cortex), 근피층(velamen layer)으로 이루어지며 근피층이 뿌리를 덮는다."},{"id":"L06-11","set":"강의록","year":null,"kind":"강의록","no":111,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난의 식물학적 분류에서 난초과(Orchidaceae)의 바로 위 단계에 해당하는 것은?","opts":["관속식물문","피자식물강","난초목(Orchidales)","단자엽식물아강"],"ans":[3],"multi":false,"dup":false,"expl":"난은 관속식물문-피자식물강-단자엽식물아강-난초목-난초과-속-종의 순으로 분류된다."},{"id":"L06-12","set":"강의록","year":null,"kind":"강의록","no":112,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난의 실용적 분류에서 분류 기준으로 제시되지 않은 것은?","opts":["원산지(열대란·온대란)","줄기 형태(단경성·복경성)","생태적 특성(지생란·착생란·부생란)","잎의 무늬와 반점"],"ans":[4],"multi":false,"dup":false,"expl":"실용적 분류는 원산지, 생태적 특성, 줄기 형태를 기준으로 한다."},{"id":"L06-13","set":"강의록","year":null,"kind":"강의록","no":113,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"동양란에 속하는 것으로 옳게 묶인 것은?","opts":["밀토니아, 파피오페딜룸, 온시디움","온시디움, 시프리페디움, 반다","카틀레야, 덴드로비움, 팔레놉시스","한란, 춘란, 일경구화, 보세란"],"ans":[4],"multi":false,"dup":false,"expl":"동양란에는 한란·춘란·일경구화·보세란·건란·소심란 등이, 서양란에는 카틀레야·심비디움·덴드로비움·팔레놉시스·온시디움·시프리페디움 등이 있다."},{"id":"L06-14","set":"강의록","year":null,"kind":"강의록","no":114,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"동양란에서 한 줄기에 꽃이 하나 피는 것과 여러 개 피는 것을 부르는 말로 옳은 것은?","opts":["둘 다 혜라 하고 난은 뿌리를 뜻한다","일경일화는 난, 일경다화는 혜","일경일화는 혜, 일경다화는 난","둘 다 난이라 하고 혜는 꽃받침을 뜻한다"],"ans":[2],"multi":false,"dup":false,"expl":"동양란에서 일경일화성(一莖一花)은 난(蘭), 일경다화성(一莖多花)은 혜(蕙)라 부른다."},{"id":"L06-15","set":"강의록","year":null,"kind":"강의록","no":115,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난의 번식법을 유성번식과 무성번식으로 나눌 때 무성번식에 속하는 것은?","opts":["유균파종과 무균파종","포기나누기와 조직배양","무균배양과 종자번식","종자번식과 유균번식"],"ans":[2],"multi":false,"dup":false,"expl":"난의 유성번식에는 종자번식·유균번식·무균배양이, 무성번식에는 분주(포기나누기)와 조직배양(생장점·잎·뿌리·화경 배양)이 있다."},{"id":"L06-16","set":"강의록","year":null,"kind":"강의록","no":116,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 잎의 형태적 특징으로 옳은 것은?","opts":["모두 바늘 모양으로 하나로 통일되어 있다","잎이 완전히 퇴화해 없다","넓은잎, 좁은잎, 다육질 잎 등 매우 다양하다","모두 물에 잠기는 수생잎이다"],"ans":[3],"multi":false,"dup":false,"expl":"난의 잎은 넓은잎·좁은잎·다육질 잎 등 다양하며, 꽃과 줄기의 형태도 종에 따라 크게 다르다."},{"id":"L06-17","set":"강의록","year":null,"kind":"강의록","no":117,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난 꽃에서 씨방의 위치에 대한 설명으로 옳은 것은?","opts":["씨방이 뿌리 쪽에 만들어진다","씨방이 없어 종자가 꽃턱에 그대로 노출된다","씨방이 꽃받침 위에 위치하는 씨방상위이다","씨방이 꽃잎과 꽃받침보다 아래에 위치하는 씨방하위이다"],"ans":[4],"multi":false,"dup":false,"expl":"난 꽃은 씨방이 꽃의 다른 부분보다 아래에 붙는 씨방하위이며, 수정 후 종자꼬투리가 된다."},{"id":"L06-18","set":"강의록","year":null,"kind":"강의록","no":118,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난을 다룬 주요 용어 자료로, 고려 말엽에 제작된 자수 작품은?","opts":["매화시첩","초충도수병","사계분경도","양화소록"],"ans":[3],"multi":false,"dup":false,"expl":"난을 설명하는 자료로 고려 말엽에 제작된 자수 작품 사계분경도와 삼국유사가 소개된다."},{"id":"L06-19","set":"강의록","year":null,"kind":"강의록","no":119,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난을 다룬 기록인 삼국유사를 지은 인물은?","opts":["강희안","일연","신사임당","정선"],"ans":[2],"multi":false,"dup":false,"expl":"삼국유사는 일연(1206~1289)이 지은 책으로 난을 다룬 주요 용어 자료로 제시된다."},{"id":"L06-20","set":"강의록","year":null,"kind":"강의록","no":120,"lec":6,"lecName":"난(Ⅰ)","src":"L","stem":"난의 지하부 기관 가운데 땅속줄기를 이르는 말은?","opts":["근경(rhizome)","원괴체","괴경","위구경"],"ans":[1],"multi":false,"dup":false,"expl":"난의 지하부 기관에는 뿌리와 근경(rhizome, 지하경)이 있으며, 원괴체는 종자가 발아할 때 거치는 단계, 위구경은 지상부의 단축줄기, 괴경은 땅속줄기가 비대한 것이다."},{"id":"L07-1","set":"강의록","year":null,"kind":"강의록","no":121,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난 종자의 무균파종에 사용하는 대표적인 배지로 보기 어려운 것은?","opts":["Knudson 배지","Hyponex 배지","MS 배지","루톤"],"ans":[4],"multi":false,"dup":false,"expl":"무균파종에는 Knudson·Hyponex·MS 배지 등을 쓰며, 난균 대신 설탕을 첨가해 영양을 공급한다. 루톤은 삽목용 발근제이다."},{"id":"L07-2","set":"강의록","year":null,"kind":"강의록","no":122,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 무균파종 배지를 만들 때 산도 조정 범위로 옳은 것은?","opts":["pH 5.3~5.5","pH 6.5~6.8","pH 4.0~4.5","pH 7.2~7.5"],"ans":[1],"multi":false,"dup":false,"expl":"배지 조성은 필수원소 용해, 설탕 30g/L 첨가, pH 5.3~5.5 조정, 한천 5~6g/L 첨가, 120℃·1.2kg/㎠에서 15분 가압멸균 순으로 한다."},{"id":"L07-3","set":"강의록","year":null,"kind":"강의록","no":123,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 포기나누기(분주)를 하는 적기로 옳은 것은?","opts":["3월 초순경 새 촉이 나오기 전","6월 장마철","9월 꽃이 진 직후","12월 휴면기 한복판"],"ans":[1],"multi":false,"dup":false,"expl":"분주는 3월 초순경 새 촉이 나오기 전에 하며, 1년에 1~2개의 신아가 나와 3~4년간 유지된다."},{"id":"L07-4","set":"강의록","year":null,"kind":"강의록","no":124,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난 재배에 적합한 공중습도와 통풍 조건으로 옳은 것은?","opts":["공중습도 60~70%, 풍속 0.1~0.5m/sec","공중습도 40~50%, 풍속 1.0~1.5m/sec","공중습도 80~90%, 풍속 2m/sec 이상","공중습도 30% 이하, 통풍은 필요 없다"],"ans":[1],"multi":false,"dup":false,"expl":"난은 공중습도 60~70%, 통풍이 잘되는 0.1~0.5m/sec 조건에서 잘 자란다. 토양은 촉촉하게, pH 6.5 정도의 약산성으로 관리한다."},{"id":"L07-5","set":"강의록","year":null,"kind":"강의록","no":125,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"고온다습한 시기 통기 불량과 과습으로 발생하며, 연약한 신아가 황록색을 띠다가 뿌리와 분토가 맞닿는 부위가 흑갈색으로 부패하는 세균성 병은?","opts":["무름병(연부병)","탄저병","잎마름병","바이러스병"],"ans":[1],"multi":false,"dup":false,"expl":"무름병은 세균성 병으로 7~8월에 많이 발생한다. 고온기에 통풍을 좋게 하고 질소질 비료 과다를 피하는 것이 방제의 기본이다."},{"id":"L07-6","set":"강의록","year":null,"kind":"강의록","no":126,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난에 발생하는 응애의 방제 요령으로 옳은 것은?","opts":["발견 즉시 물뿌리개로 충분히 씻어낸다","1주일 간격으로 살충제를 3회 연속 살포한다","팽이콜 같은 식이유인제로 구제한다","야간이나 비 오는 날에만 약제를 뿌린다"],"ans":[1],"multi":false,"dup":false,"expl":"응애는 고온건조기에 잎 앞뒤에서 즙액을 빨아먹으므로 발견 즉시 물로 충분히 씻어내는 것이 우선이다. 1주 간격 3회 살포는 총채벌레, 식이유인제는 민달팽이 방제법이다."},{"id":"L07-7","set":"강의록","year":null,"kind":"강의록","no":127,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 종자번식에서 난균(공생균)의 역할로 옳은 것은?","opts":["종피를 녹여 발아를 억제한다","난의 생장과 종자 발아에 필요한 영양분을 공급한다","꽃가루를 옮겨 수분을 돕는다","뿌리를 덮는 근피층을 만든다"],"ans":[2],"multi":false,"dup":false,"expl":"난균은 난의 생장과 종자 발아에 필요한 영양분을 공급하며, 무균파종에서는 설탕을 첨가해 난균의 기능을 대치한다."},{"id":"L07-8","set":"강의록","year":null,"kind":"강의록","no":128,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난 무균파종 배지를 만들 때의 가압멸균 조건으로 옳은 것은?","opts":["120℃, 1.2kg/cm2, 15분","80~90℃, 30분","150℃, 5분","100℃, 1시간"],"ans":[1],"multi":false,"dup":false,"expl":"배지는 필수원소를 용해한 뒤 설탕 30g/L와 한천 5~6g/L를 넣고 80~90℃로 가열해 용기에 주입·밀봉한 다음 120℃, 1.2kg/cm2에서 15분 가압멸균한다."},{"id":"L07-9","set":"강의록","year":null,"kind":"강의록","no":129,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난 종자의 무균파종 과정을 바르게 나열한 것은?","opts":["종자 맺힘 → 꼬투리 소독 → 무균배양 → 유묘 순화 → 식재","무균배양 → 종자 맺힘 → 꼬투리 소독 → 식재 → 순화","종자 맺힘 → 유묘 순화 → 꼬투리 소독 → 무균배양 → 식재","꼬투리 소독 → 종자 맺힘 → 식재 → 무균배양 → 순화"],"ans":[1],"multi":false,"dup":false,"expl":"무균파종은 종자가 맺히면 꼬투리를 소독해 무균배양하고, 발아한 유묘를 순화한 뒤 식재하는 순서로 한다."},{"id":"L07-10","set":"강의록","year":null,"kind":"강의록","no":130,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난에서 잎이 노화되어 탈락한 뒤 위구경만 남은 상태를 이르는 말은?","opts":["백벌브(back bulb)","근경(rhizome)","원괴체(protocorm)","화분괴(pollinium)"],"ans":[1],"multi":false,"dup":false,"expl":"백벌브(back bulb)는 잎이 노화되어 탈락하고 나면 위구경만 남은 상태로, 심비디움의 위구경 번식법에 이용된다."},{"id":"L07-11","set":"강의록","year":null,"kind":"강의록","no":131,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 삽목법(꺾꽂이)으로 번식하기에 알맞은 난으로 옳은 것은?","opts":["춘란, 한란, 보세란","소심란, 건란, 일경구화","덴드로비움, 에피덴드럼, 반다","카틀레야, 팔레놉시스"],"ans":[3],"multi":false,"dup":false,"expl":"삽목법은 줄기가 굵고 튼튼한 덴드로비움류·에피덴드럼·반다와 지네발난초·사철란류·흑난 등에 이용한다."},{"id":"L07-12","set":"강의록","year":null,"kind":"강의록","no":132,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 생장점배양에서 생장점을 적출하는 시기로 옳은 것은?","opts":["새 촉이 10cm 이상 자랐을 때","겨울 휴면기에 잎이 모두 진 뒤","꽃이 완전히 핀 뒤","새 촉이 1cm 미만으로 자랐을 때 포엽을 벗겨 내고 적출한다"],"ans":[4],"multi":false,"dup":false,"expl":"생장점배양은 새 촉이 1cm 미만일 때 포엽을 벗겨 생장점을 적출·소독해 무균배지에 치상하고, 원괴체(PLB) 형성과 근경 증식, shoot 분화, 계대배양을 거쳐 어린 묘를 생산한다."},{"id":"L07-13","set":"강의록","year":null,"kind":"강의록","no":133,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"호접란에서 액아가 있는 꽃대 부위를 배양해 엽절편을 얻고 원괴체 형성을 유도하는 번식법은?","opts":["근경배양","생장점배양","화경배양","위구경 번식법"],"ans":[3],"multi":false,"dup":false,"expl":"화경배양은 호접란 등에서 액아가 있는 화경 부위를 무균적으로 배양해 발생한 싹에서 엽절편을 얻고 PLB 형성을 유도하는 방법이다."},{"id":"L07-14","set":"강의록","year":null,"kind":"강의록","no":134,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 식재용토로 요구되는 조건과 그 재료로 옳은 것은?","opts":["통기성이 좋은 다공성 재료로 제주경석·바크·수태 등을 쓴다","산도가 강한 석회질 토양을 쓴다","물을 오래 머금는 점토질 흙을 쓴다","유기질이 많은 일반 밭흙만 쓴다"],"ans":[1],"multi":false,"dup":false,"expl":"난의 식재용토는 통기성이 좋은 다공성 재료가 요구되며 제주경석(송이), 일향토, 녹소토, 클레이볼, 하이드로볼, 훈탄, 숯, 바크, 수태 등을 쓴다."},{"id":"L07-15","set":"강의록","year":null,"kind":"강의록","no":135,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 종류별 식재시기로 옳은 것은?","opts":["한란은 3~4월경, 건란은 10~11월경에 식재한다","모든 난을 12~1월에 식재한다","모든 난을 6월 장마기에 식재한다","한란은 10~11월경, 건란은 7~8월경에 식재한다"],"ans":[4],"multi":false,"dup":false,"expl":"식재는 생장이 시작되기 전(2~3월경)과 개화 직후에 하며, 춘란 3~4월, 일경구화·새우난초류 5월, 건란 7~8월, 소심란류 8~9월, 한란 10~11월경이다."},{"id":"L07-16","set":"강의록","year":null,"kind":"강의록","no":136,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 비료 이용에 대한 설명으로 옳은 것은?","opts":["광선이 약한 실내에서는 염류가 쌓이지 않는다","질산태 질소만 이용할 수 있다","비료를 많이 줄수록 반드시 잘 자란다","암모니아태 질소의 이용 효율이 높다"],"ans":[4],"multi":false,"dup":false,"expl":"난은 암모니아태 질소의 이용 효율이 높으며, 광선이 약한 실내에서는 염류가 축적되고 토양이 산성화되어 잎이 타들어 가는 증상이 나타난다."},{"id":"L07-17","set":"강의록","year":null,"kind":"강의록","no":137,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난의 잎마름병(엽고병)에 대한 설명으로 옳은 것은?","opts":["곰팡이에 의해 잎끝이 갈색으로 연화되고 수침상 갈색 반점이 퍼진다","응애가 즙액을 빨아 잎 색이 퇴색한다","바이러스에 의해 잎에 모자이크 반점이 생긴다","세균에 의해 뿌리와 분토가 닿는 부위가 흑갈색으로 부패한다"],"ans":[1],"multi":false,"dup":false,"expl":"잎마름병은 곰팡이성 질병으로 잎끝이 갈색으로 연화되고 수침상 갈색 반점이 나타나 병반이 합쳐지며, 다이젠·베노밀·지네브·델란·오소사이드 등을 살포해 방제한다."},{"id":"L07-18","set":"강의록","year":null,"kind":"강의록","no":138,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난에 붙는 깍지벌레(개각충)에 대한 설명으로 옳은 것은?","opts":["뿌리만 가해하며 날개로 이동한다","화분토에 산란하고 유충이 꽃봉오리를 갉아먹는다","잎에 붙어 즙액을 빨고 분비물로 그을음병을 일으키며 번식력이 강해 연 3~4회 산란한다","고온건조기에만 발생하고 연 1회 산란한다"],"ans":[3],"multi":false,"dup":false,"expl":"깍지벌레는 화살깍지벌레·좀깍지벌레·감귤깍지벌레·거북밀 등이 있으며 잎에 부착해 즙액을 빨고 분비물로 2차 그을음병을 일으키며 연 3~4회 산란한다. 히어로(수프라사이드)를 살포해 방제한다."},{"id":"L07-19","set":"강의록","year":null,"kind":"강의록","no":139,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"난에 발생하는 민달팽이의 방제 요령으로 옳은 것은?","opts":["팽이콜, 나메돌 등 식이유인제로 구제한다","물뿌리개로 충분히 씻어낸다","히어로를 살포한다","1주일 간격으로 살충제를 3회 살포한다"],"ans":[1],"multi":false,"dup":false,"expl":"민달팽이는 야간이나 비 오는 날 활동하며 화분 바닥에 잠복해 뿌리끝·새싹·꽃눈을 갉아먹으므로 팽이콜·나메돌 같은 식이유인제로 구제한다."},{"id":"L07-20","set":"강의록","year":null,"kind":"강의록","no":140,"lec":7,"lecName":"난(Ⅱ)","src":"L","stem":"가정에서 난을 기를 때 나타나는 대표적인 실패 유형으로 옳지 않은 것은?","opts":["겨울에 저온 처리로 휴면을 충분히 채워 주는 것","직사광선이나 지나친 그늘에 두는 것","지나치게 자주 물을 주는 과습","빨리 키우려는 성급함으로 시비를 과다하게 하는 것"],"ans":[1],"multi":false,"dup":false,"expl":"가정 난 재배의 실패 유형은 시비 과다와 고농도 비료, 잦은 물주기로 인한 과습, 장기간 건조, 재배 위치 부적합(직사광선·지나친 그늘) 네 가지이다."},{"id":"L08-1","set":"강의록","year":null,"kind":"강의록","no":141,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"허브와 스파이스의 구분으로 옳은 것은?","opts":["허브는 온대지방 식물의 잎·줄기 등이고, 스파이스는 열대 식물의 향신료이다","허브는 열대 식물이고, 스파이스는 온대 식물이다","허브는 뿌리만, 스파이스는 꽃만 이용한다","허브와 스파이스는 같은 뜻으로 구분하지 않는다"],"ans":[1],"multi":false,"dup":false,"expl":"허브는 음식의 맛과 향을 내는 온대지방 식물(바실·박하·로즈메리 등)이고, 스파이스는 맛과 색을 내는 향신료로 쓰이는 열대 식물(후추·계피·고추 등)이다."},{"id":"L08-2","set":"강의록","year":null,"kind":"강의록","no":142,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"다음 중 이년생 허브로 묶인 것은?","opts":["파슬리, 카라웨이","바실, 고수","로즈메리, 라벤더","딜, 쿠민"],"ans":[1],"multi":false,"dup":false,"expl":"이년생 허브는 파슬리와 카라웨이이며, 바실·고수·딜·쿠민·캐모마일은 일년생, 로즈메리·라벤더 등은 영년생이다."},{"id":"L08-3","set":"강의록","year":null,"kind":"강의록","no":143,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"이용 목적에 따른 허브 분류에서 커리 원료용 허브로 묶인 것은?","opts":["카라웨이, 고수, 쿠민","마죠람, 바실, 오레가노","박하, 캐모마일, 라벤더","러비지, 백리향, 세이지"],"ans":[1],"multi":false,"dup":false,"expl":"커리 원료용은 카라웨이·고수·쿠민이고, 피자용은 마죠람·바실·오레가노, 신경안정용은 박하·캐모마일·라벤더, 소스용은 러비지·백리향·타라곤·세이지이다."},{"id":"L08-4","set":"강의록","year":null,"kind":"강의록","no":144,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"지중해 원산 허브의 수분 관리 방법으로 옳은 것은?","opts":["다소 건조하게 관리하며 과습하면 고사한다","항상 물에 잠겨 있도록 습하게 관리한다","하루에 여러 번 많은 물을 준다","장마철에는 배수가 나빠도 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"여름이 건조한 지중해 원산 허브는 다소 건조하게 관리해야 하며, 과습하면 고사한다. 특히 장마기에 배수가 나쁘면 로즈메리가 죽는다."},{"id":"L08-5","set":"강의록","year":null,"kind":"강의록","no":145,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"허브 재배에 필요한 하루 광 조건으로 옳은 것은?","opts":["8~10시간","2~3시간","12~14시간","광은 거의 필요 없다"],"ans":[1],"multi":false,"dup":false,"expl":"허브는 하루 8~10시간의 광이 필요하며 실내 식물이 아니다. 실내에서 기르면 웃자라고 향이 매우 낮아진다."},{"id":"L08-6","set":"강의록","year":null,"kind":"강의록","no":146,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"고기를 구울 때 허브를 이용하면 발암물질 발생이 얼마나 줄어드는가?","opts":["40% 이상 감소한다","약 10% 감소한다","약 70% 감소한다","감소 효과가 없다"],"ans":[1],"multi":false,"dup":false,"expl":"고기가 탈 때 생기는 헤테로사이클릭 아민 같은 발암물질은 허브를 함께 이용하면 40% 이상 감소한다."},{"id":"L08-7","set":"강의록","year":null,"kind":"강의록","no":147,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"기원전 4세기 그리스 학자 Theophrastus가 식물을 나눈 구분으로 옳은 것은?","opts":["일년생, 이년생, 다년생","허브, 스파이스, 채소","교목(tree), 관목(shrub), 초본(herb)","식용, 약용, 관상용"],"ans":[3],"multi":false,"dup":false,"expl":"허브(herb)라는 말은 기원전 4세기 그리스 학자 Theophrastus가 식물을 교목·관목·초본으로 나눈 데서 비롯되었다."},{"id":"L08-8","set":"강의록","year":null,"kind":"강의록","no":148,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"우리나라에 허브가 처음 공식적으로 소개된 계기로 옳은 것은?","opts":["2000년대 대형마트 입점과 함께 소개되었다","1970년대 허브 관련 법령이 제정되었다","1986년 서양채소론(박권우)에서 소개되었다","1990년대 국가기술자격이 도입되었다"],"ans":[3],"multi":false,"dup":false,"expl":"1986년 서양채소론(박권우)에서 처음 공식 소개되었고, 1990년대 해외여행 자율화와 2000년대 서양식 급증으로 관심이 커져 지금은 대형마트에서도 허브를 취급한다."},{"id":"L08-9","set":"강의록","year":null,"kind":"강의록","no":149,"lec":8,"lecName":"허브 가꾸기","src":"L","stem":"생육 습성에 따른 분류에서 일년생 허브로 묶인 것은?","opts":["파슬리, 카라웨이","바실, 고수, 캐모마일, 딜","로즈메리, 라벤더, 세이지 쪽 어깨에 단다. 라운드부케와 캐스케이드부케는 신부 부케의 형태이다."},{"id":"L09-7","set":"강의록","year":null,"kind":"강의록","no":167,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식의 기능 가운데 건축적 기능에 해당하는 것은?","opts":["공기 정화와 가습 효과","차폐 기능, 공간 분할, 통행의 방향 제시","상품 판매 촉진과 공간의 가치 창출","정서 순화와 스트레스 감소"],"ans":[2],"multi":false,"dup":false,"expl":"건축적 기능은 차폐·공간 분할·통행 방향 제시이고, 정서 순화는 심리적 기능, 상품 판매 촉진은 경제적 기능, 공기 정화는 환경적 기능이다."},{"id":"L09-8","set":"강의록","year":null,"kind":"강의록","no":168,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식 범위에서 형상장식에 해당하는 것으로 옳은 것은?","opts":["실내정원, 테라리움","분재, 토피어리","리스, 갈런드","꽃꽂이, 꽃다발"],"ans":[2],"multi":false,"dup":false,"expl":"분식물 장식 중 형상장식은 분재·토피어리처럼 모양을 만들어 장식한 것이고, 배식장식은 실내정원·테라리움처럼 식물을 아름답게 배열한 것이다."},{"id":"L09-9","set":"강의록","year":null,"kind":"강의록","no":169,"lec":9,"lecName":"화훼장식","src":"L","stem":"동양식 꽃꽂이가 우리나라에 도입되고 일본으로 전래된 과정으로 옳은 것은?","opts":["일본의 이께바나가 고려 때 우리나라에 전래되었다","인도에서 백제로 직접 전래된 뒤 고구려를 거쳐 일본으로 갔다","인도의 불전공화가 중국을 거쳐 고구려 소수림왕 때 우리나라에 들어오고 백제 성왕 때 일본으로 전래되었다","중국의 꽃꽂이가 신라 때 일본으로 직접 전해졌다"],"ans":[3],"multi":false,"dup":false,"expl":"기원전 460년경 인도의 불전공화가 중국을 거쳐 고구려 소수림왕(372년) 때 우리나라에 도입되고, 백제 성왕(540년) 때 일본으로 전래되어 동양식 꽃꽂이의 모태가 되었다."},{"id":"L09-10","set":"강의록","year":null,"kind":"강의록","no":170,"lec":9,"lecName":"화훼장식","src":"L","stem":"고려시대에 꽃을 공급하고 꽃꽂이를 맡아 하던 관직으로 옳은 것은?","opts":["중상서 상의국의 화장(花匠)","일본의 이께바나","조선의 가례도감","신라의 화랑"],"ans":[1],"multi":false,"dup":false,"expl":"고려시대에는 중상서 상의국에 화장(花匠)을 두었고, 조선시대에도 화장과 꽃을 공급하는 기관이 있었다."},{"id":"L09-11","set":"강의록","year":null,"kind":"강의록","no":171,"lec":9,"lecName":"화훼장식","src":"L","stem":"고대 이집트의 화훼장식에 대한 설명으로 옳은 것은?","opts":["장미 꽃잎을 연회장 바닥에 뿌리는 사치를 즐겼다","초승달형과 S자형의 비대칭 곡선이 유행했다","노스게이 꽃다발이 유행했다","수련·파피루스·연꽃을 소재로 화환·화관·꽃목걸이를 선호했고 꽃다발 디자인이 단순·반복적이며 양식화되었다"],"ans":[4],"multi":false,"dup":false,"expl":"고대 이집트인은 종교의식에 절화·절엽으로 집과 몸을 장식하고 수련·파피루스·연꽃을 소재로 화환·화관·꽃목걸이를 즐겼다. 장미 꽃잎을 뿌린 것은 로마, 초승달형·S자형은 바로크, 노스게이는 조지안 시대이다."},{"id":"L09-12","set":"강의록","year":null,"kind":"강의록","no":172,"lec":9,"lecName":"화훼장식","src":"L","stem":"그리
