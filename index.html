(體)·기(技)·술(術)·예(藝)"],"ans":[1],"multi":false,"dup":false,"expl":"전인적 인간은 지·정·의·체의 균형적인 발달을 이룬 인간이며, 전인교육은 요람에서 무덤까지 진행되는 과정이다.","src":"L"},{"id":"L01-08","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":8,"stem":"원시사회 교육의 특징에 대한 설명으로 가장 옳은 것은?","opts":["국가가 제도화한 형식교육이 중심이었다","가정과 생활을 중심으로 무형식적으로 이루어졌다","문자를 통한 체계적 지식 전달이 중심이었다","학교라는 제도가 먼저 생겨났다"],"ans":[2],"multi":false,"dup":false,"expl":"원시사회의 교육은 가정과 생활을 중심으로 임의적 활동과 경험을 통해 무형식적으로 이루어졌고, 성인식 같은 의례가 교육적 장치 역할을 했다.","src":"L"},{"id":"L01-09","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":9,"stem":"학교라는 제도적 교육 형태가 발생한 배경으로 강의록이 든 것은?","opts":["산업혁명으로 노동력이 부족해진 것","문자가 발명되어 기록·축적된 지식의 양이 늘어난 것","평생교육 개념이 등장한 것","아동의 권리가 법으로 보장된 것"],"ans":[2],"multi":false,"dup":false,"expl":"학교의 발생은 문자가 발명되고 문자로 기록·축적된 지식의 양이 많아진 것과 깊은 관련이 있으며, 지식을 효과적으로 가르칠 필요에서 지배계층의 자녀를 모아 가르친 데서 비롯되었다.","src":"L"},{"id":"L01-10","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":10,"stem":"19세기 학교교육의 변화로 강의록이 제시한 것은?","opts":["학교교육의 의무교육화와 국가적 사업으로의 발전","학교교육의 완전한 폐지","가정교육으로의 전면적 회귀","평생교육 체제로의 전환"],"ans":[1],"multi":false,"dup":false,"expl":"19세기에는 학교교육이 의무교육화되고 국가적 사업으로 발전했으며, 18세기 이후 시민계급의 형성과 함께 교육의 대중화가 급격히 진행되었다.","src":"L"},{"id":"L01-11","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":11,"stem":"20세기 후반 일리치(Illich)와 라이머(Reimer)가 제기한 학교교육 비판의 핵심은?","opts":["학교교육이 지나치게 다양한 선택을 제공한다","제도화된 학교교육이 몰개성화와 인간소외를 심화시킨다","학교교육이 지식의 양을 너무 적게 다룬다","학교교육이 국가 재정을 절약한다"],"ans":[2],"multi":false,"dup":false,"expl":"이들은 제도화된 학교교육이 복잡·다원화된 사회가 요구하는 인간교육을 효율적으로 하지 못하고, 권위적·획일적 교육으로 몰개성화와 인간소외를 심화시킨다고 비판했다.","src":"L"},{"id":"L01-12","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":12,"stem":"평생교육이라는 용어를 최초로 제시한 사람과 그가 강조한 내용의 연결로 가장 옳은 것은?","opts":["듀이 - 경험의 재구성","렝그랑(Lengrand) - 학교교육 중심 체제의 탈피","일리치 - 탈학교교육","마리탱 - 인간 철학의 정립"],"ans":[2],"multi":false,"dup":false,"expl":"평생교육은 프랑스의 성인교육학자 렝그랑이 최초로 제시했으며, 학교교육 중심 체제를 탈피해 일생에 걸친 다양한 교육기회와 학습경험을 균형 있게 추구하는 것을 뜻한다.","src":"L"},{"id":"L01-13","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":13,"stem":"현대에 평생교육이 강조된 배경으로 보기 어려운 것은?","opts":["지식과 기술의 폭발적 증가와 노후화","평균수명과 여가시간의 증대, 삶의 질 향상 욕구","학교교육의 한계와 역기능에 대한 비판","학교교육이 모든 학습수요를 충족하게 된 것"],"ans":[4],"multi":false,"dup":false,"expl":"평생교육은 학교교육만으로는 급변하는 사회의 학습수요를 충족할 수 없다는 인식에서 강조되었다.","src":"L"},{"id":"L01-14","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":14,"stem":"인간의 품성에 대한 이해에서 ‘인간은 본질적으로 백지와 같은 존재’라고 본 학자로 옳은 것은?","opts":["맹자","순자","고자","루소"],"ans":[3],"multi":false,"dup":false,"expl":"강의록은 인간을 본질적으로 선한 존재로 본 맹자·루소, 악한 존재로 본 순자·아우구스티누스·칼뱅, 백지로 본 고자·로크를 제시한다.","src":"L"},{"id":"L01-15","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":15,"stem":"철학·종교적 인간관에 대한 설명으로 가장 옳은 것은?","opts":["경험적 관찰과 수량화만을 인간 이해의 방법으로 인정한다","인간이 무엇이어야 하며 어떻게 살아야 하는가에 대한 당위와 가치판단에 입각해 인간을 이해한다","인간의 행동을 인과론적 법칙으로만 설명한다","인간의 궁극적 존재 의미에 대한 질문을 무의미하다고 본다"],"ans":[2],"multi":false,"dup":false,"expl":"철학·종교적 인간관은 당위와 가치판단에 입각해 인간을 설명하는 반면, 과학적 인간관은 경험적 관찰·측정과 인과론적 설명을 중시한다.","src":"L"},{"id":"L01-16","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":16,"stem":"과학적 인간관이 교육에 미친 영향으로 강의록이 지적한 문제점으로 옳지 않은 것은?","opts":["교육을 통해 길러낼 인간에 대한 규범적 논의가 퇴조했다","인간이 목적보다 수단으로 간주되는 경향이 심화되었다","공학적·행동주의적 교육관이 득세했다","학습자의 자율성과 가치판단에 대한 논의가 크게 확대되었다"],"ans":[4],"multi":false,"dup":false,"expl":"과학적 인간관은 규범적 논의를 퇴조시키고 공학적·행동주의적 교육관을 득세하게 했으며, 오히려 가치판단에 대한 논의를 배제했다.","src":"L"},{"id":"L01-17","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":17,"stem":"후기 현대철학의 인식론적 관점에 대한 설명으로 옳지 않은 것은?","opts":["절대적·선험적인 인식의 기초가 존재하지 않는다고 본다(반정초주의)","인간의 인식과 지식은 인간의 관심·신념·가치관에 기초한 해석의 결과라고 본다","진리는 다원적이고 국지적이며 상대적이라고 본다","객관적이고 보편적인 진리를 누구나 동일하게 파악할 수 있다고 본다"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 순수하고 절대적이며 객관적인 지식이나 진리를 부정하고, 진리의 다원성·국지성·상대성을 강조한다.","src":"L"},{"id":"L01-18","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":18,"stem":"후기 현대철학이 말하는 인간 이해에 해당하지 않는 것은?","opts":["계속적인 경험에 의해 변화·발전하는 주체적·자기형성적 존재","사회와 문화의 영향을 배제할 수 없는 사회적·역사적 존재","가치선택과 판단을 비판적으로 음미하는 규범적·합리적 존재","자연이나 신에 의해 주어진 불변의 본질을 지닌 고정적 존재"],"ans":[4],"multi":false,"dup":false,"expl":"후기 현대철학은 인간의 변하지 않는 본질에 대한 가정을 부인하며, 자기형성적·사회적 역사적·규범적 합리적 존재로 인간을 이해한다.","src":"L"},{"id":"L01-19","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":19,"stem":"교육의 개념적 요소에 대한 설명으로 가장 옳은 것은?","opts":["우연적이고 자연 발생적인 변화도 교육에 포함된다","교육은 전인적 인간 변화를 의도적으로 추구하되 바람직한 방향의 변화를 지향한다","교육의 수단과 방법은 목표 달성만 가능하면 정당성과 무관하다","교육은 결과적으로 이루어진 변화만으로 판단해야 한다"],"ans":[2],"multi":false,"dup":false,"expl":"교육은 의도성, 전인적 인간 변화에 대한 관심, 가치 지향성, 인간존엄성 존중, 의미 충족과 자아형성감, 교육자의 자율성과 도덕적 책임이라는 개념 요소를 지닌다.","src":"L"},{"id":"L01-20","set":"강의록","year":null,"kind":"강의록","lec":1,"lecName":"인간과 교육의 이해","no":20,"stem":"강의록이 제시한 교육의 3요소로 바르게 묶인 것은?","opts":["교육자, 학습자, 교육내용","교사, 학부모, 행정가","목표, 평가, 피드백","학교, 사회, 국가"],"ans":[1],"multi":false,"dup":false,"expl":"교육의 3요소는 교육자(교사·부모·사회·국가 등), 학습자, 교육내용(교재 등)이다.","src":"L"},{"id":"L02-01","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":21,"stem":"강의록이 정의한 학습의 의미로 가장 옳은 것은?","opts":["일시적으로 나타났다가 사라지는 행동의 변화","외현적 행동뿐 아니라 지식·신념·가치관 등 내재적 행동까지 포함하는 비교적 지속적인 행동의 변화","선천적으로 타고난 반사행동의 발현","환경과 무관하게 개인 내부에서 저절로 일어나는 변화"],"ans":[2],"multi":false,"dup":false,"expl":"학습은 눈에 보이는 외현적 행동과 지식·신념·가치관 같은 내재적 행동을 모두 포함하며, 일시적이지 않고 비교적 지속적인 행동의 변화다.","src":"L"},{"id":"L02-02","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":22,"stem":"강의록이 제시한 학습이론과 대표자를 연결한 것으로 옳지 않은 것은?","opts":["행동주의 학습이론 - 파블로프, 손다이크, 스키너","인지주의 학습이론 - 베르타이머, 쾰러, 레빈","사회학습이론 - 반두라","인본주의 학습이론 - 왓슨, 스키너"],"ans":[4],"multi":false,"dup":false,"expl":"인본주의 학습이론의 대표자는 매슬로와 로저스이며, 왓슨과 스키너는 행동주의 학습이론의 대표자다.","src":"L"},{"id":"L02-03","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":23,"stem":"행동주의 심리학의 창시자와 그가 주장한 연구 방법으로 옳은 것은?","opts":["왓슨 - 마음의 주관적 관찰 대신 관찰·측정 가능한 행동만을 연구대상으로 삼았다","쾰러 - 내성법으로 의식의 구조를 분석했다","반두라 - 동물의 소화액 분비 실험을 했다","레빈 - 통찰 실험으로 학습을 설명했다"],"ans":[1],"multi":false,"dup":false,"expl":"행동주의는 왓슨이 창시했으며, 마음의 주관적 관찰은 신뢰할 수 없다고 보고 직접 관찰·측정할 수 있는 행동만을 과학적 연구대상으로 삼았다.","src":"L"},{"id":"L02-04","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":24,"stem":"행동주의 학습이론의 기본 전제로 가장 옳은 것은?","opts":["인간행동의 원인은 개인 내부에 있다","인간행동의 원인은 바깥 세상에 있으며 행동은 그 맥락 속에서 의미를 지닌다","부적응적 행동은 선천적으로 결정된다","행동은 맥락과 무관하게 동일한 의미를 지닌다"],"ans":[2],"multi":false,"dup":false,"expl":"행동주의는 적응적·부적응적 행동 모두 학습된 것으로 보고, 행동의 원인을 개인 내부가 아니라 외부 환경(맥락)에서 찾는다.","src":"L"},{"id":"L02-05","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":25,"stem":"고전적 조건형성 이론의 탄생 배경으로 옳은 것은?","opts":["손다이크가 고양이 실험에서 시행착오 학습을 발견한 것","파블로프가 개의 소화액 분비 실험 중 원래 반응을 일으키지 못하던 자극이 반응을 일으키는 것을 관찰한 것","스키너가 스키너 상자를 제작한 것","쾰러가 침팬지의 통찰을 관찰한 것"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성은 러시아 생리학자 파블로프가 개의 소화액 분비 실험 도중 중성자극이 반응을 일으키는 것을 관찰하면서 탄생했다.","src":"L"},{"id":"L02-06","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":26,"stem":"고전적 조건형성에서 소거된 행동에 대한 설명으로 가장 옳은 것은?","opts":["완전히 사라져 다시는 나타나지 않는다","일시적으로 억압되어 있을 뿐 자발적 회복이나 신속한 재조건형성으로 다시 나타날 수 있다","다른 자극에 대해 일반화되어 나타난다","처음부터 학습되지 않았던 행동이다"],"ans":[2],"multi":false,"dup":false,"expl":"소거된 행동은 완전히 사라진 것이 아니라 일시적으로 억압된 것이며, 자발적 회복이나 신속한 재조건형성을 통해 다시 나타난다.","src":"L"},{"id":"L02-07","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":27,"stem":"고전적 조건형성이 주로 설명하는 반응의 성격으로 옳은 것은?","opts":["수의적이고 의도적인 행동","무의식적·무의도적·불수의적 반응과 정서적 반응","복잡한 문제해결 행동","언어적 추론 행동"],"ans":[2],"multi":false,"dup":false,"expl":"고전적 조건형성은 무의식적·무의도적·불수의적 반응과 정서적 반응을 설명하며, TV 광고가 대표적 예로 제시된다.","src":"L"},{"id":"L02-08","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":28,"stem":"조작적 조건형성과 고전적 조건형성의 차이로 가장 옳은 것은?","opts":["조작적 조건형성은 불수의적 행동, 고전적 조건형성은 수의적 행동의 학습기제다","조작적 조건형성은 수의적 행동, 고전적 조건형성은 불수의적 행동의 학습기제다","두 이론은 동일한 자극-반응 모형을 사용한다","조작적 조건형성은 정서 반응만을 설명한다"],"ans":[2],"multi":false,"dup":false,"expl":"강의록은 고전적 조건형성을 불수의적 행동의 학습 기제, 조작적 조건형성을 수의적 행동의 학습 기제로 구분한다.","src":"L"},{"id":"L02-09","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":29,"stem":"손다이크의 도구적 조건형성에서 ‘도구적’이라는 말이 붙은 이유로 옳은 것은?","opts":["성공적인 반응이 성공적인 결과를 가져다주는 도구로 사용되었기 때문","실험 도구를 직접 제작했기 때문","동물을 도구로 사용했기 때문","학습을 통찰로 설명했기 때문"],"ans":[1],"multi":false,"dup":false,"expl":"성공적인 반응이 성공적인 결과를 얻는 도구로 사용되었다는 점에서 도구적 조건형성이라 부르며, 성공까지 무수한 시행착오를 거치는 학습을 시행착오적 학습이라 한다.","src":"L"},{"id":"L02-10","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":30,"stem":"강의록이 제시한 손다이크의 학습의 법칙 세 가지로 바르게 묶인 것은?","opts":["연습의 법칙, 효과의 법칙, 준비성의 법칙","강화의 법칙, 소거의 법칙, 일반화의 법칙","근접성의 법칙, 유사성의 법칙, 폐쇄성의 법칙","주의집중, 파지, 운동재생"],"ans":[1],"multi":false,"dup":false,"expl":"손다이크의 학습의 법칙은 연습의 법칙, 효과의 법칙, 준비성의 법칙이다.","src":"L"},{"id":"L02-11","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":31,"stem":"스키너의 행동조형(shaping)이 손다이크의 실험과 구별되는 가장 큰 특징은?","opts":["동물이 목표 행동을 할 때까지 기다리지 않고 그 행동을 계획적으로 조형해 가는 절차를 세운 점","마음의 내성적 관찰을 강조한 점","통찰에 의한 학습을 증명한 점","관찰학습의 과정을 밝힌 점"],"ans":[1],"multi":false,"dup":false,"expl":"스키너는 학습시키고자 하는 행동을 실험동물이 할 때까지 기다리는 대신 그 행동을 계획적으로 조형해 가는 절차를 세웠고, 실험도구를 스키너 상자라 부른다.","src":"L"},{"id":"L02-12","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":32,"stem":"강화계획의 구분으로 옳지 않은 것은?","opts":["고정 비율 강화계획과 변동 비율 강화계획","고정 간격 강화계획과 변동 간격 강화계획","고정 비율 강화계획과 고정 간격 강화계획","제시형 강화계획과 제거형 강화계획"],"ans":[4],"multi":false,"dup":false,"expl":"강화계획은 비율(반응 수)과 간격(시간)을 기준으로 고정·변동으로 나뉜다. 제시형·제거형은 벌의 구분이다.","src":"L"},{"id":"L02-13","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":33,"stem":"행동수정에 대한 설명으로 가장 옳은 것은?","opts":["행동 자체를 직접 조작해 변화시킨다","행동에 선행하는 사건이나 후속 결과를 조작해 행동의 변화를 가져온다","인지구조의 재조직을 통해 행동을 바꾼다","무의식의 통찰을 통해 행동을 바꾼다"],"ans":[2],"multi":false,"dup":false,"expl":"행동수정은 행동 자체가 아니라 그 행동에 선행하는 사건(자극)이나 후속 결과를 조작함으로써 행동의 변화를 가져오는 방법이다.","src":"L"},{"id":"L02-14","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":34,"stem":"바람직하지 않은 행동을 감소시키는 방법으로 강의록이 제시한 것은?","opts":["정적 강화와 부적 강화","벌, 소거, 상반 행동의 육성","토큰 강화와 프로그램학습","모델링과 자기효능감"],"ans":[2],"multi":false,"dup":false,"expl":"바람직한 행동의 증강에는 정적·부적 강화가, 바람직하지 않은 행동의 감소에는 벌·소거와 상반 행동의 육성이 제시된다.","src":"L"},{"id":"L02-15","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":35,"stem":"프로그램학습의 특징으로 옳지 않은 것은?","opts":["학습 과제를 쉬운 것에서 어려운 것으로 체계화한다","학습자가 과제를 성공적으로 수행하면 강화를 제공한다","수행 결과에 따라 다음 과제의 난이도나 참고자료를 제시한다","학습자의 수행 결과와 무관하게 정해진 순서로만 진행된다"],"ans":[4],"multi":false,"dup":false,"expl":"프로그램학습은 수행 결과에 따라 다음 학습 과제를 제시하는 개별화 학습으로, 컴퓨터 보조학습(CAI)이 대표적 예이다.","src":"L"},{"id":"L02-16","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":36,"stem":"형태주의 심리학의 창시자와 핵심 개념의 연결로 옳은 것은?","opts":["분트 - 내성법","베르타이머·쾰러·코프카 - 형태(Gestalt)","왓슨 - 자극-반응","에빙하우스 - 망각곡선"],"ans":[2],"multi":false,"dup":false,"expl":"형태주의 심리학은 베르타이머·쾰러·코프카가 창시했고, 전체적인 모양과 조직인 형태(Gestalt)를 중시하며 베르타이머의 파이 현상 논문이 기원이다.","src":"L"},{"id":"L02-17","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":37,"stem":"형태주의의 지각 법칙 네 가지로 바르게 묶인 것은?","opts":["근접성, 유사성, 폐쇄성, 계속성","강화, 소거, 일반화, 변별","주의집중, 파지, 운동재생, 동기유발","부호화, 저장, 인출, 재인"],"ans":[1],"multi":false,"dup":false,"expl":"형태주의의 주요 4가지 법칙은 근접성, 유사성, 폐쇄성(완결성), 계속성(연속성) 법칙이며, 전경과 배경의 법칙도 제시된다.","src":"L"},{"id":"L02-18","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":38,"stem":"쾰러의 통찰학습이론에 대한 설명으로 옳지 않은 것은?","opts":["학습은 단 한 순간의 통찰에 의해 일어난다","통찰은 문제 상황의 중요한 부분들 간 관계가 전체적으로 지각될 때 이루어지기 쉽다","통찰로 얻은 문제해결은 새로운 상황에 적용될 수 있다","통찰에 의한 학습은 오래 유지되지 않고 쉽게 사라진다"],"ans":[4],"multi":false,"dup":false,"expl":"통찰에 의해 문제가 해결되면 그 학습은 상당 기간 유지되고 쉽게 반복될 수 있으며 새로운 상황에도 적용된다.","src":"L"},{"id":"L02-19","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":39,"stem":"레빈의 장(場)이론에 대한 설명으로 가장 옳은 것은?","opts":["인간행동은 과거의 사건에 의해서만 결정된다","장은 개인의 전체적인 생활공간이며 인간행동은 개인과 환경의 상호작용의 산물이다","환경은 개인에게 일방적으로 영향을 미칠 뿐 개인은 환경에 영향을 주지 못한다","학습은 자극과 반응의 결합으로만 설명된다"],"ans":[2],"multi":false,"dup":false,"expl":"장은 개인의 전체적인 생활공간이고, B=f(P×E)처럼 인간행동은 개인의 심성과 환경의 상호작용의 산물이며 장은 항상 현재적 의미를 지닌다.","src":"L"},{"id":"L02-20","set":"강의록","year":null,"kind":"강의록","lec":2,"lecName":"학습·발달하는 존재로서 인간과 교육(1)","no":40,"stem":"반두라의 사회학습이론에서 관찰학습의 과정을 순서대로 나열한 것은?","opts":["주의집중 → 파지 → 운동재생 → 동기유발","파지 → 주의집중 → 동기유발 → 운동재생","동기유발 → 주의집중 → 파지 → 운동재생","운동재생 → 주의집중 → 파지 → 동기유발"],"ans":[1],"multi":false,"dup":false,"expl":"관찰학습은 학습자가 매력 있는 모델에 주의집중하고, 관찰한 것을 언어·심상으로 파지하며, 운동으로 재생하고, 자기강화·대리강화로 동기유발되는 과정을 거친다.","src":"L"},{"id":"L03-01","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":41,"stem":"강의록에 따르면 발달을 구성하는 세 요소로 바르게 묶인 것은?","opts":["성장, 성숙, 학습","유전, 환경, 교육","동화, 조절, 평형","감각, 지각, 사고"],"ans":[1],"multi":false,"dup":false,"expl":"발달은 성장(양적 증가), 성숙(유전적 요인에 의한 변화), 학습(경험에 의한 변화)의 상호작용 결과이며 수정 순간부터 시작된다.","src":"L"},{"id":"L03-02","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":42,"stem":"태내 발달에 영향을 미치는 환경적 요인으로 강의록이 든 것으로 옳지 않은 것은?","opts":["태모의 영양상태와 질병","태모의 정서 상태와 약물 사용","태모의 연령과 환경 공해","태아 자신의 학습 의지"],"ans":[4],"multi":false,"dup":false,"expl":"태내 발달에는 태모의 영양·질병·정서·약물·연령·환경 공해 등이 영향을 미친다.","src":"L"},{"id":"L03-03","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":43,"stem":"인간발달의 주요 원리 중 ‘결정적 시기’에 대한 설명으로 가장 옳은 것은?","opts":["모든 발달 영역이 동시에 완성되는 시기이다","특정 발달 영역이 우세하게 나타나는 시기로, 놓치면 그 영역에 장애를 가져올 수 있다","유전의 영향이 완전히 사라지는 시기이다","학습이 전혀 일어나지 않는 시기이다"],"ans":[2],"multi":false,"dup":false,"expl":"결정적 시기는 특정 발달 영역이 우세하게 나타나는 시기로, 그 시기를 놓치면 해당 영역에 장애가 생길 수 있다.","src":"L"},{"id":"L03-04","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":44,"stem":"발달을 ‘연속적 현상’으로 보는 관점과 ‘단계적 현상’으로 보는 관점의 대비로 옳은 것은?","opts":["연속적 관점은 질적으로 다른 인지구조의 변화를 강조한다","단계적 관점은 인간을 기계에 비유하고 변화를 수동적 반응의 부가로 본다","연속적 관점은 변화를 환경에 대한 수동적 반응이 계속 부가되는 과정으로 본다","단계적 관점은 발달단계가 존재하지 않는다고 본다"],"ans":[3],"multi":false,"dup":false,"expl":"연속적 관점은 인간을 기계에 비유하며 변화를 수동적 반응의 부가로 보는 반면, 단계적 관점은 질적으로 다른 인지구조의 변화와 일정한 순서의 발달단계를 강조한다.","src":"L"},{"id":"L03-05","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":45,"stem":"피아제 이론의 전제로 옳지 않은 것은?","opts":["유기체는 태어날 때부터 적응하려는 힘을 지닌다","지적 적응은 인식 주체와 대상의 상호작용 과정이다","유기체의 적응은 균형 상태를 추구하는 경향이 있다","인지는 성인기에 이르러서야 갑자기 형성된다"],"ans":[4],"multi":false,"dup":false,"expl":"피아제는 인식을 점진적인 진화의 결과로 보며, 적응은 균형 상태를 추구하는 경향을 지닌다고 보았다.","src":"L"},{"id":"L03-06","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":46,"stem":"피아제의 적응 기제에서 동화와 조절에 대한 설명으로 옳은 것은?","opts":["동화는 환경의 영향으로 개인의 조직이 수정되는 과정이다","조절은 외부 요소를 내부 구조 속으로 통합하는 과정이다","동화는 외부 요소를 내부 구조로 통합하고, 조절은 환경의 영향으로 조직이 수정되는 과정이다","동화와 조절은 유아기에만 나타난다"],"ans":[3],"multi":false,"dup":false,"expl":"동화는 외부 요소를 기존 인지구조 속으로 통합하는 것이고, 조절은 환경의 영향으로 기존 조직이 수정되는 과정이며, 둘은 전 생애에 걸쳐 균형을 추구한다.","src":"L"},{"id":"L03-07","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":47,"stem":"피아제 이론에서 ‘도식(schema)’에 대한 설명으로 가장 옳은 것은?","opts":["유기체가 외계의 사물을 인지하고 대응하는 데 사용하는 지각·반응의 틀","환경에 대한 수동적 반응의 총합","지능검사의 표준화된 규준","성격의 무의식적 구조"],"ans":[1],"multi":false,"dup":false,"expl":"도식은 유기체가 사물을 인지하고 대응하는 데 쓰는 ‘세상을 바라보는 눈’이며, 발달 후기에는 인지적 구조를 갖추게 된다.","src":"L"},{"id":"L03-08","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":48,"stem":"감각동작기(0~2세)의 특징으로 옳지 않은 것은?","opts":["언어 발달 전으로 감각과 동작에 의해 학습한다","반사적 행동에서 협응 능력이 발달한다","대상 항구성 개념이 이 단계 말에 발달한다","보존개념과 서열조작이 발달한다"],"ans":[4],"multi":false,"dup":false,"expl":"보존개념과 분류·서열조작은 구체적 조작기의 특징이다. 감각동작기의 말기에는 대상 항구성이 발달한다.","src":"L"},{"id":"L03-09","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":49,"stem":"전조작기(2~6세)의 특징으로 옳은 것은?","opts":["상징적 사고가 가능해지고 자기중심성·중심화·비가역성이 나타난다","가설연역적 사고가 가능하다","보존개념이 완전히 습득된다","분류조작과 서열조작이 가능하다"],"ans":[1],"multi":false,"dup":false,"expl":"전조작기는 언어 발달로 상징적 사고가 가능해지지만 자기중심성, 중심화, 비가역성(보존개념 미발달)의 한계를 지닌다.","src":"L"},{"id":"L03-10","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":50,"stem":"구체적 조작기(6~12세)에 대한 설명으로 가장 옳은 것은?","opts":["추상적 개념만 다룰 수 있고 구체적 사물에는 적용하지 못한다","탈중심화가 이루어지고 구체적·관찰 가능한 사물에 대한 논리적 사고가 가능하다","대상 항구성이 처음 발달하는 단계이다","자기중심적 독백이 가장 활발한 단계이다"],"ans":[2],"multi":false,"dup":false,"expl":"구체적 조작기에는 탈중심화와 보존개념, 분류·서열조작이 발달하지만 논리적 사고는 구체적이고 관찰 가능한 사물과 사건에 적용된다.","src":"L"},{"id":"L03-11","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":51,"stem":"형식적 조작기(12세 이후)의 특징으로 옳지 않은 것은?","opts":["추상적 개념의 이해와 인과관계 파악","가설 검증력과 추리력, 조합적 사고의 발달","융통성 있고 개방적이며 현실 적응적인 사고","언어 미발달로 인한 상징적 사고의 결여"],"ans":[4],"multi":false,"dup":false,"expl":"형식적 조작기는 추상적 사고, 가설 검증, 조합적 사고가 발달하는 단계이며 상징적 사고의 결여는 전조작기 이전의 특징이다.","src":"L"},{"id":"L03-12","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":52,"stem":"피아제 이론의 교육적 시사점으로 보기 어려운 것은?","opts":["아동은 성인의 축소판이 아니다","지식은 아동이 직접 참여해서 얻는 것이다","발달단계에 적합한 과제를 가르치는 것이 효과적이다","지식은 교사가 전달하는 그대로 아동에게 복사된다"],"ans":[4],"multi":false,"dup":false,"expl":"피아제는 아동이 직접 참여해 지식을 구성하며 지식이 전체적 구조로 형성·발달한다고 보았다.","src":"L"},{"id":"L03-13","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":53,"stem":"에릭슨의 심리사회적 발달이론에 대한 설명으로 가장 옳은 것은?","opts":["인간발달의 전생애적 접근을 시도한 최초의 학자이며 발달을 8단계로 구분했다","성격발달을 5단계로 구분하고 리비도를 중심에 두었다","아동기만을 연구대상으로 삼았다","발달을 유전인자만으로 설명했다"],"ans":[1],"multi":false,"dup":false,"expl":"에릭슨은 전생애적 접근을 시도한 최초의 학자로, 인간발달을 8단계로 구분하고 각 단계의 심리사회적 위기와 자아자질(덕성)에 관심을 두었다.","src":"L"},{"id":"L03-14","set":"강의록","year":null,"kind":"강의록","lec":3,"lecName":"학습·발달하는 존재로서 인간과 교육(2)","no":54,"stem":"에릭슨이 말한 점성(漸成)원리의 의미로 가장 옳은 것은?","opts":["각 단계가 무작위로 나타난다","유전된 성격의 기초 기 "L"},{"id":"L04-05","set":"강의록","year":null,"kind":"강의록","lec":4,"lecName":"생각하는 지적 존재로서 인간과 교육(1)","no":65,"stem":"학습의 전이(transfer)에 대한 설명으로 가장 옳은 것은?","opts":["선행학습이 후행학습에 부정적 영향만 주는 것을 뜻한다","어떤 상황에서 학습한 내용을 새로운 장면에 적용하거나 사용하는 것이다","자극과 반응의 결합이 사라지는 현상이다","동일한 자극을 구별하는 능력이다"],"ans":[2],"multi":false,"dup":false,"expl":"전이는 어떤 상황에서 학습한 내용을 새로운 장면에 적용하거나 사용하는 것을 뜻하며, 선행학습과 후행학습 사이에 일어나는 일을 설명한다.","src":"L"},{"id":"L04-06","set":"강의록","year":null,"kind":"강의록","lec":4,"lecName":"생각하는 지적 존재로서 인간과 교육(1)","no":66,"stem":"손다이크가 주창한 학습의 전이 이론과 그 핵심 내용의 연결로 옳은 것은?","opts":["형식도야설 - 정신력을 단련시키는 기본 교과의 학습으로 전이가 일어난다","일반화설 - 선행·후행 학습에 동일한 요소가 있을 때만 전이가 일어난다","동일요소설 - 선행·후행 학습에 동일한 요소가 포함될 때 연습 효과가 확대된다","형태이조설 - 원리의 학습이 전이의 핵심이다"],"ans":[3],"multi":false,"dup":false,"expl":"동일요소설은 손다이크가 주창했으며, 선행·후행 학습의 기능에 동일한 요소가 포함될 때 연습 효과의 확대가 나타난다고 본다.","src":"L"},{"id":"L04-07","set":"강의록","year":null,"kind":"강의록","lec":4,"lecName":"생각하는 지적 존재로서 인간과 교육(1)","no":67,"stem":"학습의 전이 이론에 대한 설명으로 옳지 않은 것은?","opts":["형식도야설은 인간의 정신력을 단련시킬 수 있는 기본 교과의 학습을 통해 전이가 일어난다고 본다","일반화설은 Judd가 주창했으며 원리나 일반 법칙의 학습을 전이의 조건으로 본다","형태이조설은 전체적인 관계성(형태)이 전이를 일으키는 핵심이라고 본다","일반화설은 전이에 교과의 동일 요소만이 중요하다고 본다"],"ans":[4],"multi":false,"dup":false,"expl":"동일 요소만을 중시하는 것은 동일요소설이며, 일반화설은 새로운 장면에 적용·일반화할 수 있는 원리나 법칙의 학습을 전이의 조건으로 본다.","src":"L"},{"id":"L04-08","set":"강의록","year":null,"kind":"강의록","lec":4,"lecName":"생각하는 지적 존재로서 인간과 교육(1)","no":68,"stem":"해마의 기능과 손상 시 나타나는 현상으로 가장 옳은 것은?","opts":["정서와 공격성에 관여하며 손상되면 공격성이 높아진다","학습과 기억에 관여하며 손상되면 장기기억은 유지되나 새로 학습한 것의 기억에 문제가 생긴다","신체 균형을 담당하며 손상되면 걸음이 불안정해진다","호흡과 심장박동을 조절하며 손상되면 생명이 위험하다"],"ans":[2],"multi":false,"dup":false,"expl":"해마는 학습과 기억에 관여하며, 손상되면 단기기억이 손상되고 단기기억이 장기기억으로 전환되는 과정에 장애가 생긴다.","src":"L"},{"id":"L04-09","set":"강의록","year":null,"kind":"강의록","lec":4,"lecName":"생각하는 지적 존재로서 인간과 교육(1)","no":69,"stem":"알츠하이머병(치매)과 가장 관련이 깊은 뇌 구조는?","opts":["편도체","해마","연수","뇌량"],"ans":[2],"multi":false,"dup":false,"expl":"치매는 대개 해마의 구조적·기능적 쇠퇴로 생기는 것으로 알려져 있다.","src":"L"}, e":"생각하는 지적 존재로서 인간과 교육(2)","no":86,"stem":"비율 IQ를 계산하는 공식과 그 적용상의 한계로 옳은 것은?","opts":["IQ = (생활연령 ÷ 정신연령) × 100, 모든 연령에 적용 가능","IQ = (정신연령 ÷ 생활연령) × 100, 20세 이전 사람에게만 적합","IQ = 100 + Z × 15, 모든 연령에 적용 가능","IQ = (정신연령 × 생활연령) ÷ 100, 20세 이후에만 적합"],"ans":[2],"multi":false,"dup":false,"expl":"비율 IQ는 (정신연령 ÷ 생활연령) × 100이며, 모든 문항을 맞혀도 정신연령이 최대 20세까지만 나오므로 20세 이전 사람에게만 적합하다.","src":"L"},{"id":"L05-07","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":87,"stem":"웩슬러 지능검사가 비네 검사와 구별되는 특징으로 옳지 않은 것은?","opts":["비언어적 지능을 측정하는 수행 검사를 추가했다","언어성 IQ와 동작성 IQ, 전체 IQ를 산출한다","편차 IQ를 도입했다","정신연령 개념을 최초로 도입했다"],"ans":[4],"multi":false,"dup":false,"expl":"정신연령 개념은 비네-시몬 검사가 도입했으며, 웩슬러 검사는 편차 IQ(IQ = 100 + Z×15)를 도입했다.","src":"L"},{"id":"L05-08","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":88,"stem":"편차 IQ에 대한 설명으로 가장 옳은 것은?","opts":["정신연령을 생활연령으로 나누어 계산한다","같은 연령 집단 내에서의 상대적 위치로 지능을 규정하며 평균 100, 표준편차 15의 정상분포를 가정한다","20세 이전에만 적용할 수 있다","언어성 IQ만을 산출한다"],"ans":[2],"multi":false,"dup":false,"expl":"편차 IQ는 한 사람의 지능을 같은 연령 집단 내 상대적 위치로 규정한 것으로, 평균 100·표준편차 15의 정상분포를 가정해 IQ = 100 + Z×15로 산출한다.","src":"L"},{"id":"L05-09","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":89,"stem":"Army-α 검사와 Army-β 검사에 대한 설명으로 옳은 것은?","opts":["최초의 개인용 지능검사이다","최초의 집단용 지능검사로, 알파는 언어성, 베타는 비언어성 검사로 구성되었다","베타 검사는 언어성 검사, 알파 검사는 비언어성 검사이다","제2차 세계대전 때 개발되었다"],"ans":[2],"multi":false,"dup":false,"expl":"Army-α·β 검사는 제1차 세계대전 당시 모병을 위해 제작된 최초의 집단용 지능검사로, 알파는 언어성, 베타는 비언어성 검사다.","src":"L"},{"id":"L05-10","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":90,"stem":"표준화 심리검사의 양호도를 판별하는 가장 중요한 두 기준은?","opts":["신뢰도와 타당도","객관도와 실용도","규준과 표준편차","난이도와 변별도"],"ans":[1],"multi":false,"dup":false,"expl":"신뢰도·타당도·객관도·실용도 중 가장 중요한 두 기준은 신뢰도와 타당도다.","src":"L"},{"id":"L05-11","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":91,"stem":"신뢰도와 타당도의 의미를 바르게 지능이론에서 ‘어떤 상황이든 잘 적응하는 사람’에게 특히 강한 요소는?","opts":["성분적 요소","경험적 요소","맥락적 요소","논리적 요소"],"ans":[3],"multi":false,"dup":false,"expl":"맥락적 요소는 현실 상황에의 적응력을 강조하며, 전통적 지능검사 IQ나 학업성적과는 무관하게 어떤 상황이든 잘 적응하는 사람과 관련된다.","src":"L"},{"id":"L05-17","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":97,"stem":"정서지능(감성지능)에 대한 설명으로 옳지 않은 것은?","opts":["살로비와 메이어가 EQ라는 개념을 처음 사용했다","골먼은 정서지능이 성공 가능성을 예측하는 데 중요하다고 보았다","가드너의 대인간 지능·개인내 지능, 스턴버그의 실제적 지능과 유사하다","정서지능은 손다이크가 최초로 제안한 개념으로 사회적 지능과 무관하다"],"ans":[4],"multi":false,"dup":false,"expl":"정서지능은 손다이크가 제안한 사회적 지능의 한 하위 요소로, 자신과 타인의 내부 상태·동기·행동을 인식하고 그 정보에 기초해 적절히 행동하는 능력이다.","src":"L"},{"id":"L05-18","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":98,"stem":"정서지능의 ‘4영역 4수준 16요소’ 모형에 해당하지 않는 영역은?","opts":["정서의 인식과 표현","정서의 사고 촉진","정서 지식의 활용","정서의 억제와 통제"],"ans":[4],"multi":false,"dup":false,"expl":"네 영역은 정서의 인식과 표현, 정서의 사고 촉진, 정서 지식의 활용, 정서의 반영적 조절이다.","src":"L"},{"id":"L05-19","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":99,"stem":"지능과 창의력의 관계에 대한 설명으로 가장 옳은 것은?","opts":["지능은 창의력의 필요조건이자 충분조건이다","지능은 창의력의 필요조건이지만 충분조건은 아니며, 대개 IQ 120 이하에서는 정적 상관을 보인다","지능과 창의력은 항상 부적 상관을 보인다","창의력이 높으면 지능도 반드시 높다"],"ans":[2],"multi":false,"dup":false,"expl":"지능은 창의력의 필요조건이지만 충분조건은 아니며, 대개 IQ 120 이하에서는 정적 상관을 보이지만 그 이상에서는 상관이 거의 없거나 부적 상관을 보인다.","src":"L"},{"id":"L05-20","set":"강의록","year":null,"kind":"강의록","lec":5,"lecName":"생각하는 지적 존재로서 인간과 교육(2)","no":100,"stem":"창의력에 대한 심리측정론적 주장으로 가장 옳은 것은?","opts":["창의력은 하늘이 내린 천재만의 능력이다","창의적 활동은 일종의 승화작용이다","창의력을 구성하는 기본 능력이 있으며 그 능력은 지필검사로 측정할 수 있다","창의적 사고는 보통 사고와 근본적으로 다르다"],"ans":[3],"multi":false,"dup":false,"expl":"길포드를 중심으로 한 심리측정론은 창의력을 구성하는 기본 능력(민감성, 유창성, 독창성, 유연성)이 있고 지필검사로 측정 가능하다고 보았다.","src":"L"},{"id":"L06-01","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":101,"stem":"성격 관련 용어의 연결로 옳지 않은 것은?","opts":["인격(character) - 사회의 도덕·가치·관습과 관련한 성격","기질(temperament) - 생물학적 배경과 관련한 성격","개성(individuality) - 다른 사람과 구분되는 독특한 성격","인성(personality) - 생물학적 유전만을 뜻하는 성격"],"ans":[4],"multi":false,"dup":false,"expl":"인성(personality)은 한 개인이 다른 사람에게 드러내 보이는 전체적인 상으로, 생물학적 유전만을 뜻하지 않는다.","src":"L"},{"id":"L06-02","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":102,"stem":"강의록이 제시한 성격 정의들의 공통점으로 옳지 않은 것은?","opts":["성격은 가설적 조직체이다","성격에는 개인차가 있다","성격은 개인의 생활사·발달사에 비추어 조망해야 한다","성격은 환경에 따라 매 순간 완전히 새로 만들어진다"],"ans":[4],"multi":false,"dup":false,"expl":"성격은 역동적이면서도 항상성을 띠는 고정적 조직체이며, 가설적 조직체이고 개인차가 있으며 생활사·발달사에 비추어 조망해야 한다.","src":"L"},{"id":"L06-03","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":103,"stem":"프로이트의 정신역동이론을 ‘갈등의 심리학’이라 부르는 이유로 가장 옳은 것은?","opts":["인간의 내면이 자연적·생물학적 존재와 사회적·문화적 존재, 원초아·자아·초자아 간의 갈등으로 이루어져 있기 때문","인간이 사회적 규범과 타협하지 않기 때문","무의식이 존재하지 않는다고 보기 때문","인간을 완전히 합리적인 존재로 보기 때문"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 인간의 내면세계를 끊임없이 갈등하는 힘들의 전쟁터로 보았으며, 생물학적 존재와 사회문화적 존재, 원초아·자아·초자아 간의 갈등을 중시했다.","src":"L"},{"id":"L06-04","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":104,"stem":"프로이트 이론의 ‘무의식의 심리학’이라는 특징에 대한 설명으로 가장 옳은 것은?","opts":["인간의 모든 심리적 사상에는 원인이 있으며 그 원인의 대부분은 무의식에 있다","무의식은 의식보다 힘이 약하다","인간행동은 의식적 판단에 의해서만 결정된다","무의식은 성인기에만 형성된다"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 모든 심리적 사상에 반드시 원인이 있고 인간행동의 원인의 대부분은 무의식에 있다고 보았다.","src":"L"},{"id":"L06-05","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":105,"stem":"프로이트의 결정론적 관점에 대한 설명으로 가장 옳은 것은?","opts":["인간은 자유의지로 모든 행동을 결정한다","인간행동은 비합리적 힘, 무의식적 동기, 생애 초기 4~5년의 심리성적 사상에 의해 결정된다","인간행동은 성인기의 합리적 판단에 의해서만 결정된다","인간은 환경의 영향을 받지 않는다"],"ans":[2],"multi":false,"dup":false,"expl":"프로이트는 인간본성에 대해 기본적으로 결정론의 입장을 취하며, 행동이 비합리적 힘과 무의식적 동기, 생애 초기 4~5년의 심리성적 사상에 의해 결정된다고 보았다.","src":"L"},{"id":"L06-06","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":106,"stem":"프로이트가 말한 죽음의 본능에 해당하는 것으로 가장 옳은 것은?","opts":["성 본능","생식 본능","공격 본능","종족 번식 본능"],"ans":[3],"multi":false,"dup":false,"expl":"삶의 본능에는 성·생식·종족 번식 본능이, 죽음의 본능에는 자연회귀 본능과 공격 본능이 속한다.","src":"L"},{"id":"L06-07","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":107,"stem":"원초아(id)의 작동 원리와 과정의 연결로 옳은 것은?","opts":["쾌락원리 - 일차과정","현실원리 - 일차과정","도덕원리 - 이차과정","쾌락원리 - 이차과정"],"ans":[1],"multi":false,"dup":false,"expl":"원초아는 쾌락원리에 따라 일차과정으로 작동하며 정신적 에너지의 저장소 역할을 한다.","src":"L"},{"id":"L06-08","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":108,"stem":"자아(ego)의 기능에 대한 설명으로 가장 옳은 것은?","opts":["도덕적 이상만을 추구하며 현실을 무시한다","현실원리에 따라 이차과정으로 작동하며 원초아와 초자아를 통합·조정하는 중재자 역할을 한다","쾌락원리에 따라 긴장을 즉각 해소한다","부모의 가치를 내면화해 형성된다"],"ans":[2],"multi":false,"dup":false,"expl":"자아는 현실원리에 따라 이차과정으로 작동하며, 원초아의 욕구와 초자아의 도덕적 요구, 현실을 고려해 통합·조정하는 중재자 역할을 한다.","src":"L"},{"id":"L06-09","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":109,"stem":"초자아(superego)에 대한 설명으로 옳지 않은 것은?","opts":["도덕(양심)의 원리를 따른다","현실보다 이상, 쾌락보다 완성을 추구한다","부모의 가치를 내면화함으로써 발달한다","정신적 에너지의 저장소로서 반사작용을 담당한다"],"ans":[4],"multi":false,"dup":false,"expl":"정신적 에너지의 저장소와 반사작용은 원초아의 특징이다.","src":"L"},{"id":"L06-10","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":110,"stem":"프로이트가 말한 신경증적 불안에 대한 설명으로 가장 옳은 것은?","opts":["현실적 근거가 있는 객관적인 불안이다","성적·공격적 충동을 자아가 적절히 조절하지 못해 벌을 받게 될까 봐 느끼는 불안으로 그 원인을 의식하지 못한다","양심의 두려움으로 초자아로부터 벌의 위협을 받을 때 일어난다","공포증과 동일한 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"신경증적 불안은 성적 충동이나 공격적 충동을 자아가 조절하지 못해 벌을 받게 될까 봐 느끼는 불안으로, 그 원인을 개인이 의식하지 못한다.","src":"L"},{"id":"L06-11","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":111,"stem":"도덕적 불안에 대한 설명으로 옳은 것은?","opts":["현실적 근거가 있는 객관적 불안이다","자아가 초자아로부터 벌의 위협을 받을 때 일어나는 양심의 두려움이다","성적 충동이 억압되어 생기는 불안이다","상태불안과 같은 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"도덕적 불안은 자아가 초자아로부터 벌의 위협을 받을 때 일어나는 정서적 반응으로 양심의 두려움이라 할 수 있다.","src":"L"},{"id":"L06-12","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":112,"stem":"방어기제에 대한 설명으로 가장 옳은 것은?","opts":["현실을 정확히 지각하도록 돕는 의식적 기제이다","현실을 거부·왜곡해 지각함으로써 불안으로부터 자아를 보호하는 무의식적 기제이다","그 자체로 항상 부적응적이다","성숙한 사람에게는 나타나지 않는다"],"ans":[2],"multi":false,"dup":false,"expl":"방어기제는 현실을 거부하거나 왜곡해 지각하게 함으로써 불안으로부터 자아를 보호하는 무의식적 작용이며, 그 자체로 부적응적인 것은 아니다.","src":"L"},{"id":"L06-13","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":113,"stem":"방어기제의 수준별 분류에서 성숙한 수준에 해당하는 것으로 묶인 것은?","opts":["지성화, 억압, 전치","투사, 합리화, 행동화","이타심, 유머, 승화","망상적 투사, 부인, 왜곡"],"ans":[3],"multi":false,"dup":false,"expl":"성숙한 수준의 방어기제는 이타심·유머·승화·억제이고, 신경증적 수준은 지성화·억압·전치·반동 형성, 미성숙 수준은 투사·합리화·수동 공격성·행동화, 정신병적 수준은 망상적 투사·부인·왜곡이다.","src":"L"},{"id":"L06-14","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":114,"stem":"프로이트의 심리성적 발달단계에 대한 설명으로 옳은 것은?","opts":["성적 에너지(libido)가 집중되는 부위의 이동에 따라 단계가 명명된다","단계는 청소년기에 시작되어 성인기에 완성된다","성격의 기본 골격은 성인 초기에 형성된다","각 단계의 명칭은 사회적 관계의 범위에 따라 정해진다"],"ans":[1],"multi":false,"dup":false,"expl":"리비도가 집중되는 신체 부위의 이동에 따라 단계가 명명되며, 출생 후 5년 사이에 성격의 기본 골격이 형성된다.","src":"L"},{"id":"L06-15","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":115,"stem":"구강기(0~1세)의 특징으로 옳지 않은 것은?","opts":["입과 입술이 성감대이다","어머니의 젖을 빪으로써 쾌락욕구와 기아욕구를 만족시킨다","원초아가 발달하는 시기이다","배변훈련을 통해 자아가 발달하는 시기이다"],"ans":[4],"multi":false,"dup":false,"expl":"배변훈련을 통한 자아의 발달은 항문기(2~3세)의 특징이다.","src":"L"},{"id":"L06-16","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":116,"stem":"남근기(4~5세)에 대한 설명으로 가장 옳은 것은?","opts":["초자아가 발달하고 오이디푸스 콤플렉스를 경험하며 성 정체감이 형성된다","리비도가 잠복해 지적 흥미가 증가한다","대소변 억제를 통해 자율성을 획득한다","이성에 대해 성숙한 사랑을 표현하는 시기이다"],"ans":[1],"multi":false,"dup":false,"expl":"남근기는 초자아가 발달하고 오이디푸스 콤플렉스를 경험하며, 동성 부모와의 동일시를 통해 성 정체감이 형성되는 시기다.","src":"L"},{"id":"L06-17","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":117,"stem":"잠재기(6~11세)의 특징으로 옳은 것은?","opts":["리비도 에너지가 잠복해 신체적 관심이 줄고 지적 흥미가 증가한다","성적 에너지가 생식기에 집중된다","원초아가 처음 발달한다","오이디푸스 콤플렉스가 가장 강하게 나타난다"],"ans":[1],"multi":false,"dup":false,"expl":"잠재기는 리비도 에너지가 잠복해 신체적 관심이 감소하고 지적 흥미가 증가하며, 환경 적응 기술 습득과 사회적·도덕적 자아 형성이 이루어지는 시기다.","src":"L"},{"id":"L06-18","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":118,"stem":"볼비의 애착이론에 대한 설명으로 가장 옳은 것은?","opts":["애착은 학습된 반응에 불과하다고 본다","인간은 본질적으로 대상을 추구해 애착을 형성하는 존재이며, 초기 경험이 현재의 인간관계에 영향을 준다","애착은 성인기에 처음 형성된다","애착 형성에서 영아는 수동적 존재일 뿐이다"],"ans":[2],"multi":false,"dup":false,"expl":"애착이론은 볼비가 주장한 대상관계이론의 하나로, 인간이 본질적으로 대상을 추구해 애착을 형성하며 초기 경험에 의해 형성된 이미지를 토대로 현재의 인간관계를 맺어간다고 본다.","src":"L"},{"id":"L06-19","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":119,"stem":"애착 형성 단계에 대한 설명으로 옳지 않은 것은?","opts":["1단계(0~3개월) - 인간에 대한 무분별한 반응","2단계(3~6개월) - 요구에 가장 잘 응해 주는 사람에게 애착 형성","3단계(6개월~3세) - 낯가림이나 분리불안이 표출되기도 함","4단계(3세~아동기 말) - 부모와의 분리를 전혀 허용하지 못함"],"ans":[4],"multi":false,"dup":false,"expl":"4단계에서는 부모와의 격리(분리)가 허용되며, 발달 후기에는 애착 대상으로부터 분리·분화되는 것이 필요하다.","src":"L"},{"id":"L06-20","set":"강의록","year":null,"kind":"강의록","lec":6,"lecName":"개성적 존재로서 인간과 교육(1)","no":120,"stem":"성격의 구조 이론 중 특질이론에 대한 설명으로 가장 옳은 것은?","opts":["여러 상황에서 규칙성과 일관성을 지닌 행동을 나타나게 하는 성향을 다룬다","인간을 외향성-내향성으로만 분류한다","요인분석을 사용하지 않는다","특질은 상황에 따라 완전히 달라진다고 본다"],"ans":[1],"multi":false,"dup":false,"expl":"특질은 여러 상황이나 시기에 걸쳐 규칙성과 일관성을 가진 행동을 나타나게 하는 성향이며, 일반적인 성격검사는 특질이론을 바탕으로 제작된다.","src":"L"},{"id":"L07-01","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":121,"stem":"동기(motivation)에 대한 정의로 가장 옳은 것은?","opts":["유기체의 행동을 활성화하고 행동의 방향을 결정해 주는 힘","행동의 결과로 나타나는 학습의 정도","정서 경험의 생리적 반응","자신의 능력에 대한 자기평가"],"ans":[1],"multi":false,"dup":false,"expl":"동기는 유기체의 행동을 활성화하고 행동의 방향을 결정해 주는 힘으로, 무언가 하고 싶은 마음을 행동으로 나타나게 하는 힘이다.","src":"L"},{"id":"L07-02","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":122,"stem":"머레이(Murray)의 욕구 분류에 대한 설명으로 옳은 것은?","opts":["생리적 욕구는 성취욕구·친애욕구와 같은 2차적 욕구이다","심리적 욕구는 식욕·수면욕과 같은 1차적 욕구이다","성욕은 생리적 욕구이면서 심리적 욕구이기도 하다","머레이는 욕구를 분류하지 않았다"],"ans":[3],"multi":false,"dup":false,"expl":"머레이는 생리적(1차적) 욕구와 심리적(2차적) 욕구를 구분했으며, 성욕은 생리적 욕구이면서 심리적 욕구이기도 하다.","src":"L"},{"id":"L07-03","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":123,"stem":"동기에 대한 정신분석적 접근의 설명으로 가장 옳은 것은?","opts":["인간을 움직이는 힘은 삶의 본능(eros)과 죽음의 본능(thanatos)이다","행동의 원인은 전적으로 외부 환경에 있다","성공과 실패의 귀인 양식이 동기를 결정한다","자기효능감이 동기의 핵심이다"],"ans":[1],"multi":false,"dup":false,"expl":"정신분석적 접근은 갈등의 심리학·무의식의 심리학으로, 인간을 움직이는 힘을 삶의 본능과 죽음의 본능으로 본다.","src":"L"},{"id":"L07-04","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":124,"stem":"동기에 대한 행동주의적 접근의 특징으로 옳은 것은?","opts":["무의식과 내면의 가상적 실체의 존재를 인정한다","행동의 원인을 내면에서 찾는다","내면의 가상적 실체를 인정하지 않고 행동의 원인을 외부에서 찾는다","귀인 양식에 주목한다"],"ans":[3],"multi":false,"dup":false,"expl":"행동주의적 접근은 자아·무의식·욕구 같은 내면의 가상적 실체를 인정하지 않고 행동의 원인을 외부에서 찾으며, 홀은 행동이 동인·유인·습관 강도의 상승작용으로 결정된다고 보았다.","src":"L"},{"id":"L07-05","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":125,"stem":"동기에 대한 인지주의적 접근에서 동기를 향상시키는 귀인으로 가장 옳은 것은?","opts":["외적·안정적·통제 불가능한 요인","내적·통제 가능·불안정적 요인","외적·불안정적·통제 불가능한 요인","내적·안정적·통제 불가능한 요인"],"ans":[2],"multi":false,"dup":false,"expl":"귀인론은 원인을 내적-외적, 안정적-불안정적, 통제 가능-불가능 차원으로 나누며, 내적·통제 가능·불안정적 요인(노력 등)에 귀인할 때 동기가 향상된다.","src":"L"},{"id":"L07-06","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":126,"stem":"반두라의 사회학습이론적 동기 접근에서 동기에 영향을 주는 핵심 개념은?","opts":["자기효능감","무의식적 본능","귀인 양식","생리적 욕구"],"ans":[1],"multi":false,"dup":false,"expl":"사회학습이론적 접근은 적극적인 목표 설정과 자기효능감에 의해 영향 받는 행동 결과에 관한 사고와 심상을 중시한다.","src":"L"},{"id":"L07-07","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":127,"stem":"인본주의 심리학(제3세력의 심리학)에 대한 설명으로 옳지 않은 것은?","opts":["개인의 자기 인식과 자유의지가 행동을 결정하는 중요한 요소라고 본다","실존주의 인간관을 바탕으로 한다","정신분석과 행동주의에 대한 대안으로 등장했다","인간행동을 무의식적 본능과 외부 자극으로만 설명한다"],"ans":[4],"multi":false,"dup":false,"expl":"인본주의 심리학은 정신분석과 행동주의의 대안으로, 자기 인식과 자유의지, 실존주의 인간관을 중시한다.","src":"L"},{"id":"L07-08","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":128,"stem":"매슬로의 욕구위계이론에서 결핍욕구에 해당하는 것으로 묶인 것은?","opts":["생리적 욕구, 안전 욕구, 소속·인정·사랑 욕구, 자존 욕구","지적 욕구, 심미적 욕구, 자아실현 욕구","자아실현 욕구만","안전 욕구와 자아실현 욕구"],"ans":[1],"multi":false,"dup":false,"expl":"생리적·안전·소속과 사랑·자존 욕구는 결핍욕구(D-욕구)이고, 그 위의 지적·심미적·자아실현 욕구는 성장욕구(B-욕구)다.","src":"L"},{"id":"L07-09","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":129,"stem":"정서 관련 용어의 연결로 옳지 않은 것은?","opts":["emotion - 정서를 넓게 통칭하는 말","affect - 생리적 변화를 동반하는 일시적이고 급격한 감정","mood - 생활에 지속적으로 영향을 미치는 감정","feeling - 무의식적 본능적 충동"],"ans":[4],"multi":false,"dup":false,"expl":"feeling은 인지적 감정 상태를 뜻하며, 무의식적 본능적 충동과는 다르다.","src":"L"},{"id":"L07-10","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":130,"stem":"정서의 3요소로 바르게 묶인 것은?","opts":["생리적 요소, 상황적 요소, 인지적 요소","동기, 욕구, 추동","원초아, 자아, 초자아","감각, 지각, 기억"],"ans":[1],"multi":false,"dup":false,"expl":"어떤 감정을 느끼는 것은 생리적·상황적·인지적 세 요소가 복합적으로 작용한 결과다.","src":"L"},{"id":"L07-11","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":131,"stem":"정서와 관련된 뇌 구조로 강의록이 제시한 것은?","opts":["해마","편도체","연수","뇌량"],"ans":[2],"multi":false,"dup":false,"expl":"변연계의 일부인 편도체는 정서 및 공격성과 관련이 있는 것으로 알려져 있다.","src":"L"},{"id":"L07-12","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":132,"stem":"자율신경계에 대한 설명으로 가장 옳은 것은?","opts":["팔이나 다리 근육처럼 의도적으로 조절할 수 있는 기관을 관장한다","인위적 의도로 조절할 수 없는 신체 내부 기관을 관장하며 정서 경험과 밀접히 관련된다","교감신경계만으로 구성된다","정서와는 무관하게 소화만 담당한다"],"ans":[2],"multi":false,"dup":false,"expl":"자율신경계는 인위적 의도로 조절할 수 없는 신체 내부 기관을 관장하며 정서 경험과 반드시 관련된다.","src":"L"},{"id":"L07-13","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":133,"stem":"교감신경계의 작용으로 옳은 것은?","opts":["심박·호흡을 이완시키고 소화를 촉진한다","위험·스트레스 상황에서 활성화되어 심박·호흡 증가, 동공 확대, 소화 억제를 일으킨다","보호·영양 공급·성장에 관한 기능을 조절한다","심리적 안정과 휴식을 담당한다"],"ans":[2],"multi":false,"dup":false,"expl":"교감신경계는 위험·스트레스 상황에서 활성화되어 격렬한 활동에 대비시키며 심박·호흡 증가, 동공 확대, 소화 억제를 일으킨다.","src":"L"},{"id":"L07-14","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":134,"stem":"정서 관련 신경전달물질에 대한 설명으로 옳지 않은 것은?","opts":["도파민은 쾌락·즐거움의 정서와 관련된다","세로토닌 수준이 낮으면 공격적 행동과 불안 반응이 나타난다","신경전달물질은 시냅스에서 방출되는 화학물질이다","세로토닌은 부신에서 분비되어 싸움-도망 반응을 준비시킨다"],"ans":[4],"multi":false,"dup":false,"expl":"부신에서 분비되어 싸움-도망 반응을 준비시키는 것은 호르몬인 코르티솔이다.","src":"L"},{"id":"L07-15","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":135,"stem":"부신과 코르티솔에 대한 설명으로 가장 옳은 것은?","opts":["부신은 뇌 안에 위치한 신경절이다","부신은 콩팥 위에 붙은 내분비 기관으로 위급·스트레스 상황에서 코르티솔을 분비한다","코르티솔은 소화를 촉진하는 소화 효소이다","코르티솔은 세로토닌의 일종이다"],"ans":[2],"multi":false,"dup":false,"expl":"부신은 콩팥 바로 위에 붙어 있는 내분비 기관으로, 위급·스트레스 상황에서 싸움 또는 도망하도록 준비시키는 코르티솔을 분비한다.","src":"L"},{"id":"L07-16","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":136,"stem":"정서 분류에서 동양의 7정(七情)에 해당하지 않는 것은?","opts":["희(喜)","노(怒)","애(愛)","욕(欲)"],"ans":[3],"multi":false,"dup":false,"expl":"7정은 희·노·애(哀)·구·오·욕 등이며, 애(愛)는 플루칙의 서양 분류에 해당한다.","src":"L"},{"id":"L07-17","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":137,"stem":"안면 피드백 가설에 대한 설명으로 가장 옳은 것은?","opts":["정서 경험의 결과로 얼굴표정이 변화한다","얼굴표정의 변화를 지각한 결과로 정서를 경험한다","신체 반응과 정서 경험은 항상 무관하다","인지적 해석은 정서와 무관하다"],"ans":[2],"multi":false,"dup":false,"expl":"안면 피드백 가설은 정서 경험의 결과 얼굴표정이 변하는 것이 아니라, 얼굴표정 변화를 지각한 결과 정서를 경험한다고 본다.","src":"L"},{"id":"L07-18","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":138,"stem":"같은 생리적 각성 상태가 상황에 따라 다른 정서로 경험되는 이유를 설명하는 관점은?","opts":["신체 반응이 정서보다 앞선다는 관점","인지적 해석이 정서 경험의 내용에 영향을 준다는 관점","정서는 유전적으로 결정된다는 관점","정서는 학습될 수 없다는 관점"],"ans":[2],"multi":false,"dup":false,"expl":"제임스의 이론처럼 자신의 신체적 반응에 어떤 인지적 해석을 내리느냐가 정서 경험의 내용에 영향을 주며, 주변 상황에 대한 정보에 따라 같은 각성이 행복 또는 불쾌로 다르게 체험된다.","src":"L"},{"id":"L07-19","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":139,"stem":"로저스가 말한 실제적 자아와 이상적 자아에 대한 설명으로 옳은 것은?","opts":["두 자아의 괴리가 클수록 심리적으로 건강하다","두 자아 사이의 괴리가 클수록 병이 생기며, 괴리를 줄이는 것이 중요하다","이상적 자아는 타인이 요구하는 자아이다","실제적 자아는 되고 싶은 자아이다"],"ans":[2],"multi":false,"dup":false,"expl":"로저스는 현실의 나(real self)와 이상적인 나(ideal self)의 괴리가 클수록 병이 생긴다고 보았으며, 실제적 자아 수준을 높이거나 이상적 자아 수준을 조정해 괴리를 줄일 수 있다.","src":"L"},{"id":"L07-20","set":"강의록","year":null,"kind":"강의록","lec":7,"lecName":"개성적 존재로서 인간과 교육(2)","no":140,"stem":"자아개념에 대한 설명으로 옳지 않은 것은?","opts":["자아개념은 나에 대해 내가 가지고 있는 생각이다","학문적 자아개념은 학업성취와 높은 상관을 가진다","긍정적 자아개념을 가질수록 높은 성취를 보일 가능성이 많다","자아개념은 신체적 자아개념 하나로만 구성된다"],"ans":[4],"multi":false,"dup":false,"expl":"자아개념은 신체적·운동 기능적·사회적·도덕적·예술적·학문적 자아개념 등 여러 영역으로 구성된다.","src":"L"},{"id":"L08-01","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":141,"stem":"사회화에 대한 정의로 가장 옳은 것은?","opts":["개인이 속한 사회의 문화를 내면화해 그 사회 구성원으로 요구되는 가치관·태도·신념·행동을 갖추는 과정","개인의 타고난 기질을 그대로 발현하는 과정","사회의 문화를 개인이 새로 창조해 내는 과정","생물학적 성숙만을 의미하는 과정"],"ans":[1],"multi":false,"dup":false,"expl":"사회화는 개인이 속한 사회의 문화를 내면화함으로써 그 사회의 구성원으로서 요구되는 자질, 즉 가치관·태도·신념·행동 등을 갖추는 과정이다.","src":"L"},{"id":"L08-02","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":142,"stem":"개인과 사회의 조화를 위해 개인이 갖추어야 할 특성으로 강의록이 든 것으로 옳지 않은 것은?","opts":["친사회적 이타 행동","유연한 성역할 개념","자기통제력과 도덕성","고정적이고 경직된 성역할 개념"],"ans":[4],"multi":false,"dup":false,"expl":"현대사회에서는 지나치게 고정적인 성역할 개념을 갖는 것이 바람직하지 않으며, 유연한 성역할 개념이 필요하다.","src":"L"},{"id":"L08-03","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":143,"stem":"이타성(altruism)의 의미로 가장 옳은 것은?","opts":["타인을 이용해 자신의 이익을 얻으려는 심리적 특성","타인의 행복과 이익에 관심을 갖고 배려하는 심리적 특성","사회의 규범을 거부하는 심리적 특성","자신의 감정을 억제하는 심리적 특성"],"ans":[2],"multi":false,"dup":false,"expl":"이타성은 타인의 행복과 이익에 관심을 갖고 배려하는 심리적 특성이며, 이것이 행동으로 나타난 것이 친사회적 행동(나누기·돕기·위로하기·협조하기 등)이다.","src":"L"},{"id":"L08-04","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":144,"stem":"아들러가 ‘심리적 건강의 척도’라고 부른 개념으로 옳은 것은?","opts":["자아효능감","사회적 관심","자기통제력","조망수용능력"],"ans":[2],"multi":false,"dup":false,"expl":"이상적인 공동사회의 목표를 달성하고자 타인과 협조·협력하고 봉사하는 것, 즉 사회적 관심을 아들러는 심리적 건강의 척도라고 보았다.","src":"L"},{"id":"L08-05","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":145,"stem":"친사회적 행동의 발달에 대한 설명으로 가장 옳은 것은?","opts":["연령이 증가할수록 친사회적 행동은 감소한다","친사회적 행동은 인간의 본성이며 연령의 증가에 따라 증가하는 경향이 있다","친사회적 행동은 학습되지 않는다","친사회적 행동은 성인기에 처음 나타난다"],"ans":[2],"multi":false,"dup":false,"expl":"친사회적 행동은 인간의 본성이며, 아동이 성장하며 협조의 가치와 방법을 이해하는 인지능력이 발달하기 때문에 연령 증가에 따라 증가하는 경향이 있다.","src":"L"},{"id":"L08-06","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":146,"stem":"친사회적 행동의 촉진요인으로 강의록이 든 것으로 옳지 않은 것은?","opts":["조망수용능력","공감","강화와 모방","공격성"],"ans":[4],"multi":false,"dup":false,"expl":"촉진요인은 조망수용능력, 공감, 강화, 모방 등이며 공격성은 친사회적 행동과 반대된다.","src":"L"},{"id":"L08-07","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":147,"stem":"물리적 조망수용능력과 사회적 조망수용능력에 대한 설명으로 옳은 것은?","opts":["물리적 조망수용능력은 타인의 생각과 감정을 이해하는 능력이다","사회적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이다","물리적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이고, 사회적 조망수용능력은 타인의 생각과 감정을 타인 입장에서 이해하는 능력이다","두 능력은 같은 개념이다"],"ans":[3],"multi":false,"dup":false,"expl":"물리적 조망수용능력은 물체를 다른 방향에서 파악하는 능력이고, 사회적 조망수용능력은 타인의 생각과 감정을 타인의 입장에서 식별·이해하는 능력이다.","src":"L"},{"id":"L08-08","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":148,"stem":"공감에 대한 설명으로 가장 옳은 것은?","opts":["타인의 위치에서 현상을 이해하는 인지적 능력만을 뜻한다","타인의 감정을 식별·이해할 뿐 아니라 같이 경험하고 느끼는 능력이다","공격성을 높이는 요인이다","조망수용능력보다 낮은 차원의 경험이다"],"ans":[2],"multi":false,"dup":false,"expl":"공감은 사회적 조망수용능력보다 한 차원 높은 경험으로, 타인의 감정을 식별·이해할 뿐 아니라 같이 경험하고 느끼는 능력이다.","src":"L"},{"id":"L08-09","set":"강의록","year":null,"kind":"강의록","lec":8,"lecName":"사회적 존재로서 인간과 교육(1)","no":149,"stem":"성차와 성역할에 대한 설명으로 옳지 않은 것은?","opts":["여성과 남성은 생물학적으로 차이가 있을 뿐 모두 존중받아야 할 인간이다","생물학적 차이를 바탕으로 경험하는 사회문화적 영향은 후천적 차이를 만든다","성역 활동으로서 생활지도(2)","no":259,"stem":"부모상담의 기초 원리와 방법으로 옳지 않은 것은?","opts":["교사와 부모 간에 마음이 소통하는 대화가 중요하다","가정에서 자녀를 교육하는 것은 부모라는 점을 교사가 명확히 인식해야 한다","강제적으로 이루어지면 성공을 거두기 어렵다","부모의 의사와 무관하게 교사가 해결방법을 정해 통보한다"],"ans":[4],"multi":false,"dup":false,"expl":"부모상담은 부모가 은연중에 제안한 해결방법을 지지하고 2~3가지 대안을 제시해 부모가 선택하도록 하는 등 자발성을 존중해야 한다.","src":"L"},{"id":"L13-20","set":"강의록","year":null,"kind":"강의록","lec":13,"lecName":"실천적 교육활동으로서 생활지도(2)","no":260,"stem":"집단상담에 적합한 내담자로 강의록이 든 것으로 옳은 것은?","opts":["문제가 위급한 내담자","신상 보호가 필요한 내담자","다른 사람들이 자기를 어떻게 보고 있는지 알고 싶어 하는 내담자","집단에서 발언하는 것을 두려워하는 내담자"],"ans":[3],"multi":false,"dup":false,"expl":"집단상담은 여러 사람을 이해할 필요가 있거나, 타인이 자기를 어떻게 보는지 알고 싶어 하거나, 사회적 기술 습득이 필요한 내담자에게 적합하다.","src":"L"},{"id":"L14-01","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":261,"stem":"상담과 생활지도의 관계에 대한 설명으로 가장 옳은 것은?","opts":["상담이 생활지도를 포함하는 상위 개념이다","상담은 생활지도를 구성하는 하나의 하위 활동이다","상담과 생활지도는 완전히 무관하다","생활지도는 상담의 한 기법이다"],"ans":[2],"multi":false,"dup":false,"expl":"상담은 생활지도를 구성하는 하나의 하위 활동이며, 생활지도의 주요 활동에는 학생이해(심리검사 활용), 진로지도, 정보제공, 상담, 자문, 조정 등이 있다.","src":"L"},{"id":"L14-02","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":262,"stem":"상담목표의 기능에 대한 설명으로 가장 옳은 것은?","opts":["상담의 진행과정과 종결 시점을 판단하는 기준이 되고 방향을 제시한다","상담이 끝난 뒤에만 설정된다","상담자의 편의에 따라 수시로 바뀐다","상담의 효과 평가와는 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"상담목표는 형성평가·총괄평가의 기준이 되고 상담자와 내담자가 나아갈 방향을 제시하며, 개입 전략과 절차에 선행하는 중요한 부분이다.","src":"L"},{"id":"L14-03","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":263,"stem":"상담이론별 상담목표의 연결로 옳지 않은 것은?","opts":["정신분석이론 - 무의식을 의식화해 성격 구조를 수정하고 자아 기능을 강화","행동수정이론 - 바람직하지 않은 행동은 감소시키고 바람직한 행동은 증가","인간중심 상담이론 - 자아와 경험의 불일치를 제거하고 충분히 기능하는 사람이 되도록 도움","인지상담이론 - 무의식적 갈등을 자유연상으로 정화"],"ans":[4],"multi":false,"dup":false,"expl":"인지상담이론의 목표는 자동적 사고를 변화시키고 인지 도식을 재구성해 새롭고 합리적인 사고를 하도록 하는 것이며, 자유연상은 정신분석의 기법이다.","src":"L"},{"id":"L14-04","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName" 의식적 행동이다.","src":"L"},{"id":"L14-14","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":274,"stem":"꿈의 분석에 대한 설명으로 옳은 것은?","opts":["수면 중에는 방어가 강화되어 꿈에 무의식이 나타나지 않는다","수면 중 방어가 약화되어 억압된 욕구와 감정이 꿈속에 표출되므로 상징적 의미를 분석한다","꿈은 의식적 사고의 직접적 표현이다","꿈의 분석은 행동수정이론의 기법이다"],"ans":[2],"multi":false,"dup":false,"expl":"수면 중에는 방어가 약화되어 억압된 욕구와 감정이 꿈속에 표출되므로, 꿈에 나타난 상징적 의미를 분석해 무의식적 동기에 대한 통찰을 돕는다.","src":"L"},{"id":"L14-15","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":275,"stem":"해석(interpretation)에 대한 설명으로 옳지 않은 것은?","opts":["자유연상·꿈·저항·전이를 분석해 그 의미를 내담자에게 지적·설명하는 절차이다","내담자가 아직 깨닫지 못했더라도 견뎌낼 수 있다고 판단될 때 해석한다","내용에 대한 해석보다 저항에 대한 해석이 우선되어야 한다","해석은 표면적인 것부터 시작하지 않고 곧바로 가장 깊은 층을 다룬다"],"ans":[4],"multi":false,"dup":false,"expl":"해석은 표면적인 것에서 시작해 점점 깊이 다가가도록 해야 하며, 저항에 대한 해석이 내용 해석에 우선한다.","src":"L"},{"id":"L14-16","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":276,"stem":"인간중심 상담이론의 철학적 배경으로 가장 옳은 것은?","opts":["행동주의 철학","실존주의 철학과 현상학적 관점","정신분석적 결정론","구조주의 언어학"],"ans":[1],"multi":false,"dup":false,"expl":"인간중심 상담이론은 로저스가 창시했으며 실존주의 철학을 근거로 발달했고, 개인의 주관적 경험과 내적 참조체계를 이해하려는 현상학적 관점을 취한다.","src":"L"},{"id":"L14-17","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":277,"stem":"로저스의 인간관에 대한 설명으로 가장 옳은 것은?","opts":["인간은 무의식적 본능에 의해 결정되는 존재이다","인간은 기본적으로 자유롭고 자신의 행동에 책임을 지며 합리적·건설적인 방향으로 성장하는 미래지향적 존재이다","인간은 환경에 수동적으로 반응하는 존재이다","인간은 선천적 잠재력을 발휘할 수 없다"],"ans":[2],"multi":false,"dup":false,"expl":"로저스는 인간을 기본적으로 자유롭고 책임을 지며 유목적적이고 합리적·건설적인 방향으로 성장하는 미래지향적 존재로 보았고, 조건이 갖추어지면 무한한 성장이 가능하다고 보았다.","src":"L"},{"id":"L14-18","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":278,"stem":"로저스의 ‘현상적 장’에 대한 설명으로 가장 옳은 것은?","opts":["객관적으로 측정 가능한 외부 환경 그 자체를 의미한다","특정 순간에 개인이 지각하고 경험하는 모든 것으로, 개인적 현실을 의미한다","무의식에 저장된 과거 경험의 총체이다","상담자가 설정한 치료적 환경이다"],"ans":[2],"multi":false,"dup":false,"expl":"현상적 장은 경험적 세계 또는 주관적 경험으로도 불리며, 특정 순간에 개인이 지각하고 경험하는 모든 것을 의미한다. 로저스는 개인적 현실인 현상적 장만이 존재한다고 보았다.","src":"L"},{"id":"L14-19","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":279,"stem":"프로이트와 로저스의 인간행동 결정 요인에 대한 관점 차이로 옳은 것은?","opts":["프로이트는 과거 경험이 행동을 결정한다고 보고, 로저스는 과거 그 자체가 아니라 과거에 대한 현재의 해석이 행동을 결정한다고 본다","프로이트는 현재의 해석을, 로저스는 과거 경험을 중시한다","두 사람 모두 무의식을 중시한다","두 사람 모두 행동을 환경의 산물로만 본다"],"ans":[1],"multi":false,"dup":false,"expl":"프로이트는 과거 경험이 인간행동을 결정하는 요인이라고 보았고, 로저스는 현재 행동을 결정하는 것은 과거 자체가 아니라 과거에 대한 각 개인의 현재 해석이라고 보았다.","src":"L"},{"id":"L14-20","set":"강의록","year":null,"kind":"강의록","lec":14,"lecName":"상담: 생활지도의 중추적 활동(1)","no":280,"stem":"로저스의 자아개념과 방어기제에 대한 설명으로 옳지 않은 것은?","opts":["현실 자아는 현재 자신의 모습에 대한 인식이고 이상적 자아는 되고자 하는 자신에 대한 인식이다","현재 경험이 자아 구조와 불일치할 때 불안을 경험한다","인지적 왜곡과 부인은 자아가 사용하는 기본적 방어기제이다","부인은 받아들이기 어려운 경험을 자아상과 일치하는 형태로 변형하는 것이다"],"ans":[4],"multi":false,"dup":false,"expl":"받아들이기 어려운 경험을 자아상과 일치하는 형태로 변형하는 것은 인지적 왜곡이며, 부인은 자아개념과 일치하지 않는 경험이 존재한다는 사실을 완전히 무시하는 것이다.","src":"L"},{"id":"L15-01","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":281,"stem":"인지중심 상담에서 인지·정서·행동의 관계를 보는 관점으로 가장 옳은 것은?","opts":["인지, 정서, 행동은 서로 무관한 별개의 실체다","인지, 정서, 행동은 얽혀 있는 복합체이며 그중 인지가 다른 두 특성에 선행한다","정서가 인지와 행동에 선행한다","행동이 인지와 정서를 결정한다"],"ans":[2],"multi":false,"dup":false,"expl":"인지중심 상담은 인지·정서·행동이 함께 얽힌 복합체이며 그중 ‘인지’가 다른 두 특성에 선행한다는 관점을 취한다.","src":"L"},{"id":"L15-02","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":282,"stem":"개인의 내면화된 자기-대화(self-talk)에 대한 설명으로 가장 옳은 것은?","opts":["자기-대화의 내용이 비합리적이면 적응에 장애가 생기고, 합리적이면 행복한 삶을 영위할 수 있다","자기-대화는 의식되지 않으므로 변화시킬 수 없다","자기-대화는 정서와 무관하다","자기-대화는 타인의 평가에 의해서만 형성된다"],"ans":[1],"multi":false,"dup":false,"expl":"인지는 사고·신념·태도·의견·철학의 형태로 내면화된 자기-대화 방식으로 전개되며, 그 내용이 비합리적이면 적응 장애가, 합리적이면 행복한 삶이 가능하다.","src":"L"},{"id":"L15-03","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":283,"stem":"엘리스(Ellis)와 벡(Beck)의 공통된 주장으로 가장 옳은 것은?","opts":["동일한 사건을 겪어도 그 사건을 어떤 생각으로 받아들이느냐에 따라 영향이 다르다","무의식적 갈등이 정서 장애의 원인이다","행동의 결과가 행동을 결정한다","인간은 선천적으로 비합리적이다"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스와 벡은 모두 동일한 사건을 겪더라도 그 사건에 대한 해석, 즉 어떤 생각으로 받아들이느냐에 따라 개인에게 미치는 영향이 다르다고 주장했다.","src":"L"},{"id":"L15-04","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":284,"stem":"켈리(Kelly)의 개인적 구성개념(personal construct)에 대한 설명으로 가장 옳은 것은?","opts":["인간은 세상을 바라보는 자신만의 눈을 가지고 있으며, 그것이 현실 이해에 부적합해도 고집하면 문제가 생긴다","인간은 세상을 객관적으로만 바라본다","구성개념은 학습되지 않는 선천적 요소이다","구성개념은 정서와 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"켈리는 인간이 세상을 바라보는 자신만의 눈(개인적 구성개념)을 가지고 있으며, 그것이 현실을 이해·설명·예측하는 데 적합하지 않는데도 고집하면 문제가 생긴다고 보았다.","src":"L"},{"id":"L15-05","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":285,"stem":"엘리스의 합리·정서·행동치료(REBT)의 변천 순서로 옳은 것은?","opts":["합리 치료(RT) → 합리·정서 치료(RET) → 합리·정서·행동치료(REBT)","합리·정서·행동치료 → 합리 치료 → 합리·정서 치료","합리·정서 치료 → 합리·정서·행동치료 → 합리 치료","정신분석 → 합리·정서·행동치료 → 합리 치료"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스는 합리 치료(1955) → 합리·정서 치료(1961) → 합리·정서·행동치료(1993)로 이론을 발전시켰다.","src":"L"},{"id":"L15-06","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":286,"stem":"엘리스 이론의 사상적 배경으로 가장 옳은 것은?","opts":["그리스 스토아 학파의 “사람을 혼란스럽게 하는 것은 사건이 아니라 사건에 대한 판단이다”","행동주의의 자극-반응 이론","정신분석의 무의식 이론","형태주의의 통찰 이론"],"ans":[1],"multi":false,"dup":false,"expl":"엘리스의 이론은 개인의 주관적 생각과 판단을 강조하는 현상학적 관점과 맥을 같이하며, 그리스 스토아 학파의 “사람의 마음을 혼란스럽게 하는 것은 사건 자체가 아니라 사건에 대한 판단”이라는 사상에 바탕을 둔다.","src":"L"},{"id":"L15-07","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":287,"stem":"엘리스의 인간관에 대한 설명으로 옳지 않은 것은?","opts":["인간은 합리적 사고와 비합리적 사고를 모두 가질 수 있는 존재이다","인간은 자기와 대화하고 자기를 평가하며 자기를 유지할 수 있는 존재이다","인간은 자신의 한계를 이해하고 기본 관점과 가치를 변화시킬 능력을 지닌다","인간은 비합리적 신념을 바꿀 수 없는 존재이다"],"ans":[4],"multi":false,"dup":false,"expl":"엘리스는 인간이 자신의 한계를 이해할 수 있는 힘과, 아동기에 주입된 기본 관점과 가치를 변화시킬 능력, 자기 패배적 경향에 도전할 능력을 갖고 있다고 보았다.","src":"L"},{"id":"L15-08","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":288,"stem":"엘리스의 A-B-C 모형에 대한 설명으로 가장 옳은 것은?","opts":["선행 사건(A)이 정서적·행동적 결과(C)를 직접 일으킨다","신념체제(B)가 정서적·행동적 결과(C)의 진정한 원인이다","결과(C)가 신념(B)을 결정한다","A와 B는 같은 개념이다"],"ans":[2],"multi":false,"dup":false,"expl":"A-B-C 모형은 선행 사건(A)이 결과(C)를 직접 일으키는 것이 아니라 그 사람의 신념체제(B)가 C의 진정한 원인이라는 것이 요체다.","src":"L"},{"id":"L15-09","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":289,"stem":"엘리스가 말한 비합리적 신념의 예로 옳지 않은 것은?","opts":["중요한 타인으로부터 사랑받고 인정받는 것은 절대적으로 중요한 일이다","모든 영역에서 빈틈없이 유능하고 성공해야 가치 있는 사람이다","어떤 일이 원하는 대로 되지 않으면 끔찍한 일이다","일이 뜻대로 되지 않을 때도 인내하며 대안을 찾을 수 있다"],"ans":[4],"multi":false,"dup":false,"expl":"인내하며 대안을 찾는 것은 합리적 신념이며, 나머지는 절대적 당위·파국적 사고 등 비합리적 신념의 예다.","src":"L"},{"id":"L15-10","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":290,"stem":"비합리적 신념의 유형으로 강의록이 든 것으로 옳지 않은 것은?","opts":["절대적 당위의 사고 - “~해야만 한다”","파국적 사고 - “~하면 큰일난다”","자기 및 타인 비하","현실적 수용과 인내"],"ans":[4],"multi":false,"dup":false,"expl":"비합리적 신념의 유형은 절대적 당위 사고, 파국적 사고, 자기 및 타인 비하, 좌절에 대한 인내심 부족이다.","src":"L"},{"id":"L15-11","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":291,"stem":"엘리스가 제시한 정신건강의 기준으로 옳지 않은 것은?","opts":["자기 관심과 자기 지향","사회적 관심과 관용·융통성","위험 감수와 불확실성의 수용","완벽한 유토피아의 실현 추구"],"ans":[4],"multi":false,"dup":false,"expl":"엘리스의 정신건강 기준에는 자기 관심·자기 지향·자기 수용, 사회적 관심, 관용과 융통성, 몰입, 과학적 사고, 위험 감수, 불확실성의 수용, 탈유토피아주의가 포함된다.","src":"L"},{"id":"L15-12","set":"강의록","year":null,"kind":"강의록","lec":15,"lecName":"상담: 생활지도의 중추적 활동(2)","no":292,"stem":"합리·정서·행동치료(REBT)의 상담 과정에 대한 설명으로 가장 옳은 것은?","opts":["상담자는 내담자를 평가하고 판단하며 훈계한다","상담자는 내담자를 한 인간으로서 완전하게 수용하면서 비합리적 사고와 자기 파괴적 행동에 도전하게 한다","내담자의 비합리적 신념은 그대로 두고 행동만 바꾼다","개인적 온정을 최대한 제공하는 것이 핵심이다"],"ans":[2],"multi":false,"dup":false,"expl":"REBT는 내담자가 자기 경멸을 하지 않도록 돕는 것을 기본 생각으로 하며, 내담자를 평가하지 않고 완전히 수용하면서 비합리적 사고와 자기 파괴적 행동에 도전하게 하고 개인적 온정보다 객관적 기법을 사용한다.","src":"L"},{"id":"L15-13","set":"강의록","year /* ---------- 선지 순서 섞기 ---------- */
var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
function identityPerm(n){ var a = []; for(var i=0;i<n;i++) a.push(i); return a; }
function makePerm(n){ return state.optShuffle ? shuffled(identityPerm(n)) : identityPerm(n); }
/* 해설 속 ①~④ 표기를 섞인 순서에 맞게 다시 매핑 (숫자 읽는 소리에 맞춰 조사도 정리) */
function remapExpl(expl, perm){
  if(!expl) return '';
  var toDisp = {};
  for(var i=0;i<perm.length;i++){ toDisp[perm[i]+1] = i+1; }
  var out = expl.replace(/[①②③④⑤]/g, function(ch){
    var n = CIRC.indexOf(ch)+1;
    return toDisp[n] ? CIRC[toDisp[n]-1] : ch;
  });
  var WITH = {은:1, 이:1, 을:1, 과:1};      // 받침 있는 소리(일·삼)
  var WITHOUT = {는:1, 가:1, 를:1, 와:1};   // 받침 없는 소리(이·사·오)
  var toWith = {는:'은', 가:'이', 를:'을', 와:'과'};
  var toWithout = {은:'는', 이:'가', 을:'를', 과:'와'};
  return out.replace(/([①②③④⑤])(은|는|이|가|을|를|과|와)/g, function(m, num, josa){
    var noBatchim = (num === '②' || num === '④' || num === '⑤');
    if(noBatchim && WITH[josa]) return num + toWithout[josa];   // 은→는, 이→가 ...
    if(!noBatchim && WITHOUT[josa]) return num + toWith[josa];  // 는→은, 가→이 ...
    return m;
  });
}
/* perm: 화면 순서 -> 원본 인덱스(0부터). 없으면 원본 순서 그대로 */
function viewOf(q, perm){
  if(!perm || perm.length !== q.opts.length) perm = identityPerm(q.opts.length);
  var toDisp = {};
  perm.forEach(function(o, i){ toDisp[o+1] = i+1; });
  return {
    opts: perm.map(function(o){ return q.opts[o]; }),
    ans: q.ans.map(function(n){ return toDisp[n] || n; }).sort(function(a,b){ return a-b; }),
    perm: perm,
    expl: remapExpl(q.expl, perm)
  };
}

function normStem(s){ return s.replace(/[^가-힣A-Za-z0-9]/g,'').slice(0,40); }

function scopeListRaw(scope){
  if(scope === 'all') return DATA.slice();
  if(scope === '기말') return DATA.filter(function(q){ return q.kind==='기말'; });
  if(scope === '출석') return DATA.filter(function(q){ return q.kind==='출석대체'; });
  if(scope === 'wrong') return Object.keys(wrongNote).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope === 'book') return Object.keys(bookmarks).map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if(scope.indexOf('set:') === 0) return DATA.filter(function(q){ return q.set === scope.slice(4); });

  return DATA.slice();
}
function scopeList(scope){ return scopeListRaw(scope).filter(srcOk).filter(function(q){ return !isHidden(q.id); }); }

function dedupeList(list){
  var seen = {};
  return list.filter(function(q){ var k = normStem(q.stem); if(seen[k]) return false; seen[k] = 1; return true; });
}
/* 기출:강의록 = 80:20 으로 맞춘 구성 계산 */
function planMix(limit, baseN, lecAvail){
  var lecCap = (typeof lecAvail === 'number') ? lecAvail : LEC_COUNT;
  var gin, lecN;
  if(baseN <= 0){
    lecN = Math.min(limit > 0 ? limit : lecCap, lecCap);
    return {gin: 0, lec: lecN, total: lecN};
  }
  if(limit > 0){ lecN = Math.max(1, Math.round(limit * 0.2)); gin = limit - lecN; }
  else { gin = baseN; lecN = Math.round(baseN * 0.25); }
  if(gin > baseN){ lecN += gin - baseN; gin = baseN; }
  lecN = Math.min(lecN, lecCap);
  return {gin: gin, lec: lecN, total: gin + lecN};
}
function planPreview(){
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    return planMix(state.limit, examPool(state.scope).length, lecturePool().length);
  }
  var n = scopeList(state.scope).length;
  var t = (state.limit && n > state.limit) ? state.limit : n;
  return state.bank === 'lecture' ? {gin:0, lec:t, total:t} : {gin:t, lec:0, total:t};
}
function buildPool(){
  /* 출제 문항 선택은 항상 전체 후보를 무작위로 섞은 뒤 한다 (특정 연도·강에 치우치지 않도록) */
  if(state.bank === 'mixed' && state.scope !== 'wrong' && state.scope !== 'book'){
    var base = examPool(state.scope);
    if(state.dedupe) base = dedupeList(base);
    var lecList = lecturePool();
    base = shuffled(base);
    lecList = shuffled(lecList);
    var plan = planMix(state.limit, base.length, lecList.length);
    var sel = base.slice(0, plan.gin).concat(lecList.slice(0, plan.lec));
    var ids = sel.map(function(q){ return q.id; });
    return state.shuffle ? shuffled(ids) : canonSort(ids);
  }
  var list = scopeList(state.scope);
  if(state.dedupe) list = dedupeList(list);
  var pool = shuffled(list);
  if(state.limit && pool.length > state.limit) pool = pool.slice(0, state.limit);
  var out = pool.map(function(q){ return q.id; });
  return state.shuffle ? out : canonSort(out);
}
function poolLabel(pool){
  var lec = 0;
  pool.forEach(function(id){ var q = BY_ID[id]; if(q && q.src === 'L') lec++; });
  var gin = pool.length - lec;
  if(gin && lec) return '기출 ' + gin + ' + 강의록 ' + lec;
  return lec ? '강의록만' : '기출만';
}

function startQuiz(pool, label){
  var maps = {};
  pool.forEach(function(id){ var q = BY_ID[id]; if(q) maps[id] = makePerm(q.opts.length); });
  quiz = {
    pool: pool, i: 0, picks: {}, revealed: {}, finished: false, maps: maps,
    mode: state.mode, startAt: Date.now(),
    label: label || (scopeLabelText(state.scope) + ' · ' + poolLabel(pool))
  };
  renderQuiz();
}

/* pick은 화면에 보인 번호(1~4)이므로 섞인 순서로 정답을 판정한다 */
function isRight(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  return v.ans.indexOf(pick) >= 0;
}

function recordAnswer(q, pick){
  var ok = isRight(q, pick);
  if(!ok){
    var rec = wrongNote[q.id] || {n:0};
    rec.n = (rec.n||0) + 1; rec.t = Date.now();
    wrongNote[q.id] = rec;
  } else if(state.removeOnCorrect && wrongNote[q.id]){
    delete wrongNote[q.id];
  }
  save(LS_KEYS.wrong, wrongNote);
  return ok;
}

function renderQuiz(){
  var q = BY_ID[quiz.pool[quiz.i]];
  var total = quiz.pool.length;
  var done = Object.keys(quiz.picks).length;
  var revealed = quiz.mode === 'instant' && quiz.revealed[q.id];
  var pick = quiz.picks[q.id];
  var v = viewOf(q, quiz.maps ? quiz.maps[q.id] : null);
  var correctSoFar = 0;
  quiz.pool.forEach(function(id){ if(quiz.picks[id] && isRight(BY_ID[id], quiz.picks[id])) correctSoFar++; });
  var answeredSoFar = done;

  var html = '' +
  '<div class="topbar">' +
    '<div class="wrap"><div class="inner">' +
      '<button class="iconbtn" id="btn-quit" aria-label="그만두기">✕</button>' +
      '<div class="title">' + esc(CS().name) + ' · ' + (quiz.mode==='exam' ? '실전 모의고사' : '즉시 채점') + '</div>' +
      '<button class="iconbtn" id="btn-theme2" aria-label="다크모드 전환">' + (document.documentElement.getAttribute('data-theme')==='dark' ? '☀' : '☾') + '</button>' +
    '</div>' +
    '<div class="wrap"><div class="metrics">' +
      '<span><b>' + (quiz.i+1) + '</b> / ' + total + '</span>' +
      '<span>정답률 <b>' + (answeredSoFar ? pct(correctSoFar, answeredSoFar) + '%' : '–') + '</b></span>' +
      '<span>오답노트 <b>' + wrongCount() + '</b></span>' +
    '</div></div>' +
    '<div class="progress"><i style="width:' + ((quiz.i)/total*100) + '%"></i></div>' +
  '</div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta">' +
        '<span class="badge">' + esc(qLabel(q)) + '</span>' +
        lecBadge(q) +
        (q.src !== 'L' ? '<span class="badge gray">' + q.no + '번</span>' : '') +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') +
        '<button class="star" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
      '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts" id="opts">' +
        v.opts.map(function(txt, idx){
          var n = idx+1;
          var cls = 'opt';
          if(revealed){
            if(v.ans.indexOf(n) >= 0) cls += ' right';
            else if(pick === n) cls += ' wrong';
          } else if(pick === n){
            cls += ' picked';
          }
          return '<button class="' + cls + '" data-pick="' + n + '"' + ' data-picked="' + (pick===n?1:0) + '"' + (revealed ? ' disabled' : '') + '>' +
            '<span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
            (revealed && v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') +
          '</button>';
        }).join('') +
      '</div>' +
      (revealed ? feedbackHtml(q, pick) : '') +
      hideBarHtml(q.id) +
    '</div>' +
    '<div class="navbar">' +
      '<button id="btn-prev"' + (quiz.i===0?' disabled':'') + '>이전</button>' +
      (quiz.i === total-1
        ? '<button class="primary" id="btn-next">' + (quiz.mode==='instant' ? '결과 보기' : '채점하기') + '</button>'
        : '<button class="primary" id="btn-next">다음</button>') +
    '</div>' +
    '<div class="hint">' + (quiz.mode==='instant' ? '선지를 고르면 바로 채점됩니다.' : '답을 골라 두고 마지막에 한 번에 채점합니다.') + '</div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;

  document.getElementById('btn-quit').onclick = function(){
    if(confirm('학습을 그만하고 처음 화면으로 돌아갈까요? 푼 문제의 오답 기록은 저장됩니다.')) renderHome();
  };
  document.getElementById('btn-theme2').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme');
    state.theme = cur === 'dark' ? 'light' : 'dark';
    save(LS_KEYS.theme, state.theme); applyTheme(); renderQuiz();
  };
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderQuiz();
  };
  var hideBtn = document.getElementById('btn-hide');
  if(hideBtn) hideBtn.onclick = function(){
    if(isHidden(q.id)) unhideQ(q.id); else hideFor24h(q.id);
    renderQuiz();
  };
  var optsBox = document.getElementById('opts');
  optsBox.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){
      var n = parseInt(b.getAttribute('data-pick'), 10);
      if(quiz.mode === 'instant' && quiz.revealed[q.id]) return;
      quiz.picks[q.id] = n;
      if(quiz.mode === 'instant'){
        quiz.revealed[q.id] = true;
        recordAnswer(q, n);
      }
      renderQuiz();
    };
  });
  document.getElementById('btn-prev').onclick = function(){ if(quiz.i>0){ quiz.i--; renderQuiz(); } };
  document.getElementById('btn-next').onclick = function(){
    if(quiz.mode === 'instant' && !quiz.revealed[q.id]){
      alert('선지를 먼저 고르세요.'); return;
    }
    if(quiz.i === quiz.pool.length-1){ finishQuiz(); return; }
    quiz.i++;
    renderQuiz();
  };
  window.scrollTo(0,0);
}

function feedbackHtml(q, pick){
  var v = viewOf(q, quiz && quiz.maps ? quiz.maps[q.id] : null);
  var ok = v.ans.indexOf(pick) >= 0;
  var ansText = v.ans.map(function(n){ return n + ') ' + v.opts[n-1]; }).join(' / ');
  return '<div class="feedback ' + (ok?'ok':'no') + '">' +
    '<div class="head">' + (ok ? '정답입니다' : '오답입니다') + (q.multi ? ' · 복수정답 문항(전항 정답 처리)' : '') + '</div>' +
    '<div class="ans"><b>정답</b> ' + esc(ansText) + '</div>' +
    (q.expl ? '<div>' + esc(v.expl) + '</div>' : '') +
  '</div>';
}

function finishQuiz(){
  var total = quiz.pool.length;
  var picks = quiz.picks;
  var correct = 0, unanswered = 0, wrongIds = [];
  quiz.pool.forEach(function(id){
    var p = picks[id];
    if(!p){ unanswered++; wrongIds.push(id); return; }
    if(isRight(BY_ID[id], p)) correct++;
    else { wrongIds.push(id); }
  });
  if(quiz.mode === 'exam'){
    quiz.pool.forEach(function(id){ var p = picks[id]; if(p) recordAnswer(BY_ID[id], p); });
  }
  var spent = Math.max(1, Math.round((Date.now()-quiz.startAt)/1000));
  hist.unshift({label: quiz.label, when: nowText(), correct: correct, total: total, mode: quiz.mode, sec: spent});
  hist = hist.slice(0,20);
  save(LS_KEYS.stats, hist);
  quiz.finished = true;
  quiz.result = {correct: correct, total: total, unanswered: unanswered, wrongIds: wrongIds, spent: spent};
  renderResult();
}

    }).join('') + '</div></div>'
      : '<div class="card"><div class="empty">' + (kind==='wrong' ? '오답이 없습니다.<br>문제를 풀면 틀린 문제가 여기에 쌓입니다.' : '북마크한 문제가 없습니다.<br>문제 화면의 ☆를 눌러 저장하세요.') + '</div></div>') +

  var solve = document.getElementById('btn-solve');
  if(solve) solve.onclick = function(){ startQuiz(items.map(function(q){ return q.id; }), title + ' 풀기'); };
  window.scrollTo(0,0);
}

function renderHiddenList(){
  var ids = hiddenIds();
  ids.sort(function(a,b){ return hiddenUntil[a] - hiddenUntil[b]; });
  var items = ids.map(function(id){ return BY_ID[id]; }).filter(Boolean);
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-home" aria-label="처음으로">←</button>' +
    '<div class="title">🙈 24시간 안 보기 <span class="muted small">' + items.length + '</span></div>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    (items.length
      ? '<div class="card"><div class="small muted" style="margin-bottom:10px;">숨김을 해제하면 바로 다시 출제됩니다. 시간이 지나면 저절로 풀립니다.</div>' +
        items.map(function(q){
          return '<div class="hiddenitem">' +
            '<div class="row-top"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) +
              (q.src !== 'L' ? '<span class="meta">' + q.no + '번</span>' : '') +
              '<span class="meta" style="margin-left:auto;">' + remainText(hiddenUntil[q.id]) + '</span></div>' +
            '<div>' + esc(q.stem.length > 62 ? q.stem.slice(0,62)+'…' : q.stem) + '</div>' +
            '<div class="act">' +
              '<button data-detail="' + q.id + '">문제 보기</button>' +
              '<button data-unhide="' + q.id + '">숨김 해제</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>'
      : '<div class="card"><div class="empty">24시간 안 보기로 숨긴 문제가 없습니다.<br>문제 화면의 🙈 버튼으로 잘 아는 문제를 잠시 뺄 수 있습니다.</div></div>') +
    (items.length ? '<div class="navbar"><button class="primary" id="btn-unhide-all">숨김 전체 해제 (' + items.length + ')</button></div>' : '') +
    '<div class="navbar"><button class="ghost" id="btn-home2">처음으로</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-home').onclick = renderHome;
  document.getElementById('btn-home2').onclick = renderHome;
  document.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick = function(){ renderDetail(b.getAttribute('data-detail'), renderHiddenList); };
  });
  document.querySelectorAll('[data-unhide]').forEach(function(b){
    b.onclick = function(){ unhideQ(b.getAttribute('data-unhide')); renderHiddenList(); };
  });
  var all = document.getElementById('btn-unhide-all');
  if(all) all.onclick = function(){ unhideAll(); renderHiddenList(); };
  window.scrollTo(0,0);
}

function renderDetail(id, back, perm){
  var q = BY_ID[id];
  if(!q) { renderHome(); return; }
  var v = viewOf(q, perm || null);
  var html = '' +
  '<div class="topbar"><div class="wrap"><div class="inner">' +
    '<button class="iconbtn" id="btn-back" aria-label="뒤로">←</button>' +
    '<div class="title">문제 보기</div>' +
    '<button class="iconbtn" id="btn-star" aria-label="북마크" aria-pressed="' + (!!bookmarks[q.id]) + '">' + (bookmarks[q.id] ? '★' : '☆') + '</button>' +
  '</div></div></div>' +
  '<div class="wrap">' +
    '<div class="card detail">' +
      '<div class="qmeta"><span class="badge">' + esc(qLabel(q)) + '</span>' + lecBadge(q) +
        (q.src !== 'L' ? '<span class="badge gray">' + q.no + '번</span>' : '') +
        (q.multi ? '<span class="badge gray">복수정답</span>' : '') + '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>' +
      '<div class="opts">' + v.opts.map(function(txt, idx){
        var n = idx+1, cls = 'opt' + (v.ans.indexOf(n) >= 0 ? ' right' : '');
        return '<div class="' + cls + '"><span class="num">' + n + '</span><span class="txt">' + esc(txt) + '</span>' +
          (v.ans.indexOf(n) >= 0 ? '<span class="mark">정답</span>' : '') + '</div>';
      }).join('') + '</div>' +
      (q.expl ? '<div class="answerbox"><b>해설</b><br>' + esc(v.expl) + '</div>' : '') +
      hideBarHtml(q.id) +
    '</div>' +
    '<div class="navbar"><button class="ghost" id="btn-back2">목 록</button></div>' +
  '</div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-back').onclick = back;
  document.getElementById('btn-back2').onclick = back;
  document.getElementById('btn-star').onclick = function(){
    if(bookmarks[q.id]) delete bookmarks[q.id]; else bookmarks[q.id] = Date.now();
    save(LS_KEYS.book, bookmarks);
    renderDetail(id, back, perm);
  };
  var hideBtn = document.getElementById('btn-hide');
  if(hideBtn) hideBtn.onclick = function(){
    if(isHidden(q.id)) unhideQ(q.id); else hideFor24h(q.id);
    renderDetail(id, back, perm);
  };
  window.scrollTo(0,0);
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if(!quiz || quiz.finished) return;
  var q = BY_ID[quiz.pool[quiz.i]];
  if(!q) return;
  if(e.key >= '1' && e.key <= '4'){
    var n = parseInt(e.key,10);
    if(!(quiz.mode==='instant' && quiz.revealed[q.id])){
      quiz.picks[q.id] = n;
      if(quiz.mode==='instant'){ quiz.revealed[q.id] = true; recordAnswer(q, n); }
      renderQuiz();
    }
  } else if(e.key === 'ArrowRight' || e.key === 'Enter'){
    var b = document.getElementById('btn-next'); if(b) b.click();
  } else if(e.key === 'ArrowLeft'){
    var p = document.getElementById('btn-prev'); if(p && !p.disabled) p.click();
  }
});

state.theme = load(LS_PREF.theme, '');
state.mode = load(LS_PREF.mode, 'instant');
state.bank = load(LS_PREF.bank, 'mixed');
state.optShuffle = load(LS_PREF.optshuf, true);
initSubject(load(LS_PREF.subject, 'horti'));
applyTheme();
renderHome();
</script>
</body>
</html>
