d":"강의록","no":161,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식(floral and plant design)의 정의로 가장 옳은 것은?","opts":["화훼식물을 주소재로 창의력과 표현능력을 활용해 공간 기능에 미적 효과가 높은 장식물을 제작·설치·유지·관리하는 기술","화훼식물을 대량으로 생산해 시장에 유통하는 재배 기술","정원수를 전정해 수형을 만드는 조경 기술","절화를 건조해 보존하는 가공 기술"],"ans":[1],"multi":false,"dup":false,"expl":"화훼장식은 화훼식물을 주소재로 디자이너의 창의력과 표현능력을 활용해 공간 기능에 맞는 장식물을 제작·설치·유지·관리하는 기술이다."},{"id":"L09-2","set":"강의록","year":null,"kind":"강의록","no":162,"lec":9,"lecName":"화훼장식","src":"L","stem":"디자인의 골격을 이루고 작품의 높이와 폭을 결정하는 소재를 무엇이라 하는가?","opts":["라인플라워","매스플라워","필러플라워","폼플라워"],"ans":[1],"multi":false,"dup":false,"expl":"라인플라워는 수상화서로 디자인의 골격을 이루어 높이와 폭을 결정한다(글라디올러스·금어초·스토크). 매스플라워는 무게감과 안정감을 준다."},{"id":"L09-3","set":"강의록","year":null,"kind":"강의록","no":163,"lec":9,"lecName":"화훼장식","src":"L","stem":"절화를 보관할 때 적합한 온도와 습도로 옳은 것은?","opts":["온대 2~5℃, 열대 7~10℃, 습도 90%","온대 10~15℃, 열대 20℃, 습도 50%","온대 0℃ 이하, 열대 2℃, 습도 40%","모두 25℃, 습도 60%"],"ans":[1],"multi":false,"dup":false,"expl":"절화 보관은 온대 2~5℃, 열대 7~10℃, 습도 90%가 적당하며, 보존용액에는 당분·살균제·산도조절제(pH 3.5)·에틸렌 발생억제제가 들어간다."},{"id":"L09-4","set":"강의록","year":null,"kind":"강의록","no":164,"lec":9,"lecName":"화훼장식","src":"L","stem":"꽃꽂이에서 높은 용기를 사용할 때 작품의 높이를 용기 높이의 몇 배로 하는 것이 적당한가?","opts":["1.5~2배","0.5배","3~4배","용기와 무관하다"],"ans":[1],"multi":false,"dup":false,"expl":"비례의 원리에 따라 높은 용기에서는 용기 높이의 1.5~2배, 낮은 용기에서는 용기 길이의 1.5~2배로 작품을 만든다. 황금비율은 3:5:8이다."},{"id":"L09-5","set":"강의록","year":null,"kind":"강의록","no":165,"lec":9,"lecName":"화훼장식","src":"L","stem":"동양식 꽃꽂이의 특징으로 옳은 것은?","opts":["3개의 주지로 골격을 구성하는 비대칭 형태이며 여백을 남기는 선 디자인이다","원·삼각·원추 등 기하학적 형태의 덩이 디자인이다","사방에서 볼 수 있는 대칭 구도가 대부분이다","직선을 많이 이용해 풍부한 색과 양감을 낸다"],"ans":[1],"multi":false,"dup":false,"expl":"동양식은 화도에 목적을 두고 곡선의 목본류를 주로 이용해 3개의 주지로 골격을 만드는 비대칭 선 디자인이며 여백을 살린다. 나머지는 서양식의 특징이다."},{"id":"L09-6","set":"강의록","year":null,"kind":"강의록","no":166,"lec":9,"lecName":"화훼장식","src":"L","stem":"신체장식용 화훼장식에서 남성이 양복 깃 단추 구멍에 다는 작은 꽃다발을 이르는 말은?","opts":["부토니어","코사지","라운드부케","캐스케이드부케"],"ans":[1],"multi":false,"dup":false,"expl":"남성은 부토니어(boutonniere)를 양복 깃 단추 구멍에, 여성은 코사지를 왼쪽 어깨에 단다. 라운드부케와 캐스케이드부케는 신부 부케의 형태이다."},{"id":"L09-7","set":"강의록","year":null,"kind":"강의록","no":167,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식의 기능 가운데 건축적 기능에 해당하는 것은?","opts":["공기 정화와 가습 효과","차폐 기능, 공간 분할, 통행의 방향 제시","상품 판매 촉진과 공간의 가치 창출","정서 순화와 스트레스 감소"],"ans":[2],"multi":false,"dup":false,"expl":"건축적 기능은 차폐·공간 분할·통행 방향 제시이고, 정서 순화는 심리적 기능, 상품 판매 촉진은 경제적 기능, 공기 정화는 환경적 기능이다."},{"id":"L09-8","set":"강의록","year":null,"kind":"강의록","no":168,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식 범위에서 형상장식에 해당하는 것으로 옳은 것은?","opts":["실내정원, 테라리움","분재, 토피어리","리스, 갈런드","꽃꽂이, 꽃다발"],"ans":[2],"multi":false,"dup":false,"expl":"분식물 장식 중 형상장식은 분재·토피어리처럼 모양을 만들어 장식한 것이고, 배식장식은 실내정원·테라리움처럼 식물을 아름답게 배열한 것이다."},{"id":"L09-9","set":"강의록","year":null,"kind":"강의록","no":169,"lec":9,"lecName":"화훼장식","src":"L","stem":"동양식 꽃꽂이가 우리나라에 도입되고 일본으로 전래된 과정으로 옳은 것은?","opts":["일본의 이께바나가 고려 때 우리나라에 전래되었다","인도에서 백제로 직접 전래된 뒤 고구려를 거쳐 일본으로 갔다","인도의 불전공화가 중국을 거쳐 고구려 소수림왕 때 우리나라에 들어오고 백제 성왕 때 일본으로 전래되었다","중국의 꽃꽂이가 신라 때 일본으로 직접 전해졌다"],"ans":[3],"multi":false,"dup":false,"expl":"기원전 460년경 인도의 불전공화가 중국을 거쳐 고구려 소수림왕(372년) 때 우리나라에 도입되고, 백제 성왕(540년) 때 일본으로 전래되어 동양식 꽃꽂이의 모태가 되었다."},{"id":"L09-10","set":"강의록","year":null,"kind":"강의록","no":170,"lec":9,"lecName":"화훼장식","src":"L","stem":"고려시대에 꽃을 공급하고 꽃꽂이를 맡아 하던 관직으로 옳은 것은?","opts":["중상서 상의국의 화장(花匠)","일본의 이께바나","조선의 가례도감","신라의 화랑"],"ans":[1],"multi":false,"dup":false,"expl":"고려시대에는 중상서 상의국에 화장(花匠)을 두었고, 조선시대에도 화장과 꽃을 공급하는 기관이 있었다."},{"id":"L09-11","set":"강의록","year":null,"kind":"강의록","no":171,"lec":9,"lecName":"화훼장식","src":"L","stem":"고대 이집트의 화훼장식에 대한 설명으로 옳은 것은?","opts":["장미 꽃잎을 연회장 바닥에 뿌리는 사치를 즐겼다","초승달형과 S자형의 비대칭 곡선이 유행했다","노스게이 꽃다발이 유행했다","수련·파피루스·연꽃을 소재로 화환·화관·꽃목걸이를 선호했고 꽃다발 디자인이 단순·반복적이며 양식화되었다"],"ans":[4],"multi":false,"dup":false,"expl":"고대 이집트인은 종교의식에 절화·절엽으로 집과 몸을 장식하고 수련·파피루스·연꽃을 소재로 화환·화관·꽃목걸이를 즐겼다. 장미 꽃잎을 뿌린 것은 로마, 초승달형·S자형은 바로크, 노스게이는 조지안 시대이다."},{"id":"L09-12","set":"강의록","year":null,"kind":"강의록","no":172,"lec":9,"lecName":"화훼장식","src":"L","stem":"그리스 시대에 풍요의 상징으로 뿔 모양 용기에 꽃을 가득 담은 양식을 이르는 말은?","opts":["코누코피아(cornucopia)","토피어리(topiary)","노스게이(nosegay)","갈런드(garland)"],"ans":[1],"multi":false,"dup":false,"expl":"그리스 시대에는 운동 경기 승리자에게 월계관을 씌웠고, 풍요의 상징으로 뿔 모양 용기에 꽃을 가득 담은 코누코피아 양식이 나타났다."},{"id":"L09-13","set":"강의록","year":null,"kind":"강의록","no":173,"lec":9,"lecName":"화훼장식","src":"L","stem":"바로크 시대 절화장식의 특징으로 옳은 것은?","opts":["삼각형·원형·원추형이 유행했다","나선형 토피어리가 유행했다","타원형의 균형미를 갖춘 양식이 유행했다","초승달형과 S자형의 비대칭 곡선이 유행했다"],"ans":[4],"multi":false,"dup":false,"expl":"르네상스는 삼각형·원형·원추형, 바로크는 초승달형·S자형의 비대칭 곡선, 더치플레미시는 타원형의 균형미, 중세 비잔틴은 나선형 토피어리가 유행했다."},{"id":"L09-14","set":"강의록","year":null,"kind":"강의록","no":174,"lec":9,"lecName":"화훼장식","src":"L","stem":"식물소재의 형태별 분류에서 매스플라워(mass flowers)에 해당하는 것은?","opts":["장미, 카네이션, 거베라, 국화","안개초, 스타티스, 솔리다스터","나리, 극락조화, 프로테아","글라디올러스, 금어초, 스토크"],"ans":[1],"multi":false,"dup":false,"expl":"매스플라워는 두상화서로 낮게 꽂아 무게감과 안정감을 주며 장미·카네이션·데이지·거베라·국화가 해당한다. 라인플라워는 글라디올러스·금어초·스토크, 필러플라워는 안개초·스타티스·솔리다스터, 폼플라워는 나리·극락조화·프로테아이다."},{"id":"L09-15","set":"강의록","year":null,"kind":"강의록","no":175,"lec":9,"lecName":"화훼장식","src":"L","stem":"필러플라워(filler flowers)의 역할로 옳은 것은?","opts":["한눈에 매혹시키는 개성적 형태로 디자인의 초점에 쓰인다","디자인의 골격을 이루고 작품의 높이와 폭을 결정한다","낮게 꽂아 무게감과 안정감을 준다","산형화서로 공간을 채워 보기 싫은 부분을 가리고 주된 꽃을 강조한다"],"ans":[4],"multi":false,"dup":false,"expl":"필러플라워는 산형화서로 공간을 채워 보기 싫은 것을 가리고 주된 꽃을 강조하며 안개초·스타티스·솔리다스터·카스피아·아스파라거스 등이 쓰인다."},{"id":"L09-16","set":"강의록","year":null,"kind":"강의록","no":176,"lec":9,"lecName":"화훼장식","src":"L","stem":"폼플라워(form flowers)의 특징으로 옳은 것은?","opts":["작품의 높이와 폭을 결정하는 골격 소재로 쓰인다","개성적이고 특이한 형태로 주로 디자인의 초점에 이용된다","공간을 채워 주된 꽃을 강조한다","잎만 이용해 배경을 만든다"],"ans":[2],"multi":false,"dup":false,"expl":"폼플라워는 한눈에 매혹시키는 개성적·특이한 형태로 디자인의 초점에 쓰이며 나리·극락조화·프로테아·카틀레야·헬리코니아·안수리움 등이 있다."},{"id":"L09-17","set":"강의록","year":null,"kind":"강의록","no":177,"lec":9,"lecName":"화훼장식","src":"L","stem":"절화의 수명을 단축시키는 원인으로 옳지 않은 것은?","opts":["미생물의 번식","에틸렌 발생","낮은 온도와 높은 습도","고온과 건조"],"ans":[3],"multi":false,"dup":false,"expl":"절화의 수명은 고온·건조, 여러 가지 병, 미생물 번식, 에틸렌 발생으로 단축되므로 시원한 온도와 습도 90% 정도로 관리한다."},{"id":"L09-18","set":"강의록","year":null,"kind":"강의록","no":178,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼디자인의 요소 가운데 수평선이 주는 느낌으로 옳은 것은?","opts":["역동적인 느낌을 준다","힘과 단순함, 차갑고 형식적인 느낌을 준다","안정적인 느낌으로 테이블 장식에 알맞다","화려하고 불안정한 느낌을 준다"],"ans":[3],"multi":false,"dup":false,"expl":"수직선은 힘·단순함·차갑고 형식적인 느낌, 사선은 역동적인 느낌, 수평선은 안정적인 느낌으로 테이블 장식에 적합하다."},{"id":"L09-19","set":"강의록","year":null,"kind":"강의록","no":179,"lec":9,"lecName":"화훼장식","src":"L","stem":"색상환에서 동일한 간격(삼각형태)을 유지한 세 개의 색을 배합해 일반적으로 화려한 느낌을 주는 배색은?","opts":["유사색배합","보색배합","삼색배합(triadic)","단색배합"],"ans":[3],"multi":false,"dup":false,"expl":"삼색배합(triadic)은 색상환에서 같은 간격을 유지한 세 색의 배합으로 화려한 느낌을 준다. 단색배합은 단조롭고, 유사색배합은 통일감과 부드러움을 준다."},{"id":"L09-20","set":"강의록","year":null,"kind":"강의록","no":180,"lec":9,"lecName":"화훼장식","src":"L","stem":"화훼장식 디자인 과정의 첫 단계로 옳은 것은?","opts":["소재를 구입한다","평가와 기록을 남긴다","용도와 목적을 파악하고 주제를 결정한다","도면을 작성한다"],"ans":[3],"multi":false,"dup":false,"expl":"디자인 과정은 주제 결정 → 공간 분석 → 구상과 스케치 → 도면 작성 → 연습 및 소재 구입 → 제작과 운반 → 평가와 기록의 순으로 진행된다."},{"id":"L10-1","set":"강의록","year":null,"kind":"강의록","no":181,"lec":10,"lecName":"간이 수경재배(Ⅰ)","src":"L","stem":"수경재배(hydroponics)의 어원으로 옳은 것은?","opts":["hydro(물)와 ponos(노동)의 합성어","hydro(물)와 philia(사랑)의 합성어","hortus(정원)와 cultura(재배)의 합성어","hydor(물)와 logos(학문)의 합성어"],"ans":[1],"multi":false,"dup":false,"expl":"수경재배는 '물'을 뜻하는 hydro와 '노동'을 뜻하는 ponos의 합성어로, 영양액재배·양액재배·무토양재배라고도 한다."},{"id":"L10-2","set":"강의록","year":null,"kind":"강의록","no":182,"lec":10,"lecName":"간이 수경재배(Ⅰ)","src":"L","stem":"간이수경재배에서 재배조에 작물을 심는 간격으로 옳은 것은?","opts":["과채류 20~30cm, 엽채류 10~15cm로 4~6주","과채류 5~10cm, 엽채류 30~40cm로 10주","모든 작물 50cm 간격으로 2주","작물 종류와 관계없이 3cm 간격"],"ans":[1],"multi":false,"dup":false,"expl":"재배조에는 과채류는 20~30cm, 엽채류는 10~15cm 간격으로 4~6주를 심는다."},{"id":"L10-3","set":"강의록","year":null,"kind":"강의록","no":183,"lec":10,"lecName":"간이 수경재배(Ⅰ)","src":"L","stem":"간이수경재배에 록","year":null,"kind":"강의록","no":211,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"수경재배의 재배 형태로 제시되지 않은 것은?","opts":["고설수경재배","노지 밭재배","자루재배","베드재배"],"ans":[2],"multi":false,"dup":false,"expl":"수경재배의 재배 형태에는 베드재배, 자루재배, 고설수경재배, 용기재배, 입체재배가 있다."},{"id":"L11-12","set":"강의록","year":null,"kind":"강의록","no":212,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"양액의 미량원소로 옳게 묶인 것은?","opts":["Ca, Mg, S, N, P","N, P, K, Ca, Mg","Fe, B, Mn, Zn, Cu, Mo, Cl","C, H, O, N, P, K"],"ans":[3],"multi":false,"dup":false,"expl":"다량원소는 C·H·O·N·P·K·Ca·Mg·S이고, 미량원소는 Fe·B·Mn·Zn·Cu·Mo·Cl이다."},{"id":"L11-13","set":"강의록","year":null,"kind":"강의록","no":213,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"양액의 용존산소를 충분히 유지하는 방법으로 옳은 것은?","opts":["양액 수온을 높이고 순환을 멈춘다","양액을 밀봉해 공기와의 접촉을 막는다","양액을 오래 정체시켜 둔다","양액 수온을 낮추고 순환시키거나 기포발생기를 이용한다"],"ans":[4],"multi":false,"dup":false,"expl":"수중 포화 용존산소량은 수온에 따라 달라지므로 양액 수온을 낮추고 순환시키거나 기포발생기를 이용해 산소를 공급한다."},{"id":"L11-14","set":"강의록","year":null,"kind":"강의록","no":214,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"양액의 조성과 공급 농도를 결정할 때 고려할 요인으로 옳지 않은 것은?","opts":["배지의 종류","식물의 종류와 생육 단계","재배 시기와 급액 방법","재배자의 연령"],"ans":[4],"multi":false,"dup":false,"expl":"양액의 조성과 공급 농도는 식물의 종류, 생육 단계, 재배 시기, 급액 방법, 배지의 종류를 고려해 정한다."},{"id":"L11-15","set":"강의록","year":null,"kind":"강의록","no":215,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"가정에서 구근식물로 수경재배하기에 알맞은 식물로 옳게 묶인 것은?","opts":["토마토, 오이, 가지, 호박","상추, 쑥갓, 미나리, 치커리","히아신스, 수선화, 크로커스, 튤립","딸기, 수박, 참외, 멜론"],"ans":[3],"multi":false,"dup":false,"expl":"구근식물 수경재배에는 히아신스·수선화·크로커스·튤립·아이리스와 양파·마늘·쪽파 등이 이용된다."},{"id":"L11-16","set":"강의록","year":null,"kind":"강의록","no":216,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"분화식물의 심지재배에 이용하는 식물로 옳게 묶인 것은?","opts":["칼랑코에, 아프리칸바이올렛, 안스리움, 스파티필름","토마토, 오이, 딸기, 고추","히아신스, 튤립, 수선화, 크로커스","상추, 청경채, 쑥갓, 치커리"],"ans":[1],"multi":false,"dup":false,"expl":"분화식물 심지재배에는 다년생 숙근초(칼랑코에·아프리칸바이올렛·국화), 구근류(시클라멘·수선화·구근베고니아), 관엽식물(안스리움·스파티필름·포인세티아) 등이 이용된다."},{"id":"L11-17","set":"강의록","year":null,"kind":"강의록","no":217,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"과채류 수경재배에서 토마토에 알맞은 양액 농도(EC)로 옳은 것은?","opts":["3.5~4.5dS/m","0.5~0.8dS/m","2.0~3.0dS/m","1.0~1.5dS/m"],"ans":[3],"multi":false,"dup":false,"expl":"토마토 수경재배는 EC 2.0~3.0dS/m, 딸기는 EC 1.0~1.5dS/m가 알맞다."},{"id":"L11-18","set":"강의록","year":null,"kind":"강의록","no":218,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"허브 수경재배에 대한 설명으로 옳은 것은?","opts":["허브는 과채류와 같이 EC 3.0dS/m 이상에서 기른다","허브는 음지성 식물로 생육 적온이 25~30℃이다","허브는 호광성 식물로 생육 적온이 15~20℃이다","허브는 양액을 공급하지 않아도 된다"],"ans":[3],"multi":false,"dup":false,"expl":"허브는 호광성 식물로 생육 적온이 15~20℃이고, 허브용 배양액을 주 2~3회 급액하며 EC는 1.2~1.8dS/m로 관리한다."},{"id":"L11-19","set":"강의록","year":null,"kind":"강의록","no":219,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"Microgreen(어린 채소)에 대한 설명으로 옳은 것은?","opts":["과채류의 열매만 수확하는 재배법이다","어린 채소를 뜻하며 수경재배로 생산해 샐러드 등으로 이용하고 사업화도 이루어지고 있다","다 자란 잎채소를 건조해 가루로 만든 것이다","구근을 물에 담가 꽃을 피우는 방식이다"],"ans":[2],"multi":false,"dup":false,"expl":"Microgreen은 어린 채소를 뜻하며 인천국제성모병원 마리스텔라, 서울시립대 등에서 재배되고 샐러드용으로 사업화되고 있다. 멀티그린·겨자채·케일·루꼴라 등이 재배된다."},{"id":"L11-20","set":"강의록","year":null,"kind":"강의록","no":220,"lec":11,"lecName":"간이 수경재배(Ⅱ)","src":"L","stem":"자루재배(bag culture)에 대한 설명으로 옳은 것은?","opts":["플라스틱 비닐 튜브에 각종 배지를 채워 작물을 재배한다","PVC 파이프를 수직으로 세워 재배한다","화분에 상토를 넣어 재배한다","스티로폼 베드에 양액을 담아 재배한다"],"ans":[1],"multi":false,"dup":false,"expl":"자루재배는 플라스틱 비닐 튜브에 각종 배지를 채워 재배하는 방식이고, 베드재배는 플라스틱·스티로폼 베드를, 용기재배는 플라스틱 포트를 이용한다."},{"id":"L12-1","set":"강의록","year":null,"kind":"강의록","no":221,"lec":12,"lecName":"도시원예","src":"L","stem":"로빈슨(1987)이 정의한 도시원예의 핵심으로 옳은 것은?","opts":["원예식물의 생산보다 이용과 관련되며, 도시인의 스트레스를 줄이고 생활환경을 향상시키기 위해 식물의 기능을 연구·발전·교육하는 것","도시 근교에서 원예작물을 대규모로 생산해 소득을 높이는 것","도시 공원에 조경수를 식재하고 관리하는 것","실내에서 인공광으로 식물공장을 운영하는 것"],"ans":[1],"multi":false,"dup":false,"expl":"도시원예는 생산보다 이용에 초점을 두고, 도시인의 스트레스 경감과 생활환경 향상을 위해 식물의 기능을 연구·발전·교육하는 소비자 중심의 원예이다."},{"id":"L12-2","set":"강의록","year":null,"kind":"강의록","no":222,"lec":12,"lecName":"도시원예","src":"L","stem":"「도시농업의 육성 및 지원에 관한 법률」(도시농업법)이 시행된 때는?","opts":["2011년 5월 1일","2014년 11월 19일","2017년 3월 21일","2024년 1월 1일"],"ans":[2],"multi":false,"dup":false,"expl":"도시농업법은 2014년 11월 19일 시행되었고, 2017년 3월 21일 개정으로 수목·화초 재배와 곤충 사육까지 도시농업의 범위가 넓어졌다."},{"id":"L12-3","set":"강의록","year":null,"kind":"강의록","no":223,"lec":12,"lecName":"도시원예","src":"L","stem":"옥상녹화에서 저관리형의 특징으로 옳은 것은?","opts":["토심이 20cm 이하이고 건조에 강한 지피식물(세덤류) 위주로 식재한다","토심이 20cm 이상이며 교목을 포함한 다층구조로 조성한다","관수·시비·전정 등 정기적인 관리가 반드시 필요하다","경량형이 없고 중량형으로만 시공한다"],"ans":[1],"multi":false,"dup":false,"expl":"저관리형은 토심 20cm 이하에 건조에 강한 지피식물 위주로 식재한다. 관리형은 토심 20cm 이상에 지피식물·관목·교목을 다층으로 조성해 정기 관리가 필요하다."},{"id":"L12-4","set":"강의록","year":null,"kind":"강의록","no":224,"lec":12,"lecName":"도시원예","src":"L","stem":"미국 시애틀의 P-패치 공동체텃밭에서 경작자에게 부과하는 의무로 옳은 것은?","opts":["연간 사용료를 내고 1인당 연 8시간의 자원봉사를 한다","사용료 없이 1인당 연 100시간의 자원봉사를 한다","5년마다 경작 자격을 새로 시험으로 받는다","경작한 작물의 절반을 시에 납부한다"],"ans":[1],"multi":false,"dup":false,"expl":"시애틀 P-패치(85개 텃밭, 2,750구획, 경작자 6,300명)는 연간 사용료와 1인당 연 8시간의 자원봉사를 의무화하고 있다."},{"id":"L12-5","set":"강의록","year":null,"kind":"강의록","no":225,"lec":12,"lecName":"도시원예","src":"L","stem":"실내정원에서 증산작용이 활발해 음이온을 많이 발생시키는 식물로 옳은 것은?","opts":["팔손이나무, 스파티필름, 심비디움","선인장, 다육식물","아레카야자, 드라세나","관음죽, 테이블야자"],"ans":[1],"multi":false,"dup":false,"expl":"음이온을 다량 발생시키는 식물은 증산작용이 활발한 팔손이나무·스파티필름·심비디움·광나무이다. 음이온은 오염물질 제거와 신진대사 촉진에 도움을 준다."},{"id":"L12-6","set":"강의록","year":null,"kind":"강의록","no":226,"lec":12,"lecName":"도시원예","src":"L","stem":"밤에 이산화탄소를 흡수하는 식물로 침실에 두면 좋은 것을 묶은 것은?","opts":["호접란, 선인장, 다육식물","아레카야자, 인도고무나무","스킨답서스, 산호수","관음죽, 테이블야자"],"ans":[1],"multi":false,"dup":false,"expl":"침실에는 밤에 이산화탄소를 흡수하는 호접란·선인장·다육식물을 두는 것이 좋다. 아레카야자는 거실, 스킨답서스는 주방, 관음죽은 화장실에 알맞다."},{"id":"L12-7","set":"강의록","year":null,"kind":"강의록","no":227,"lec":12,"lecName":"도시원예","src":"L","stem":"2017년 3월 개정된 도시농업법에서 도시농업의 범위에 새로 포함된 행위는?","opts":["임업용 묘목 생산","축산물 가공","어류의 양식","곤충의 사육(양봉 포함)"],"ans":[4],"multi":false,"dup":false,"expl":"2017년 3월 21일 개정된 도시농업법은 도시농업을 농작물 경작·재배, 수목·화초 재배, 곤충 사육(양봉 포함)의 행위로 규정했다."},{"id":"L12-8","set":"강의록","year":null,"kind":"강의록","no":228,"lec":12,"lecName":"도시원예","src":"L","stem":"2024년 유형별 도시농업 현황에서 참여자 수가 가장 많은 유형은?","opts":["학교교육형","농장·공원형","근린생활권형","주택활용형"],"ans":[1],"multi":false,"dup":false,"expl":"참여자 수는 학교교육형 > 근린생활권형 > 주택활용형 > 농장·공원형의 순으로 나타났다."},{"id":"L12-9","set":"강의록","year":null,"kind":"강의록","no":229,"lec":12,"lecName":"도시원예","src":"L","stem":"스쿨팜의 효과로 제시된 것으로 옳게 묶인 것은?","opts":["체력 향상, 다이어트, 근력 강화","경쟁심, 성취욕, 소득 증대","수확량 증대, 병해충 감소, 노동력 절감","자연사랑, 협력, 화합, 책임, 존중"],"ans":[4],"multi":false,"dup":false,"expl":"스쿨팜은 학생과 일반인의 원예활동·원예치료를 목적으로 하며 자연사랑·협력·화합·책임·존중을 통해 바람직한 사회 구성원을 기르는 효과가 있다. 영국은 80여 개 스쿨팜(SFN), 미국은 팜투스쿨, 일본은 교육팜을 운영한다."},{"id":"L12-10","set":"강의록","year":null,"kind":"강의록","no":230,"lec":12,"lecName":"도시원예","src":"L","stem":"공동체정원(community garden)에 대한 설명으로 옳은 것은?","opts":["학교 교육 과정의 체험 학습을 위해 교내에 만든 텃밭이다","기업이 옥상에 상업적 목적으로 작물을 생산하는 공간이다","근접 지역에 살며 비슷한 관심사와 가치를 공유하는 공동체가 참여해 조성한 도시농업 공간이다","지자체가 개인에게 경작을 목적으로 대여하는 253m2 규모의 작은 토지이다"],"ans":[3],"multi":false,"dup":false,"expl":"공동체정원은 근접해서 살고 비슷한 관심사와 가치를 공유하는 공동체가 참여해 삶의 질을 높이고자 근접 지역에 계획·조성한 도시농업 공간으로, 농업활동과 공동체의식, 활동·교육 장소의 역할을 한다."},{"id":"L12-11","set":"강의록","year":null,"kind":"강의록","no":231,"lec":12,"lecName":"도시원예","src":"L","stem":"캐나다 벤쿠버시의 공동체텃밭 정책에 대한 설명으로 옳은 것은?","opts":["공동체텃밭 경작자에게 연 8시간의 자원봉사를 의무화했다","토지 소유자가 유휴지를 공동체텃밭으로 임시 제공하면 재산세를 감면해 준다","지자체가 개인에게 77평 규모의 토지를 대여한다","시정부가 시민사회단체의 도시텃밭을 지원하는 그린썸 프로그램을 운영한다"],"ans":[2],"multi":false,"dup":false,"expl":"벤쿠버시는 2013년 기준 104개 공동체텃밭 4,000구획을 두고, 유휴지를 임시 제공한 토지 소유자에게 재산세를 감면했으며, 농민시장 거래 규모가 연 1,500만 달러로 도시농업이 지역경제에 기여했다."},{"id":"L12-12","set":"강의록","year":null,"kind":"강의록","no":232,"lec":12,"lecName":"도시원예","src":"L","stem":"영국의 얼랏먼트(allotment)에 대한 설명으로 옳은 것은?","opts":["지방자치단체가 개인에게 경작을 목적으로 대여하는 작은 토지 구획이다","비영리 자가 수요를 위해 300~400m2씩 나눈 독일의 텃밭이다","기업이 운영하는 옥상 농장이다","학교 교육용 텃밭으로 30m2 이상 규모이다"],"ans":[1],"multi":false,"dup":false,"expl":"얼랏먼트는 지방자치단체가 개인에게 경작을 목적으로 대여하는 작은 토지 구획(253m2, 77평)의 도시민 농장이다. 독일은 Kleingarten이 1획당 평균 300~400m2이다."},{"id":"L12-13","set":"강의록","year":null,"kind":"강의록","no":233,"lec":12,"lecName":"도시원예","src":"L","stem":"독일 연방텃밭농원법(Bundes Kleingarten Gesetz)에서 규정한 텃밭(농원)에 대한 설명으로 옳은 것은?","opts":["옥상에 설치한 경량 인공토양 정원이다","상업적 판매를 목적으로 대규모로 작물을 생산하는 농원이다","학교 교육 과정과 연계된 학생 전용 텃밭이다","비영리적으로 자가 수요를 위해 재배·수확하며 휴양을 목적으로 이용되는 농원으로, 도로·놀이터·클럽하우스 같은 공동설비를 갖춘다"],"ans":[4],"multi":false,"dup":false,"expl":"독일의 텃밭은 비영리적으로 자가 수요를 위해 재배·수확하며 휴양을 목적으로 이용되는 농원으로, 도로·놀이터·클럽하우스 같은 공동설비를 갖추고 1획당 평균 300~400m2(121평) 규모이다."},{"id":"L12-14","set":"강의록","year":null,"kind":"강의록","no":234,"lec":12,"lecName":"도시원예","src":"L","stem":"싱가포르의 기업형 도시농업 사례인 캄크랍(ComCrop)에 대한 설명으로 옳은 것은?","opts":["지하 공간에서 인공광으로만 작물을 생산한다","옥상을 활용해 557m2 면적에서 작물을 생산하고 80:20 법칙으로 수익의 20%를 사회에 환원한다","주상복합건물 옥상 60,000m2에서 작물을 재배하는 이더블가든이다","학교 옥상에 학생들이 텃밭을 만드는 프로그램이다"],"ans":[2],"multi":false,"dup":false,"expl":"캄크랍은 옥상을 활용해 557m2 면적에서 작물을 생산하고 80:20 법칙을 적용해 회사 수익의 20%를 사회에 환원하며 지역 노인들에게 일자리를 제공한다. 이더블가든은 피플스파크 콤플렉스 옥상 60,000m2에서 작물을 재배하는 사례이다."},{"id":"L12-15","set":"강의록","year":null,"kind":"강의록","no":235,"lec":12,"lecName":"도시원예","src":"L","stem":"옥상녹화 시스템을 아래에서 위로 바르게 나열한 것은?","opts":["방수층 - 방근층 - 배수·저장층 - 토양여과층 - 토양층 - 식생층","방근층 - 방수층 - 식생층 - 토양층 - 배수층 - 토양여과층","토양층 - 방수층 - 식생층 - 방근층 - 배수층 - 토양여과층","식생층 - 토양층 - 방수층 - 배수층 - 방근층 - 토양여과층"],"ans":[1],"multi":false,"dup":false,"expl":"옥상녹화 시스템은 방수층, 방근층, 배수·저장층, 토양여과층, 토양층, 식생층으로 구성된다."},{"id":"L12-16","set":"강의록","year":null,"kind":"강의록","no":236,"lec":12,"lecName":"도시원예","src":"L","stem":"벽면녹화의 효과로 옳지 않은 것은?","opts":["산성비와 자외선을 차단해 구조물의 내구성을 높인다","여름철 온도를 낮추고 겨울철 단열 효과를 준다","인공 구조물에 의한 위압감을 줄인다","건물의 하중을 늘려 구조를 보강한다"],"ans":[4],"multi":false,"dup":false,"expl":"벽면녹화는 미적 경관 향상, 여름철 온도 저하, 겨울철 단열, 위압감 감소, 산성비·자외선 차단에 의한 내구성 향상, 서식처·피난처 제공에 의한 도심 생태계 보호의 효과가 있다."},{"id":"L12-17","set":"강의록","year":null,"kind":"강의록","no":237,"lec":12,"lecName":"도시원예","src":"L","stem":"베란다의 햇빛 환경이 부족할 때 재배하기 알맞은 작물로 옳게 묶인 것은?","opts":["수박, 참외, 오이, 호박","청치마상추, 오크상추, 쑥갓, 신선초","부추, 엔다이브, 치커리, 쪽파, 미나리","로메인상추, 청경채, 방울토마토, 겨자채"],"ans":[3],"multi":false,"dup":false,"expl":"햇빛이 부족한 베란다에서는 부추·엔다이브·적치커리·치커리·쪽파·아욱·생강·곰취·미나리 같은 내음성이 강한 작물을 고르는 것이 좋다."},{"id":"L12-18","set":"강의록","year":null,"kind":"강의록","no":238,"lec":12,"lecName":"도시원예","src":"L","stem":"수목의 피톤치드에 대한 설명으로 옳은 것은?","opts":["꽃가루가 물에 녹아 만든 산성 물질이다","피톤(식물)과 치드(죽이는)의 합성어로 쾌적감, 소취·탈취, 항균·방충의 효능이 있다","토양 미생물이 분비하는 항생물질로 질소를 고정한다","식물이 뿜는 이산화탄소의 다른 이름이다"],"ans":[2],"multi":false,"dup":false,"expl":"피톤치드는 피톤(phyton: 식물)과 치드(cide: 죽이는)의 합성어로 쾌적감, 소취·탈취, 항균·방충의 효능이 있으며 테르펜류(휘발성)와 알칼로이드·플라보노이드·페놀성 물질(비휘발성)로 이루어진다."},{"id":"L12-19","set":"강의록","year":null,"kind":"강의록","no":239,"lec":12,"lecName":"도시원예","src":"L","stem":"실내에 식물을 공간 대비 얼마만큼 두면 상대습도가 10% 증가하는가?","opts":["1%","20%","9%","50%"],"ans":[3],"multi":false,"dup":false,"expl":"실내에 식물을 공간 대비 9% 두면 상대습도가 10% 증가한다."},{"id":"L12-20","set":"강의록","year":null,"kind":"강의록","no":240,"lec":12,"lecName":"도시원예","src":"L","stem":"거실에 두면 휘발성 유기화합물(벤젠·톨루엔·자일렌) 제거 능력이 우수하고 빛이 적어도 잘 자라는 식물로 옳게 묶인 것은?","opts":["팔손이나무, 분화국화, 시클라멘, 꽃베고니아","호접란, 선인장, 다육식물","아레카야자, 인도고무나무, 드라세나, 디펜바키아","관음죽, 테이블야자, 스킨답서스"],"ans":[3],"multi":false,"dup":false,"expl":"거실에는 휘발성 유기화합물 제거 능력이 우수하고 빛이 적어도 잘 자라는 아레카야자·인도고무나무·드라세나·디펜바키아를, 베란다에는 팔손이나무·분화국화·시클라멘·꽃베고니아·허브류를 둔다."},{"id":"L13-1","set":"강의록","year":null,"kind":"강의록","no":241,"lec":13,"lecName":"가정채소","src":"L","stem":"색깔에 따른 채소 분류에서 안토시아닌을 함유한 적색채소에 속하는 것은?","opts":["비트, 적양배추, 파프리카","당근, 노란호박","마늘, 무, 양파","검정콩, 검정옥수수, 검정토마토"],"ans":[1],"multi":false,"dup":false,"expl":"적색채소는 안토시아닌을 함유하며 비트·적양배추·파프리카가 이에 속한다. 등황색은 카로티노이드, 백색은 알린·티오시안네이트, 흑색은 이소플라본이다."},{"id":"L13-2","set":"강의록","year":null,"kind":"강의록","no":242,"lec":13,"lecName":"가정채소","src":"L","stem":"호냉성 채소의 생육 적온과 해당 채소로 옳은 것은?","opts":["18~20℃, 무·배추·상추·감자","23~25℃, 고추·토마토·수박·고구마","10~12℃, 마늘·양파·파","30℃ 이상, 오이·호박"],"ans":[1],"multi":false,"dup":false,"expl":"호냉성 채소는 18~20℃에서 잘 자라는 잎·뿌리채소(무·배추·상추·감자)이고, 호온성 채소는 23~25℃를 좋아하는 열매채소(고추·토마토·수박·고구마)이다."},{"id":"L13-3","set":"강의록","year":null,"kind":"강의록","no":243,"lec":13,"lecName":"가정채소","src":"L","stem":"잎·뿌리채소를 줄뿌림 했을 때 솎음 간격으로 옳은 것은?","opts":["당근 10cm, 무 20cm, 배추 30~40cm","당근 30cm, 무 10cm, 배추 10cm","모두 5cm 간격으로 솎는다","당근 50cm, 무 50cm, 배추 60cm"],"ans":[1],"multi":false,"dup":false,"expl":"본잎 3~4매 때 솎아 주며 간격은 당근 10cm, 무 20cm, 배추 30~40cm이다. 병든 것, 생육이 부진한 것, 품종 특성을 나타내지 않는 것을 제거한다."},{"id":"L13-4","set":"강의록","year":null,"kind":"강의록","no":244,"lec":13,"lecName":"가정채소","src":"L","stem":"열매채소(고추·토마토·가지) 모종을 본밭에 아주심기 하는 시기로 가장 알맞은 것은?","opts":["토양 온도가 오르고 서리 위험이 없는 5월 초","서리가 내리는 3월 중순","장마가 끝난 8월 초","첫서리 직후인 11월 초"],"ans":[1],"multi":false,"dup":false,"expl":"열매채소는 토양 온도가 오르고 서리 위험이 없는 5월 초에 심으며, 서리 위험이 있으면 종이꼬깔을 씌운다. 상추·엔디브는 4월 말에 심어도 된다."},{"id":"L13-5","set":"강의록","year":null,"kind":"강의록","no":245,"lec":13,"lecName":"가정채소","src":"L","stem":"토양 수분 변화가 심할 때 나타나는 생리장해로 옳은 것은?","opts":["열근(무·당근)과 열과(멜론·참외)","배꼽썩음병(토마토)","탄저병(고추)","역병(고추·토마토)"],"ans":[1],"multi":false,"dup":false,"expl":"토양 수분 변화가 심하면 열근과 열과가 생긴다. 배꼽썩음병은 석회비료를 주지 않은 사질 토양에서, 탄저병·역병은 병원균에 의한 병해이다."},{"id":"L13-6","set":"강의록","year":null,"kind":"강의록","no":246,"lec":13,"lecName":"가정채소","src":"L","stem":"가정채소를 저장할 때 호온성 채소의 적정 저장온도로 옳은 것은?","opts":["10~12℃","0℃","-2℃","25℃"],"ans":[1],"multi":false,"dup":false,"expl":"호냉성 채소(배추·상추·당근·감자)는 0℃, 호온성 채소(수박·오이·토마토·고추·고구마)는 10~12℃에서 저장한다."},{"id":"L13-7","set":"강의록","year":null,"kind":"강의록","no":247,"lec":13,"lecName":"가정채소","src":"L","stem":"가정채소의 중요성에 대한 설명으로 옳은 것은?","opts":["어린이 교육과는 무관하다","농약을 많이 사용해 병해충을 완전히 막을 수 있다","부식비를 절감할 수 있어 독일에서는 여름 채소의 50%를 텃밭에서 생산한다","도시 녹화와는 관계가 없다"],"ans":[3],"multi":false,"dup":false,"expl":"가정채소는 무농약·저농약의 안전 먹거리를 생산하고 부식비를 절감하며(독일은 여름 채소 50%를 텃밭에서 생산), 육체적·정신적 효과와 어린이의 환경친화적 인성 구축, 가족 유대 강화, 도시 녹화와 탄산가스 감축 효과가 있다."},{"id":"L13-8","set":"강의록","year":null,"kind":"강의록","no":248,"lec":13,"lecName":"가정채소","src":"L","stem":"채소의 세 가지 기능으로 옳은 것은?","opts":["경운, 시비, 관수","생체방어, 생체조절, 정신조절","저장, 수송, 가공","광합성, 증산, 호흡"],"ans":[2],"multi":false,"dup":false,"expl":"채소의 3기능은 생체방어, 생체조절, 정신조절이며 영양적 측면(비타민·무기질 급원)과 보건적 측면(식물섬유, 체질 산성화 방지)도 중요하다."},{"id":"L13-9","set":"강의록","year":null,"kind":"강의록","no":249,"lec":13,"lecName":"가정채소","src":"L","stem":"햇빛 적응성에 따른 분류에서 약광에서도 자랄 수 있는 채소로 옳게 묶인 것은?","opts":["토마토, 고추, 수박","배추, 양배추, 무","콩나물, 치콘","생강, 삼엽채, 미나리, 쑥갓, 머위"],"ans":[4],"multi":false,"dup":false,"expl":"강광에는 열매채소(토마토·고추·수박), 보통광에는 잎·뿌리채소(배추·양배추·무), 약광에는 생강·삼엽채·미나리·쑥갓·머위, 암실에는 콩나물·치커리싹(치콘)이 해당한다."},{"id":"L13-10","set":"강의록","year":null,"kind":"강의록","no":250,"lec":13,"lecName":"가정채소","src":"L","stem":"재배 계절에 따른 분류에서 봄채소로 옳게 묶인 것은?","opts":["오이, 수박, 고추, 고구마","무, 배추, 당근, 갓","상추, 쑥갓, 완두, 감자","마늘, 양파, 파, 시금치"],"ans":[3],"multi":false,"dup":false,"expl":"봄채소는 상추·쑥갓·완두·감자, 여름채소는 오이·수박·고추·고구마, 가을채소는 무·배추·당근·갓·순무, 겨울채소는 마늘·양파·파·쪽파·시금치이다."},{"id":"L13-11","set":"강의록","year":null,"kind":"강의록","no":251,"lec":13,"lecName":"가정채소","src":"L","stem":"색깔에 따른 채소 분류에서 이소플라본을 함유한 흑색 채소로 옳게 묶인 것은?","opts":["당근, 노란호박, 단호박","마늘, 무, 양파","비트, 적양배추, 파프리카","검정콩, 검정옥수수, 검정토마토"],"ans":[4],"multi":false,"dup":false,"expl":"녹색은 엽록소(상추·시금치·쑥갓·청경채), 등황색은 카로티노이드(당근·노란호박), 백색은 알린·티오시안네이트(마늘·무·양파), 적색은 안토시아닌(비트·적양배추·파프리카), 흑색은 이소플라본(검정콩·검정옥수수·검정토마토)이다."},{"id":"L13-12","set":"강의록","year":null,"kind":"강의록","no":252,"lec":13,"lecName":"가정채소","src":"L","stem":"텃밭을 조성할 때 도로와의 거리로 옳은 것은?","opts":["도로와 바로 붙어 있어도 무방하다","도로로부터 100m 이상 떨어져야 한다","도로로부터 최소한 10m 이상 유지한다","도로로부터 1m만 떨어지면 된다"],"ans":[3],"multi":false,"dup":false,"expl":"텃밭은 도로변을 피해 도로로부터 최소한 10m 이상 유지하고, 오염된 도로 빗물이 텃밭으로 흘러들지 않게 해야 하며, 오염되지 않은 토양이 객토된 곳을 선택한다."},{"id":"L13-13","set":"강의록","year":null,"kind":"강의록","no":253,"lec":13,"lecName":"가정채소","src":"L","stem":"관리 능력에 따른 텃밭 면적으로 4인 가족에게 알맞은 것은?","opts":["100~150m2","10~15m2","1~2m2","500m2 이상"],"ans":[2],"multi":false,"dup":false,"expl":"4인 가족은 10~15m2를 기준으로 하며, 소규모(6.6m2, 2평)는 상추·들깨·케일·알타리, 중규모(17m2, 5평), 대규모(33m2, 10평)로 확장한다."},{"id":"L13-14","set":"강의록","year":null,"kind":"강의록","no":254,"lec":13,"lecName":"가정채소","src":"L","stem":"돌려짓기(윤작)에 대한 설명으로 옳은 것은?","opts":["연작장해를 피하기 위한 방법으로 고추·토마토는 4년 휴작이 필요하다","같은 작물을 계속 재배해 토양을 비옥하게 하는 방법이다","고추·토마토는 연작이 가능하지만 상추·무는 4년 휴작이 필요하다","모든 채소를 해마다 같은 자리에 심는 방법이다"],"ans":[1],"multi":false,"dup":false,"expl":"이어짓기(연작)는 같은 작물을 계속 재배해 연작 피해가 생기고, 돌려짓기(윤작)는 이를 피하는 방법이다. 상추·무·배추·상추·호박은 연작이 가능하지만 고추·토마토는 4년 휴작이 필요하다."},{"id":"L13-15","set":"강의록","year":null,"kind":"강의록","no":255,"lec":13,"lecName":"가정채소","src":"L","stem":"섞어짓기(혼작)에서 동반작물을 심어 병충해 방제 효과를 보는 조합으로 옳은 것은?","opts":["고추 + 가지","배추과 채소 + 토마토","상추 + 시금치","배추과 채소 + 메리골드, 바실"],"ans":[4],"multi":false,"dup":false,"expl":"채소와 허브를 함께 심으면 병충해 방제 효과가 있으며 배추과 채소에 메리골드·바실을 심는 것이 대표적이다."},{"id":"L13-16","set":"강의록","year":null,"kind":"강의록","no":256,"lec":13,"lecName":"가정채소","src":"L","stem":"싹채소를 기를 때 종자에 대한 주의사항으로 옳은 것은?","opts":["시판되는 아무 종자나 사용해도 된다","농약 코팅 종자를 써야 발아가 잘 된다","종자를 3일간 물에 담가 두었다가 그대로 먹는다","반드시 새싹용 종자를 구입하고 착색되거나 농약 코팅된 종자는 사용하지 않는다"],"ans":[4],"multi":false,"dup":false,"expl":"싹채소는 반드시 새싹용 종자를 구입해야 하며 착색 또는 농약 코팅 종자는 사용하지 않는다. 종자를 물에 불려 암조건에서 치상하고 1일 2~3회 물을 주며, 싹이 난 뒤 햇빛에 둔다."},{"id":"L13-17","set":"강의록","year":null,"kind":"강의록","no":257,"lec":13,"lecName":"가정채소","src":"L","stem":"용기재배에서 표준으로 하는 상토량으로 옳은 것은?","opts":["잎채소 10L, 열매채소 30L","잎채소는 주당 2L 내외, 열매채소는 5~10L","모든 채소 주당 20L","잎채소 0.1L, 열매채소 0.5L"],"ans":[2],"multi":false,"dup":false,"expl":"용기재배의 상토는 잎채소는 주당 2L 내외, 열매채소는 5~10L를 표준으로 하며 생육 단계와 날씨를 고려한다."},{"id":"L13-18","set":"강의록","year":null,"kind":"강의록","no":258,"lec":13,"lecName":"가정채소","src":"L","stem":"텃밭의 이랑 만들기에 대한 설명으로 옳은 것은?","opts":["두둑 폭은 잎채소 1.2m, 고랑 0.4m로 하고 고추·감자·고구마는 골이랑 60cm로 만든다","두둑 폭은 0.4m, 고랑은 1.2m로 만든다","모든 채소를 평평한 밭에 그대로 심는다","검정 비닐 멀칭은 지온을 낮추기 위해 한다"],"ans":[1],"multi":false,"dup":false,"expl":"퇴비와 밑거름을 뿌리고 경운·써레질한 뒤 두둑 폭 1.2m(잎채소), 고랑 0.4m, 골이랑 60cm(고추·감자·고구마)로 만들고 검정 비닐로 멀칭해 잡초를 억제하고 지온을 높인다."},{"id":"L13-19","set":"강의록","year":null,"kind":"강의록","no":259,"lec":13,"lecName":"가정채소","src":"L","stem":"과채류 모종을 고를 때 좋은 모의 조건으로 옳지 않은 것은?","opts":["잎의 뒷면에 병충해 피해가  흙 50%","밭흙 100%","모래 90% + 퇴비 10%","퇴비 80% + 석회 20%"],"ans":[1],"multi":false,"dup":false,"expl":"유기물이 많고 가벼운 산성 토양을 만들어야 하므로 피트모스 50%와 흙 50%를 기본으로 하고, 마사토·왕겨·수도용 상토·펄라이트를 더할 수 있다."},{"id":"L15-3","set":"강의록","year":null,"kind":"강의록","no":283,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 묘목을 심을 구덩이의 기본 크기로 옳은 것은?","opts":["지름 60cm × 깊이 40cm","지름 30cm × 깊이 20cm","지름 100cm × 깊이 80cm","지름 45cm × 깊이 45cm"],"ans":[1],"multi":false,"dup":false,"expl":"용기를 준비하거나 구덩이를 팔 때는 기본적으로 지름 60cm, 깊이 40cm로 만든다."},{"id":"L15-4","set":"강의록","year":null,"kind":"강의록","no":284,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 재배에서 멀칭의 효과로 옳지 않은 것은?","opts":["토양 온도와 수분을 유지한다","잡초 발생을 억제한다","토양 유실을 방지하고 유기물을 공급한다","토양 산도를 높여 pH를 올린다"],"ans":[4],"multi":false,"dup":false,"expl":"멀칭은 토양 온도·수분 유지, 잡초 억제, 토양 유실 방지, 유기물 공급의 효과가 있으며 pH를 올리는 효과는 없다."},{"id":"L15-5","set":"강의록","year":null,"kind":"강의록","no":285,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"복합비료(11-11-11) 기준으로 성목(5~6년생) 블루베리의 주당 연간 시비량은?","opts":["70g","140g","280g","560g"],"ans":[3],"multi":false,"dup":false,"expl":"주당 시비량은 재식 1~2년생 70g, 3~4년생 140g, 5~6년생 280g이며 3~4회 나누어 준다."},{"id":"L15-6","set":"강의록","year":null,"kind":"강의록","no":286,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 재식 1년차 겨울전정 방법으로 옳은 것은?","opts":["가지를 1/2 또는 2/3 정도 잘라내면서 모든 꽃눈을 제거한다","꽃눈을 최대한 남겨 첫해부터 결실시킨다","전정을 하지 않고 그대로 둔다","뿌리를 절반 잘라 수관을 줄인다"],"ans":[1],"multi":false,"dup":false,"expl":"재식 1년차에는 가지를 1/2 또는 2/3 정도 잘라내고 모든 꽃눈을 제거해 영양생장을 촉진하고 수관을 조기에 확장한다."},{"id":"L15-7","set":"강의록","year":null,"kind":"강의록","no":287,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 묘목을 심을 장소로 옳은 것은?","opts":["습하고 배수가 불량한 그늘진 곳","물이 고이는 점토질 논바닥","햇볕이 잘 들고 찬바람을 막을 수 있으며 물 빠짐이 좋은 곳","찬바람이 강하게 부는 북향 저지대"],"ans":[3],"multi":false,"dup":false,"expl":"햇볕이 잘 들고 찬바람을 막을 수 있으며 물 빠짐이 좋은 곳을 고르고, 특히 물 빠짐이 중요해 산지에서는 마사토, 논에서는 객토하거나 이랑을 높게 만든다."},{"id":"L15-8","set":"강의록","year":null,"kind":"강의록","no":288,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 식재용 인공토양을 만들 때 피트모스와 흙에 더할 수 있는 재료로 옳은 것은?","opts":["황가루, 유황, 명반","석회, 소석회, 패화석","퇴비, 유박, 골분","마사토, 왕겨, 수도용 상토, 펄라이트"],"ans":[4],"multi":false,"dup":false,"expl":"유기물이 많은 가벼운 산성 토양을 만들기 위해 피트모스 50%와 흙 50%를 기본으로 하고 마사토·왕겨·수도용 상토·펄라이트를 더할 수 있다."},{"id":"L15-9","set":"강의록","year":null,"kind":"강의록","no":289,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 묘목을 심기 전후에 하는 다듬기로 옳은 것은?","opts":["뿌리를 1/2 잘라 낸다","잎을 모두 따고 줄기만 남긴다","마른가지·병든가지·처진가지를 제거하고 3년생 묘목의 굵고 긴 가지는 1/3 정도 자르며 모든 꽃눈을 제거한다","가지를 모두 남기고 꽃눈을 최대한 살린다"],"ans":[3],"multi":false,"dup":false,"expl":"심기 전후에는 가볍게 전정해 마른가지·병든가지·처진가지를 제거하고, 3년생 묘목의 굵고 긴 가지는 1/3 정도 자르며 모든 꽃눈을 반드시 제거한다."},{"id":"L15-10","set":"강의록","year":null,"kind":"강의록","no":290,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 묘목을 심을 때 강하게 전정하는 효과로 옳은 것은?","opts":["꽃눈이 많아져 착과가 촉진된다","뿌리 발생이 억제된다","조기에 수관을 확보할 수 있다","첫해부터 수확량이 크게 늘어난다"],"ans":[3],"multi":false,"dup":false,"expl":"강전정의 효과는 조기에 수관을 확보하는 것이다."},{"id":"L15-11","set":"강의록","year":null,"kind":"강의록","no":291,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 관수 시기로 옳지 않은 것은?","opts":["겨울에는 절대 관수하지 않는다","착과 후 비대기에 관수한다","여름 가뭄과 꽃눈 분화기에 관수한다","봄 가뭄에 관수한다"],"ans":[1],"multi":false,"dup":false,"expl":"봄 가뭄, 착과 후 비대기, 여름 가뭄과 꽃눈 분화기에 관수하고 겨울에도 건조하면 따뜻한 날을 택해 관수한다. 적당한 수분 스트레스는 오히려 약이 되지만 지나치면 습해가 발생한다."},{"id":"L15-12","set":"강의록","year":null,"kind":"강의록","no":292,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"복합비료(11-11-11) 기준으로 재식 1~2년생 유목과 3~4년생 청목의 주당 연간 시비량으로 옳은 것은?","opts":["유목 280g, 청목 560g","유목 35g, 청목 70g","유목 70g, 청목 140g","유목 140g, 청목 70g"],"ans":[3],"multi":false,"dup":false,"expl":"주당 시비량은 재식 1~2년생(유목) 70g, 3~4년생(청목) 140g, 5~6년생(성목) 280g이며 3~4회 나누어 준다."},{"id":"L15-13","set":"강의록","year":null,"kind":"강의록","no":293,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리에 시비할 때 주의할 점으로 옳지 않은 것은?","opts":["질소질 비료의 과용을 금한다","토양 pH를 올리는 일반 퇴비를 충분히 준다","8월 이후 늦은 시비, 특히 질소 비료는 금한다","비료 요구도가 낮아 지나치면 모자람만 못하다"],"ans":[2],"multi":false,"dup":false,"expl":"블루베리는 비료 요구도가 낮고 질소 과용을 금하며, pH를 올리는 비료(일반 퇴비)를 피하고 가급적 산성 비료를 쓰며 8월 이후 늦은 시비 특히 질소 비료는 주지 않는다."},{"id":"L15-14","set":"강의록","year":null,"kind":"강의록","no":294,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 재배 토양의 pH를 1 낮추는 데 필요한 황가루의 양과 소요 기간으로 옳은 것은?","opts":["그루당 4g, 1개월","그루당 1kg, 5년","그루당 40g, 4~6개월","그루당 400g, 1년"],"ans":[3],"multi":false,"dup":false,"expl":"적정 토양 pH는 4.5~5.0이며 pH를 1 낮추는 데 그루당 황가루 40g이 4~6개월에 걸쳐 효과를 낸다."},{"id":"L15-15","set":"강의록","year":null,"kind":"강의록","no":295,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 전정의 목적으로 옳지 않은 것은?","opts":["수세와 착과를 조절한다","경제적 수명을 연장하고 병충해 방제에 도움을 준다","과실 품질을 향상시키고 대과 생산과 착색을 촉진한다","나무의 키를 크게 키워 수확 작업을 어렵게 만든다"],"ans":[4],"multi":false,"dup":false,"expl":"전정은 수세와 착과 조절, 과실 품질 향상(대과 생산·착색 촉진), 경제적 수명 연장, 병충해 방제를 목적으로 하며 겨울전정·여름전정, 자름전정·솎음전정이 있다."},{"id":"L15-16","set":"강의록","year":null,"kind":"강의록","no":296,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리의 절단전정과 솎음전정에 대한 설명으로 옳은 것은?","opts":["두 방법 모두 뿌리의 재생장을 촉진한다","솎음전정은 가지를 자르지 않고 잎만 따는 방법이다","절단전정은 수관 전체의 재생장을, 솎음전정은 절단 부위 아랫부분의 재생장을 촉진한다","절단전정은 절단 부위 아랫부분의 재생장을, 솎음전정은 나무 수관 전체의 재생장을 촉진한다"],"ans":[4],"multi":false,"dup":false,"expl":"절단전정은 절단 부위 아랫부분의 재생장을 촉진하고, 솎음전정은 나무 수관 전체의 재생장을 촉진한다."},{"id":"L15-17","set":"강의록","year":null,"kind":"강의록","no":297,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 재식 3년차 청목의 겨울전정 요령으로 옳은 것은?","opts":["불량가지를 제거해 내부를 비우고 꽃눈의 40~50%를 제거하며 흡지 일부를 남겨 주축지를 대체할 준비를 한다","모든 꽃눈을 제거해 결실을 막는다","전정을 하지 않고 가지를 모두 남긴다","주축지를 모두 잘라 한 개만 남긴다"],"ans":[1],"multi":false,"dup":false,"expl":"3년차에는 불량가지 제거로 내부를 비우고 수형을 유지하며 꽃눈의 40~50%를 제거해 결실량을 조절하고, 새로 난 흡지 일부를 남겨 묵은 주축지를 대체할 준비를 한다."},{"id":"L15-18","set":"강의록","year":null,"kind":"강의록","no":298,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리 성목(재식 5년차 이후)에서 유지하는 주축지의 수로 옳은 것은?","opts":["20개 이상","5~8개","15~20개","1~2개"],"ans":[2],"multi":false,"dup":false,"expl":"성목은 주축지를 5~8개 정도 유지하되 5년이 지나면 순차적으로 갱신해 준다."},{"id":"L15-19","set":"강의록","year":null,"kind":"강의록","no":299,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"북부하이부시 블루베리가 월동 중 저온 요구도를 충족하기 위해 필요한 조건으로 옳은 것은?","opts":["7℃ 이하의 저온에 800~1,200시간 노출되어야 한다","25℃ 이상의 고온에 100시간 노출되어야 한다","저온 요구도 없이 언제든 휴면이 타파된다","0℃ 이하에 10시간만 노출되면 된다"],"ans":[1],"multi":false,"dup":false,"expl":"북부하이부시는 7℃ 이하의 저온에 800~1,200시간 놓여야 저온 요구도를 충족하며, 노지에서 월동시키되 동해와 건조해, 이상난동과 2~3월 물오름 뒤 강추위에 주의한다."},{"id":"L15-20","set":"강의록","year":null,"kind":"강의록","no":300,"lec":15,"lecName":"가정과수-블루베리(Ⅱ)","src":"L","stem":"블루베리의 수확 요령으로 옳은 것은?","opts":["착색이 시작되면 한낮에 모두 딴다","미숙과를 함께 따서 익혀 먹는다","완전 착색 후 2~3일 지나 과병 꼭지 자리까지 물든 것을 아침·저녁에 딴다","과분을 씻어 낸 뒤 수확한다"],"ans":[3],"multi":false,"dup":false,"expl":"수확 기간은 6월 중순~8월 초순이고, 완전 착색 후 2~3일 지나 과병 꼭지 자리까지 선명하게 물든(O-ring) 완숙과를 과분을 유지한 채 아침·저녁에 따며 한낮은 피한다."}] },
  edu:   { exam: [{"id":"E2015-2-01-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 철학․종교적 인간관과 과학적 인간관이 공통적으로 갖고 있는 생각은?","opts":["인간은 물질세계의 한 부분으로서 인과론적 법칙에 따라 행동하는 존재이다","인간에게는 불변의 본성이나 본질이 자연 또는 신에 의해 주어져 있다","인간의 고유한 형상은 이성이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[2],"multi":false,"dup":false,"expl":"마리탱은 인간을 물질세계의 일부로 보는 과학적 인간관과, 이성으로 형상을 실현하는 존재로 보는 철학·종교적 인간관이 ‘인간에게는 자연 또는 신이 준 불변의 본성·본질이 있다’는 점에서 공통한다고 보았다. ①은 과학적 인간관만의 특징, ③은 철학·종교적 인간관, ④는 칸트의 정언명령에 가깝다.","src":"E"},{"id":"E2015-2-01-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":1,"stem":"공학적 교육관과 가장 거리가 먼 것은?","opts":["교육의 과정은 투입-가공-산출 모형으로 설명할 수 있다","교사는 교육목표의 설정이라는 가치판단의 주체이다","교수-학습의 효율성과 성취도의 평가가 강조된다","교사와 학생의 관계는 전달, 주입, 통제의 관계로 간주된다"],"ans":[2],"multi":false,"dup":true,"expl":"공학적 교육관은 교육을 투입-가공-산출의 체제로 보고 교사를 목표 달성을 위한 기술자·관리자로 본다. 따라서 교사가 교육목표 설정의 가치판단 주체라는 진술이 공학적 교육관과 가장 거리가 멀다. ①·③·④는 모두 공학적 교육관의 특징이다.","src":"E"},{"id":"E2015-2-02-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":2,"stem":"다음 중 연결이 적절한 것은?","opts":["자연주의 교육관 - 스키너(Skinner)","진보주의 교육관 - 틸리히(Tillich)","실존주의 교육관 - 부버(Buber)","행동주의 교육관 - 루소(Rousseau)"],"ans":[3],"multi":false,"dup":true,"expl":"실존주의 교육관은 부버(Buber)·틸리히 등과 연결된다. 자연주의는 루소, 행동주의는 스키너, 진보주의는 듀이와 연결되므로 ①·②·④는 잘못된 연결이다.","src":"E"},{"id":"E2015-2-02-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":2,"stem":"다음 중 진보주의 교육관과 가장 거리가 먼 것은?","opts":["자연주의 교육관","경험중심 교육","실용주의 철학","인간행동의 계획적 변화"],"ans":[4],"multi":false,"dup":true,"expl":"진보주의 교육관은 경험중심·실용주의·자연주의와 통한다. ‘인간행동의 계획적 변화’는 전통적(주형적) 교육관의 특징이므로 진보주의와 가장 거리가 멀다.","src":"E"},{"id":"E2015-2-03-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":3,"stem":"교육은 학습자 내부에 잠재해 있는 가능성들이 자연스럽고 올바른 방향으로 커 나갈 수 있도록 도와주는 과정이라고 보는 교육관과 가장 거리가 먼 것은?","opts":["전통적 교육관","진보주의 교육관","자연주의 교육관","실존주의 교육관"],"ans":[1],"multi":false,"dup":true,"expl":"잠재가능성의 자연스러운 발현을 돕는다는 것은 진보주의·자연주의·실존주의 교육관의 공통된 이해다. 전통적 교육관은 교사를 주형으로, 학습자를 재료로 보아 이와 정반대다.","src":"E"},{"id":"E2015-2-03-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":3,"stem":"다음 중 후기 현대철학에서 강조되고 있는 인간관으로 보기에 적당하지 않은 것은?","opts":["자기형성적 존재","무의식적 존재","능동적 존재","합리적 존재"],"ans":[2],"multi":false,"dup":false,"expl":"후기 현대철학은 고정된 본질을 부정하고 자기형성적·능동적·합리적 존재를 강조한다. ‘무의식적 존재’는 정신분석적 인간관으로, 후기 현대철학에서 강조하는 인간관이 아니다.","src":"E"},{"id":"E2015-2-04-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":4,"stem":"수학 교과에서 배운 공식이 과학 교과에서 활용될 수 있도록 교육내용을 선정하고 조직하는 것과 가장 가까운 것은?","opts":["계속성의 원리","일관성의 원리","계열성의 원리","통합성의 원리"],"ans":[4],"multi":false,"dup":false,"expl":"서로 다른 교과의 내용을 관련지어 조직하는 것은 통합성의 원리다. 계속성은 같은 요소의 반복, 계열성은 내용의 심화·확대, 일관성은 목적과의 일치를 뜻한다.","src":"E"},{"id":"E2015-2-04-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":4,"stem":"다음 중 교육이 이루어지는 과정을 순서대로 나열한 것은?","opts":["교육목표의 설정 → 교육내용 선정과 조직 → 교수-학습 → 평가","교육목표의 설정 → 교수-학습 → 교육내용 선정과 조직 → 평가","교육내용 선정과 조직 → 교수-학습 → 교육목표의 설정 → 평가","교육내용 선정과 조직 → 교육목표의 설정 → 교수-학습 → 평가"],"ans":[1],"multi":false,"dup":true,"expl":"교육의 과정은 교육목표의 설정 → 교육내용의 선정과 조직 → 교수-학습 → 평가 순으로 이루어진다. 목표가 먼저 서고 그에 따라 내용을 조직한 뒤 실제 수업과 평가가 뒤따른다.","src":"E"},{"id":"E2015-2-05-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":5,"stem":"다음 중 교육의 내재적 목적으로 보기 어려운 것은?","opts":["전인적 변화의 추구","개인의 잠재가능성의 실현","사회문화의 보존","성장 동기(being-need)의 충족"],"ans":[3],"multi":false,"dup":false,"expl":"교육의 내재적 목적은 교육 활동 자체에 내재한 목적으로 전인적 변화의 추구, 개인의 잠재가능성 실현, 성장동기(being-need)의 충족 등이다. 사회문화의 보존은 교육을 통해 사회가 얻는 외재적 목적이므로 내재적 목적으로 보기 어렵다.","src":"E"},{"id":"E2015-2-05-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":5,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 주형으로서의 교육관","매슬로우(Maslow) - 탈학교 교육론","렝그랑(Lengrand) - 평생교육","피터스(Peters) - 프로그램 수업"],"ans":[3],"multi":false,"dup":false,"expl":"렝그랑은 평생교육, 일리치는 탈학교교육론, 매슬로는 자아실현, 피터스는 교육의 기준 정립과 연결된다. 따라서 ③만 바른 연결이다.","src":"E"},{"id":"E2015-2-06-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":6,"stem":"다음 중 일벌백계(一罰百戒)와 가장 관련이 깊은 것은?","opts":["소거","부분 강화","자기 처벌","대리 처벌"],"ans":[4],"multi":false,"dup":true,"expl":"한 사람이 받은 벌을 다른 사람이 관찰하고 같은 행동을 하지 않게 되는 것은 대리 처벌(대리적 벌)이다. 소거·부분 강화는 벌의 전이와 다른 학습 원리이고, 자기 처벌은 스스로에게 벌을 주는 것이다.","src":"E"},{"id":"E2015-2-06-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":6,"stem":"수학교과서의 내용이 초등학교, 중학교, 고등학교로 갈수록 점차 심화되고 확대되는 것을 알 수 있는데, 이것과 가장 관련이 있는 교육내용 선정 및 조직의 원리는?","opts":["통합성의 원리","계열성의 원리","반복성의 원리","계속성의 원리"],"ans":[2],"multi":false,"dup":true,"expl":"학년이 올라갈수록 내용이 심화·확대되는 것은 계열성의 원리다. 계속성은 같은 내용의 반복, 통합성은 교과 간 관련을 뜻하며 반복성은 내용 조직의 원리가 아니다.","src":"E"},{"id":"E2015-2-07-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":7,"stem":"어떤 아이가 어른에게 인사를 하여 칭찬을 받은 후, 이 아이는 어른을 보면 인사하는 행동을 자주 하게 되었다. 이와 가장 관련이 있는 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","반복의 법칙"],"ans":[2],"multi":false,"dup":false,"expl":"칭찬이라는 만족스러운 결과가 뒤따른 행동이 반복되는 것은 손다이크의 효과의 법칙이다. 연습의 법칙은 반복 연습, 준비성의 법칙은 학습할 준비 상태와 관련된다.","src":"E"},{"id":"E2015-2-07-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":7,"stem":"공부할 마음이 없는 아이는 여러 학원에 다닌다고 하더라도 학습의 효과를 보기가 어렵다. 이와 가장 관련이 깊은 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","유사의 법칙"],"ans":[3],"multi":false,"dup":false,"expl":"배울 마음(준비 상태)이 없으면 학습 효과를 얻기 어렵다는 것은 손다이크의 준비성의 법칙이다. 효과의 법칙은 결과에 따른 강화, 연습의 법칙은 반복 연습과 관련된다.","src":"E"},{"id":"E2015-2-08-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":8,"stem":"다음 설명 중 조작적 조건형성이론과 관련이 깊은 것은?","opts":["개의 소화계에 대한 실험으로부터 탄생된 이론이다","불수의적 행동의 학습기제이다","스키너(Skinner)에 의해 체계화되었다","중성자극과 조건자극 간의 관계를 설명하고 있다"],"ans":[3],"multi":false,"dup":false,"expl":"조작적 조건형성은 스키너가 체계화한 이론으로, 수의적 행동이 그 결과(강화·벌)에 따라 학습된다. ①·②·④는 고전적 조건형성(파블로프)에 대한 설명이다.","src":"E"},{"id":"E2015-2-08-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":8,"stem":"고전적 조건형성이론에 대한 다음 설명 중 적절치 않은 것은?","opts":["음식물에 대한 개의 타액 분비는 선천적 반사행동이다","파블로프(Pavlov)에 의해 처음 체계적으로 이론화되었다","조건형성된 반응이 없어지는 소거(消去)는 학습되는 것이다","수의적 행동의 학습기제이다"],"ans":[4],"multi":false,"dup":true,"expl":"고전적 조건형성은 불수의적(반사적) 행동의 학습기제이므로 ‘수의적 행동의 학습기제’라는 진술이 적절하지 않다. 수의적 행동의 학습은 조작적 조건형성이다. ①~③은 모두 옳은 설명이다.","src":"E"},{"id":"E2015-2-09-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":9,"stem":"공부는 거의 하지 않고 하루 종일 컴퓨터 게임만 하는 아이의 공부하는 행동을 늘리기 위하여, 일정 시간의 공부를 하면 아이가 좋아하는 컴퓨터 게임을 일정 시간동안 할 수 있도록 해주는 것과 관련이 깊은 것은?","opts":["프리맥의 원리","범람법","토큰 강화","소거의 원리"],"ans":[1],"multi":false,"dup":true,"expl":"빈도가 높은 행동(게임)을 강화물로 삼아 빈도가 낮은 행동(공부)을 늘리는 것은 프리맥의 원리다. 범람법은 불안 치료 기법, 토큰 강화는 상징적 강화물을 쓰는 방법, 소거는 강화를 중단하는 것이다.","src":"E"},{"id":"E2015-2-09-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":9,"stem":"아이들이 바람직하지 않은 행동을 했을 때 그들이 좋아하는 컴퓨터 게임을 일정 시간 동안 하지 못하도록 함으로써 바람직하지 않은 행동의 빈도를 감소시키고자 하는 것과 관련이 있는 것은?","opts":["부적 강화","정적 강화","벌","소거"],"ans":[3],"multi":false,"dup":true,"expl":"좋아하는 게임을 일정 시간 하지 못하게 하는 것은 혐오자극을 제시해 행동을 감소시키는 벌이다. 부적 강화는 혐오자극을 제거해 행동을 증가시키고, 정적 강화는 자극을 더해 행동을 늘린다.","src":"E"},{"id":"E2015-2-10-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":10,"stem":"조작적 조건형성이론에 의하면 어떤 행동을 학습하는 초기 단계에서 유용한 강화방법은?","opts":["자기 강화","대리 강화","계속적 강화","간헐적 강화"],"ans":[3],"multi":false,"dup":true,"expl":"행동 학습 초기에는 매 반응마다 강화하는 계속적 강화가 효과적이며, 행동이 안정된 뒤에는 간헐적(부분) 강화로 옮겨 간다. 자기 강화·대리 강화는 초기 습득 단계의 강화 방법이 아니다.","src":"E"},{"id":"E2015-2-10-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":10,"stem":"학교에서 전체 조회시간에 어떤 아이에게 선행상을 주었다. 이것을 본 다른 아이들이 나도 착한 행동을 해야겠다고 마음먹고 유사한 선행을 했다. 직접적으로 선행상을 받지 않은 다른 아이들은 어떤 강화를 받은 것인가?","opts":["계속적 강화","부분강화","자기강화","대리강화"],"ans":[4],"multi":false,"dup":true,"expl":"다른 아이가 강화받는 장면을 관찰하고 같은 행동을 하게 된 것은 대리강화(대리적 강화)다. 직접 강화를 받지 않아도 관찰을 통해 학습이 일어난다.","src":"E"},{"id":"E2015-2-11-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":11,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 불어 시간에 배운 내용 때문에 영어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[1],"multi":false,"dup":false,"expl":"나중에 배운 불어가 먼저 배운 영어의 기억을 방해한 것은 역행성 간섭이다. 순행성 간섭은 반대로 먼저 배운 내용이 나중 학습을 방해하는 경우다.","src":"E"},{"id":"E2015-2-11-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":11,"stem":"피아제(Piaget)의 인지발달단계 중 내재적 사고가 가능하나 자기중심성과 비가역성의 한계를 지니고 있는 발달단계는?","opts":["전조작기","형식적 조작기","구체적 조작기","감각운동기"],"ans":[1],"multi":false,"dup":true,"expl":"전조작기(2~7세)는 상징적 사고(내재적 사고)가 가능하지만 자기중심성·비가역성·중심화의 한계를 지닌다. 형식적 조작기는 가설연역적 사고, 구체적 조작기는 보존개념이 발달하는 단계다.","src":"E"},{"id":"E2015-2-12-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":12,"stem":"피아제(Piaget)의 인지발달단계 중 가설연역적 사고가 가능한 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[4],"multi":false,"dup":false,"expl":"가설연역적 사고는 형식적 조작기(12세 이후)에 가능해진다. 감각운동기는 대상영속성, 전조작기는 상징적 사고, 구체적 조작기는 구체물을 통한 논리 조작이 특징이다.","src":"E"},{"id":"E2015-2-12-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":12,"stem":"에릭슨(Erikson)의 성격발달 각 단계에서 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["근면성 - 침체감","자율성 - 고립감","주도성 - 수치심","자아정체성 - 역할혼미"],"ans":[4],"multi":false,"dup":false,"expl":"자아정체성 대 역할혼미가 바른 짝이다. 근면성은 열등감, 자율성은 수치감, 주도성은 죄책감과 짝지어지므로 ①~③은 잘못 짝지어졌다.","src":"E"},{"id":"E2015-2-13-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":13,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 각 단계별로 성취해야 할 긍정적인 과업이 발달 순서대로 나열된 것은?","opts":["신뢰감 → 자율성 → 근면성 → 주도성","주도성 → 근면성 → 친밀성 → 자아정체성","자율성 → 주도성 → 근면성 → 자아정체성","신뢰감 → 주도성 → 자율성 → 친밀성"],"ans":[3],"multi":false,"dup":true,"expl":"에릭슨의 발달 순서는 신뢰감→자율성→주도성→근면성→자아정체성→친밀성→생산성→통합성이다. ③만 이 순서에 맞다.","src":"E"},{"id":"E2015-2-13-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":13,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["감각기억은 시연에 의해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 작업기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[3],"multi":false,"dup":true,"expl":"논리적 추론처럼 정보를 조작·처리하는 과정은 작업기억에 해당한다. 시연으로 지속시간이 늘어나는 것은 단기기억, 감각기억은 1초 이내이며, 7±2는 단기(작업)기억의 용량이다.","src":"E"},{"id":"E2015-2-14-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":14,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["작업기억 - 논리적 추론","감각기억 - 유목별 군집화","장기기억 - 음악 감상","단기기억 - 영화 감상"],"ans":[1],"multi":false,"dup":false,"expl":"작업기억은 정보를 일시 저장하면서 논리적 추론 같은 사고를 수행하는 장치다. 유목별 군집화는 장기기억, 음악·영화 감상은 감각기억과 관련된다.","src":"E"},{"id":"E2015-2-14-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":14,"stem":"우리가 영화를 보고, 음악을 감상하고, 언어에 의한 의사소통을 할 수 있는 것은 다음 중 어떤 기억 장치가 있기 때문인가?","opts":["장기기억","단기기억","작업기억","감각기억"],"ans":[4],"multi":false,"dup":false,"expl":"영화의 영상, 음악의 소리, 언어의 소리를 순간적으로 받아들여 하나의 흐름으로 지각하게 하는 것은 감각기억이다. 감각기억이 없으면 연속된 자극을 이어서 경험할 수 없다.","src":"E"},{"id":"E2015-2-15-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":15,"stem":"다음 중 인간의 지능에 관심을 가지고 있는 다음 학자들과 그들의 주장이 바르게 연결된 것은?","opts":["커텔(Cattell) - 7가지 기초정신능력","서스턴(Thurstone) - 일반요인, 특수요인","스피어만(Spearman) - 유동성 지능, 결정성 지능","길포드(Guilford) - 180가지 요소설"],"ans":[4],"multi":false,"dup":true,"expl":"길포드는 지능을 조작×내용×결과의 180가지 요소로 분석한 요소설을 주장했다. 커텔은 유동성·결정성, 서스턴은 7가지 기초정신능력, 스피어만은 일반·특수요인이다.","src":"E"},{"id":"E2015-2-15-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":15,"stem":"어떤 학생이 1교시에 영어, 2교시에 불어를 배웠는데 영어 시간에 배운 내용 때문에 불어 시간에 배운 내용이 잘 기억나지 않았다고 한다. 이러한 현상과 관련이 있는 것은?","opts":["역행성 간섭","순행성 간섭","의도적 망각","적극적 전이"],"ans":[2],"multi":false,"dup":true,"expl":"먼저 배운 영어가 나중에 배운 불어의 기억을 방해한 것은 순행성 간섭이다. 역행성 간섭은 나중 학습이 먼저 학습을 방해하는 경우다.","src":"E"},{"id":"E2015-2-16-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":16,"stem":"최초의 지능검사인 비네-시몬(Binet-Simon) 지능검사에 대한 다음 설명 중 가장 적절한 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다","사회적 지능을 측정하는 데 유용하다"],"ans":[2],"multi":false,"dup":false,"expl":"비네-시몬 검사는 정신연령 개념을 도입한 최초의 지능검사다. 언어성·동작성 IQ와 편차 IQ는 웩슬러 검사, 사회적 지능은 손다이크 등과 관련된다.","src":"E"},{"id":"E2015-2-16-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":16,"stem":"커텔(Cattell)은 지능을 유동성 지능과 결정성 지능으로 구분하였다. 다음 중 결정성 지능에 해당하지 않는 것은?","opts":["어휘이해력","언어유추능력","일반 지식","수리력"],"ans":[2],"multi":false,"dup":false,"expl":"언어유추능력은 경험·교육과 무관하게 새 상황에 적응하는 유동성 지능에 해당한다. 어휘력·일반지식·수리력은 경험과 학습으로 형성되는 결정성 지능이다.","src":"E"},{"id":"E2015-2-17-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":17,"stem":"다음 설명 중 길포드(Guilford)가 말하는 확산적 사고와 가장 거리가 먼 것은?","opts":["문제에 대한 민감성","아이디어 산출의 유창성","타인에의 동조성","사고의 유연성"],"ans":[3],"multi":false,"dup":false,"expl":"확산적 사고는 유창성·융통성·독창성·정교성·민감성으로 설명된다. 타인에의 동조성은 이와 반대되는 특성이다.","src":"E"},{"id":"E2015-2-17-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":17,"stem":"서스턴(Thurstone)이 주장하는 일곱가지 기본정신능력(Primary Mental Ability)에 해당하지 않는 것은?","opts":["지각속도","기억력","수리력","창의력"],"ans":[4],"multi":false,"dup":true,"expl":"서스턴의 7가지 기초정신능력은 언어이해·추리·수리·공간지각·언어유창성·지각속도·기억력이다. 창의력은 길포드의 확산적 사고와 관련된 개념이다.","src":"E"},{"id":"E2015-2-18-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":18,"stem":"프로이트(Freud)의 정신역동이론에서 말하는 ‘삶의 본능’과 가장 거리가 먼 것은?","opts":["성적 본능","창조적 본능","사랑의 본능","공격 본능"],"ans":[4],"multi":false,"dup":true,"expl":"프로이트의 삶의 본능(리비도)은 성·사랑·창조 등 생명을 유지·확장하는 본능이다. 공격 본능은 죽음의 본능(타나토스)에 속한다.","src":"E"},{"id":"E2015-2-18-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":18,"stem":"창의력에 관한 다음 설명 중 정신분석학적 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력을 구성하는 능력들은 지필검사로 측정할 수 있다","창의력은 확산적 사고와 밀접한 관련이 있다","창의력은 하늘이 부여한 것이다"],"ans":[1],"multi":false,"dup":false,"expl":"정신분석학은 창의적 활동을 본능적 에너지가 사회적으로 가치 있는 형태로 전환된 승화작용으로 본다. 확산적 사고·지필검사 측정은 길포드의 관점이다.","src":"E"},{"id":"E2015-2-19-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":19,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["셀리그만(Seligman) - 성취동기","보울비(Bowlby) - 애착이론","페어번(Fairbairn) - 자기 효능감","맥클리랜드(McClelland) - 학습된 무력감"],"ans":[2],"multi":false,"dup":true,"expl":"보울비는 애착이론, 셀리그만은 학습된 무력감, 맥클리랜드는 성취동기와 연결된다. 따라서 ②만 바른 연결이다.","src":"E"},{"id":"E2015-2-19-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":19,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 가장 거리가 먼 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","아동용보다 성인용 검사가 먼저 만들어졌다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다"],"ans":[3],"multi":false,"dup":true,"expl":"웩슬러 검사는 언어성·동작성 IQ를 산출하고 편차 IQ로 지능지수를 계산하며, 성인용(WAIS)이 아동용(WISC)보다 먼저 만들어졌다. 정신연령은 비네 검사의 개념이므로 가장 거리가 멀다.","src":"E"},{"id":"E2015-2-20-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":20,"stem":"팔이나 다리의 근육과 같이 우리의 의지에 의해 조절되는 것들을 관장하는 신경계는?","opts":["체성신경계","자율신경계","교감신경계","부교감신경계"],"ans":[1],"multi":false,"dup":true,"expl":"팔·다리 근육처럼 의지로 조절되는 골격근을 관장하는 것은 체성신경계다. 자율신경계(교감·부교감)는 의지와 무관하게 내장 기관을 조절한다.","src":"E"},{"id":"E2015-2-20-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":20,"stem":"아이들이 TV를 시청하는 시간대에 폭력적 장면을 방영하는 것을 규제하고 있는 것과 가장 관련이 깊은 설명은?","opts":["공격적 행동에 대한 직접적 보상은 그 행동을 반복케 한다","상대방의 공격을 적대적으로 해석하는 것이 공격성의 원인이다","공격성은 공격적인 남의 행동을 우연히 관찰함으로써 학습된다","공격성은 선천적으로 가지고 태어나는 것이다"],"ans":[3],"multi":false,"dup":false,"expl":"폭력 장면을 관찰한 아동의 공격성이 학습된다는 설명은 반두라의 사회학습이론(관찰학습)이다. ①은 행동주의(직접 보상), ②는 인지주의, ④는 본능설에 해당한다.","src":"E"},{"id":"E2015-2-21-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":21,"stem":"프로이트(Freud)의 정신역동이론에 의하면 오이디푸스 콤플렉스를 해결하는 길은?","opts":["억압","퇴행","반동형성","동일시"],"ans":[4],"multi":false,"dup":false,"expl":"오이디푸스 콤플렉스는 동성 부모를 동일시하면서 해결된다. 억압·퇴행·반동형성은 불안에 대처하는 자아의 방어기제다.","src":"E"},{"id":"E2015-2-21-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":21,"stem":"다음 중 매슬로우(Maslow)의 욕구위계이론에서 성장욕구에 해당하는 것은?","opts":["생리적 욕구","지적 욕구","안전 욕구","자존 욕구"],"ans":[2],"multi":false,"dup":false,"expl":"매슬로의 성장욕구(B-욕구)는 지적·심미적·자아실현 욕구다. 생리·안전·자존 욕구는 결핍욕구(D-욕구)다.","src":"E"},{"id":"E2015-2-22-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":22,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["맥클리랜드(McClelland) - 이상적 자아","로저스(Rogers) - 자기효능감","셀리그만(Seligman) - 학습된 무력감","컨버그(Kernberg) - 성취동기"],"ans":[3],"multi":false,"dup":true,"expl":"셀리그만은 학습된 무력감, 맥클리랜드는 성취동기, 로저스는 자기개념·자기실현과 연결된다. ③만 바른 연결이다.","src":"E"},{"id":"E2015-2-22-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":22,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["로저스(Rogers) - 충분히 기능하는 인간","올포트(Allport) - 생산적인 사람","프롬(Fromm) - 합리적 모험가","매슬로우(Maslow) - 성숙한 인격"],"ans":[1],"multi":false,"dup":false,"expl":"로저스는 충분히 기능하는 사람, 매슬로는 자아실현인, 올포트는 성숙한 인격, 프롬은 생산적인 사람을 제시했다.","src":"E"},{"id":"E2015-2-23-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":23,"stem":"청소년기 자아중심적 사고의 특징으로서, 자신이 타인들의 관심과 주의의 대상이 되고 있다는 믿음에서 비롯되는 심리상태를 특히 무엇이라고 하는가?","opts":["상상적 청중","자기충족적 예언","열등감","정체감 혼미"],"ans":[1],"multi":false,"dup":true,"expl":"자신이 타인의 관심과 주목의 대상이라고 믿는 청소년기 자아중심성은 상상적 청중이다.","src":"E"},{"id":"E2015-2-23-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":23,"stem":"아동이 도덕적 개념을 이해하고 자율적인 도덕적 판단을 하기 위해서는 이에 상응하는 인지적 발달이 이루어져야 한다고 주장하는 대표적인 학자는?","opts":["프로이트(Freud)","에릭슨(Erikson)","반두라(Bandura)","피아제(Piaget)"],"ans":[4],"multi":false,"dup":false,"expl":"도덕적 개념의 이해와 자율적 도덕 판단에 인지발달이 선행해야 한다고 본 대표적 학자는 피아제다.","src":"E"},{"id":"E2015-2-24-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":24,"stem":"친사회적 행동에 관한 다음 설명 중 가장 적절한 것은?","opts":["이기심이 행동으로 나타날 때 친사회적 행동이라고 한다","친사회적 행동은 일정수준의 인지 및 정의적 능력의 발달을 필수적으로 요구한다","공감은 친사회적 행동의 발달과 깊이 관련되어 있다","물리적 조망수용능력은 친사회적 행동과 높은 상관관계가 있다"],"ans":[3],"multi":false,"dup":true,"expl":"공감은 친사회적 행동의 발달과 깊이 관련된다. 친사회적 행동은 일정 수준의 인지·정의적 능력을 요구하며, 물리적 조망수용보다 사회적 조망수용과 상관이 높다.","src":"E"},{"id":"E2015-2-24-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":24,"stem":"자아실현과 관련된 다음 설명 중 가장 적절하지 않은 것은?","opts":["자아실현은 특수한 영역의 가능성을 현실화하는 것이다","자아실현은 고도의 성취뿐만 아니라 낮은 수준의 성취도 포함한다","자아실현의 과정은 어렵고 때로 고통스럽기도 하다","자아실현은 그 자체가 삶의 목적이다"],"ans":[1],"multi":false,"dup":false,"expl":"자아실현은 특정 영역의 가능성만이 아니라 자신의 전체 잠재가능성을 현실화하는 것이다.","src":"E"},{"id":"E2015-2-25-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":25,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 인습적 수준의 도덕성 발달단계에 해당하는 것은?","opts":["대인간 조화 지향","사회적 계약 지향","도구적 상대주의 지향","처벌과 복종 지향"],"ans":[1],"multi":false,"dup":false,"expl":"인습적 수준은 대인간 조화 지향(3단계)과 법과 질서 지향(4단계)이다. 사회적 계약은 후인습적, 도구적 상대주의는 전인습적이다.","src":"E"},{"id":"E2015-2-25-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":25,"stem":"프로이트(Freud)의 정신역동이론에 의하면 오이디푸스 콤플렉스를 해결하는 길은?","opts":["억압","퇴행","반동형성","동일시"],"ans":[4],"multi":false,"dup":true,"expl":"오이디푸스 콤플렉스는 동성 부모를 동일시하면서 해결된다. 억압·퇴행·반동형성은 불안에 대처하는 자아의 방어기제다.","src":"E"},{"id":"E2015-2-26-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":26,"stem":"어떤 남자 아이가 인형을 가지고 노는 것은 여자의 행동이라고 생각하지만, 사실 자기는 인형을 가지고 노는 것을 좋아할 때 경험하는 갈등과 가장 관련이 깊은 개념은?","opts":["내적 통제사고","상상적 청중","외적 통제사고","인지적 부조화"],"ans":[4],"multi":false,"dup":false,"expl":"자신의 행동과 성역할 신념이 서로 어긋날 때 느끼는 불편한 심리 상태는 인지적 부조화다.","src":"E"},{"id":"E2015-2-26-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":26,"stem":"다음 중 생활지도의 일반적 목표로 보기에 가장 적합치 않은 것은?","opts":["자신에 대한 올바른 이해","잠재가능성의 실현","특정한 문제의 해결","전인적 발달의 촉진"],"ans":[3],"multi":false,"dup":true,"expl":"생활지도의 일반적 목표는 자기이해, 잠재가능성 실현, 전인적 발달이다. 특정 문제의 해결은 상담의 목표에 가깝다.","src":"E"},{"id":"E2015-2-27-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":27,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["탐구적 유형 - 교사, 간호사, 종교지도자","관습적 유형 - 정치가, 영업사원, 광고업자","사회적 유형 - 회계사, 은행원, 사무원","실제적 유형 - 기술자, 정비사, 의료기사"],"ans":[4],"multi":false,"dup":true,"expl":"실제적 유형-기술자·정비사·의료기사가 바른 연결이다. 사회적 유형은 교사·간호사·종교지도자, 관습적은 회계사·은행원·사무원, 탐구적은 과학자·연구자다.","src":"E"},{"id":"E2015-2-27-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":27,"stem":"다음 중 그 측정하고자 하는 내용이 다른 한 가지 검사는?","opts":["웩슬러 검사","주제통각검사","군대베타검사","스탠포드-비네 검사"],"ans":[2],"multi":false,"dup":false,"expl":"주제통각검사(TAT)는 성격·투사검사이고, 웩슬러·군대베타·스탠포드-비네는 지능검사다.","src":"E"},{"id":"E2015-2-28-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":28,"stem":"진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["사회이론 - 겔라트(Gelatt)","특성이론 - 윌리엄슨(Williamson)","의사결정이론 - 보딘(Bordin)","심리이론 - 홀링쉐드(Hollingshead)"],"ans":[2],"multi":false,"dup":true,"expl":"특성이론-윌리엄슨이 바른 연결이다. 사회이론은 홀링쉐드, 의사결정이론은 겔라트, 심리이론은 로우다.","src":"E"},{"id":"E2015-2-28-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":28,"stem":"진로지도와 관련된 이론 중 가장 오래된 것으로서, 개인과 직업의 특성을 진단하고 분석하여 연결시켜 주는 것을 요체로 하고 있는 이론은?","opts":["특성이론","사회이론","심리이론","의사결정이론"],"ans":[1],"multi":false,"dup":false,"expl":"개인과 직업의 특성을 진단해 연결하는 가장 오래된 진로지도 이론은 특성이론(특성-요인 이론)이다.","src":"E"},{"id":"E2015-2-29-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":29,"stem":"상담에서 가장 중요한 상담자와 내담자간의 신뢰와 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","부정적 전이","주종관계"],"ans":[2],"multi":false,"dup":false,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다. 역전이·부정적 전이는 상담자의 감정 반응이다.","src":"E"},{"id":"E2015-2-29-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":29,"stem":"학교에서 심리검사를 활용할 때 유의해야 할 사항에 대한 다음 설명 중 가장 적절한 것은?","opts":["문․이과의 선택시 적성검사 결과만 가지고도 충분하다","검사결과표를 학생에게 전달하기만 하면 교사의 임무는 끝난다","다른 학교에서 하니까 우리 학교도 심리검사를 사용하지 않으면 안 된다","한 심리검사는 학생의 상태를 이해하는 데 부분적인 정보만을 제공할 뿐이다"],"ans":[4],"multi":false,"dup":false,"expl":"심리검사 결과는 학생 이해의 부분적 정보일 뿐이며, 다른 정보와 함께 해석해야 한다.","src":"E"},{"id":"E2015-2-30-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":30,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 볼 수 있는 것은?","opts":["사회문화적 구속에 동조하거나 수동적으로 반응한다","자신의 미래는 자기 자신에 의해 좌우된다고 확신한다","자신의 모든 경험에 대해 방어적이다","자신의 행동에 대해 타인에게 인정받는 데 연연해한다"],"ans":[2],"multi":false,"dup":true,"expl":"충분히 기능하는 사람은 자기 삶의 주체로서 미래를 스스로 결정한다고 확신한다. 동조·방어·타인 인정에의 연연은 그 반대 특성이다.","src":"E"},{"id":"E2015-2-30-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":30,"stem":"회계사, 은행원, 사무원 등은 홀랜드(Holland)가 말하는 어떤 성격유형의 직업인인가?","opts":["사회적 유형","실제적 유형","관습적 유형","탐구적 유형"],"ans":[3],"multi":false,"dup":false,"expl":"회계사·은행원·사무원은 자료를 정리하고 규칙을 따르는 관습적(관례적) 유형의 직업이다.","src":"E"},{"id":"E2015-2-31-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":31,"stem":"우리는 타인으로부터 인정받고 싶은 마음 때문에 타인의 기대에 맞추어 살기도 한다. 하지만 이것이 많으면 많을수록 삶의 무의미와 공허감을 느끼게 된다고 로저스(Rogers)는 주장한다. 이것은?","opts":["가치조건","자동적 사고","공상","혐오자극"],"ans":[1],"multi":false,"dup":true,"expl":"타인의 기대에 맞추느라 자신의 유기체적 경험을 무시하게 만드는 조건은 로저스가 말한 가치조건이다.","src":"E"},{"id":"E2015-2-31-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":31,"stem":"인간중심상담이론에서 가정하고 있는 인간관은?","opts":["인간은 합리적이고 건설적이며 합목적적인 존재이다","인간은 끊임없이 갈등하는 존재다","자율적인 인간이란 없다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다"],"ans":[1],"multi":false,"dup":false,"expl":"인간중심상담은 인간을 합리적·건설적·합목적적이며 자아실현 경향을 지닌 존재로 가정한다.","src":"E"},{"id":"E2015-2-32-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":32,"stem":"합리-정의적 상담이론의 ABCD기법에서 현재의 정서적․행동적 결과의 진정한 원인이라고 엘리스(Ellis)가 주장하는 것은?","opts":["A","B","C","D"],"ans":[2],"multi":false,"dup":true,"expl":"엘리스는 정서·행동적 결과(C)의 진정한 원인을 신념체계(B)라고 본다. 선행사건(A) 자체가 원인이 아니다.","src":"E"},{"id":"E2015-2-32-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":32,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 A는 무엇을 의미하는가?","opts":["결과","신념","선행 사건","논리적 반박"],"ans":[3],"multi":false,"dup":false,"expl":"ABCD기법에서 A는 선행사건, B는 신념, C는 정서·행동적 결과, D는 논리적 반박이다.","src":"E"},{"id":"E2015-2-33-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":33,"stem":"월페(Wolpe)에 의해 제안된 것으로서 불안과 양립할 수 없는 이완반응을 이끌어낸 다음 불안을 유발시키는 경험을 상상하게 함으로써 불안유발자극의 영향을 약화시키는 방법은?","opts":["토큰 강화","저항의 해석","체계적 둔감법","혐오자극의 제공"],"ans":[3],"multi":false,"dup":true,"expl":"이완반응과 불안을 양립시켜 불안을 약화시키는 월페의 기법은 체계적 둔감법이다.","src":"E"},{"id":"E2015-2-33-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":33,"stem":"다음 중 연결이 바르게 된 것은?","opts":["체계적 둔감법 - 월페(Wolpe)","상호제지의 원리 - 스키너(Skinner)","고전적 조건형성 - 벡(Beck)","범람법 - 반두라(Bandura)"],"ans":[1],"multi":false,"dup":false,"expl":"체계적 둔감법은 월페가 제안했다. 상호제지의 원리는 월페, 고전적 조건형성은 파블로프, 범람법은 행동주의 치료기법이다.","src":"E"},{"id":"E2015-2-34-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":34,"stem":"다음 중 엘리스(Ellis)가 말하는 비합리적 신념에 해당하는 것은?","opts":["현재 내가 겪고 있는 정서적인 괴로움은 주로 나의 책임이다","사랑받기보다는 사랑하는 것에 신경 쓰는 것이 바람직하고 생산적이다","걱정한다고 해서 어떤 괴로운 일이 사라지는 것은 아니다","일이 내 뜻대로 진행되지 않는다면 끔찍스러운 일이다"],"ans":[4],"multi":false,"dup":false,"expl":"“일이 뜻대로 안 되면 끔찍한 일이다”는 대표적인 비합리적 신념이다. 나머지는 합리적 신념에 가깝다.","src":"E"},{"id":"E2015-2-34-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":34,"stem":"다음 중 집단상담에 가장 적합한 사람은?","opts":["매우 복잡한 위기의 문제를 가지고 있어서 심층적인 탐색이 필요한 사람","사회적 기술을 습득할 필요가 있는 사람","여러 사람 앞에서 이야기하는 것을 두려워하는 사람","남의 인정에 대한 욕구가 강해서 집단을 혼자 주도할 가능성이 있는 사람"],"ans":[2],"multi":false,"dup":true,"expl":"집단상담은 사회적 기술 습득이나 인간관계 훈련이 필요한 사람에게 적합하다. 심층적 위기 탐색은 개인상담이 적합하다.","src":"E"},{"id":"E2015-2-35-1","set":"2015-2-기말-1학년","year":2015,"kind":"기말","grade":"1학년","no":35,"stem":"상담자가 내담자와 대화하면서 서로간의 신뢰가 문제시 될 것 같아 다음과 같이 말했다. 이와 가장 관계있는 상담기법은?“당신이 말하기를 주저하는 것이 혹시 나와 관계되어 그런 것이 아닌가 궁금하군요. 아직은 나를 믿는 것이 어렵겠지요.”","opts":["해석","즉시성","직면","구체화"],"ans":[2],"multi":false,"dup":false,"expl":"상담자가 지금-여기에서의 관계를 내담자와 논의하는 기법은 즉시성이다.","src":"E"},{"id":"E2015-2-35-3","set":"2015-2-기말-3학년","year":2015,"kind":"기말","grade":"3학년","no":35,"stem":"정신분석이론의 주요 상담기법들에 공통적으로 적용되는 기법은?","opts":["해석","강화","논리적 반박","귀인"],"ans":[1],"multi":false,"dup":false,"expl":"정신분석 상담의 여러 기법(자유연상, 꿈 분석, 전이 해석 등)에 공통으로 적용되는 것은 해석이다.","src":"E"},{"id":"E2015-H-01-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":1,"stem":"후기 현대철학적 인간이해의 관점이 교육과 관련하여 우리에게 주는 시사점으로 볼 수 있는 것은?","opts":["교육은 가치중립적인 활동이다","교육의 과정은 투입-가공-산출이라는 공학적 모형에 의해 설명될 수 있다","교육목표보다는 교수-학습의 효율성과 성취도의 평가를 강조할 필요가 있다","교육은 경험의 끊임없는 재구성을 통해 개인이 성장해 갈 수 있도록 도와주는 과정이다"],"ans":[4],"multi":false,"dup":true,"expl":"후기 현대철학은 경험의 끊임없는 재구성을 통한 개인의 성장을 교육의 핵심으로 본다. 가치중립성·공학적 모형은 전통적·과학적 관점이다.","src":"E"},{"id":"E2015-H-02-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":2,"stem":"프뢰벨, 페스탈로찌, 헤르바르트에 의해 전개된 유럽의 신교육운동의 바탕이 된 인간관은?","opts":["자연주의 교육관","진보주의 교육관","행동주의 교육관","실존주의 교육관"],"ans":[1],"multi":false,"dup":true,"expl":"프뢰벨·페스탈로찌·헤르바르트로 이어진 유럽 신교육운동의 바탕은 자연주의 교육관이다.","src":"E"},{"id":"E2015-H-03-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":3,"stem":"다음 중 연결이 적절한 것은?","opts":["자연주의 교육관 - 스키너(Skinner)","진보주의 교육관 - 틸리히(Tillich)","실존주의 교육관 - 부버(Buber)","행동주의 교육관 - 루소(Rousseau)"],"ans":[3],"multi":false,"dup":true,"expl":"실존주의 교육관은 부버(Buber)·틸리히 등과 연결된다. 자연주의는 루소, 행동주의는 스키너, 진보주의는 듀이와 연결되므로 ①·②·④는 잘못된 연결이다.","src":"E"},{"id":"E2015-H-04-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":4,"stem":"학교교육에 대해 급진적인 비판을 가하고 있는 대표적 인물로서, 삶의 전 과정 속에서 교육이 제대로 이루어질 수 있도록 하기 위해서는 학교라는 교육기관을 없애야 한다는 “탈학교교육론”을 주장한 사람은?","opts":["피터스(Peters)","일리히(Illich)","렝그랑(Lengrand)","매슬로(Maslow)"],"ans":[2],"multi":false,"dup":true,"expl":"학교를 없애야 한다는 탈학교교육론은 일리치가 주장했다.","src":"E"},{"id":"E2015-H-05-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":5,"stem":"다음 중 교육의 내재적 목적에 해당하는 것은?","opts":["문화의 창조","전인적 인간의 육성","사회문화의 보존","국가경제의 발전"],"ans":[2],"multi":false,"dup":true,"expl":"교육의 내재적 목적은 교육 활동 자체에 내재한 목적으로 전인적 인간 육성, 자아실현 등이다. 문화 창조·보존, 경제 발전은 외재적 목적이다.","src":"E"},{"id":"E2015-H-06-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":6,"stem":"교육내용을 선정하고 조직할 때 적용되는 기본 원칙으로 보기에 가장 적절하지 않은 것은?","opts":["계열성과 통합성","교사의 능력에 대한 적합성","교육목적에 대한 일관성","교육내용의 전이성"],"ans":[2],"multi":false,"dup":false,"expl":"내용 선정·조직의 원칙은 계열성·통합성, 목적과의 일관성, 전이성 등이며 교사의 능력에 대한 적합성은 원칙이 아니다.","src":"E"},{"id":"E2015-H-07-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":7,"stem":"어떤 아이가 어른에게 인사를 하여 칭찬을 받은 후, 이 아이는 어른을 보면 인사하는 행동을 자주 하게 되었다. 이와 가장 관련이 있는 손다이크(Thorndike)의 학습의 법칙은?","opts":["연습의 법칙","효과의 법칙","준비성의 법칙","반복의 법칙"],"ans":[2],"multi":false,"dup":true,"expl":"칭찬이라는 만족스러운 결과가 뒤따른 행동이 반복되는 것은 손다이크의 효과의 법칙이다. 연습의 법칙은 반복 연습, 준비성의 법칙은 학습할 준비 상태와 관련된다.","src":"E"},{"id":"E2015-H-08-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":8,"stem":"일어날 확률이 높은 행동은 일어날 확률이 낮은 행동에 대해 정적 강화물로서 작용한다는 것을 바탕으로 한 행동수정방법은?","opts":["타임 아우트","토큰 강화","프리맥의 원리","소거의 원리"],"ans":[3],"multi":false,"dup":true,"expl":"빈도가 높은 활동을 강화물로 활용해 빈도가 낮은 행동을 늘리는 방법은 프리맥의 원리다.","src":"E"},{"id":"E2015-H-09-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":9,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["인지학습 - 범람법","고전적 조건형성 - 통찰","사회학습 - 대리강화","모델링 - 컴퓨터 보조학습"],"ans":[3],"multi":false,"dup":false,"expl":"사회학습이론은 관찰과 대리강화로 학습이 일어난다고 본다. 범람법은 행동치료, 통찰은 인지(형태)학습, 컴퓨터 보조학습은 모델링과 무관하다.","src":"E"},{"id":"E2015-H-10-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":10,"stem":"학습된 행동을 소거(消去: extinction)시키더라도 그 행동이 완전히 없어지는 것이 아니라 일시적으로 억압되어 있다는 것을 뒷받침해주는 증거는?","opts":["자발적 회복","자극 변별","자극 일반화","고차적 조건형성"],"ans":[1],"multi":false,"dup":true,"expl":"소거 후 반응이 다시 나타나는 자발적 회복은 행동이 일시적으로 억압되었음을 뒷받침한다.","src":"E"},{"id":"E2015-H-11-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":11,"stem":"카지노에 있는 도박기계(예: 슬로트 머신)에 입력되어 있는 프로그램이 기초로 하고 있는 부분강화계획은?","opts":["고정간격 강화계획","고정비율 강화계획","변동간격 강화계획","변동비율 강화계획"],"ans":[4],"multi":false,"dup":false,"expl":"슬로트머신은 몇 번 당첨될지 예측할 수 없는 변동비율 강화계획으로, 소거에 대한 저항이 가장 강하다.","src":"E"},{"id":"E2015-H-12-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":12,"stem":"아이들이 TV를 시청하는 시간대에는 선정적, 폭력적인 방송물을 방영하지 못하도록 하는 것과 가장 관련이 깊은 이론은?","opts":["고전적 조건형성 이론","정신분석이론","조작적 조건형성 이론","사회학습이론"],"ans":[4],"multi":false,"dup":false,"expl":"TV의 폭력 장면을 관찰한 아동의 공격성이 학습된다는 설명은 사회학습이론(관찰학습)이다.","src":"E"},{"id":"E2015-H-13-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":13,"stem":"인간의 기억구조와 관련된 다음 설명 중 가장 적절한 것은?","opts":["감각기억은 시연에 의해 그 지속시간이 증대될 수 있다","단기기억의 지속시간은 보통 1초 정도이다","논리적 추론과 같은 작업수행과정은 작업기억에 해당된다","장기기억의 용량은 무의미한 자료의 경우 7±2개 정도이다"],"ans":[3],"multi":false,"dup":true,"expl":"논리적 추론처럼 정보를 조작·처리하는 과정은 작업기억에 해당한다. 시연으로 지속시간이 늘어나는 것은 단기기억, 감각기억은 1초 이내이며, 7±2는 단기(작업)기억의 용량이다.","src":"E"},{"id":"E2015-H-14-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":14,"stem":"피아제(Piaget)의 인지발달단계 중 어떤 아이가 자기 눈앞에서 장난감이 사라지더라도 그 장난감은 어딘가에 계속 존재한다는 것을 이해하는 능력을 처음 획득하게 되는 시기는?","opts":["감각운동기","전조작기","구체적 조작기","형식적 조작기"],"ans":[1],"multi":false,"dup":true,"expl":"눈앞에서 사라진 장난감이 계속 존재한다는 이해, 즉 대상영속성은 감각운동기에 획득된다.","src":"E"},{"id":"E2015-H-15-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":15,"stem":"에릭슨(Erikson)의 성격발달단계이론에서 0～1세 사이에 성취해야 할 긍정적인 과업과 그에 대응하는 부정적인 과업이 제대로 짝 지워진 것은?","opts":["신뢰감-불신감","주도성-죄책감","자율성-수치감","근면성-열등감"],"ans":[1],"multi":false,"dup":false,"expl":"0~1세의 과업은 신뢰감 대 불신감이다. 주도성-죄책감은 4~5세, 자율성-수치감은 2~3세, 근면성-열등감은 아동기다.","src":"E"},{"id":"E2015-H-16-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":16,"stem":"망각의 원인에 관한 다음 설명 중 간섭이론에 관한 설명은?","opts":["파지를 방해하는 외부적 영향 때문에 망각이 촉진된다","행동주의 이론에 근거하고 있다","뇌세포의 기억 흔적이 시간의 경과로 인해 흐려진다","망각 속도와 깊은 관련이 있다"],"ans":[1],"multi":false,"dup":true,"expl":"간섭이론은 앞뒤 학습이 서로를 방해해 파지를 저해한다고 설명한다(순행성·역행성 간섭).","src":"E"},{"id":"E2015-H-17-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":17,"stem":"서스턴(Thurstone)이 주장하는 일곱가지 기본정신능력(Primary Mental Ability)에 해당하지 않는 것은?","opts":["지각속도","기억력","수리력","창의력"],"ans":[4],"multi":false,"dup":true,"expl":"서스턴의 7가지 기초정신능력은 언어이해·추리·수리·공간지각·언어유창성·지각속도·기억력이다. 창의력은 길포드의 확산적 사고와 관련된 개념이다.","src":"E"},{"id":"E2015-H-18-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":18,"stem":"창의력에 관한 다음 설명 중 길포드(Guilford)의 관점과 가장 가까운 것은?","opts":["창의적 활동은 일종의 승화작용이다","창의력은 수렴적 사고와 밀접한 관련이 있다","창의력을 구성하는 기본능력은 지필검사로 측정할 수 있다","창의력은 하늘이 내리는 것이다"],"ans":[3],"multi":false,"dup":true,"expl":"길포드는 창의력을 확산적 사고의 구성 요소(유창성·융통성·독창성·정교성)로 보고 지필검사로 측정 가능하다고 보았다.","src":"E"},{"id":"E2015-H-19-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":19,"stem":"다음 중 연결이 적절한 것은?","opts":["퀠러(Kohler) - 장(場)이론","에빙하우스(Ebbinghaus) - 망각곡선","레빈(Lewin) - 모방학습","밴두라(Bandura) - 통찰학습"],"ans":[2],"multi":false,"dup":false,"expl":"에빙하우스-망각곡선이 바른 연결이다. 쾰러는 통찰학습, 레빈은 장이론, 반두라는 관찰학습이다.","src":"E"},{"id":"E2015-H-20-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":20,"stem":"커텔(Cattell)은 지능을 유동성 지능과 결정성 지능으로 구분하였다. 다음 중 결정성 지능에 해당하지 않는 것은?","opts":["언어유추능력","어휘이해력","일반 지식","수리력"],"ans":[1],"multi":false,"dup":true,"expl":"언어유추능력은 경험·교육과 무관하게 새 상황에 적응하는 유동성 지능에 해당한다. 어휘력·일반지식·수리력은 경험과 학습으로 형성되는 결정성 지능이다.","src":"E"},{"id":"E2015-H-21-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":21,"stem":"웩슬러(Wechsler) 지능검사에 대한 다음 설명 중 가장 거리가 먼 것은?","opts":["언어성 I.Q.와 동작성 I.Q.를 산출할 수 있다","아동용보다 성인용 검사가 먼저 만들어졌다","정신연령이라는 개념을 도입하고 있다","지능지수를 계산하는 데 편차 I.Q.를 적용하였다"],"ans":[3],"multi":false,"dup":true,"expl":"웩슬러 검사는 언어성·동작성 IQ를 산출하고 편차 IQ로 지능지수를 계산하며, 성인용(WAIS)이 아동용(WISC)보다 먼저 만들어졌다. 정신연령은 비네 검사의 개념이므로 가장 거리가 멀다.","src":"E"},{"id":"E2015-H-22-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":22,"stem":"다음 중 자기통제력의 발달과 가장 관련이 깊은 것은?","opts":["도구적 공격성","외적 통제사고","확산적 사고","만족지연능력"],"ans":[4],"multi":false,"dup":false,"expl":"자기통제력 발달의 핵심은 만족지연능력, 즉 즉각적 충동을 억제하고 보상을 미루는 능력이다.","src":"E"},{"id":"E2015-H-23-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":23,"stem":"인간의 기억구조에서 컴퓨터의 중앙통제기능, 즉 CPU에 해당하는 개념은?","opts":["감각기억","작업기억","동작기억","장기기억"],"ans":[2],"multi":false,"dup":false,"expl":"작업기억은 컴퓨터의 CPU처럼 정보를 일시 저장하면서 조작·통제하는 중앙통제 기능을 한다.","src":"E"},{"id":"E2015-H-24-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":24,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["원초아 - 1차과정","자아 - 쾌락원리","죽음의 본능 - 리비도(libido)","초자아 - 2차과정"],"ans":[1],"multi":false,"dup":true,"expl":"원초아-1차과정이 바른 연결이다. 자아는 현실원리, 초자아는 도덕원리를 따르고, 리비도는 삶의 본능이다.","src":"E"},{"id":"E2015-H-25-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":25,"stem":"다음 중 매슬로(Maslow)의 욕구위계이론에서 성장욕구에 해당하지 않는 것은?","opts":["자아실현 욕구","자존 욕구","지적 욕구","심미적 욕구"],"ans":[2],"multi":false,"dup":false,"expl":"성장욕구는 지적·심미적·자아실현 욕구이며 자존 욕구는 결핍욕구에 속한다.","src":"E"},{"id":"E2015-H-26-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":26,"stem":"위급한 상황이 발생했을 때 몸으로 하여금 ‘싸움 혹은 도망’ (fight or flight)하도록 준비시키는 호르몬으로서 부신에서 방출되는 것은?","opts":["코티졸","도파민","에스트로겐","테스토스테론"],"ans":[1],"multi":false,"dup":true,"expl":"위급 상황에서 부신에서 분비되어 싸움-도망 반응을 준비시키는 호르몬은 코티졸(당질코르티코이드)이다.","src":"E"},{"id":"E2015-H-27-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":27,"stem":"친사회적 행동을 촉진하는 요인으로 보기 어려운 것은?","opts":["도덕성","조망수용능력","공감","이기심"],"ans":[4],"multi":false,"dup":false,"expl":"친사회적 행동은 도덕성·조망수용능력·공감이 촉진하며 이기심은 오히려 방해한다.","src":"E"},{"id":"E2015-H-28-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":28,"stem":"자아정체성의 발달수준 중 자아정체성에 대한 위기도 경험하지 못한 채 마치 정체성을 확립한 것처럼 느끼는 상태를 특히 무엇이라고 하는가?","opts":["정체성 혼미","정체성 조기완료","정체성 유예","정체성 성취"],"ans":[2],"multi":false,"dup":true,"expl":"위기 없이 정체성을 확립한 듯 보이는 상태는 정체성 조기완료(조기성취)다.","src":"E"},{"id":"E2015-H-29-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":29,"stem":"다음 중 콜버그(Kohlberg)의 도덕판단능력 발달단계이론에서 전(前) 인습적 수준의 도덕성 발달단계에 해당하는 것은?","opts":["도구적 상대주의 지향","사회적 계약 지향","대인간 조화 지향","법과 질서 지향"],"ans":[1],"multi":false,"dup":true,"expl":"전인습적 수준에는 처벌과 복종 지향, 도구적 상대주의 지향이 속한다.","src":"E"},{"id":"E2015-H-30-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":30,"stem":"어떤 남자 아이가 ‘인형을 가지고 노는 것은 여자의 행동’이라고 생각하지만, 사실 자기는 인형을 가지고 노는 것을 좋아할 때 경험하는 갈등과 가장 관련이 깊은 개념은?","opts":["내적 통제사고","외적 통제사고","인지적 부조화","상상적 청중"],"ans":[3],"multi":false,"dup":true,"expl":"자신의 행동과 성역할 신념이 서로 어긋날 때 느끼는 불편한 심리 상태는 인지적 부조화다.","src":"E"},{"id":"E2015-H-31-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":31,"stem":"다음 중 로저스(Rogers)가 말하는 ‘충분히 기능을 발휘하는 사람들’의 특징으로 볼 수 있는 것은?","opts":["사회문화적 구속에 동조하거나 수동적으로 반응한다","자신의 미래는 자기 자신에 의해 좌우된다고 확신한다","자신의 모든 경험에 대해 방어적이다","자신의 행동에 대해 타인에게 인정받는 데 연연해한다"],"ans":[2],"multi":false,"dup":true,"expl":"충분히 기능하는 사람은 자기 삶의 주체로서 미래를 스스로 결정한다고 확신한다. 동조·방어·타인 인정에의 연연은 그 반대 특성이다.","src":"E"},{"id":"E2015-H-32-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":32,"stem":"자아실현과 관련된 다음 설명 중 가장 적절하지 않은 것은?","opts":["자아실현은 특수한 영역의 가능성을 현실화하는 것을 말한다","자아실현은 그 자체가 삶의 목적이다","자아실현의 과정은 어렵고 때로 고통스럽기도 하다","자아실현은 고도의 성취뿐만 아니라 낮은 수준의 성취도 포함한다"],"ans":[1],"multi":false,"dup":false,"expl":"자아실현은 특정 영역이 아니라 자신의 전체 잠재가능성을 현실화하는 것이다.","src":"E"},{"id":"E2015-H-33-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":33,"stem":"홀랜드(Holland)가 말하는 여섯 가지 성격유형과 대표적인 직업이 제대로 연결된 것은?","opts":["사회적 유형 - 교사, 간호사, 종교지도자","실제적 유형 - 정치가, 영업사원, 광고업자","사업가적 유형 - 회계사, 은행원, 사무원","관습적 유형 - 기술자, 정비사, 의료기사"],"ans":[1],"multi":false,"dup":true,"expl":"사회적 유형-교사·간호사·종교지도자가 바른 연결이다. 실제적은 기술자·정비사, 관습적은 회계사·은행원, 사업가적은 정치가·영업사원이다.","src":"E"},{"id":"E2015-H-34-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":34,"stem":"직업에 대한 다음 설명 중 가장 적절한 것은?","opts":["직업은 개인의 성격형성과는 무관하다","직업은 취미로 하는 활동을 말한다","직업은 반드시 일, 즉 노동행위를 포함하고 있다","직업은 사회적 책무성이 결여되어 있어야 한다"],"ans":[3],"multi":false,"dup":true,"expl":"직업은 노동행위를 포함하며 사회적 책무성을 지니고 개인의 성격 형성과도 관련된다.","src":"E"},{"id":"E2015-H-35-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":35,"stem":"다음 중 진로지도 이론과 대표적 학자가 제대로 연결되어 있는 것은?","opts":["특성이론 - 겔라트(Gelatt)","의사결정이론 - 보딘(Bordin)","사회이론 - 윌리엄슨(Williamson)","심리이론 - 로우(Roe)"],"ans":[4],"multi":false,"dup":true,"expl":"심리이론-로우가 바른 연결이다. 특성이론은 윌리엄슨, 의사결정이론은 겔라트, 사회이론은 홀링쉐드다.","src":"E"},{"id":"E2015-H-36-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":36,"stem":"수퍼(Super)의 직업의식 발달단계가 순서대로 나열된 것은?","opts":["성장기 → 탐색기 → 유지기 → 확립기 → 쇠퇴기","탐색기 → 성장기 → 확립기 → 유지기 → 쇠퇴기","성장기 → 탐색기 → 확립기 → 유지기 → 쇠퇴기","탐색기 → 성장기 → 유지기 → 확립기 → 쇠퇴기"],"ans":[3],"multi":false,"dup":true,"expl":"수퍼의 직업의식 발달단계는 성장기→탐색기→확립기→유지기→쇠퇴기 순이다.","src":"E"},{"id":"E2015-H-37-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":37,"stem":"내담자와 대화를 하면서 대화에 진전이 없을 때나 상담자와 내담자간에 긴장이 있을 경우에, 상담자가 현재 내적으로 경험하는 것을 활용하여 ‘현재’와 ‘대인관계’의 측면에서 피드백을 주는 것을 특히 무엇이라고 하는가?","opts":["명료화","자아개방","직면","즉시성"],"ans":[4],"multi":false,"dup":true,"expl":"지금-여기에서의 대인관계와 상담자 자신의 내적 경험을 피드백하는 기법은 즉시성이다.","src":"E"},{"id":"E2015-H-38-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":38,"stem":"현대 청소년들이 지니고 있는 고민을 이해하고 지도하는 것과 관련된 다음 설명 중 가장 적절한 것은?","opts":["내성적인 성격과 소극적인 성격은 나쁜 성격이다","친구관계는 갈등이 전혀 없는 관계이다","성인들은 성에 대한 건전한 태도와 행동을 아이들에게 보여줄 필요가 있다","시험불안을 극복하려면 유연한 사고를 극단적인 사고로 변화시킬 필요가 있다"],"ans":[3],"multi":false,"dup":false,"expl":"성에 대한 건전한 태도와 행동을 성인이 모델로 보여 줄 필요가 있다는 설명이 적절하다. 내성적 성격은 나쁜 성격이 아니고, 친구관계에도 갈등이 있다.","src":"E"},{"id":"E2015-H-39-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":39,"stem":"다음 중 그 측정하고자 하는 내용이 다른 한 가지 검사는?","opts":["웩슬러 검사","주제통각검사","군대베타검사","스탠포드-비네 검사"],"ans":[2],"multi":false,"dup":true,"expl":"주제통각검사(TAT)는 성격·투사검사이고, 웩슬러·군대베타·스탠포드-비네는 지능검사다.","src":"E"},{"id":"E2015-H-40-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":40,"stem":"다음 중 ‘표준화 심리검사’와 가장 거리가 먼 것은?","opts":["상식적 이해 방법","전문적 제작과정","검사 조건의 표준화","규준(norm)의 설정"],"ans":[1],"multi":false,"dup":true,"expl":"표준화 심리검사는 전문적 제작과정, 검사조건의 표준화, 규준 설정을 갖추며 상식적 이해 방법과는 거리가 멀다.","src":"E"},{"id":"E2015-H-41-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":41,"stem":"다음 중 행동수정이론에서 가정하고 있는 인간관에 해당하는 것은?","opts":["자율적인 인간이란 없다","인간은 끊임없이 갈등하는 존재다","인간은 합리적으로 사고할 수도 있고, 비합리적으로 사고할 수도 있다","인간은 합리적이고 건설적이며 합목적적인 존재이다"],"ans":[1],"multi":false,"dup":true,"expl":"행동수정이론은 인간행동의 원인을 외부 환경에서 찾으며 자율적인 인간을 가정하지 않는다.","src":"E"},{"id":"E2015-H-42-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":42,"stem":"다음 중 연결이 바르게 된 것은?","opts":["범람법 - 반두라(Bandura)","상호제지의 원리 - 스키너(Skinner)","고전적 조건형성 - 벡(Beck)","체계적 둔감법 - 월페(Wolpe)"],"ans":[4],"multi":false,"dup":true,"expl":"체계적 둔감법은 월페가 제안했다. 상호제지의 원리는 월페, 고전적 조건형성은 파블로프, 범람법은 행동주의 치료기법이다.","src":"E"},{"id":"E2015-H-43-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":43,"stem":"엘리스(Ellis)의 합리-정의적 상담이론의 상담기법인 ABCD기법에서 D는 무엇을 의미하는가?","opts":["결과","신념","선행 사건","논리적 반박"],"ans":[4],"multi":false,"dup":true,"expl":"ABCD기법에서 D는 논리적 반박(dispute)이다.","src":"E"},{"id":"E2015-H-44-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":44,"stem":"정신분석이론의 주요 상담기법들에 공통적으로 적용되는 기법은?","opts":["자유연상","강화","해석","논리적 반박"],"ans":[3],"multi":false,"dup":true,"expl":"정신분석 상담의 주요 기법(자유연상, 꿈 분석, 전이 분석 등)에 공통으로 적용되는 것은 해석이다.","src":"E"},{"id":"E2015-H-45-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":45,"stem":"내담자의 표현 중에 불분명하고 불확실한 부분이나 애매모호해서 혼란을 주는 부분을 정밀하게 확인하기 위해서 사용하는 기법은?","opts":["공감적 이해","즉시성","자아개방","구체화"],"ans":[4],"multi":false,"dup":true,"expl":"내담자의 불분명하고 애매한 표현을 정밀하게 확인하는 기법은 구체화다.","src":"E"},{"id":"E2015-H-46-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":46,"stem":"학교에서 전체 조회시간에 어떤 아이에게 선행상을 주었다. 이것을 본 다른 아이들이 나도 착한 행동을 해야겠다고 마음먹고 유사한 선행을 했다. 직접적으로 선행상을 받지 않은 다른 아이들은 어떤 강화를 받은 것인가?","opts":["간헐적 강화","대리강화","자기강화","부분강화"],"ans":[2],"multi":false,"dup":false,"expl":"다른 아이가 강화받는 장면을 관찰해 같은 행동을 하게 된 것은 대리강화다.","src":"E"},{"id":"E2015-H-47-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":47,"stem":"다음 중 직업에 대한 지식․태도․기능이 어려서부터 성인기까지 발달한다는 관점을 취하고 있는 이론가는?","opts":["로우(Roe)","긴츠버그(Ginzberg)","홀랜드(Holland)","윌리암슨(Williamson)"],"ans":[2],"multi":false,"dup":true,"expl":"직업에 대한 지식·태도·기능이 어려서부터 성인기까지 발달한다고 본 이론가는 긴츠버그다.","src":"E"},{"id":"E2015-H-48-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":48,"stem":"행동수정의 진행과정에서 강화를 주어야 할 행동과 말아야 할 행동을 구분해주는 기준이 되는 것은?","opts":["1차 강화자극","2차 강화자극","활동 강화자극","기초선 수준"],"ans":[4],"multi":false,"dup":false,"expl":"강화를 주어야 할 행동과 주지 말아야 할 행동을 구분하는 기준은 기초선 수준이다.","src":"E"},{"id":"E2015-H-49-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":49,"stem":"상담에서 가장 중요한 것은 상담자와 내담자간의 신뢰와 협력이다. 이러한 협력관계를 나타내는 개념으로 볼 수 있는 것은?","opts":["역전이","작업동맹","전이","주종관계"],"ans":[2],"multi":false,"dup":false,"expl":"상담자와 내담자의 신뢰·협력 관계는 작업동맹이다.","src":"E"},{"id":"E2015-H-50-0","set":"2015-하계","year":2015,"kind":"하계","grade":"전학년","no":50,"stem":"다음의 학자들과 그들이 주장하는 바람직한 인간상이 제대로 연결되어 있는 것은?","opts":["로저스(Rogers) - 성숙한 인격","올포트(Allport) - 생산적인 사람","매슬로우(Maslow) - 자아실현인","프롬(Fromm) - 합리적 모험가"],"ans":[3],"multi":false,"dup":false,"expl":"매슬로우-자아실현인이 바른 연결이다. 로저스는 충분히 기능하는 사람, 올포트는 성숙한 인격, 프롬은 생산적인 사람이다.","src":"E"},{"id":"E2016-2-01-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":1,"stem":"다음 중 마리탱(Maritain)이 말하는 과학적 인간관과 가장 거리가 먼 것은?","opts":["인간의 정신과 육체는 물질로 이루어져 있다","인간행동은 외부 자극에 대한 습관화된 반응이다","이성을 실현하는 것이 인간의 최고 행복이다","인간은 목적이 아닌 수단으로서 다루어져야 한다"],"ans":[3],"multi":false,"dup":true,"expl":"이성 실현을 최고의 행복으로 보는 것은 철학·종교적 인간관이다. 마리탱의 과학적 인간관은 인간을 물질세계의 일부로 본다.","src":"E"},{"id":"E2016-2-01-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":1,"stem":"개인은 사회가 제시하는 기존의 지식체계나 신념체계를 수동적으로 수용하고, 그에 적응해나가야 하는 존재라고 여기는 교육관은?","opts":["실존주의 교육관","진보주의 교육관","자연주의 교육관","전통적 교육관"],"ans":[4],"multi":false,"dup":true,"expl":"기존의 지식·신념체계를 수동적으로 수용하는 존재로 보는 교육관은 전통적 교육관이다.","src":"E"},{"id":"E2016-2-02-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":2,"stem":"후기 현대철학적 인간이해의 관점이 교육과 관련하여 우리에게 주는 시사점으로 볼 수 있는 것은?","opts":["교육은 경험의 끊임없는 재구성을 통해 개인이 성장해 갈 수 있도록 도와주는 과정이다","교육의 과정은 투입-가공-산출이라는 공학적 모형에 의해 설명될 수 있다","교육목표보다는 교수-학습의 효율성과 성취도의 평가를 강조할 필요가 있다","교육은 가치중립적인 활동이다"],"ans":[1],"multi":false,"dup":true,"expl":"후기 현대철학은 경험의 끊임없는 재구성을 통한 개인의 성장을 교육의 핵심으로 본다. 가치중립성·공학적 모형은 전통적·과학적 관점이다.","src":"E"},{"id":"E2016-2-02-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":2,"stem":"다음 중 후기 현대철학에서 강조되고 있는 인간관으로 보기에 적당한 것은?","opts":["수동적 존재","무규범적 존재","무의식적 존재","자기형성적 존재"],"ans":[4],"multi":false,"dup":true,"expl":"후기 현대철학은 스스로 자신을 형성해 가는 자기형성적 존재를 강조한다.","src":"E"},{"id":"E2016-2-03-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":3,"stem":"다음 중 연결이 가장 적절한 것은?","opts":["일리치(Illich) - 주형으로서의 교육관","매슬로(Maslow) - 탈학교 교육론","렝그랑(Lengrand) - 평생교육","피터스(Peters) - 프로그램 수업"],"ans":[3],"multi":false,"dup":true,"expl":"렝그랑-평생교육이 바른 연결이다. 일리치는 탈학교교육론, 매슬로는 자아실현, 피터스는 교육의 기준과 연결된다.","src":"E"},{"id":"E2016-2-03-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":3,"stem":"프뢰벨, 페스탈로찌, 헤르바르트에 의해 전개된 유럽의 신교육운동의 바탕이 된 인간관은?","opts":["자연주의 교육관","진보주의 교육관","행동주의 교육관","실존주의 교육관"],"ans":[1],"multi":false,"dup":false,"expl":"프뢰벨·페스탈로찌·헤르바르트로 이어진 유럽 신교육운동의 바탕은 자연주의 교육관이다.","src":"E"},{"id":"E2016-2-04-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":4,"stem":"다음 중 교육의 내재적 목적에 해당하는 것은?","opts":["문화의 창조","전인적 인간의 육성","사회문화의 보존","국가경제의 발전"],"ans":[2],"multi":false,"dup":false,"expl":"교육의 내재적 목적은 교육 활동 자체에 내재한 목적으로 전인적 인간 육성, 자아실현 등이다. 문화 창조·보존, 경제 발전은 외재적 목적이다.","src":"E"},{"id":"E2016-2-04-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":4,"stem":"학교교육에 대해 급진적인 비판을 가하고 있는 대표적 인물로서, 삶의 전 과정 속에서 교육이 제대로 이루어질 수 있도록 하기 위해서는 학교라는 교육기관을 없애야 한다는 “탈학교교육론”을 주장한 사람은?","opts":["피터스(Peters)","일리히(Illich)","렝그랑(Lengrand)","매슬로(Maslow)"],"ans":[2],"multi":false,"dup":false,"expl":"학교를 없애야 한다는 탈학교교육론은 일리치가 주장했다.","src":"E"},{"id":"E2016-2-05-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":5,"stem":"다음 중 진보주의 교육관과 가장 거리가 먼 것은?","opts":["자연주의 교육관","경험중심 교육","실용주의 철학","인간행동의 계획적 변화"],"ans":[4],"multi":false,"dup":true,"expl":"진보주의 교육관은 경험중심·실용주의·자연주의와 통한다. ‘인간행동의 계획적 변화’는 전통적(주형적) 교육관의 특징이므로 진보주의와 가장 거리가 멀다.","src":"E"},{"id":"E2016-2-05-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":5,"stem":"다음 중 교육의 외재적 목적에 해당하지 않는 것은?","opts":["문화의 창조","전인적 인간의 육성","사회문화의 보존","국가경제의 발전"],"ans":[2],"multi":false,"dup":false,"expl":"전인적 인간의 육성은 교육의 내재적 목적이다. 문화의 창조·보존, 경제 발전은 외재적 목적에 해당한다.","src":"E"},{"id":"E2016-2-06-1","set":"2016-2-기말-1학년","year":2016,"kind":"기말","grade":"1학년","no":6,"stem":"고전적 조건형성이론에 대한 다음 설명 중 적절치 않은 것은?","opts":["음식물에 대한 개의 타액 분비는 선천적 반사행동이다","파블로프(Pavlov)에 의해 처음 체계적으로 이론화되었다","조건형성된 반응이 없어지는 소거(消去)는 학습되는 것이다","수의적 행동의 학습기제이다"],"ans":[4],"multi":false,"dup":true,"expl":"고전적 조건형성은 불수의적(반사적) 행동의 학습기제이므로 ‘수의적 행동의 학습기제’라는 진술이 적절하지 않다. 수의적 행동의 학습은 조작적 조건형성이다. ①~③은 모두 옳은 설명이다.","src":"E"},{"id":"E2016-2-06-3","set":"2016-2-기말-3학년","year":2016,"kind":"기말","grade":"3학년","no":6,"stem":"교육내용을 선정하고 조직할 때 고려해야 할 사항으로 보기에 가장 적절하지 않은 것은?","opts":["통합성","교사에의 타당성","계열성","계속성"],"ans":[2],"multi":false,"dup":true,"expl":"교육내용 선정·조직의 고려 사항은 통합성·계열성·계속성 등이며 교사에의 타당성은 해당하지 않는다.","src":"E"},{"id":"E2016-2-07-1","set":"2016-2-기말-1학년","year":2016,"
